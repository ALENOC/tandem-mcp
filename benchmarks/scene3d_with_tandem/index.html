<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
  #c { display: block; width: 100vw; height: 100vh; }
  .hud {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    font-family: system-ui, sans-serif;
    color: #e0e0e0;
    font-size: 14px;
  }
  .hud button {
    padding: 6px 14px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.1);
    color: #e0e0e0;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.2s;
  }
  .hud button:hover { background: rgba(255, 255, 255, 0.2); }
  .hud input[type="range"] {
    width: 100px;
    accent-color: #7b68ee;
  }
  #stats {
    font-variant-numeric: tabular-nums;
    min-width: 80px;
    text-align: right;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <button id="btnPause">Pause</button>
  <button id="btnWire">Wire</button>
  <button id="btnReset">Reset</button>
  <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
  <span id="stats"></span>
</div>
<script src="engine3d.js"></script>
<script src="app.js"></script>
</body>
</html>
