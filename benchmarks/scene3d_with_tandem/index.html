<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON PORTAL 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #020309; }
body {
  background: radial-gradient(ellipse at center, #0d1633 0%, #050814 55%, #020309 100%);
  font-family: 'Segoe UI', system-ui, sans-serif;
}
#c {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  display: block;
}
.hud {
  position: fixed;
  top: 12px;
  left: 12px;
  min-width: 220px;
  padding: 8px 10px;
  font-size: 11px;
  background: rgba(8,13,28,0.72);
  border: 1px solid rgba(56,189,248,0.28);
  border-radius: 10px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: #c8e6ff;
  z-index: 10;
  user-select: none;
}
.hud-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.hud-title h1 {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #7dd3fc;
}
.hud-title .tag {
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(56,189,248,0.12);
  border: 1px solid rgba(56,189,248,0.25);
  color: #67e8f9;
}
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 4px;
  margin-bottom: 6px;
}
.stats .stat {
  text-align: center;
  padding: 3px 4px;
  background: rgba(56,189,248,0.06);
  border-radius: 4px;
}
.stats .stat .label {
  font-size: 9px;
  color: #64748b;
  text-transform: uppercase;
}
.stats .stat .val {
  font-size: 12px;
  font-weight: 600;
  color: #e0f2fe;
}
.btn-row {
  display: flex;
  gap: 4px;
  margin-bottom: 6px;
}
.btn-row button {
  flex: 1;
  padding: 4px 6px;
  font-size: 10px;
  font-weight: 600;
  border: 1px solid rgba(56,189,248,0.3);
  border-radius: 5px;
  background: rgba(56,189,248,0.08);
  color: #94a3b8;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-row button.active {
  background: rgba(56,189,248,0.2);
  color: #7dd3fc;
  border-color: rgba(56,189,248,0.5);
}
.btn-row button:hover {
  background: rgba(56,189,248,0.15);
}
.spd-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.spd-row label {
  font-size: 9px;
  color: #64748b;
  white-space: nowrap;
}
.spd-row input[type="range"] {
  flex: 1;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: rgba(56,189,248,0.15);
  border-radius: 2px;
  outline: none;
}
.spd-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #38bdf8;
  cursor: pointer;
}
.spd-row .spd-val {
  font-size: 10px;
  font-weight: 600;
  color: #7dd3fc;
  min-width: 28px;
  text-align: right;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="hud-title">
    <h1>NEON PORTAL 3D</h1>
    <span class="tag">TANDEM LOCAL</span>
  </div>
  <div class="stats">
    <div class="stat"><div class="label">FPS</div><div class="val" id="fps">--</div></div>
    <div class="stat"><div class="label">Polys</div><div class="val" id="polys">--</div></div>
    <div class="stat"><div class="label">Parts</div><div class="val" id="parts">--</div></div>
  </div>
  <div class="btn-row">
    <button id="playBtn" class="active">Pause</button>
    <button id="orbitBtn" class="active">Orbit</button>
    <button id="resetBtn">Reset</button>
  </div>
  <div class="spd-row">
    <label>Speed</label>
    <input type="range" id="spd" min="0.2" max="3.0" step="0.1" value="1.0">
    <span class="spd-val" id="spdVal">1.0x</span>
  </div>
</div>
<script src="engine3d.js"></script>
<script src="app.js"></script>
</body>
</html>
