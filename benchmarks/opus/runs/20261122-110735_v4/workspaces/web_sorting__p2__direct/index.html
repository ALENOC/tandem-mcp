<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visualizzatore di algoritmi di ordinamento</title>
<style>
  :root {
    --bg: #12141a;
    --panel: #1c1f28;
    --text: #e4e6eb;
    --muted: #8b90a0;
    --bar: #4a7bd1;
    --compare: #f5c542;
    --swap: #e5534b;
    --pivot: #b67cf0;
    --sorted: #3fb96b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 { font-size: 1.5rem; margin: 0 0 16px; font-weight: 600; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 16px;
  }
  button, select {
    background: #2a2f3d;
    color: var(--text);
    border: 1px solid #3a4052;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover:not(:disabled), select:hover { background: #343a4b; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  #playBtn { min-width: 84px; }
  label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.9rem; }
  input[type="range"] { accent-color: var(--bar); width: 140px; }
  .stats {
    display: flex;
    gap: 24px;
    margin-bottom: 12px;
    font-size: 1rem;
    color: var(--muted);
  }
  .stats strong { color: var(--text); font-variant-numeric: tabular-nums; }
  #status { color: var(--sorted); }
  #chart {
    width: min(900px, 100%);
    height: 400px;
    background: var(--panel);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    align-items: flex-end;
    gap: 3px;
  }
  .bar {
    flex: 1;
    background: var(--bar);
    border-radius: 3px 3px 0 0;
    transition: height 0.08s linear;
  }
  .bar.compare { background: var(--compare); }
  .bar.swap { background: var(--swap); }
  .bar.pivot { background: var(--pivot); }
  .bar.sorted { background: var(--sorted); }
  .legend {
    display: flex; flex-wrap: wrap; gap: 16px; margin-top: 14px;
    font-size: 0.85rem; color: var(--muted); justify-content: center;
  }
  .legend span::before {
    content: ""; display: inline-block; width: 12px; height: 12px;
    border-radius: 2px; margin-right: 6px; vertical-align: -1px;
    background: var(--c);
  }
</style>
</head>
<body>
  <h1>Visualizzatore di algoritmi di ordinamento</h1>

  <div class="controls">
    <button id="playBtn" type="button">Play</button>
    <button id="stepBtn" type="button">Step</button>
    <button id="resetBtn" type="button">Reset</button>
    <label>Algoritmo
      <select id="algoSelect">
        <option value="bubble">Bubble sort</option>
        <option value="insertion">Insertion sort</option>
        <option value="quick">Quick sort</option>
      </select>
    </label>
    <label>Velocità
      <input id="speed" type="range" min="1" max="100" value="50">
    </label>
  </div>

  <div class="stats">
    <div>Confronti: <strong id="cmpCount">0</strong></div>
    <div>Scambi: <strong id="swapCount">0</strong></div>
    <div id="status"></div>
  </div>

  <div id="chart"></div>

  <div class="legend">
    <span style="--c: var(--bar)">Non ordinato</span>
    <span style="--c: var(--compare)">Confronto</span>
    <span style="--c: var(--swap)">Scambio</span>
    <span style="--c: var(--pivot)">Pivot</span>
    <span style="--c: var(--sorted)">Ordinato</span>
  </div>

<script>
(function () {
  "use strict";

  var N = 40;
  var chart = document.getElementById("chart");
  var playBtn = document.getElementById("playBtn");
  var stepBtn = document.getElementById("stepBtn");
  var resetBtn = document.getElementById("resetBtn");
  var algoSelect = document.getElementById("algoSelect");
  var speed = document.getElementById("speed");
  var cmpCountEl = document.getElementById("cmpCount");
  var swapCountEl = document.getElementById("swapCount");
  var statusEl = document.getElementById("status");

  var original = [];
  var arr = [];
  var bars = [];
  var state;
  var gen = null;
  var playing = false;
  var timer = null;
  var done = false;

  function freshState() {
    return { comparisons: 0, swaps: 0, cmp: [], swapped: [], pivot: -1, sorted: new Set() };
  }

  function randomArray() {
    var a = [];
    for (var i = 0; i < N; i++) a.push(Math.floor(Math.random() * 96) + 5);
    return a;
  }

  // ---- Operazioni registrate ----
  function compare(i, j) {
    state.cmp = [i, j];
    state.comparisons++;
  }
  function swap(i, j) {
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    state.swapped.push(i, j);
    state.swaps++;
  }

  // ---- Algoritmi (ogni yield = un confronto) ----
  function* bubbleSort() {
    var n = arr.length;
    for (var i = 0; i < n - 1; i++) {
      var swappedAny = false;
      for (var j = 0; j < n - 1 - i; j++) {
        compare(j, j + 1);
        yield;
        if (arr[j] > arr[j + 1]) { swap(j, j + 1); swappedAny = true; }
      }
      state.sorted.add(n - 1 - i);
      if (!swappedAny) break;
    }
  }

  function* insertionSort() {
    for (var i = 1; i < arr.length; i++) {
      var j = i;
      while (j > 0) {
        compare(j - 1, j);
        yield;
        if (arr[j - 1] > arr[j]) { swap(j - 1, j); j--; }
        else break;
      }
    }
  }

  function* quickSort(lo, hi) {
    if (lo > hi) return;
    if (lo === hi) { state.sorted.add(lo); return; }
    state.pivot = hi;
    var pivotVal = arr[hi];
    var i = lo;
    for (var j = lo; j < hi; j++) {
      state.pivot = hi;
      compare(j, hi);
      yield;
      if (arr[j] < pivotVal) {
        if (i !== j) swap(i, j);
        i++;
      }
    }
    if (i !== hi) swap(i, hi);
    state.sorted.add(i);
    state.pivot = -1;
    yield* quickSort(lo, i - 1);
    yield* quickSort(i + 1, hi);
  }

  function makeGenerator() {
    switch (algoSelect.value) {
      case "insertion": return insertionSort();
      case "quick": return quickSort(0, arr.length - 1);
      default: return bubbleSort();
    }
  }

  // ---- Rendering ----
  function buildBars() {
    chart.textContent = "";
    bars = [];
    for (var i = 0; i < arr.length; i++) {
      var b = document.createElement("div");
      b.className = "bar";
      chart.appendChild(b);
      bars.push(b);
    }
  }

  function render() {
    for (var i = 0; i < arr.length; i++) {
      var b = bars[i];
      b.style.height = arr[i] + "%";
      var cls = "bar";
      if (state.sorted.has(i)) cls += " sorted";
      else if (state.swapped.indexOf(i) !== -1) cls += " swap";
      else if (state.cmp.indexOf(i) !== -1) cls += " compare";
      else if (i === state.pivot) cls += " pivot";
      b.className = cls;
      b.title = String(arr[i]);
    }
    cmpCountEl.textContent = state.comparisons;
    swapCountEl.textContent = state.swaps;
  }

  function updateButtons() {
    playBtn.textContent = playing ? "Pause" : "Play";
    playBtn.disabled = done;
    stepBtn.disabled = done || playing;
  }

  // ---- Controllo esecuzione ----
  function step() {
    if (done || !gen) return;
    state.swapped = [];
    var res = gen.next();
    if (res.done) {
      finish();
      return;
    }
    render();
  }

  function finish() {
    done = true;
    pause();
    state.cmp = [];
    state.swapped = [];
    state.pivot = -1;
    for (var i = 0; i < arr.length; i++) state.sorted.add(i);
    render();
    statusEl.textContent = "Ordinato!";
    updateButtons();
  }

  function delay() {
    // velocità 1..100 -> ritardo ~600ms..5ms (scala esponenziale)
    var v = Number(speed.value);
    return Math.round(600 * Math.pow(5 / 600, (v - 1) / 99));
  }

  function tick() {
    timer = null;
    if (!playing) return;
    step();
    if (playing && !done) timer = setTimeout(tick, delay());
  }

  function play() {
    if (done) return;
    playing = true;
    updateButtons();
    tick();
  }

  function pause() {
    playing = false;
    if (timer !== null) { clearTimeout(timer); timer = null; }
    updateButtons();
  }

  function restart(newArray) {
    pause();
    if (newArray) original = randomArray();
    arr = original.slice();
    state = freshState();
    done = false;
    gen = makeGenerator();
    statusEl.textContent = "";
    if (bars.length !== arr.length) buildBars();
    render();
    updateButtons();
  }

  playBtn.addEventListener("click", function () {
    if (playing) pause(); else play();
  });
  stepBtn.addEventListener("click", function () {
    if (!playing) step();
  });
  resetBtn.addEventListener("click", function () { restart(true); });
  algoSelect.addEventListener("change", function () { restart(false); });

  restart(true);
})();
</script>
</body>
</html>
