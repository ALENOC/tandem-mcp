<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Particle Simulation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #060913;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #dfe7ff;
  }
  canvas#sim { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; }
  .hud {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    width: 270px; padding: 16px 18px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 16px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.12);
    user-select: none;
  }
  .hud h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #ffd98a; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  .hud button {
    flex: 1; padding: 8px 6px; font-size: 12px; font-weight: 600; color: #e9efff;
    background: rgba(255, 255, 255, 0.09); border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.08s;
  }
  .hud button:hover { background: rgba(255, 255, 255, 0.17); border-color: rgba(255, 255, 255, 0.35); }
  .hud button:active { transform: scale(0.96); }
  .hud button.off { color: #9aa6c4; background: rgba(255, 255, 255, 0.03); }
  .hud button:focus-visible, .hud input:focus-visible { outline: 2px solid #7fb4ff; outline-offset: 2px; }
  .slider-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; color: #b8c4e4; }
  .slider-label b { color: #ffd98a; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: #ffb84d; margin-bottom: 14px; cursor: pointer; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .stat { background: rgba(0, 0, 0, 0.22); border-radius: 10px; padding: 7px 6px; text-align: center; }
  .stat span { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #8b97b8; }
  .stat b { display: block; font-size: 15px; margin-top: 2px; font-variant-numeric: tabular-nums; color: #f2f5ff; }
  .hint { margin-top: 12px; font-size: 11px; color: #8b97b8; text-align: center; }
</style>
</head>
<body>
<canvas id="sim" aria-label="Orbital particle simulation"></canvas>

<div class="hud" id="hud">
  <h1>Orbital Simulation</h1>
  <div class="row">
    <button id="btnPlay" type="button">Pause</button>
    <button id="btnTrails" type="button">Trails: ON</button>
    <button id="btnReset" type="button">Reset</button>
  </div>
  <div class="slider-label"><label for="speed">Speed</label><b id="speedOut">1.0×</b></div>
  <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
  <div class="stats">
    <div class="stat"><span>FPS</span><b id="fpsOut">0</b></div>
    <div class="stat"><span>Time (s)</span><b id="timeOut">0.0</b></div>
    <div class="stat"><span>Particles</span><b id="partOut">0</b></div>
  </div>
  <div class="hint">Click anywhere to spawn a burst</div>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("sim");
  var ctx = canvas.getContext("2d");
  var btnPlay = document.getElementById("btnPlay");
  var btnTrails = document.getElementById("btnTrails");
  var btnReset = document.getElementById("btnReset");
  var speedInput = document.getElementById("speed");
  var speedOut = document.getElementById("speedOut");
  var fpsOut = document.getElementById("fpsOut");
  var timeOut = document.getElementById("timeOut");
  var partOut = document.getElementById("partOut");

  var W = 0, H = 0, DPR = 1, CX = 0, CY = 0, SCALE = 1;

  var state = {
    playing: true,
    trails: true,
    speed: 1.0,
    simTime: 0
  };

  var TAU = Math.PI * 2;
  var MAX_PARTICLES = 4000;
  var TRAIL_LEN = 90;

  // ---------- Planet definitions (radius in "units", scaled to viewport) ----------
  var PLANET_DEFS = [
    { name: "Ember",  orbit: 70,  size: 4,   speed: 1.60, color: "#ff8a5c", phase: 0.0, moons: [] },
    { name: "Azure",  orbit: 115, size: 6.5, speed: 1.05, color: "#5cb8ff", phase: 1.3,
      moons: [{ orbit: 14, size: 1.8, speed: 4.2, color: "#d8e6ff", phase: 0 }] },
    { name: "Verdant",orbit: 165, size: 7,   speed: 0.74, color: "#6fe3a1", phase: 2.6,
      moons: [{ orbit: 16, size: 2.0, speed: 3.4, color: "#e8f2d0", phase: 1 },
              { orbit: 24, size: 1.4, speed: -2.2, color: "#b0c4ff", phase: 3 }] },
    { name: "Rose",   orbit: 220, size: 5,   speed: 0.52, color: "#ff6fb5", phase: 4.1, moons: [] },
    { name: "Gilded", orbit: 285, size: 11,  speed: 0.36, color: "#ffd27a", phase: 5.2, ring: true,
      moons: [{ orbit: 24, size: 2.4, speed: 2.4, color: "#fff0c8", phase: 2 },
              { orbit: 32, size: 1.6, speed: 1.6, color: "#c9b6ff", phase: 4.5 }] },
    { name: "Violet", orbit: 345, size: 8,   speed: 0.25, color: "#a98bff", phase: 0.7,
      moons: [{ orbit: 17, size: 1.8, speed: -3.0, color: "#e0d8ff", phase: 0.5 }] }
  ];

  var planets = [];
  var particles = [];
  var stars = [];

  function buildPlanets() {
    planets = PLANET_DEFS.map(function (d) {
      return {
        def: d,
        angle: d.phase,
        x: 0, y: 0,
        trail: [],
        moons: d.moons.map(function (m) {
          return { def: m, angle: m.phase, x: 0, y: 0, trail: [] };
        })
      };
    });
    updatePositions(0);
  }

  function buildStars() {
    var count = Math.max(180, Math.floor((W * H) / 5500));
    stars = [];
    for (var i = 0; i < count; i++) {
      var tint = Math.random();
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.2 + 0.25,
        base: Math.random() * 0.55 + 0.25,
        amp: Math.random() * 0.45 + 0.1,
        freq: Math.random() * 2.2 + 0.4,
        phase: Math.random() * TAU,
        color: tint < 0.15 ? "255,214,170" : tint < 0.3 ? "180,205,255" : "235,240,255"
      });
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2;
    CY = H / 2;
    var maxOrbit = PLANET_DEFS[PLANET_DEFS.length - 1].orbit + 40;
    SCALE = Math.max(0.35, Math.min(1.6, (Math.min(W, H) * 0.48) / maxOrbit));
    buildStars();
    // trails are in screen coords; clear so they don't jump
    planets.forEach(function (p) { p.trail.length = 0; p.moons.forEach(function (m) { m.trail.length = 0; }); });
    updatePositions(0);
  }

  function pushTrail(arr, x, y, max) {
    arr.push(x, y);
    if (arr.length > max * 2) arr.splice(0, arr.length - max * 2);
  }

  function updatePositions(dt) {
    for (var i = 0; i < planets.length; i++) {
      var p = planets[i];
      p.angle += p.def.speed * dt * 0.6;
      var r = p.def.orbit * SCALE;
      p.x = CX + Math.cos(p.angle) * r;
      p.y = CY + Math.sin(p.angle) * r * 0.92;
      if (dt > 0) pushTrail(p.trail, p.x, p.y, TRAIL_LEN);
      for (var j = 0; j < p.moons.length; j++) {
        var m = p.moons[j];
        m.angle += m.def.speed * dt * 0.6;
        var mr = m.def.orbit * SCALE;
        m.x = p.x + Math.cos(m.angle) * mr;
        m.y = p.y + Math.sin(m.angle) * mr;
        if (dt > 0) pushTrail(m.trail, m.x, m.y, 40);
      }
    }
  }

  function updateParticles(dt) {
    // frame-rate independent damping
    var damp = Math.pow(0.12, dt);
    for (var i = particles.length - 1; i >= 0; i--) {
      var q = particles[i];
      q.vx *= damp;
      q.vy *= damp;
      q.x += q.vx * dt;
      q.y += q.vy * dt;
      q.life -= dt;
      if (q.life <= 0) {
        particles[i] = particles[particles.length - 1];
        particles.pop();
      }
    }
  }

  function spawnBurst(x, y) {
    var count = 70 + Math.floor(Math.random() * 40);
    var hueBase = Math.random() * 360;
    for (var i = 0; i < count; i++) {
      if (particles.length >= MAX_PARTICLES) particles.shift();
      var a = (i / count) * TAU + (Math.random() - 0.5) * 0.25;
      var sp = 90 + Math.random() * 260;
      var life = 1.1 + Math.random() * 1.4;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: life,
        maxLife: life,
        size: 1.2 + Math.random() * 2.2,
        hue: (hueBase + (Math.random() - 0.5) * 70 + 360) % 360
      });
    }
  }

  // ---------- Drawing ----------
  var realTime = 0;

  function drawBackground() {
    ctx.fillStyle = "#060913";
    ctx.fillRect(0, 0, W, H);
    var neb = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.7);
    neb.addColorStop(0, "rgba(40, 30, 80, 0.25)");
    neb.addColorStop(0.5, "rgba(15, 25, 60, 0.12)");
    neb.addColorStop(1, "rgba(6, 9, 19, 0)");
    ctx.fillStyle = neb;
    ctx.fillRect(0, 0, W, H);
  }

  function drawStars() {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var a = s.base + Math.sin(realTime * s.freq + s.phase) * s.amp;
      if (a < 0.05) a = 0.05; else if (a > 1) a = 1;
      ctx.fillStyle = "rgba(" + s.color + "," + a.toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fill();
    }
  }

  function drawOrbits() {
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(140, 160, 220, 0.09)";
    for (var i = 0; i < planets.length; i++) {
      var r = planets[i].def.orbit * SCALE;
      ctx.beginPath();
      ctx.ellipse(CX, CY, r, r * 0.92, 0, 0, TAU);
      ctx.stroke();
    }
  }

  function drawTrail(arr, color, width) {
    var n = arr.length / 2;
    if (n < 2) return;
    ctx.lineCap = "round";
    ctx.strokeStyle = color;
    for (var i = 1; i < n; i++) {
      var t = i / n;
      ctx.globalAlpha = t * t * 0.8;
      ctx.lineWidth = width * (0.3 + t * 0.7);
      ctx.beginPath();
      ctx.moveTo(arr[(i - 1) * 2], arr[(i - 1) * 2 + 1]);
      ctx.lineTo(arr[i * 2], arr[i * 2 + 1]);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawStar() {
    var pulse = 1 + Math.sin(state.simTime * 2.1) * 0.06 + Math.sin(state.simTime * 3.7) * 0.03;
    var coreR = 26 * SCALE + 6;
    var coronaR = coreR * 4.2 * pulse;

    ctx.globalCompositeOperation = "lighter";
    var corona = ctx.createRadialGradient(CX, CY, coreR * 0.4, CX, CY, coronaR);
    corona.addColorStop(0, "rgba(255, 210, 120, 0.55)");
    corona.addColorStop(0.25, "rgba(255, 150, 60, 0.22)");
    corona.addColorStop(0.6, "rgba(255, 90, 40, 0.06)");
    corona.addColorStop(1, "rgba(255, 60, 20, 0)");
    ctx.fillStyle = corona;
    ctx.beginPath();
    ctx.arc(CX, CY, coronaR, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = "source-over";

    var core = ctx.createRadialGradient(CX - coreR * 0.25, CY - coreR * 0.25, 0, CX, CY, coreR);
    core.addColorStop(0, "#fffef5");
    core.addColorStop(0.35, "#fff0b8");
    core.addColorStop(0.75, "#ffc35c");
    core.addColorStop(1, "#ff9a3a");
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(CX, CY, coreR, 0, TAU);
    ctx.fill();
  }

  function drawBody(x, y, r, color, glow) {
    // light comes from the star: offset highlight toward center
    var dx = CX - x, dy = CY - y;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    var hx = x + (dx / d) * r * 0.45, hy = y + (dy / d) * r * 0.45;

    if (glow) {
      ctx.globalCompositeOperation = "lighter";
      var g = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
      g.addColorStop(0, hexToRgba(color, 0.35));
      g.addColorStop(1, hexToRgba(color, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r * 3, 0, TAU);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }

    var body = ctx.createRadialGradient(hx, hy, r * 0.1, x, y, r);
    body.addColorStop(0, "#ffffff");
    body.addColorStop(0.3, color);
    body.addColorStop(1, shade(color, 0.25));
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }

  function drawRing(p, behind) {
    var r = p.def.size * SCALE;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(-0.4);
    ctx.strokeStyle = "rgba(255, 225, 160, 0.55)";
    ctx.lineWidth = Math.max(1, r * 0.28);
    ctx.beginPath();
    if (behind) ctx.ellipse(0, 0, r * 2.0, r * 0.6, 0, Math.PI, TAU);
    else ctx.ellipse(0, 0, r * 2.0, r * 0.6, 0, 0, Math.PI);
    ctx.stroke();
    ctx.restore();
  }

  function drawPlanets() {
    var i, j, p, m;
    if (state.trails) {
      for (i = 0; i < planets.length; i++) {
        p = planets[i];
        drawTrail(p.trail, p.def.color, Math.max(1, p.def.size * SCALE * 0.5));
        for (j = 0; j < p.moons.length; j++) {
          m = p.moons[j];
          drawTrail(m.trail, m.def.color, 1);
        }
      }
    }
    for (i = 0; i < planets.length; i++) {
      p = planets[i];
      var pr = Math.max(2, p.def.size * SCALE);
      if (p.def.ring) drawRing(p, true);
      drawBody(p.x, p.y, pr, p.def.color, true);
      if (p.def.ring) drawRing(p, false);
      for (j = 0; j < p.moons.length; j++) {
        m = p.moons[j];
        drawBody(m.x, m.y, Math.max(1, m.def.size * SCALE), m.def.color, false);
      }
    }
  }

  function drawParticles() {
    if (!particles.length) return;
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < particles.length; i++) {
      var q = particles[i];
      var t = q.life / q.maxLife;
      var a = t * t;
      var r = q.size * (0.5 + t * 0.8);
      ctx.fillStyle = "hsla(" + q.hue.toFixed(0) + ",100%,65%," + (a * 0.25).toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(q.x, q.y, r * 3, 0, TAU);
      ctx.fill();
      ctx.fillStyle = "hsla(" + q.hue.toFixed(0) + ",100%,85%," + a.toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(q.x, q.y, r, 0, TAU);
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  // ---------- Color helpers ----------
  function hexToRgb(hex) {
    var h = hex.replace("#", "");
    return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
  }
  function hexToRgba(hex, a) {
    var c = hexToRgb(hex);
    return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
  }
  function shade(hex, f) {
    var c = hexToRgb(hex);
    return "rgb(" + Math.round(c[0] * f) + "," + Math.round(c[1] * f) + "," + Math.round(c[2] * f) + ")";
  }

  // ---------- Loop ----------
  var last = performance.now();
  var fpsFrames = 0, fpsAccum = 0, hudAccum = 0;

  function frame(now) {
    var rawDt = (now - last) / 1000;
    last = now;
    if (rawDt > 0.1) rawDt = 0.1; // avoid huge jumps after tab switch
    if (rawDt < 0) rawDt = 0;
    realTime += rawDt;

    fpsFrames++;
    fpsAccum += rawDt;
    if (fpsAccum >= 0.5) {
      fpsOut.textContent = Math.round(fpsFrames / fpsAccum);
      fpsFrames = 0;
      fpsAccum = 0;
    }

    if (state.playing) {
      var dt = rawDt * state.speed;
      state.simTime += dt;
      updatePositions(dt);
      updateParticles(dt);
    }

    drawBackground();
    drawStars();
    drawOrbits();
    drawStar();
    drawPlanets();
    drawParticles();

    hudAccum += rawDt;
    if (hudAccum >= 0.1) {
      hudAccum = 0;
      timeOut.textContent = state.simTime.toFixed(1);
      partOut.textContent = particles.length;
    }

    requestAnimationFrame(frame);
  }

  // ---------- UI ----------
  function refreshButtons() {
    btnPlay.textContent = state.playing ? "Pause" : "Play";
    btnPlay.classList.toggle("off", !state.playing);
    btnTrails.textContent = state.trails ? "Trails: ON" : "Trails: OFF";
    btnTrails.classList.toggle("off", !state.trails);
    speedOut.textContent = state.speed.toFixed(1) + "×";
  }

  btnPlay.addEventListener("click", function () {
    state.playing = !state.playing;
    refreshButtons();
  });

  btnTrails.addEventListener("click", function () {
    state.trails = !state.trails;
    if (!state.trails) {
      planets.forEach(function (p) { p.trail.length = 0; p.moons.forEach(function (m) { m.trail.length = 0; }); });
    }
    refreshButtons();
  });

  btnReset.addEventListener("click", function () {
    state.simTime = 0;
    state.speed = 1.0;
    speedInput.value = "1.0";
    state.playing = true;
    particles.length = 0;
    buildPlanets();
    timeOut.textContent = "0.0";
    partOut.textContent = "0";
    refreshButtons();
  });

  speedInput.addEventListener("input", function () {
    var v = parseFloat(speedInput.value);
    state.speed = isNaN(v) ? 1 : v;
    refreshButtons();
  });

  canvas.addEventListener("pointerdown", function (e) {
    var rect = canvas.getBoundingClientRect();
    spawnBurst(e.clientX - rect.left, e.clientY - rect.top);
    partOut.textContent = particles.length;
  });

  window.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "INPUT") return;
    if (e.code === "Space") { e.preventDefault(); btnPlay.click(); }
    else if (e.key === "t" || e.key === "T") btnTrails.click();
    else if (e.key === "r" || e.key === "R") btnReset.click();
  });

  window.addEventListener("resize", resize);

  buildPlanets();
  resize();
  refreshButtons();
  requestAnimationFrame(function (t) { last = t; frame(t); });
})();
</script>
</body>
</html>
