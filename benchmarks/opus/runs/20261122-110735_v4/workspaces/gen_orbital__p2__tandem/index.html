<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Simulation</title>
<style>
html, body {
  margin: 0;
  overflow: hidden;
  background: #060913;
}
canvas#sim {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  display: block;
}
#hud {
  position: fixed;
  top: 16px;
  left: 16px;
  width: 260px;
  padding: 14px 16px;
  border-radius: 14px;
  background: rgba(20,28,50,0.45);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  color: #e6ecff;
  font: 13px system-ui, sans-serif;
  z-index: 10;
}
#hud h2 {
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 10px 0;
}
.btn-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}
.btn-row button {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.18);
  color: #e6ecff;
  border-radius: 8px;
  padding: 6px 10px;
  cursor: pointer;
  font: inherit;
}
.btn-row button:hover {
  background: rgba(255,255,255,0.18);
}
.slider-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.slider-row label {
  white-space: nowrap;
}
.slider-row input[type="range"] {
  width: 100%;
}
.stats {
  display: flex;
  gap: 12px;
  font-size: 12px;
}
.stats span {
  font-variant-numeric: tabular-nums;
}
</style>
</head>
<body>
<canvas id="sim"></canvas>
<div id="hud">
  <h2>Orbital Simulation</h2>
  <div class="btn-row">
    <button id="btnPlay">Pause</button>
    <button id="btnTrails">Trails: ON</button>
    <button id="btnReset">Reset</button>
  </div>
  <div class="slider-row">
    <label for="speed">Speed</label>
    <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
    <span id="speedVal">1.0&times;</span>
  </div>
  <div class="stats">
    <span>FPS <span id="fps">0</span></span>
    <span>Sim time <span id="simTime">0.0 s</span></span>
    <span>Particles <span id="particleCount">0</span></span>
  </div>
</div>
<script>
(function() {
  'use strict';

  var canvas = document.getElementById('sim');
  var ctx = canvas.getContext('2d');

  // State
  var playing = true;
  var trails = true;
  var simTime = 0;
  var speed = 1.0;
  var particles = [];
  var lastTime = performance.now();
  var realTime = 0;
  var frameCount = 0;
  var fpsTimer = 0;
  var currentFps = 0;

  // Scale factor
  var s = 1;

  // Stars: exactly 220
  var stars = [];
  (function initStars() {
    for (var i = 0; i < 220; i++) {
      var nx = Math.random();
      var ny = Math.random();
      var r = 0.3 + Math.random() * 1.2;
      var baseAlpha = 0.3 + Math.random() * 0.6;
      var twinkleSpeed = 0.5 + Math.random() * 2.5;
      var phase = Math.random() * Math.PI * 2;
      var tinted = Math.random() < 0.15;
      stars.push({
        nx: nx,
        ny: ny,
        r: r,
        baseAlpha: baseAlpha,
        twinkleSpeed: twinkleSpeed,
        phase: phase,
        color: tinted ? '#aac8ff' : '#ffffff'
      });
    }
  })();

  // Planets: exactly 6
  var planetDefs = [
    { name: 'Ember',   radius: 80,  w: 1.6,  color: '#c9a27e', size: 4 },
    { name: 'Azure',   radius: 130, w: 1.1,  color: '#4fa3ff', size: 7 },
    { name: 'Verdant', radius: 190, w: 0.8,  color: '#4cd98a', size: 8 },
    { name: 'Crimson', radius: 255, w: 0.6,  color: '#ff5a4e', size: 6 },
    { name: 'Gold',    radius: 330, w: 0.42, color: '#f2c14e', size: 13 },
    { name: 'Violet',  radius: 400, w: 0.3,  color: '#b48cff', size: 10 }
  ];

  var planets = planetDefs.map(function(def, i) {
    return {
      name: def.name,
      radius: def.radius,
      w: def.w,
      color: def.color,
      size: def.size,
      angle0: i * 1.1,
      angle: i * 1.1,
      x: 0,
      y: 0,
      trail: []
    };
  });

  // Moons: exactly 4
  var moonDefs = [
    { planet: 1, dist: 14, w: 4.0,  size: 2,   color: '#d8e2ff' },
    { planet: 2, dist: 16, w: 3.2,  size: 2.2, color: '#e6e6e6' },
    { planet: 4, dist: 22, w: 2.5,  size: 2.5, color: '#ffe9b0' },
    { planet: 4, dist: 30, w: -1.7, size: 2,   color: '#cfd8ff' }
  ];

  var moons = moonDefs.map(function(def, i) {
    return {
      planet: def.planet,
      dist: def.dist,
      w: def.w,
      size: def.size,
      color: def.color,
      angle0: i * 1.3,
      angle: i * 1.3,
      x: 0,
      y: 0,
      trail: []
    };
  });

  // Resize
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    s = Math.max(0.35, Math.min(window.innerWidth, window.innerHeight) / 900);
  }
  window.addEventListener('resize', resize);
  resize();

  // HUD elements
  var btnPlay = document.getElementById('btnPlay');
  var btnTrails = document.getElementById('btnTrails');
  var btnReset = document.getElementById('btnReset');
  var speedInput = document.getElementById('speed');
  var speedVal = document.getElementById('speedVal');
  var fpsEl = document.getElementById('fps');
  var simTimeEl = document.getElementById('simTime');
  var particleCountEl = document.getElementById('particleCount');

  function updatePlayBtn() {
    btnPlay.textContent = playing ? 'Pause' : 'Play';
  }
  function updateTrailsBtn() {
    btnTrails.textContent = trails ? 'Trails: ON' : 'Trails: OFF';
  }
  function updateSpeedVal() {
    speedVal.textContent = speed.toFixed(1) + '\u00d7';
  }

  btnPlay.addEventListener('click', function() {
    playing = !playing;
    updatePlayBtn();
  });

  btnTrails.addEventListener('click', function() {
    trails = !trails;
    if (!trails) {
      planets.forEach(function(p) { p.trail = []; });
      moons.forEach(function(m) { m.trail = []; });
    }
    updateTrailsBtn();
  });

  btnReset.addEventListener('click', function() {
    simTime = 0;
    particles = [];
    planets.forEach(function(p) { p.trail = []; });
    moons.forEach(function(m) { m.trail = []; });
    speed = 1.0;
    speedInput.value = '1.0';
    updateSpeedVal();
    playing = true;
    updatePlayBtn();
    trails = true;
    updateTrailsBtn();
  });

  speedInput.addEventListener('input', function() {
    speed = parseFloat(speedInput.value);
    updateSpeedVal();
  });

  // Burst particles
  function spawnBurst(x, y) {
    for (var i = 0; i < 80; i++) {
      var angle = (i / 80) * Math.PI * 2 + (Math.random() - 0.5) * 0.1;
      var spd = 60 + Math.random() * 200;
      var life = 1.2 + Math.random() * 0.8;
      var size = 1.5 + Math.random() * 2.0;
      var hue = Math.random() < 0.5 ? 15 + Math.random() * 40 : 180 + Math.random() * 40;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        life: life,
        maxLife: life,
        size: size,
        hue: hue
      });
    }
    // Cap at 2000, drop oldest
    if (particles.length > 2000) {
      particles.splice(0, particles.length - 2000);
    }
    particleCountEl.textContent = String(particles.length);
  }

  canvas.addEventListener('click', function(e) {
    spawnBurst(e.clientX, e.clientY);
  });

  // Drawing helpers
  function drawStarfield(t) {
    var w = window.innerWidth;
    var h = window.innerHeight;
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      var alpha = st.baseAlpha * (0.55 + 0.45 * Math.sin(t * st.twinkleSpeed + st.phase));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = st.color;
      ctx.beginPath();
      ctx.arc(st.nx * w, st.ny * h, st.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawOrbits() {
    var cx = window.innerWidth / 2;
    var cy = window.innerHeight / 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    for (var i = 0; i < planets.length; i++) {
      var r = planets[i].radius * s;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawTrails() {
    if (!trails) return;
    var i, j, p, m, len, alpha, x1, y1, x2, y2;

    // Planet trails
    for (i = 0; i < planets.length; i++) {
      p = planets[i];
      len = p.trail.length;
      if (len < 2) continue;
      ctx.lineWidth = 2;
      for (j = 0; j < len - 1; j++) {
        alpha = (j / (len - 1)) * 0.55;
        ctx.strokeStyle = p.color;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.moveTo(p.trail[j].x, p.trail[j].y);
        ctx.lineTo(p.trail[j + 1].x, p.trail[j + 1].y);
        ctx.stroke();
      }
    }

    // Moon trails
    for (i = 0; i < moons.length; i++) {
      m = moons[i];
      len = m.trail.length;
      if (len < 2) continue;
      ctx.lineWidth = 1;
      for (j = 0; j < len - 1; j++) {
        alpha = (j / (len - 1)) * 0.4;
        ctx.strokeStyle = m.color;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.moveTo(m.trail[j].x, m.trail[j].y);
        ctx.lineTo(m.trail[j + 1].x, m.trail[j + 1].y);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawStar(t) {
    var cx = window.innerWidth / 2;
    var cy = window.innerHeight / 2;
    var coreR = Math.max(18, 28 * s);
    var glowR = 140 * s * (1 + 0.06 * Math.sin(t * 2.2));

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
    grad.addColorStop(0, '#fff8e1');
    grad.addColorStop(0.15, '#ffd36b');
    grad.addColorStop(0.4, 'rgba(255,150,40,0.35)');
    grad.addColorStop(1, 'rgba(255,120,20,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = '#fff8e1';
    ctx.beginPath();
    ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawPlanets() {
    var cx = window.innerWidth / 2;
    var cy = window.innerHeight / 2;
    var i, p, r, px, py, grad, off;

    for (i = 0; i < planets.length; i++) {
      p = planets[i];
      r = p.radius * s;
      px = cx + Math.cos(p.angle) * r;
      py = cy + Math.sin(p.angle) * r;
      p.x = px;
      p.y = py;

      // Push trail
      if (playing && trails) {
        p.trail.push({ x: px, y: py });
        if (p.trail.length > 90) p.trail.shift();
      }

      // Draw planet
      ctx.save();
      ctx.shadowBlur = 12;
      ctx.shadowColor = p.color;
      off = -0.35 * p.size;
      grad = ctx.createRadialGradient(px + off, py + off, 0, px, py, p.size);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.4, p.color);
      grad.addColorStop(1, p.color);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(px, py, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawMoons() {
    var i, m, p, mx, my;

    for (i = 0; i < moons.length; i++) {
      m = moons[i];
      p = planets[m.planet];
      mx = p.x + Math.cos(m.angle) * m.dist;
      my = p.y + Math.sin(m.angle) * m.dist;
      m.x = mx;
      m.y = my;

      // Push trail
      if (playing && trails) {
        m.trail.push({ x: mx, y: my });
        if (m.trail.length > 30) m.trail.shift();
      }

      // Draw moon
      ctx.fillStyle = m.color;
      ctx.beginPath();
      ctx.arc(mx, my, m.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawBursts() {
    if (particles.length === 0) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < particles.length; i++) {
      var pt = particles[i];
      var alpha = pt.life / pt.maxLife;
      var glowR = pt.size * 3;
      var grad = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, glowR);
      var col = 'hsl(' + pt.hue + ',100%,65%)';
      grad.addColorStop(0, col);
      grad.addColorStop(1, 'hsla(' + pt.hue + ',100%,65%,0)');
      ctx.globalAlpha = alpha;
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, glowR, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // Update
  function update(dt) {
    if (playing) {
      simTime += dt * speed;

      // Update planet angles
      for (var i = 0; i < planets.length; i++) {
        planets[i].angle = planets[i].angle0 + planets[i].w * simTime;
      }

      // Update moon angles
      for (var j = 0; j < moons.length; j++) {
        moons[j].angle = moons[j].angle0 + moons[j].w * simTime;
      }

      // Update burst particles
      var damp = Math.pow(0.12, dt);
      for (var k = particles.length - 1; k >= 0; k--) {
        var pt = particles[k];
        pt.vx *= damp;
        pt.vy *= damp;
        pt.x += pt.vx * dt * speed;
        pt.y += pt.vy * dt * speed;
        pt.life -= dt * speed;
        if (pt.life <= 0) {
          particles.splice(k, 1);
        }
      }
    }
  }

  // Main loop
  function frame(now) {
    var dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    realTime = now / 1000;

    // FPS counting
    frameCount++;
    fpsTimer += dt;
    if (fpsTimer >= 0.5) {
      currentFps = Math.round(frameCount / fpsTimer);
      fpsEl.textContent = String(currentFps);
      frameCount = 0;
      fpsTimer = 0;
    }

    // Update
    update(dt);

    // Draw
    var w = window.innerWidth;
    var h = window.innerHeight;
    ctx.fillStyle = '#060913';
    ctx.fillRect(0, 0, w, h);

    drawStarfield(realTime);
    drawOrbits();
    drawTrails();
    drawStar(realTime);
    drawPlanets();
    drawMoons();
    drawBursts();

    // Update HUD
    simTimeEl.textContent = simTime.toFixed(1) + ' s';
    particleCountEl.textContent = String(particles.length);

    requestAnimationFrame(frame);
  }

  // Expose window.app before first frame
  window.app = {
    get playing() { return playing; },
    get trails() { return trails; },
    get simTime() { return simTime; },
    get speed() { return speed; },
    get particles() { return particles; },
    get planets() { return planets; },
    get moons() { return moons; },
    get stars() { return stars; },
    togglePlay: function() {
      playing = !playing;
      updatePlayBtn();
    },
    toggleTrails: function() {
      trails = !trails;
      if (!trails) {
        planets.forEach(function(p) { p.trail = []; });
        moons.forEach(function(m) { m.trail = []; });
      }
      updateTrailsBtn();
    },
    reset: function() {
      simTime = 0;
      particles = [];
      planets.forEach(function(p) { p.trail = []; });
      moons.forEach(function(m) { m.trail = []; });
      speed = 1.0;
      speedInput.value = '1.0';
      updateSpeedVal();
      playing = true;
      updatePlayBtn();
      trails = true;
      updateTrailsBtn();
    },
    spawnBurst: function(x, y) {
      spawnBurst(x, y);
    }
  };

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
