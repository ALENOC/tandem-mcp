<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boids – Simulazione di stormo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #070b14; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e6ecff; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: crosshair; }
  .glass {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 14px;
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }
  #hud {
    position: fixed; top: 16px; left: 16px; padding: 14px 18px; min-width: 190px;
    font-size: 14px; line-height: 1.7; user-select: none; pointer-events: none;
  }
  #hud h1 { font-size: 15px; font-weight: 600; letter-spacing: .5px; margin-bottom: 4px; color: #9fc3ff; }
  #hud .row { display: flex; justify-content: space-between; gap: 16px; }
  #hud .val { font-variant-numeric: tabular-nums; font-weight: 600; color: #fff; }
  #controls {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; padding: 12px 16px; flex-wrap: wrap; justify-content: center;
  }
  button {
    font: inherit; font-size: 14px; font-weight: 600; color: #e6ecff; cursor: pointer;
    background: rgba(255, 255, 255, 0.10); border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 10px; padding: 8px 16px; min-width: 84px; transition: background .15s, transform .1s;
  }
  button:hover { background: rgba(255, 255, 255, 0.18); }
  button:active { transform: scale(0.96); }
  button:focus-visible, input:focus-visible { outline: 2px solid #6ea8ff; outline-offset: 2px; }
  #playBtn.playing { background: rgba(110, 168, 255, 0.28); border-color: rgba(110, 168, 255, 0.6); }
  label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  input[type=range] { width: 140px; accent-color: #6ea8ff; cursor: pointer; }
  #speedLabel { font-variant-numeric: tabular-nums; min-width: 38px; }
  #hint { position: fixed; top: 16px; right: 16px; padding: 10px 14px; font-size: 13px; opacity: .85; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas" aria-label="Simulazione Boids"></canvas>

<div id="hud" class="glass" aria-live="polite">
  <h1>Boids</h1>
  <div class="row"><span>FPS</span><span class="val" id="fps">0</span></div>
  <div class="row"><span>Boids</span><span class="val" id="count">0</span></div>
  <div class="row"><span>Velocità</span><span class="val" id="speedHud">1.0×</span></div>
  <div class="row"><span>Stato</span><span class="val" id="state">In pausa</span></div>
</div>

<div id="hint" class="glass">Clic sul canvas per aggiungere un boid</div>

<div id="controls" class="glass">
  <button id="playBtn" type="button">▶ Play</button>
  <button id="stepBtn" type="button">Step</button>
  <button id="resetBtn" type="button">Reset</button>
  <label for="speed">Velocità
    <input id="speed" type="range" min="0.5" max="3" step="0.1" value="1">
    <span id="speedLabel">1.0×</span>
  </label>
</div>

<script>
(function () {
  "use strict";

  var INITIAL_COUNT = 60;
  var MAX_BOIDS = 600;
  var BASE_MAX_SPEED = 2.6;
  var MAX_FORCE = 0.06;
  var PERCEPTION = 55;
  var SEPARATION_DIST = 22;
  var W_SEP = 1.6, W_ALI = 1.0, W_COH = 0.85;
  var MARGIN = 60;

  var canvas = document.getElementById("canvas");
  var ctx = canvas.getContext("2d");
  var fpsEl = document.getElementById("fps");
  var countEl = document.getElementById("count");
  var speedHudEl = document.getElementById("speedHud");
  var stateEl = document.getElementById("state");
  var playBtn = document.getElementById("playBtn");
  var stepBtn = document.getElementById("stepBtn");
  var resetBtn = document.getElementById("resetBtn");
  var speedInput = document.getElementById("speed");
  var speedLabel = document.getElementById("speedLabel");

  var width = 0, height = 0, dpr = 1;
  var boids = [];
  var running = false;
  var speedMul = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      if (b.x > width) b.x = Math.random() * width;
      if (b.y > height) b.y = Math.random() * height;
    }
    draw();
  }

  function Boid(x, y) {
    var a = Math.random() * Math.PI * 2;
    var s = BASE_MAX_SPEED * (0.5 + Math.random() * 0.5);
    this.x = x; this.y = y;
    this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
    this.hue = 195 + Math.random() * 50;
  }

  function addBoid(x, y) {
    if (boids.length >= MAX_BOIDS) boids.shift();
    boids.push(new Boid(x, y));
    updateHud();
  }

  function reset() {
    boids = [];
    var pad = Math.min(MARGIN * 2, Math.min(width, height) * 0.2);
    for (var i = 0; i < INITIAL_COUNT; i++) {
      boids.push(new Boid(pad + Math.random() * Math.max(1, width - 2 * pad),
                          pad + Math.random() * Math.max(1, height - 2 * pad)));
    }
    updateHud();
    draw();
  }

  function limit(vx, vy, max) {
    var m2 = vx * vx + vy * vy;
    if (m2 > max * max) { var m = Math.sqrt(m2); return [vx / m * max, vy / m * max]; }
    return [vx, vy];
  }

  // One simulation step; dt is a multiplier of the base 60Hz step
  function update(dt) {
    var maxSpeed = BASE_MAX_SPEED * speedMul;
    var maxForce = MAX_FORCE * speedMul;
    var n = boids.length;
    var p2 = PERCEPTION * PERCEPTION, s2 = SEPARATION_DIST * SEPARATION_DIST;
    var ax = new Float32Array(n), ay = new Float32Array(n);

    for (var i = 0; i < n; i++) {
      var b = boids[i];
      var sepX = 0, sepY = 0, aliX = 0, aliY = 0, cohX = 0, cohY = 0, cnt = 0, sepCnt = 0;
      for (var j = 0; j < n; j++) {
        if (i === j) continue;
        var o = boids[j];
        var dx = o.x - b.x, dy = o.y - b.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < p2 && d2 > 0) {
          cnt++;
          aliX += o.vx; aliY += o.vy;
          cohX += o.x; cohY += o.y;
          if (d2 < s2) { sepX -= dx / d2; sepY -= dy / d2; sepCnt++; }
        }
      }
      var fx = 0, fy = 0, m, st;
      if (cnt > 0) {
        // Alignment
        aliX /= cnt; aliY /= cnt;
        m = Math.hypot(aliX, aliY);
        if (m > 0) {
          st = limit(aliX / m * maxSpeed - b.vx, aliY / m * maxSpeed - b.vy, maxForce);
          fx += st[0] * W_ALI; fy += st[1] * W_ALI;
        }
        // Cohesion
        cohX = cohX / cnt - b.x; cohY = cohY / cnt - b.y;
        m = Math.hypot(cohX, cohY);
        if (m > 0) {
          st = limit(cohX / m * maxSpeed - b.vx, cohY / m * maxSpeed - b.vy, maxForce);
          fx += st[0] * W_COH; fy += st[1] * W_COH;
        }
      }
      if (sepCnt > 0) {
        m = Math.hypot(sepX, sepY);
        if (m > 0) {
          st = limit(sepX / m * maxSpeed - b.vx, sepY / m * maxSpeed - b.vy, maxForce * 1.5);
          fx += st[0] * W_SEP; fy += st[1] * W_SEP;
        }
      }
      // Soft edge avoidance
      var turn = maxForce * 2.5;
      if (b.x < MARGIN) fx += turn * (1 - b.x / MARGIN);
      if (b.x > width - MARGIN) fx -= turn * (1 - (width - b.x) / MARGIN);
      if (b.y < MARGIN) fy += turn * (1 - b.y / MARGIN);
      if (b.y > height - MARGIN) fy -= turn * (1 - (height - b.y) / MARGIN);
      ax[i] = fx; ay[i] = fy;
    }

    for (var k = 0; k < n; k++) {
      var c = boids[k];
      c.vx += ax[k] * dt; c.vy += ay[k] * dt;
      var sp = Math.hypot(c.vx, c.vy);
      var minSpeed = maxSpeed * 0.45;
      if (sp > maxSpeed) { c.vx = c.vx / sp * maxSpeed; c.vy = c.vy / sp * maxSpeed; }
      else if (sp < minSpeed && sp > 0) { c.vx = c.vx / sp * minSpeed; c.vy = c.vy / sp * minSpeed; }
      c.x += c.vx * dt; c.y += c.vy * dt;
      // Hard safety: wrap if a boid escapes entirely
      if (c.x < -20) c.x = width + 10; else if (c.x > width + 20) c.x = -10;
      if (c.y < -20) c.y = height + 10; else if (c.y > height + 20) c.y = -10;
    }
  }

  function draw() {
    ctx.fillStyle = "#070b14";
    ctx.fillRect(0, 0, width, height);
    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      var ang = Math.atan2(b.vy, b.vx);
      var cos = Math.cos(ang), sin = Math.sin(ang);
      var L = 9, Wd = 4.5;
      ctx.beginPath();
      ctx.moveTo(b.x + cos * L, b.y + sin * L);
      ctx.lineTo(b.x - cos * L * 0.6 - sin * Wd, b.y - sin * L * 0.6 + cos * Wd);
      ctx.lineTo(b.x - cos * L * 0.3, b.y - sin * L * 0.3);
      ctx.lineTo(b.x - cos * L * 0.6 + sin * Wd, b.y - sin * L * 0.6 - cos * Wd);
      ctx.closePath();
      ctx.fillStyle = "hsl(" + b.hue.toFixed(0) + ",90%,68%)";
      ctx.fill();
    }
  }

  function updateHud() {
    countEl.textContent = String(boids.length);
    var s = speedMul.toFixed(1) + "×";
    speedHudEl.textContent = s;
    speedLabel.textContent = s;
    stateEl.textContent = running ? "In esecuzione" : "In pausa";
  }

  function setRunning(r) {
    running = r;
    playBtn.textContent = running ? "❚❚ Pause" : "▶ Play";
    playBtn.classList.toggle("playing", running);
    playBtn.setAttribute("aria-pressed", running ? "true" : "false");
    updateHud();
  }

  // Events
  playBtn.addEventListener("click", function () { setRunning(!running); });
  stepBtn.addEventListener("click", function () {
    if (running) setRunning(false);
    update(1);
    draw();
  });
  resetBtn.addEventListener("click", function () { setRunning(false); reset(); });
  speedInput.addEventListener("input", function () {
    var v = parseFloat(speedInput.value);
    if (!isFinite(v)) v = 1;
    speedMul = Math.min(3, Math.max(0.5, v));
    updateHud();
  });
  canvas.addEventListener("click", function (e) {
    var r = canvas.getBoundingClientRect();
    addBoid(e.clientX - r.left, e.clientY - r.top);
    draw();
  });
  window.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "INPUT") return;
    if (e.code === "Space") { e.preventDefault(); setRunning(!running); }
  });
  window.addEventListener("resize", resize);

  // Main loop
  var last = performance.now(), fpsAcc = 0, fpsFrames = 0;
  function loop(now) {
    var elapsed = now - last;
    last = now;
    if (!(elapsed >= 0)) elapsed = 16.67;
    fpsAcc += elapsed; fpsFrames++;
    if (fpsAcc >= 500) {
      fpsEl.textContent = String(Math.round(fpsFrames * 1000 / fpsAcc));
      fpsAcc = 0; fpsFrames = 0;
    }
    if (running) {
      var dt = Math.min(elapsed / 16.667, 3);
      update(dt);
      draw();
    }
    requestAnimationFrame(loop);
  }

  resize();
  reset();
  setRunning(false);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
