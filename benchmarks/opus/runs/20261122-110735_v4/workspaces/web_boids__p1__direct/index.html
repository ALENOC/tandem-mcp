<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boids – Simulazione di stormo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #070b14; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e6ecff; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: crosshair; background: #070b14; }
  .glass {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 14px;
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }
  #hud { position: fixed; top: 16px; left: 16px; padding: 12px 16px; min-width: 190px; user-select: none; z-index: 2; }
  #hud h1 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #8fb4ff; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; gap: 16px; font-size: 14px; line-height: 1.7; }
  .row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  #controls { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 10px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; z-index: 2; }
  button {
    font: inherit; font-size: 14px; color: #e6ecff; cursor: pointer;
    background: rgba(255, 255, 255, 0.10); border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 10px; padding: 8px 14px; min-width: 76px; transition: background .15s, transform .1s;
  }
  button:hover { background: rgba(143, 180, 255, 0.22); }
  button:active { transform: scale(.96); }
  button:focus-visible, input:focus-visible { outline: 2px solid #8fb4ff; outline-offset: 2px; }
  label { font-size: 14px; display: flex; align-items: center; gap: 8px; }
  input[type=range] { width: 140px; accent-color: #8fb4ff; }
  #speedVal { min-width: 36px; font-variant-numeric: tabular-nums; font-weight: 600; }
  #hint { position: fixed; top: 16px; right: 16px; padding: 8px 12px; font-size: 12px; color: #b8c6e6; z-index: 2; user-select: none; }
</style>
</head>
<body>
<canvas id="canvas" aria-label="Simulazione Boids: clicca per aggiungere un boid"></canvas>

<div id="hud" class="glass" aria-live="polite">
  <h1>Boids</h1>
  <div class="row"><span>FPS</span><span id="fps">0</span></div>
  <div class="row"><span>Boids</span><span id="count">0</span></div>
  <div class="row"><span>Velocità</span><span id="speedHud">1.0×</span></div>
  <div class="row"><span>Stato</span><span id="state">In pausa</span></div>
</div>

<div id="hint" class="glass">Clicca sul canvas per aggiungere un boid</div>

<div id="controls" class="glass">
  <button id="playBtn" type="button">Play</button>
  <button id="stepBtn" type="button">Step</button>
  <button id="resetBtn" type="button">Reset</button>
  <label for="speed">Velocità
    <input id="speed" type="range" min="0.5" max="3.0" step="0.1" value="1.0">
    <span id="speedVal">1.0×</span>
  </label>
</div>

<script>
(function () {
  'use strict';

  var INITIAL_BOIDS = 60;
  var MAX_BOIDS = 600;
  var PERCEPTION = 60;
  var SEPARATION_DIST = 24;
  var BASE_MAX_SPEED = 2.6;
  var MAX_FORCE = 0.06;
  var W_SEP = 1.6, W_ALI = 1.0, W_COH = 0.85;

  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var fpsEl = document.getElementById('fps');
  var countEl = document.getElementById('count');
  var speedHudEl = document.getElementById('speedHud');
  var stateEl = document.getElementById('state');
  var playBtn = document.getElementById('playBtn');
  var stepBtn = document.getElementById('stepBtn');
  var resetBtn = document.getElementById('resetBtn');
  var speedInput = document.getElementById('speed');
  var speedVal = document.getElementById('speedVal');

  var width = 0, height = 0, dpr = 1;
  var boids = [];
  var running = false;
  var speed = 1.0;

  function resize() {
    dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      if (b.x > width) b.x = Math.random() * width;
      if (b.y > height) b.y = Math.random() * height;
    }
    draw();
  }

  function createBoid(x, y) {
    var a = Math.random() * Math.PI * 2;
    var s = BASE_MAX_SPEED * (0.5 + Math.random() * 0.5);
    return {
      x: x, y: y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      hue: 195 + Math.random() * 50
    };
  }

  function reset() {
    boids = [];
    var margin = 40;
    for (var i = 0; i < INITIAL_BOIDS; i++) {
      boids.push(createBoid(
        margin + Math.random() * Math.max(1, width - margin * 2),
        margin + Math.random() * Math.max(1, height - margin * 2)
      ));
    }
    updateHud();
    draw();
  }

  function limit(vx, vy, max) {
    var m2 = vx * vx + vy * vy;
    if (m2 > max * max) {
      var m = Math.sqrt(m2);
      return [vx / m * max, vy / m * max];
    }
    return [vx, vy];
  }

  // Shortest toroidal delta
  function wrapDelta(d, size) {
    if (d > size / 2) return d - size;
    if (d < -size / 2) return d + size;
    return d;
  }

  function step(dt) {
    var maxSpeed = BASE_MAX_SPEED * speed;
    var maxForce = MAX_FORCE * speed;
    var n = boids.length;
    var ax = new Float32Array(n), ay = new Float32Array(n);
    var p2 = PERCEPTION * PERCEPTION, s2 = SEPARATION_DIST * SEPARATION_DIST;

    for (var i = 0; i < n; i++) {
      var b = boids[i];
      var sepX = 0, sepY = 0, aliX = 0, aliY = 0, cohX = 0, cohY = 0;
      var count = 0, sepCount = 0;
      for (var j = 0; j < n; j++) {
        if (i === j) continue;
        var o = boids[j];
        var dx = wrapDelta(o.x - b.x, width);
        var dy = wrapDelta(o.y - b.y, height);
        var d2 = dx * dx + dy * dy;
        if (d2 < p2 && d2 > 0) {
          count++;
          aliX += o.vx; aliY += o.vy;
          cohX += dx; cohY += dy;
          if (d2 < s2) {
            var d = Math.sqrt(d2);
            sepX -= dx / d / d; sepY -= dy / d / d;
            sepCount++;
          }
        }
      }
      var fx = 0, fy = 0, v, m;
      if (count > 0) {
        // Alignment
        aliX /= count; aliY /= count;
        m = Math.hypot(aliX, aliY);
        if (m > 0) {
          v = limit(aliX / m * maxSpeed - b.vx, aliY / m * maxSpeed - b.vy, maxForce);
          fx += v[0] * W_ALI; fy += v[1] * W_ALI;
        }
        // Cohesion
        cohX /= count; cohY /= count;
        m = Math.hypot(cohX, cohY);
        if (m > 0) {
          v = limit(cohX / m * maxSpeed - b.vx, cohY / m * maxSpeed - b.vy, maxForce);
          fx += v[0] * W_COH; fy += v[1] * W_COH;
        }
      }
      if (sepCount > 0) {
        m = Math.hypot(sepX, sepY);
        if (m > 0) {
          v = limit(sepX / m * maxSpeed - b.vx, sepY / m * maxSpeed - b.vy, maxForce);
          fx += v[0] * W_SEP; fy += v[1] * W_SEP;
        }
      }
      ax[i] = fx; ay[i] = fy;
    }

    for (var k = 0; k < n; k++) {
      var bk = boids[k];
      bk.vx += ax[k] * dt; bk.vy += ay[k] * dt;
      var lim = limit(bk.vx, bk.vy, maxSpeed);
      bk.vx = lim[0]; bk.vy = lim[1];
      var sp = Math.hypot(bk.vx, bk.vy), minSpeed = maxSpeed * 0.4;
      if (sp < minSpeed) {
        if (sp === 0) { bk.vx = minSpeed; bk.vy = 0; }
        else { bk.vx = bk.vx / sp * minSpeed; bk.vy = bk.vy / sp * minSpeed; }
      }
      bk.x += bk.vx * dt; bk.y += bk.vy * dt;
      if (bk.x < 0) bk.x += width; else if (bk.x >= width) bk.x -= width;
      if (bk.y < 0) bk.y += height; else if (bk.y >= height) bk.y -= height;
    }
  }

  function draw() {
    ctx.fillStyle = '#070b14';
    ctx.fillRect(0, 0, width, height);
    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      var ang = Math.atan2(b.vy, b.vx);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(9, 0);
      ctx.lineTo(-6, 4.5);
      ctx.lineTo(-3.5, 0);
      ctx.lineTo(-6, -4.5);
      ctx.closePath();
      ctx.fillStyle = 'hsl(' + b.hue.toFixed(0) + ', 90%, 68%)';
      ctx.fill();
      ctx.restore();
    }
  }

  function updateHud() {
    countEl.textContent = String(boids.length);
    speedHudEl.textContent = speed.toFixed(1) + '×';
    speedVal.textContent = speed.toFixed(1) + '×';
    stateEl.textContent = running ? 'In esecuzione' : 'In pausa';
    playBtn.textContent = running ? 'Pause' : 'Play';
    playBtn.setAttribute('aria-pressed', running ? 'true' : 'false');
  }

  // Main loop
  var lastTime = performance.now();
  var fpsFrames = 0, fpsTime = lastTime;
  function frame(now) {
    var dt = Math.min((now - lastTime) / (1000 / 60), 3);
    lastTime = now;
    if (running) step(dt);
    draw();
    fpsFrames++;
    if (now - fpsTime >= 500) {
      fpsEl.textContent = String(Math.round(fpsFrames * 1000 / (now - fpsTime)));
      fpsFrames = 0; fpsTime = now;
    }
    requestAnimationFrame(frame);
  }

  // Events
  playBtn.addEventListener('click', function () { running = !running; updateHud(); });
  stepBtn.addEventListener('click', function () {
    if (running) { running = false; }
    step(1); draw(); updateHud();
  });
  resetBtn.addEventListener('click', function () { reset(); });
  speedInput.addEventListener('input', function () {
    var v = parseFloat(speedInput.value);
    if (!isFinite(v)) v = 1;
    speed = Math.max(0.5, Math.min(3.0, v));
    updateHud();
  });
  canvas.addEventListener('click', function (e) {
    if (boids.length >= MAX_BOIDS) return;
    var r = canvas.getBoundingClientRect();
    boids.push(createBoid(e.clientX - r.left, e.clientY - r.top));
    updateHud();
    draw();
  });
  window.addEventListener('keydown', function (e) {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); running = !running; updateHud(); }
  });
  window.addEventListener('resize', resize);

  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
