<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Portal 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03020a; }
  body {
    background: radial-gradient(ellipse at 50% 45%, #1b0f3a 0%, #0b0720 45%, #03020a 100%);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #e8f6ff;
    user-select: none;
  }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: grab; }
  #c.drag { cursor: grabbing; }
  .glass {
    position: fixed;
    background: rgba(20, 16, 48, 0.32);
    border: 1px solid rgba(160, 220, 255, 0.22);
    border-radius: 16px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  #hud { top: 18px; left: 18px; padding: 14px 18px; min-width: 200px; }
  #hud h1 {
    margin: 0 0 10px; font-size: 17px; letter-spacing: 3px; font-weight: 800;
    background: linear-gradient(90deg, #3ef2ff, #ff3ed8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 18px rgba(62, 242, 255, 0.35);
  }
  .stats { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 12px;
           font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
  .stats span:nth-child(odd) { color: #8fa9c9; letter-spacing: 1px; }
  .stats span:nth-child(even) { color: #7dfcff; text-align: right; }
  #controls { bottom: 18px; left: 50%; transform: translateX(-50%); padding: 10px 14px;
              display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button {
    font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: 1px;
    color: #e8f6ff; background: rgba(62, 242, 255, 0.08);
    border: 1px solid rgba(62, 242, 255, 0.4); border-radius: 10px;
    padding: 7px 14px; cursor: pointer; transition: all .15s;
  }
  button:hover { background: rgba(62, 242, 255, 0.2); box-shadow: 0 0 14px rgba(62, 242, 255, 0.45); }
  button.off { border-color: rgba(255, 62, 216, 0.5); background: rgba(255, 62, 216, 0.1); }
  label { font-size: 12px; color: #8fa9c9; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
  #speedVal { color: #7dfcff; font-family: ui-monospace, Consolas, monospace; min-width: 34px; }
  input[type=range] { accent-color: #ff3ed8; width: 130px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="glass">
  <h1>NEON PORTAL 3D</h1>
  <div class="stats">
    <span>FPS</span><span id="fps">0</span>
    <span>POLYS</span><span id="polys">0</span>
    <span>PARTS</span><span id="parts">0</span>
  </div>
</div>

<div id="controls" class="glass">
  <button id="btnPause">Pause</button>
  <button id="btnOrbit">Orbit ON</button>
  <button id="btnReset">Reset</button>
  <label>Speed <input id="speed" type="range" min="0" max="3" step="0.05" value="1"><span id="speedVal">1.00x</span></label>
</div>

<script>
"use strict";
(() => {
  // ---------------------------------------------------------------- vec math
  const V = (x, y, z) => ({ x, y, z });
  const sub = (a, b) => V(a.x - b.x, a.y - b.y, a.z - b.z);
  const add = (a, b) => V(a.x + b.x, a.y + b.y, a.z + b.z);
  const scale = (a, s) => V(a.x * s, a.y * s, a.z * s);
  const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
  const cross = (a, b) => V(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
  const norm = a => { const l = Math.hypot(a.x, a.y, a.z) || 1; return V(a.x / l, a.y / l, a.z / l); };
  const rotY = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return V(p.x * c + p.z * s, p.y, -p.x * s + p.z * c); };
  const rotX = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return V(p.x, p.y * c - p.z * s, p.y * s + p.z * c); };
  const rotZ = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return V(p.x * c - p.y * s, p.x * s + p.y * c, p.z); };
  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------------------------------------------------------------- canvas
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1, FOCAL = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    FOCAL = Math.min(W, H) * 1.05;
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------------------------------------------------------------- camera
  const NEAR = 0.15;
  const cam = { pos: V(0, 0, 0), right: V(1, 0, 0), up: V(0, 1, 0), fwd: V(0, 0, 1) };
  const DEFAULT_VIEW = { yaw: 0.55, pitch: 0.22, dist: 17, target: V(0, 3.2, 0) };
  const view = { ...DEFAULT_VIEW };

  function updateCamera() {
    const cp = Math.cos(view.pitch);
    cam.pos = V(view.target.x + Math.sin(view.yaw) * cp * view.dist,
                view.target.y + Math.sin(view.pitch) * view.dist,
                view.target.z + Math.cos(view.yaw) * cp * view.dist);
    cam.fwd = norm(sub(view.target, cam.pos));
    cam.right = norm(cross(V(0, 1, 0), cam.fwd));
    cam.up = cross(cam.fwd, cam.right);
  }
  // world -> camera space
  function toCam(p) {
    const d = sub(p, cam.pos);
    return V(dot(d, cam.right), dot(d, cam.up), dot(d, cam.fwd));
  }
  // camera space -> screen
  function proj(c) {
    const k = FOCAL / c.z;
    return { x: W / 2 + c.x * k, y: H / 2 - c.y * k, z: c.z, k };
  }

  // ---------------------------------------------------------------- scene: boxes (6 boxes x 6 faces = 36)
  function makeBox(cx, y0, cz, sx, sy, sz, color, edge) {
    const x0 = cx - sx / 2, x1 = cx + sx / 2, y1 = y0 + sy, z0 = cz - sz / 2, z1 = cz + sz / 2;
    const v = [V(x0, y0, z0), V(x1, y0, z0), V(x1, y1, z0), V(x0, y1, z0),
               V(x0, y0, z1), V(x1, y0, z1), V(x1, y1, z1), V(x0, y1, z1)];
    const quads = [
      [[0, 3, 2, 1], V(0, 0, -1)], [[4, 5, 6, 7], V(0, 0, 1)],
      [[0, 4, 7, 3], V(-1, 0, 0)], [[1, 2, 6, 5], V(1, 0, 0)],
      [[3, 7, 6, 2], V(0, 1, 0)],  [[0, 1, 5, 4], V(0, -1, 0)],
    ];
    return quads.map(([idx, n]) => {
      const pts = idx.map(i => v[i]);
      const c = scale(pts.reduce(add, V(0, 0, 0)), 0.25);
      return { pts, n, c, color, edge };
    });
  }
  const STONE = [38, 30, 72], STONE2 = [30, 26, 60], PILLAR = [44, 34, 86], CAP = [56, 36, 96];
  const CYAN = "62,242,255", MAGENTA = "255,62,216", VIOLET = "170,110,255";
  const boxFaces = [
    ...makeBox(0, 0.0, 0, 9.0, 0.55, 6.0, STONE2, CYAN),     // lower tier
    ...makeBox(0, 0.55, 0, 6.6, 0.5, 4.0, STONE, MAGENTA),   // upper tier
    ...makeBox(-2.55, 1.05, 0, 0.9, 5.2, 0.9, PILLAR, CYAN), // left pillar
    ...makeBox(2.55, 1.05, 0, 0.9, 5.2, 0.9, PILLAR, CYAN),  // right pillar
    ...makeBox(0, 6.25, 0, 6.4, 0.75, 1.2, CAP, MAGENTA),    // lintel
    ...makeBox(0, 7.0, 0, 3.0, 0.55, 0.9, CAP, VIOLET),      // crown cap
  ];

  // ---------------------------------------------------------------- scene: crystals (6 octahedra x 8 = 48 tris)
  const PORTAL = V(0, 3.65, 0);
  const OCT_V = [V(1, 0, 0), V(-1, 0, 0), V(0, 1.5, 0), V(0, -1.5, 0), V(0, 0, 1), V(0, 0, -1)];
  const OCT_F = [[2, 4, 0], [2, 0, 5], [2, 5, 1], [2, 1, 4], [3, 0, 4], [3, 5, 0], [3, 1, 5], [3, 4, 1]];
  const crystals = Array.from({ length: 6 }, (_, i) => ({
    phase: (i / 6) * Math.PI * 2,
    radius: 4.6 + (i % 2) * 0.6,
    height: 3.4 + Math.sin(i * 1.7) * 1.4,
    size: 0.32 + (i % 3) * 0.06,
    spin: 1.2 + i * 0.25,
    hue: i % 2 ? MAGENTA : CYAN,
    base: i % 2 ? [150, 40, 140] : [30, 140, 170],
  }));

  // ---------------------------------------------------------------- stars & particles
  const stars = Array.from({ length: 180 }, () => {
    const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, r = Math.sqrt(1 - u * u);
    return { d: V(r * Math.cos(t), Math.abs(u) * 0.9 + 0.05, r * Math.sin(t)),  // upper hemisphere-ish
             size: rand(0.5, 1.8), phase: rand(0, 6.28), rate: rand(0.8, 3.2),
             tint: Math.random() < 0.2 ? MAGENTA : Math.random() < 0.5 ? CYAN : "235,240,255" };
  });
  function spawnParticle(p, initial) {
    const a = rand(0, Math.PI * 2), r = Math.sqrt(Math.random()) * 3.0;
    p.pos = V(Math.cos(a) * r, initial ? rand(1.05, 9) : 1.05, Math.sin(a) * r * 0.7);
    p.vy = rand(0.5, 1.4); p.drift = rand(-0.25, 0.25); p.life = 0;
    p.max = rand(5, 9); p.size = rand(0.03, 0.07); p.tint = Math.random() < 0.5 ? CYAN : MAGENTA;
    return p;
  }
  const particles = Array.from({ length: 110 }, () => spawnParticle({}, true));

  // ---------------------------------------------------------------- state & UI
  const state = { paused: false, orbit: true, speed: 1, time: 0 };
  const $ = id => document.getElementById(id);
  const btnPause = $("btnPause"), btnOrbit = $("btnOrbit"), slider = $("speed");
  btnPause.onclick = () => {
    state.paused = !state.paused;
    btnPause.textContent = state.paused ? "Resume" : "Pause";
    btnPause.classList.toggle("off", state.paused);
  };
  btnOrbit.onclick = () => {
    state.orbit = !state.orbit;
    btnOrbit.textContent = state.orbit ? "Orbit ON" : "Orbit OFF";
    btnOrbit.classList.toggle("off", !state.orbit);
  };
  $("btnReset").onclick = () => {
    Object.assign(view, DEFAULT_VIEW);
    state.time = 0; state.speed = 1; slider.value = 1; $("speedVal").textContent = "1.00x";
    particles.forEach(p => spawnParticle(p, true));
  };
  slider.oninput = () => { state.speed = +slider.value; $("speedVal").textContent = state.speed.toFixed(2) + "x"; };
  window.addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); btnPause.click(); }
    else if (e.key === "o" || e.key === "O") btnOrbit.click();
    else if (e.key === "r" || e.key === "R") $("btnReset").click();
  });

  // mouse drag / wheel camera control
  let drag = null;
  canvas.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY }; canvas.classList.add("drag"); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", e => {
    if (!drag) return;
    view.yaw -= (e.clientX - drag.x) * 0.006;
    view.pitch = Math.max(-0.05, Math.min(1.2, view.pitch + (e.clientY - drag.y) * 0.004));
    drag = { x: e.clientX, y: e.clientY };
  });
  const endDrag = () => { drag = null; canvas.classList.remove("drag"); };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("wheel", e => { e.preventDefault(); view.dist = Math.max(8, Math.min(32, view.dist * (1 + Math.sign(e.deltaY) * 0.08))); }, { passive: false });

  // ---------------------------------------------------------------- lighting
  const SUN = norm(V(-0.4, 0.8, 0.5));
  function shade(base, n, c, t) {
    const lam = Math.max(0, dot(n, SUN));
    const toP = sub(PORTAL, c); const d = Math.hypot(toP.x, toP.y, toP.z) || 1;
    const pl = Math.max(0, dot(n, scale(toP, 1 / d))) * (2.4 / (1 + d * d * 0.12)) * (0.85 + 0.15 * Math.sin(t * 3));
    const amb = 0.35;
    const r = base[0] * (amb + lam * 0.7) + 120 * pl;
    const g = base[1] * (amb + lam * 0.7) + 50 * pl;
    const b = base[2] * (amb + lam * 0.7) + 160 * pl;
    return `rgb(${Math.min(255, r) | 0},${Math.min(255, g) | 0},${Math.min(255, b) | 0})`;
  }

  // ---------------------------------------------------------------- render helpers
  function drawGrid(t) {
    const size = 30, step = 1.5, scroll = (t * 0.6) % step;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.lineWidth = 1;
    const line = (a, b, alpha, col) => {
      let ca = toCam(a), cb = toCam(b);
      if (ca.z < NEAR && cb.z < NEAR) return;
      if (ca.z < NEAR) { const s = (NEAR - ca.z) / (cb.z - ca.z); ca = add(ca, scale(sub(cb, ca), s)); }
      else if (cb.z < NEAR) { const s = (NEAR - cb.z) / (ca.z - cb.z); cb = add(cb, scale(sub(ca, cb), s)); }
      const pa = proj(ca), pb = proj(cb);
      ctx.strokeStyle = `rgba(${col},${alpha})`;
      ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
    };
    for (let i = -size; i <= size + 0.001; i += step) {
      const fade = 1 - Math.abs(i) / size;
      line(V(i, 0, -size), V(i, 0, size), 0.32 * fade, MAGENTA);
      const z = i + scroll;
      if (Math.abs(z) <= size) line(V(-size, 0, z), V(size, 0, z), 0.32 * (1 - Math.abs(z) / size), CYAN);
    }
    ctx.restore();
    // floor glow under the portal
    const c = toCam(V(0, 0, 0));
    if (c.z > NEAR) {
      const p = proj(c), r = 9 * p.k;
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      g.addColorStop(0, "rgba(255,62,216,0.22)"); g.addColorStop(0.5, "rgba(62,242,255,0.07)"); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, r, r * Math.max(0.15, Math.abs(cam.fwd.y)) , 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
  }

  function drawStars(t) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const s of stars) {
      const c = V(dot(s.d, cam.right), dot(s.d, cam.up), dot(s.d, cam.fwd));
      if (c.z <= 0.05) continue;
      const p = proj(c);
      if (p.x < -10 || p.x > W + 10 || p.y < -10 || p.y > H + 10) continue;
      const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.rate + s.phase));
      ctx.fillStyle = `rgba(${s.tint},${tw.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, s.size * (0.7 + tw * 0.5), 0, Math.PI * 2); ctx.fill();
      if (s.size > 1.4 && tw > 0.85) {
        ctx.strokeStyle = `rgba(${s.tint},${(tw - 0.7).toFixed(3)})`; ctx.lineWidth = 0.6;
        ctx.beginPath(); ctx.moveTo(p.x - 5, p.y); ctx.lineTo(p.x + 5, p.y); ctx.moveTo(p.x, p.y - 5); ctx.lineTo(p.x, p.y + 5); ctx.stroke();
      }
    }
    ctx.restore();
  }

  // polygon draw item: world pts -> cam -> screen, painter-sorted
  function polyItem(worldPts, fill, edge, edgeAlpha, list) {
    const cs = worldPts.map(toCam);
    if (cs.some(c => c.z < NEAR)) return false;
    const ps = cs.map(proj);
    let z = 0; for (const c of cs) z += c.z; z /= cs.length;
    list.push({ z, draw() {
      ctx.beginPath(); ctx.moveTo(ps[0].x, ps[0].y);
      for (let i = 1; i < ps.length; i++) ctx.lineTo(ps[i].x, ps[i].y);
      ctx.closePath();
      ctx.fillStyle = fill; ctx.fill();
      ctx.strokeStyle = `rgba(${edge},${edgeAlpha})`; ctx.lineWidth = 1.2;
      ctx.shadowColor = `rgba(${edge},0.9)`; ctx.shadowBlur = 8;
      ctx.stroke(); ctx.shadowBlur = 0;
    }});
    return true;
  }

  function buildRing(list, radius, angle, tilt, segs, col, width, t) {
    // dashed ring in the portal plane (XY at z=0), spinning about its normal with a small tilt wobble
    for (let i = 0; i < segs; i++) {
      if (i % 4 === 3) continue; // gaps make the rotation visible
      const a0 = angle + (i / segs) * Math.PI * 2, a1 = angle + ((i + 0.85) / segs) * Math.PI * 2;
      const pt = a => add(PORTAL, rotX(rotY(V(Math.cos(a) * radius, Math.sin(a) * radius, 0), tilt), tilt * 0.5));
      const ca = toCam(pt(a0)), cb = toCam(pt(a1));
      if (ca.z < NEAR || cb.z < NEAR) continue;
      const pa = proj(ca), pb = proj(cb);
      const pulse = 0.65 + 0.35 * Math.sin(t * 4 + i * 0.5);
      list.push({ z: (ca.z + cb.z) / 2, draw() {
        ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
        ctx.strokeStyle = `rgba(${col},${0.25 * pulse})`; ctx.lineWidth = width * 3.2 * pa.k / 60;
        ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
        ctx.strokeStyle = `rgba(${col},${0.95 * pulse})`; ctx.lineWidth = width * pa.k / 60;
        ctx.stroke();
        ctx.restore();
      }});
    }
  }

  function drawPortalCore(list, t) {
    const c = toCam(PORTAL);
    if (c.z < NEAR) return;
    const p = proj(c);
    list.push({ z: c.z + 0.05, draw() {
      const r = 1.55 * p.k;
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      // outer halo
      let g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 2.2);
      g.addColorStop(0, "rgba(255,255,255,0.35)"); g.addColorStop(0.25, "rgba(255,62,216,0.35)");
      g.addColorStop(0.55, "rgba(62,242,255,0.15)"); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r * 2.2, 0, Math.PI * 2); ctx.fill();
      // swirling vortex arms (drawn in screen space, foreshortened by portal facing)
      const facing = Math.abs(dot(V(0, 0, 1), cam.fwd));
      ctx.translate(p.x, p.y);
      for (let arm = 0; arm < 5; arm++) {
        ctx.beginPath();
        for (let s = 0; s <= 40; s++) {
          const f = s / 40, a = t * 1.6 + arm * (Math.PI * 2 / 5) + f * 4.2, rr = f * r * 0.95;
          const x = Math.cos(a) * rr * Math.max(0.2, facing), y = Math.sin(a) * rr;
          s ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.strokeStyle = arm % 2 ? "rgba(62,242,255,0.5)" : "rgba(255,62,216,0.55)";
        ctx.lineWidth = Math.max(1, r * 0.06); ctx.stroke();
      }
      // bright core
      g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.45);
      const beat = 0.8 + 0.2 * Math.sin(t * 5);
      g.addColorStop(0, `rgba(255,255,255,${0.9 * beat})`); g.addColorStop(0.5, `rgba(200,120,255,${0.5 * beat})`); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }});
  }

  // ---------------------------------------------------------------- main loop
  let last = performance.now(), fpsAcc = 0, fpsFrames = 0, fpsShown = 0;
  const elFps = $("fps"), elPolys = $("polys"), elParts = $("parts");

  function frame(now) {
    const rawDt = Math.min(0.05, (now - last) / 1000); last = now;
    fpsAcc += rawDt; fpsFrames++;
    if (fpsAcc >= 0.4) { fpsShown = Math.round(fpsFrames / fpsAcc); fpsAcc = 0; fpsFrames = 0; elFps.textContent = fpsShown; }

    const dt = state.paused ? 0 : rawDt * state.speed;
    state.time += dt;
    const t = state.time;
    if (state.orbit && !drag) view.yaw += dt * 0.22;
    updateCamera();

    ctx.clearRect(0, 0, W, H);
    drawStars(t);
    drawGrid(t);

    const list = [];
    let polys = 0;

    // box faces with backface culling
    for (const f of boxFaces) {
      if (dot(f.n, sub(cam.pos, f.c)) <= 0) continue;
      if (polyItem(f.pts, shade(f.color, f.n, f.c, t), f.edge, 0.75, list)) polys++;
    }

    // crystals
    for (const cr of crystals) {
      const a = cr.phase + t * 0.5;
      const center = V(Math.cos(a) * cr.radius, cr.height + Math.sin(t * 1.3 + cr.phase) * 0.45, Math.sin(a) * cr.radius * 0.8);
      const verts = OCT_V.map(v => add(center, rotY(rotZ(scale(v, cr.size), 0.3 * Math.sin(t + cr.phase)), t * cr.spin)));
      for (const tri of OCT_F) {
        const pts = tri.map(i => verts[i]);
        const n = norm(cross(sub(pts[1], pts[0]), sub(pts[2], pts[0])));
        const c = scale(add(add(pts[0], pts[1]), pts[2]), 1 / 3);
        if (dot(n, sub(cam.pos, c)) <= 0) continue;
        if (polyItem(pts, shade(cr.base, n, c, t), cr.hue, 0.95, list)) polys++;
      }
    }

    // portal core + counter-rotating rings
    drawPortalCore(list, t);
    buildRing(list, 1.95, t * 0.9, 0.12 * Math.sin(t * 0.7), 32, CYAN, 7, t);
    buildRing(list, 1.65, -t * 1.4, -0.12 * Math.sin(t * 0.9), 24, MAGENTA, 5, t);

    // rising particles
    for (const p of particles) {
      if (dt > 0) {
        p.life += dt; p.pos = V(p.pos.x + Math.sin(t + p.life) * p.drift * dt, p.pos.y + p.vy * dt, p.pos.z);
        if (p.pos.y > 10 || p.life > p.max) spawnParticle(p, false);
      }
      const c = toCam(p.pos);
      if (c.z < NEAR) continue;
      const sp = proj(c);
      const fade = Math.min(1, p.life * 1.5) * Math.max(0, 1 - (p.pos.y - 1) / 9);
      list.push({ z: c.z, draw() {
        const r = Math.max(0.8, p.size * sp.k);
        ctx.save(); ctx.globalCompositeOperation = "lighter";
        const g = ctx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, r * 3);
        g.addColorStop(0, `rgba(255,255,255,${0.9 * fade})`); g.addColorStop(0.3, `rgba(${p.tint},${0.7 * fade})`); g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sp.x, sp.y, r * 3, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }});
    }

    list.sort((a, b) => b.z - a.z);
    for (const it of list) it.draw();

    elPolys.textContent = polys;
    elParts.textContent = particles.length;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
