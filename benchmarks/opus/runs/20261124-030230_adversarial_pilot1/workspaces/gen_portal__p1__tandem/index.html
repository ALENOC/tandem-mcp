<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON PORTAL 3D</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; overflow: hidden; background: #05010f; }
canvas#c { display: block; position: fixed; top: 0; left: 0; }
#hud {
  position: fixed;
  top: 16px;
  left: 16px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 14px;
  padding: 16px 20px;
  color: #fff;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  line-height: 1.6;
  min-width: 200px;
  z-index: 10;
  user-select: none;
}
#title {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.stat { margin: 2px 0; }
.controls { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.controls button {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.25);
  color: #fff;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
}
.controls button:hover { background: rgba(255,255,255,0.18); }
.speed-row { display: flex; align-items: center; gap: 8px; }
.speed-row label { font-size: 12px; }
.speed-row input[type="range"] { width: 100px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="title">NEON PORTAL 3D</div>
  <div class="stat" id="fps">FPS: 0</div>
  <div class="stat" id="polys">POLYS: 0</div>
  <div class="stat" id="parts">PARTS: 110</div>
  <div class="controls">
    <button id="pauseBtn">Pause</button>
    <button id="orbitBtn">Orbit ON</button>
    <button id="resetBtn">Reset</button>
    <div class="speed-row">
      <label for="speed">Speed</label>
      <input type="range" id="speed" min="0" max="3" step="0.1" value="1">
    </div>
  </div>
</div>
<script src="engine3d.js"></script>
<script src="scene.js"></script>
<script src="app.js"></script>
</body>
</html>
