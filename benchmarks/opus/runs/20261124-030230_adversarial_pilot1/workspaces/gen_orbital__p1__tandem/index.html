<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Particle Simulation</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #060913;
    overflow: hidden;
  }
  #sim {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #060913;
    cursor: crosshair;
  }
  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    min-width: 210px;
    padding: 14px 16px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 14px;
    color: #e6ecff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    user-select: none;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }
  #hud h1 {
    margin: 0 0 10px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #ffffff;
    opacity: 0.9;
  }
  .row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  button {
    flex: 1;
    padding: 8px 10px;
    background: rgba(255, 255, 255, 0.10);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 9px;
    color: #e6ecff;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  button:hover {
    background: rgba(255, 255, 255, 0.18);
  }
  button:active {
    transform: translateY(1px);
  }
  .sliderRow {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .sliderRow label {
    font-size: 11px;
    opacity: 0.8;
    white-space: nowrap;
  }
  #speed {
    flex: 1;
    accent-color: #ffd27a;
    cursor: pointer;
  }
  #speedVal {
    min-width: 34px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .stats {
    display: grid;
    grid-template-columns: auto auto;
    gap: 4px 14px;
    font-size: 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    padding-top: 10px;
  }
  .stats .k {
    opacity: 0.7;
  }
  .stats .v {
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .hint {
    margin-top: 10px;
    font-size: 10px;
    opacity: 0.55;
  }
</style>
</head>
<body>
  <canvas id="sim"></canvas>
  <div id="hud">
    <h1>Orbital Sim</h1>
    <div class="row">
      <button id="btnPlay">Pause</button>
      <button id="btnTrails">Trails: ON</button>
      <button id="btnReset">Reset</button>
    </div>
    <div class="sliderRow">
      <label for="speed">Speed</label>
      <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
      <span id="speedVal">1.0x</span>
    </div>
    <div class="stats">
      <span class="k">FPS</span><span class="v" id="fps">0</span>
      <span class="k">Time</span><span class="v" id="simTime">0.0 s</span>
      <span class="k">Particles</span><span class="v" id="particleCount">0</span>
    </div>
    <div class="hint">Click the canvas to spawn a burst.</div>
  </div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('sim');
  var ctx = canvas.getContext('2d');

  var btnPlay = document.getElementById('btnPlay');
  var btnTrails = document.getElementById('btnTrails');
  var btnReset = document.getElementById('btnReset');
  var speedInput = document.getElementById('speed');
  var speedVal = document.getElementById('speedVal');
  var fpsEl = document.getElementById('fps');
  var simTimeEl = document.getElementById('simTime');
  var particleCountEl = document.getElementById('particleCount');

  var app = {
    planets: [],
    moons: [],
    stars: [],
    particles: [],
    playing: true,
    trails: true,
    speed: 1.0,
    simTime: 0,
    spawnBurst: null,
    reset: null
  };

  var W = 0;
  var H = 0;
  var dpr = 1;

  var PLANET_DEFS = [
    { r: 70,  size: 5,  color: '#4fc3f7', speed: 0.90, phase: 0.0 },
    { r: 105, size: 7,  color: '#ef5350', speed: 0.62, phase: 1.3 },
    { r: 145, size: 6,  color: '#66bb6a', speed: 0.45, phase: 2.6 },
    { r: 190, size: 9,  color: '#ffca28', speed: 0.30, phase: 4.1 },
    { r: 240, size: 8,  color: '#ab47bc', speed: 0.20, phase: 5.4 },
    { r: 295, size: 6,  color: '#26c6da', speed: 0.13, phase: 0.8 }
  ];

  var MOON_DEFS = [
    { parent: 0, dist: 16, size: 2.5, speed: 2.2, phase: 0.0, color: '#cfd8ff' },
    { parent: 1, dist: 20, size: 3.0, speed: 1.8, phase: 1.0, color: '#ffd9d9' },
    { parent: 3, dist: 24, size: 3.5, speed: 1.4, phase: 2.0, color: '#fff3c4' },
    { parent: 4, dist: 22, size: 3.0, speed: 1.6, phase: 3.0, color: '#e6ccff' }
  ];

  var TRAIL_LEN = 40;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function buildStars() {
    app.stars = [];
    var n = 180;
    for (var i = 0; i < n; i++) {
      app.stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.4 + 0.4,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 1.5 + 0.5
      });
    }
  }

  function buildPlanets() {
    app.planets = [];
    for (var i = 0; i < PLANET_DEFS.length; i++) {
      var d = PLANET_DEFS[i];
      app.planets.push({
        orbitRadius: d.r,
        size: d.size,
        color: d.color,
        angSpeed: d.speed,
        angle: d.phase,
        initAngle: d.phase,
        x: 0,
        y: 0,
        trail: []
      });
    }
  }

  function buildMoons() {
    app.moons = [];
    for (var i = 0; i < MOON_DEFS.length; i++) {
      var d = MOON_DEFS[i];
      app.moons.push({
        parent: d.parent,
        dist: d.dist,
        size: d.size,
        angSpeed: d.speed,
        angle: d.phase,
        initAngle: d.phase,
        color: d.color,
        x: 0,
        y: 0
      });
    }
  }

  function updatePositions() {
    var cx = W / 2;
    var cy = H / 2;
    var i, p;
    for (i = 0; i < app.planets.length; i++) {
      p = app.planets[i];
      p.x = cx + Math.cos(p.angle) * p.orbitRadius;
      p.y = cy + Math.sin(p.angle) * p.orbitRadius;
    }
    for (i = 0; i < app.moons.length; i++) {
      var m = app.moons[i];
      var pp = app.planets[m.parent];
      m.x = pp.x + Math.cos(m.angle) * m.dist;
      m.y = pp.y + Math.sin(m.angle) * m.dist;
    }
  }

  function spawnBurst(x, y) {
    var count = 60 + Math.floor(Math.random() * 61);
    var palette = ['#ffd27a', '#ff9a3c', '#4fc3f7', '#ffffff', '#ffca28', '#ab47bc'];
    for (var i = 0; i < count; i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = 40 + Math.random() * 160;
      app.particles.push({
        x: x,
        y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 1,
        decay: 0.5 + Math.random() * 0.8,
        size: 1 + Math.random() * 2.5,
        color: palette[Math.floor(Math.random() * palette.length)]
      });
    }
  }

  function reset() {
    app.simTime = 0;
    app.playing = true;
    btnPlay.textContent = 'Pause';
    var i;
    for (i = 0; i < app.planets.length; i++) {
      app.planets[i].angle = app.planets[i].initAngle;
      app.planets[i].trail.length = 0;
    }
    for (i = 0; i < app.moons.length; i++) {
      app.moons[i].angle = app.moons[i].initAngle;
    }
    app.particles.length = 0;
    updatePositions();
  }

  function update(dt) {
    var i, p;
    for (i = 0; i < app.planets.length; i++) {
      p = app.planets[i];
      p.angle += p.angSpeed * dt;
    }
    for (i = 0; i < app.moons.length; i++) {
      app.moons[i].angle += app.moons[i].angSpeed * dt;
    }
    updatePositions();
    if (app.trails) {
      for (i = 0; i < app.planets.length; i++) {
        p = app.planets[i];
        p.trail.push({ x: p.x, y: p.y });
        if (p.trail.length > TRAIL_LEN) p.trail.shift();
      }
    }
    var damp = Math.pow(0.96, dt * 60);
    for (i = app.particles.length - 1; i >= 0; i--) {
      var pt = app.particles[i];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vx *= damp;
      pt.vy *= damp;
      pt.life -= pt.decay * dt;
      if (pt.life <= 0) {
        app.particles.splice(i, 1);
      }
    }
  }

  function drawStarfield() {
    var t = app.simTime;
    var i, s;
    for (i = 0; i < app.stars.length; i++) {
      s = app.stars[i];
      var a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
      ctx.globalAlpha = a;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawOrbits() {
    var cx = W / 2;
    var cy = H / 2;
    var i, p;
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    for (i = 0; i < app.planets.length; i++) {
      p = app.planets[i];
      ctx.beginPath();
      ctx.arc(cx, cy, p.orbitRadius, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawStar() {
    var cx = W / 2;
    var cy = H / 2;
    var t = app.simTime;
    var pulse = 0.5 + 0.5 * Math.sin(t * 1.5);
    var base = Math.min(W, H) * 0.16;
    var coreR = base * (0.9 + 0.1 * pulse);
    var coronaR = base * (1.6 + 0.35 * pulse);

    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.25, 'rgba(255,210,122,0.95)');
    g.addColorStop(0.55, 'rgba(255,154,60,0.55)');
    g.addColorStop(1, 'rgba(255,154,60,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
    ctx.fill();

    var cg = ctx.createRadialGradient(cx, cy, coreR * 0.6, cx, cy, coronaR);
    cg.addColorStop(0, 'rgba(255,180,90,' + (0.18 + 0.12 * pulse).toFixed(3) + ')');
    cg.addColorStop(1, 'rgba(255,154,60,0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(cx, cy, coronaR, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawTrails() {
    var i, p, j, pt;
    for (i = 0; i < app.planets.length; i++) {
      p = app.planets[i];
      var n = p.trail.length;
      if (n < 2) continue;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      for (j = 1; j < n; j++) {
        var a = (j / n) * 0.5;
        ctx.strokeStyle = p.color;
        ctx.globalAlpha = a;
        ctx.beginPath();
        ctx.moveTo(p.trail[j - 1].x, p.trail[j - 1].y);
        ctx.lineTo(p.trail[j].x, p.trail[j].y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawPlanets() {
    var i, p;
    for (i = 0; i < app.planets.length; i++) {
      p = app.planets[i];
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawMoons() {
    var i, m;
    for (i = 0; i < app.moons.length; i++) {
      m = app.moons[i];
      ctx.fillStyle = m.color;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawParticles() {
    var i, pt;
    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < app.particles.length; i++) {
      pt = app.particles[i];
      ctx.globalAlpha = Math.max(0, Math.min(1, pt.life));
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function render() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#060913';
    ctx.fillRect(0, 0, W, H);
    drawStarfield();
    drawOrbits();
    drawStar();
    if (app.trails) drawTrails();
    drawPlanets();
    drawMoons();
    drawParticles();
  }

  var last = performance.now();
  var fpsAccum = 0;
  var fpsFrames = 0;
  var fps = 0;

  function frame(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (dt < 0) dt = 0;
    if (dt > 0.05) dt = 0.05;

    fpsAccum += dt;
    fpsFrames++;
    if (fpsAccum >= 0.5) {
      fps = Math.round(fpsFrames / fpsAccum);
      fpsAccum = 0;
      fpsFrames = 0;
    }

    if (app.playing) {
      app.simTime += dt * app.speed;
      update(dt * app.speed);
    }

    render();

    fpsEl.textContent = String(fps);
    simTimeEl.textContent = app.simTime.toFixed(1) + ' s';
    particleCountEl.textContent = String(app.particles.length);

    requestAnimationFrame(frame);
  }

  function onPointer(e) {
    var rect = canvas.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var y = e.clientY - rect.top;
    spawnBurst(x, y);
  }

  function onPlay() {
    app.playing = !app.playing;
    btnPlay.textContent = app.playing ? 'Pause' : 'Play';
  }

  function onTrails() {
    app.trails = !app.trails;
    btnTrails.textContent = app.trails ? 'Trails: ON' : 'Trails: OFF';
    if (!app.trails) {
      var i;
      for (i = 0; i < app.planets.length; i++) app.planets[i].trail.length = 0;
    }
  }

  function onSpeed() {
    app.speed = parseFloat(speedInput.value);
    speedVal.textContent = app.speed.toFixed(1) + 'x';
  }

  function onReset() {
    reset();
  }

  btnPlay.addEventListener('click', onPlay);
  btnTrails.addEventListener('click', onTrails);
  btnReset.addEventListener('click', onReset);
  speedInput.addEventListener('input', onSpeed);
  canvas.addEventListener('click', onPointer);
  window.addEventListener('resize', resize);

  app.spawnBurst = spawnBurst;
  app.reset = reset;
  window.app = app;

  resize();
  buildStars();
  buildPlanets();
  buildMoons();
  updatePositions();
  speedVal.textContent = app.speed.toFixed(1) + 'x';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
