<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boids – Simulazione di stormo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #070b14; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e6ecff; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; background: #070b14; cursor: crosshair; }
  .glass {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 14px;
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }
  #hud { position: fixed; top: 16px; left: 16px; padding: 14px 18px; min-width: 190px; user-select: none; }
  #hud h1 { font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .85; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; gap: 16px; font-size: 13px; line-height: 1.7; }
  .row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; color: #8fd3ff; }
  #controls { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; font-size: 14px; color: #e6ecff; cursor: pointer;
    background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px; padding: 8px 16px; min-width: 76px; transition: background .15s, transform .1s;
  }
  button:hover { background: rgba(255, 255, 255, 0.18); }
  button:active { transform: scale(0.96); }
  button:focus-visible, input:focus-visible { outline: 2px solid #8fd3ff; outline-offset: 2px; }
  label { font-size: 13px; display: flex; align-items: center; gap: 8px; }
  input[type=range] { width: 140px; accent-color: #8fd3ff; }
  #speedVal { font-variant-numeric: tabular-nums; min-width: 38px; color: #8fd3ff; font-weight: 600; }
  #hint { position: fixed; top: 16px; right: 16px; padding: 10px 14px; font-size: 12px; opacity: .8; user-select: none; }
</style>
</head>
<body>
<canvas id="canvas" aria-label="Simulazione Boids"></canvas>

<div id="hud" class="glass" aria-live="polite">
  <h1>Boids</h1>
  <div class="row"><span>FPS</span><span id="fps">0</span></div>
  <div class="row"><span>Boids</span><span id="count">0</span></div>
  <div class="row"><span>Velocità</span><span id="speedHud">1.0×</span></div>
  <div class="row"><span>Stato</span><span id="state">Pausa</span></div>
</div>

<div id="hint" class="glass">Click sul canvas per aggiungere un boid</div>

<div id="controls" class="glass">
  <button id="playBtn" type="button">Play</button>
  <button id="stepBtn" type="button">Step</button>
  <button id="resetBtn" type="button">Reset</button>
  <label for="speed">Velocità
    <input id="speed" type="range" min="0.5" max="3.0" step="0.1" value="1.0">
    <span id="speedVal">1.0×</span>
  </label>
</div>

<script>
(function () {
  'use strict';

  var INITIAL_COUNT = 60;
  var MAX_BOIDS = 600;
  var PERCEPTION = 60;
  var SEPARATION_DIST = 24;
  var MAX_SPEED = 2.6;
  var MAX_FORCE = 0.06;
  var W_SEP = 1.6, W_ALI = 1.0, W_COH = 0.8;

  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var fpsEl = document.getElementById('fps');
  var countEl = document.getElementById('count');
  var speedHudEl = document.getElementById('speedHud');
  var stateEl = document.getElementById('state');
  var playBtn = document.getElementById('playBtn');
  var stepBtn = document.getElementById('stepBtn');
  var resetBtn = document.getElementById('resetBtn');
  var speedInput = document.getElementById('speed');
  var speedVal = document.getElementById('speedVal');

  var width = 0, height = 0, dpr = 1;
  var boids = [];
  var running = false;
  var speed = 1.0;

  function resize() {
    dpr = Math.max(1, window.devicePixelRatio || 1);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function Boid(x, y) {
    var a = Math.random() * Math.PI * 2;
    var s = MAX_SPEED * (0.5 + Math.random() * 0.5);
    this.x = x; this.y = y;
    this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
    this.hue = 190 + Math.random() * 50;
  }

  function createFlock() {
    boids = [];
    for (var i = 0; i < INITIAL_COUNT; i++) {
      boids.push(new Boid(Math.random() * width, Math.random() * height));
    }
  }

  function limit(vx, vy, max) {
    var m2 = vx * vx + vy * vy;
    if (m2 > max * max) { var m = Math.sqrt(m2); return [vx / m * max, vy / m * max]; }
    return [vx, vy];
  }

  function steer(dx, dy, b) {
    // desired velocity toward (dx,dy) at max speed, minus current velocity
    var m = Math.sqrt(dx * dx + dy * dy);
    if (m === 0) return [0, 0];
    return limit(dx / m * MAX_SPEED - b.vx, dy / m * MAX_SPEED - b.vy, MAX_FORCE);
  }

  function update(dt) {
    var n = boids.length;
    var p2 = PERCEPTION * PERCEPTION, s2 = SEPARATION_DIST * SEPARATION_DIST;
    var hw = width / 2, hh = height / 2;
    var acc = new Array(n);
    for (var i = 0; i < n; i++) {
      var b = boids[i];
      var sx = 0, sy = 0, ax = 0, ay = 0, cx = 0, cy = 0, cnt = 0, scnt = 0;
      for (var j = 0; j < n; j++) {
        if (i === j) continue;
        var o = boids[j];
        var dx = o.x - b.x, dy = o.y - b.y;
        // toroidal distance
        if (dx > hw) dx -= width; else if (dx < -hw) dx += width;
        if (dy > hh) dy -= height; else if (dy < -hh) dy += height;
        var d2 = dx * dx + dy * dy;
        if (d2 < p2 && d2 > 0) {
          ax += o.vx; ay += o.vy;
          cx += dx; cy += dy;
          cnt++;
          if (d2 < s2) { sx -= dx / d2; sy -= dy / d2; scnt++; }
        }
      }
      var fx = 0, fy = 0, f;
      if (cnt > 0) {
        f = steer(ax / cnt, ay / cnt, b); fx += f[0] * W_ALI; fy += f[1] * W_ALI;
        f = steer(cx / cnt, cy / cnt, b); fx += f[0] * W_COH; fy += f[1] * W_COH;
      }
      if (scnt > 0) {
        f = steer(sx, sy, b); fx += f[0] * W_SEP; fy += f[1] * W_SEP;
      }
      acc[i] = [fx, fy];
    }
    for (var k = 0; k < n; k++) {
      var bk = boids[k];
      bk.vx += acc[k][0] * dt; bk.vy += acc[k][1] * dt;
      var v = limit(bk.vx, bk.vy, MAX_SPEED);
      bk.vx = v[0]; bk.vy = v[1];
      var sp = Math.sqrt(bk.vx * bk.vx + bk.vy * bk.vy), minS = MAX_SPEED * 0.4;
      if (sp < minS && sp > 0) { bk.vx = bk.vx / sp * minS; bk.vy = bk.vy / sp * minS; }
      bk.x += bk.vx * dt; bk.y += bk.vy * dt;
      if (bk.x < 0) bk.x += width; else if (bk.x >= width) bk.x -= width;
      if (bk.y < 0) bk.y += height; else if (bk.y >= height) bk.y -= height;
    }
  }

  function draw() {
    ctx.fillStyle = '#070b14';
    ctx.fillRect(0, 0, width, height);
    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      var ang = Math.atan2(b.vy, b.vx);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(9, 0);
      ctx.lineTo(-6, 4.5);
      ctx.lineTo(-3, 0);
      ctx.lineTo(-6, -4.5);
      ctx.closePath();
      ctx.fillStyle = 'hsl(' + b.hue.toFixed(0) + ', 90%, 65%)';
      ctx.fill();
      ctx.restore();
    }
  }

  function updateHud() {
    countEl.textContent = String(boids.length);
    speedHudEl.textContent = speed.toFixed(1) + '×';
    speedVal.textContent = speed.toFixed(1) + '×';
    stateEl.textContent = running ? 'In esecuzione' : 'Pausa';
    playBtn.textContent = running ? 'Pause' : 'Play';
    playBtn.setAttribute('aria-pressed', running ? 'true' : 'false');
  }

  // FPS measurement
  var lastTime = performance.now();
  var frames = 0, fpsTimer = 0;

  function loop(now) {
    var elapsed = now - lastTime;
    lastTime = now;
    if (!(elapsed >= 0) || elapsed > 250) elapsed = 16.67;
    frames++; fpsTimer += elapsed;
    if (fpsTimer >= 500) {
      fpsEl.textContent = String(Math.round(frames * 1000 / fpsTimer));
      frames = 0; fpsTimer = 0;
    }
    if (running) {
      var dt = (elapsed / 16.67) * speed;
      // substeps for stability at high speed
      var steps = Math.max(1, Math.ceil(dt));
      for (var s = 0; s < steps; s++) update(dt / steps);
    }
    draw();
    requestAnimationFrame(loop);
  }

  playBtn.addEventListener('click', function () { running = !running; updateHud(); });
  stepBtn.addEventListener('click', function () {
    if (running) { running = false; }
    update(speed);
    draw();
    updateHud();
  });
  resetBtn.addEventListener('click', function () {
    running = false;
    createFlock();
    draw();
    updateHud();
  });
  speedInput.addEventListener('input', function () {
    var v = parseFloat(speedInput.value);
    if (isFinite(v)) speed = Math.min(3, Math.max(0.5, v));
    updateHud();
  });
  canvas.addEventListener('click', function (e) {
    if (boids.length >= MAX_BOIDS) boids.shift();
    var rect = canvas.getBoundingClientRect();
    boids.push(new Boid(e.clientX - rect.left, e.clientY - rect.top));
    draw();
    updateHud();
  });
  window.addEventListener('resize', function () {
    var ow = width || 1, oh = height || 1;
    resize();
    for (var i = 0; i < boids.length; i++) {
      boids[i].x = boids[i].x / ow * width;
      boids[i].y = boids[i].y / oh * height;
    }
    draw();
  });

  resize();
  createFlock();
  updateHud();
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
