<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Particle Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #060913; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e6ecff; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: crosshair; }
  .hud {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    padding: 16px 18px; min-width: 250px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 16px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    user-select: none;
  }
  .hud h1 { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; color: #a9b8ff; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  button {
    flex: 1; padding: 8px 10px; font: inherit; font-size: 12px; font-weight: 600; color: #e6ecff;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 10px; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  button:hover { background: rgba(255, 255, 255, 0.16); border-color: rgba(255, 255, 255, 0.3); }
  button:active { transform: scale(0.96); }
  button.off { color: #8892b0; background: rgba(0, 0, 0, 0.2); }
  label.slider { display: flex; justify-content: space-between; font-size: 12px; color: #b8c4e8; margin-bottom: 6px; }
  #speedVal { font-variant-numeric: tabular-nums; color: #ffd27a; font-weight: 600; }
  input[type=range] { width: 100%; accent-color: #8aa2ff; margin-bottom: 12px; cursor: pointer; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: rgba(0, 0, 0, 0.22); border-radius: 10px; padding: 7px 8px; text-align: center; }
  .stat .k { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #7f8bb3; }
  .stat .v { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .hint { margin-top: 10px; font-size: 11px; color: #7f8bb3; text-align: center; }
</style>
</head>
<body>
<canvas id="sim"></canvas>

<div class="hud" id="hud">
  <h1>Orbital Simulation</h1>
  <div class="row">
    <button id="playBtn" type="button">Pause</button>
    <button id="trailBtn" type="button">Trails: ON</button>
    <button id="resetBtn" type="button">Reset</button>
  </div>
  <label class="slider" for="speed"><span>Speed</span><span id="speedVal">1.0×</span></label>
  <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
  <div class="stats">
    <div class="stat"><div class="k">FPS</div><div class="v" id="fps">0</div></div>
    <div class="stat"><div class="k">Time (s)</div><div class="v" id="simTime">0.0</div></div>
    <div class="stat"><div class="k">Particles</div><div class="v" id="pCount">0</div></div>
  </div>
  <div class="hint">Click anywhere to spawn a burst</div>
</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('sim');
  const ctx = canvas.getContext('2d');
  const playBtn = document.getElementById('playBtn');
  const trailBtn = document.getElementById('trailBtn');
  const resetBtn = document.getElementById('resetBtn');
  const speedInput = document.getElementById('speed');
  const speedVal = document.getElementById('speedVal');
  const fpsEl = document.getElementById('fps');
  const timeEl = document.getElementById('simTime');
  const countEl = document.getElementById('pCount');

  let W = 0, H = 0, DPR = 1, CX = 0, CY = 0, SCALE = 1;
  let playing = true;
  let trailsOn = true;
  let speed = 1.0;
  let simTime = 0;
  let stars = [];
  let planets = [];
  let particles = [];
  const MAX_PARTICLES = 4000;
  const TRAIL_LEN = 90;

  const PLANET_DEFS = [
    { r: 70,  size: 4,   speed: 1.60, color: '#b8b2a6', moons: [] },
    { r: 110, size: 6.5, speed: 1.15, color: '#e8c27a', moons: [] },
    { r: 160, size: 7,   speed: 0.85, color: '#4fa3ff', moons: [{ r: 15, size: 2,   speed: 4.0, color: '#d9dde6' }] },
    { r: 215, size: 5.5, speed: 0.65, color: '#ff6b4a', moons: [{ r: 11, size: 1.5, speed: 5.2, color: '#c9b9a8' }, { r: 17, size: 1.3, speed: 3.4, color: '#a89c90' }] },
    { r: 290, size: 13,  speed: 0.40, color: '#e0a868', moons: [{ r: 24, size: 2.4, speed: 3.0, color: '#f2e6c9' }, { r: 32, size: 2,   speed: 2.2, color: '#c7d3e0' }, { r: 40, size: 1.8, speed: 1.6, color: '#b0a090' }] },
    { r: 365, size: 10,  speed: 0.28, color: '#7fe0d4', moons: [{ r: 20, size: 1.8, speed: 2.6, color: '#e0f2f0' }] },
    { r: 430, size: 9,   speed: 0.20, color: '#6a7dff', moons: [] }
  ];

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2;
    CY = H / 2;
    SCALE = Math.min(1.25, Math.max(0.35, (Math.min(W, H) / 2 - 20) / 445));
    buildStars();
    // positions change with scale, so clear stale trails
    for (const p of planets) { p.trail.length = 0; for (const m of p.moons) m.trail.length = 0; }
  }

  function buildStars() {
    const count = Math.max(180, Math.floor((W * H) / 5000));
    stars = [];
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() < 0.9 ? Math.random() * 1.1 + 0.2 : Math.random() * 1.6 + 1,
        base: Math.random() * 0.6 + 0.25,
        tw: Math.random() * 2.5 + 0.5,
        ph: Math.random() * Math.PI * 2,
        hue: Math.random() < 0.15 ? 'rgb(255,220,190)' : (Math.random() < 0.2 ? 'rgb(190,210,255)' : 'rgb(255,255,255)')
      });
    }
  }

  function buildPlanets() {
    planets = PLANET_DEFS.map(function (d, i) {
      return {
        r: d.r, size: d.size, speed: d.speed, color: d.color, rgb: hexToRgb(d.color),
        angle: (i * 2.399) % (Math.PI * 2), x: 0, y: 0, trail: [],
        moons: d.moons.map(function (m, j) {
          return { r: m.r, size: m.size, speed: m.speed, color: m.color, rgb: hexToRgb(m.color),
                   angle: j * 2.1, x: 0, y: 0, trail: [] };
        })
      };
    });
    updatePositions();
  }

  function updatePositions() {
    for (const p of planets) {
      p.x = CX + Math.cos(p.angle) * p.r * SCALE;
      p.y = CY + Math.sin(p.angle) * p.r * SCALE * 0.92;
      for (const m of p.moons) {
        m.x = p.x + Math.cos(m.angle) * m.r * SCALE;
        m.y = p.y + Math.sin(m.angle) * m.r * SCALE;
      }
    }
  }

  function step(dt) {
    const sdt = dt * speed;
    simTime += sdt;
    for (const p of planets) {
      p.angle += p.speed * 0.5 * sdt;
      for (const m of p.moons) m.angle += m.speed * 0.5 * sdt;
    }
    updatePositions();
    for (const p of planets) {
      pushTrail(p.trail, p.x, p.y, TRAIL_LEN);
      for (const m of p.moons) pushTrail(m.trail, m.x, m.y, 28);
    }
    // particles
    const damp = Math.pow(0.12, sdt); // velocity damping per second
    for (let i = particles.length - 1; i >= 0; i--) {
      const q = particles[i];
      q.vx *= damp; q.vy *= damp;
      q.x += q.vx * sdt; q.y += q.vy * sdt;
      q.life -= sdt / q.maxLife;
      if (q.life <= 0) {
        particles[i] = particles[particles.length - 1];
        particles.pop();
      }
    }
  }

  function pushTrail(arr, x, y, max) {
    arr.push(x, y);
    if (arr.length > max * 2) arr.splice(0, arr.length - max * 2);
  }

  function spawnBurst(x, y) {
    const n = 90 + Math.floor(Math.random() * 50);
    const hueBase = Math.random() * 360;
    for (let i = 0; i < n; i++) {
      if (particles.length >= MAX_PARTICLES) particles.shift();
      const a = (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.25;
      const s = 80 + Math.random() * 320;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 1, maxLife: 1.2 + Math.random() * 1.4,
        size: 1 + Math.random() * 2.2,
        hue: (hueBase + Math.random() * 60) % 360
      });
    }
  }

  // ---------- drawing ----------
  function drawBackground(realT) {
    ctx.fillStyle = '#060913';
    ctx.fillRect(0, 0, W, H);
    const neb = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.7);
    neb.addColorStop(0, 'rgba(40, 50, 110, 0.18)');
    neb.addColorStop(0.5, 'rgba(20, 20, 60, 0.08)');
    neb.addColorStop(1, 'rgba(6, 9, 19, 0)');
    ctx.fillStyle = neb;
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      const tw = 0.5 + 0.5 * Math.sin(realT * s.tw + s.ph);
      ctx.globalAlpha = Math.max(0.05, s.base * (0.35 + 0.65 * tw));
      ctx.fillStyle = s.hue;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawOrbits() {
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(140, 160, 255, 0.07)';
    for (const p of planets) {
      ctx.beginPath();
      ctx.ellipse(CX, CY, p.r * SCALE, p.r * SCALE * 0.92, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawStar(realT) {
    const pulse = 1 + 0.06 * Math.sin(realT * 1.8) + 0.03 * Math.sin(realT * 4.3);
    const coreR = 26 * SCALE + 6;
    const coronaR = coreR * 4.2 * pulse;

    ctx.globalCompositeOperation = 'lighter';
    const corona = ctx.createRadialGradient(CX, CY, coreR * 0.4, CX, CY, coronaR);
    corona.addColorStop(0, 'rgba(255, 200, 110, 0.55)');
    corona.addColorStop(0.25, 'rgba(255, 140, 50, 0.22)');
    corona.addColorStop(0.6, 'rgba(255, 90, 30, 0.06)');
    corona.addColorStop(1, 'rgba(255, 60, 20, 0)');
    ctx.fillStyle = corona;
    ctx.beginPath();
    ctx.arc(CX, CY, coronaR, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    const core = ctx.createRadialGradient(CX - coreR * 0.25, CY - coreR * 0.25, 0, CX, CY, coreR);
    core.addColorStop(0, '#fffef2');
    core.addColorStop(0.35, '#fff1b0');
    core.addColorStop(0.75, '#ffb547');
    core.addColorStop(1, '#ff8a2a');
    ctx.fillStyle = core;
    ctx.shadowColor = 'rgba(255, 170, 60, 0.9)';
    ctx.shadowBlur = 40 * pulse;
    ctx.beginPath();
    ctx.arc(CX, CY, coreR, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawTrail(arr, rgb, width) {
    const n = arr.length / 2;
    if (n < 2) return;
    ctx.lineCap = 'round';
    for (let i = 1; i < n; i++) {
      const a = i / n;
      ctx.strokeStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + (a * a * 0.6).toFixed(3) + ')';
      ctx.lineWidth = width * (0.3 + 0.7 * a);
      ctx.beginPath();
      ctx.moveTo(arr[(i - 1) * 2], arr[(i - 1) * 2 + 1]);
      ctx.lineTo(arr[i * 2], arr[i * 2 + 1]);
      ctx.stroke();
    }
  }

  function drawBody(b, sizeScale) {
    const r = Math.max(1, b.size * sizeScale);
    const dx = b.x - CX, dy = b.y - CY;
    const d = Math.hypot(dx, dy) || 1;
    const lx = b.x - (dx / d) * r * 0.5, ly = b.y - (dy / d) * r * 0.5;
    const g = ctx.createRadialGradient(lx, ly, r * 0.1, b.x, b.y, r);
    const c = b.rgb;
    g.addColorStop(0, 'rgb(' + Math.min(255, c[0] + 70) + ',' + Math.min(255, c[1] + 70) + ',' + Math.min(255, c[2] + 70) + ')');
    g.addColorStop(0.6, b.color);
    g.addColorStop(1, 'rgb(' + Math.floor(c[0] * 0.3) + ',' + Math.floor(c[1] * 0.3) + ',' + Math.floor(c[2] * 0.3) + ')');
    ctx.shadowColor = b.color;
    ctx.shadowBlur = r * 1.6;
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawPlanets() {
    const sz = Math.max(0.6, SCALE);
    if (trailsOn) {
      for (const p of planets) {
        drawTrail(p.trail, p.rgb, p.size * sz * 0.5);
        for (const m of p.moons) drawTrail(m.trail, m.rgb, 1);
      }
    }
    for (const p of planets) {
      // ring for the large planet
      if (p.size >= 13) {
        ctx.strokeStyle = 'rgba(230, 200, 150, 0.45)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.size * sz * 1.9, p.size * sz * 0.55, -0.4, 0, Math.PI * 2);
        ctx.stroke();
      }
      drawBody(p, sz);
      for (const m of p.moons) drawBody(m, sz);
    }
  }

  function drawParticles() {
    ctx.globalCompositeOperation = 'lighter';
    for (const q of particles) {
      const a = Math.max(0, q.life);
      const r = q.size * (0.6 + a * 0.8);
      ctx.fillStyle = 'hsla(' + q.hue.toFixed(0) + ',100%,65%,' + (a * 0.22).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(q.x, q.y, r * 3.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'hsla(' + q.hue.toFixed(0) + ',100%,85%,' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(q.x, q.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- loop ----------
  let last = performance.now();
  let fpsFrames = 0, fpsAcc = 0, fps = 0;
  let realT = 0;
  let hudAcc = 0;

  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1; // clamp after tab switch
    if (dt < 0) dt = 0;
    realT += dt;

    fpsFrames++; fpsAcc += dt;
    if (fpsAcc >= 0.5) { fps = fpsFrames / fpsAcc; fpsFrames = 0; fpsAcc = 0; }

    if (playing) step(dt);

    drawBackground(realT);
    drawOrbits();
    drawStar(realT);
    drawPlanets();
    drawParticles();

    hudAcc += dt;
    if (hudAcc >= 0.1) {
      hudAcc = 0;
      fpsEl.textContent = Math.round(fps);
      timeEl.textContent = simTime.toFixed(1);
      countEl.textContent = particles.length;
    }
    requestAnimationFrame(frame);
  }

  // ---------- UI ----------
  playBtn.addEventListener('click', function () {
    playing = !playing;
    playBtn.textContent = playing ? 'Pause' : 'Play';
    playBtn.classList.toggle('off', !playing);
  });
  trailBtn.addEventListener('click', function () {
    trailsOn = !trailsOn;
    trailBtn.textContent = 'Trails: ' + (trailsOn ? 'ON' : 'OFF');
    trailBtn.classList.toggle('off', !trailsOn);
  });
  resetBtn.addEventListener('click', function () {
    simTime = 0;
    particles = [];
    buildPlanets();
    speed = 1.0;
    speedInput.value = '1.0';
    speedVal.textContent = '1.0×';
    timeEl.textContent = '0.0';
    countEl.textContent = '0';
  });
  speedInput.addEventListener('input', function () {
    speed = parseFloat(speedInput.value) || 1;
    speedVal.textContent = speed.toFixed(1) + '×';
  });
  canvas.addEventListener('pointerdown', function (e) {
    const rect = canvas.getBoundingClientRect();
    spawnBurst(e.clientX - rect.left, e.clientY - rect.top);
  });
  window.addEventListener('resize', resize);

  resize();
  buildPlanets();
  requestAnimationFrame(function (t) { last = t; frame(t); });
})();
</script>
</body>
</html>
