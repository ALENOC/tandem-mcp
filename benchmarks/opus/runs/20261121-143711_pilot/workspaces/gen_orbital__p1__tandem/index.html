<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Particle Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #060913;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  #sim {
    position: fixed;
    top: 0;
    left: 0;
    display: block;
    background: #060913;
  }
  #hud {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    min-width: 240px;
    padding: 16px 18px;
    border-radius: 16px;
    color: #cfe0ff;
    background: rgba(18, 26, 48, 0.35);
    border: 1px solid rgba(120, 160, 255, 0.25);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
  }
  #hud h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 12px;
    color: #eaf1ff;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 10px 0;
    font-size: 13px;
  }
  .row label { min-width: 52px; opacity: 0.85; }
  button {
    cursor: pointer;
    color: #eaf1ff;
    background: rgba(90, 130, 220, 0.28);
    border: 1px solid rgba(140, 175, 255, 0.35);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
    transition: background 0.15s ease;
  }
  button:hover { background: rgba(110, 150, 240, 0.42); }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 120px;
    height: 4px;
    border-radius: 3px;
    background: rgba(140, 175, 255, 0.35);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #8fb4ff;
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: none;
    border-radius: 50%;
    background: #8fb4ff;
    cursor: pointer;
  }
  .stats {
    display: flex;
    gap: 14px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(120, 160, 255, 0.2);
    font-size: 12px;
  }
  .stats div { display: flex; flex-direction: column; }
  .stats span { font-size: 16px; font-weight: 600; color: #eaf1ff; }
  .stats small { opacity: 0.7; }
</style>
</head>
<body>
  <canvas id="sim"></canvas>
  <div id="hud">
    <h1>Orbital Sim</h1>
    <div class="row">
      <button id="playPause">Pause</button>
      <button id="trailsToggle">Trails: ON</button>
      <button id="reset">Reset</button>
    </div>
    <div class="row">
      <label for="speed">Speed</label>
      <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
      <span id="speedVal">1.0x</span>
    </div>
    <div class="stats">
      <div><span id="fps">0</span><small>FPS</small></div>
      <div><span id="simTime">0.0</span><small>sec</small></div>
      <div><span id="particleCount">0</span><small>particles</small></div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("sim");
  var ctx = canvas.getContext("2d");

  var hud = document.getElementById("hud");
  var playPauseBtn = document.getElementById("playPause");
  var trailsToggleBtn = document.getElementById("trailsToggle");
  var resetBtn = document.getElementById("reset");
  var speedSlider = document.getElementById("speed");
  var speedVal = document.getElementById("speedVal");
  var fpsEl = document.getElementById("fps");
  var simTimeEl = document.getElementById("simTime");
  var particleCountEl = document.getElementById("particleCount");

  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---- State ----
  var app = {
    paused: false,
    trails: true,
    speed: 1.0,
    simTime: 0,
    particles: [],
    planets: [],
    moons: [],
    stars: []
  };
  window.app = app;

  var TRAIL_LEN = 40;

  var planetDefs = [
    { radius: 70,  speed: 0.90, color: "#5b8cff", size: 6 },
    { radius: 110, speed: 0.62, color: "#ff7a59", size: 9 },
    { radius: 155, speed: 0.45, color: "#4fd1c5", size: 7 },
    { radius: 205, speed: 0.32, color: "#c084fc", size: 11 },
    { radius: 255, speed: 0.24, color: "#facc15", size: 8 },
    { radius: 305, speed: 0.18, color: "#f472b6", size: 10 }
  ];

  function buildPlanets() {
    app.planets = planetDefs.map(function (d, i) {
      return {
        radius: d.radius,
        speed: d.speed,
        angle: (i * 1.7) % (Math.PI * 2),
        color: d.color,
        size: d.size,
        trail: []
      };
    });
  }

  function buildMoons() {
    app.moons = [
      { parentIndex: 0, dist: 18, speed: 2.2, angle: 0.5, size: 3, color: "#dbeafe" },
      { parentIndex: 1, dist: 24, speed: 1.8, angle: 2.1, size: 4, color: "#fde68a" },
      { parentIndex: 3, dist: 26, speed: 1.5, angle: 4.0, size: 3, color: "#e9d5ff" },
      { parentIndex: 4, dist: 22, speed: 2.0, angle: 1.2, size: 3, color: "#fef9c3" }
    ];
  }

  function buildStars() {
    app.stars = [];
    var count = 220;
    for (var i = 0; i < count; i++) {
      app.stars.push({
        x: Math.random(),
        y: Math.random(),
        size: Math.random() * 1.6 + 0.4,
        phase: Math.random() * Math.PI * 2,
        tw: Math.random() * 1.5 + 0.8
      });
    }
  }

  buildPlanets();
  buildMoons();
  buildStars();

  // ---- Particles ----
  function spawnBurst(x, y) {
    var n = 48;
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + Math.random() * 0.2;
      var sp = 60 + Math.random() * 160;
      app.particles.push({
        x: x,
        y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1.0,
        size: 1.5 + Math.random() * 2.5,
        hue: 180 + Math.random() * 120
      });
    }
  }

  function updateParticles(dt) {
    for (var i = app.particles.length - 1; i >= 0; i--) {
      var p = app.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.life -= dt * 0.9;
      if (p.life <= 0) {
        app.particles.splice(i, 1);
      }
    }
  }

  // ---- Drawing ----
  function drawStarfield(t) {
    for (var i = 0; i < app.stars.length; i++) {
      var s = app.stars[i];
      var tw = 0.5 + 0.5 * Math.sin(t * s.tw + s.phase);
      var alpha = 0.25 + 0.75 * tw;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawCentralStar(t) {
    var cx = W / 2, cy = H / 2;
    var base = Math.min(W, H) * 0.16;
    var pulse = base * (1 + 0.06 * Math.sin(t * 1.6));
    var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, pulse);
    grad.addColorStop(0, "rgba(255, 255, 255, 1)");
    grad.addColorStop(0.25, "rgba(255, 236, 179, 0.95)");
    grad.addColorStop(0.5, "rgba(255, 176, 92, 0.55)");
    grad.addColorStop(1, "rgba(255, 140, 60, 0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, pulse, 0, Math.PI * 2);
    ctx.fill();
  }

  function planetPos(p) {
    var cx = W / 2, cy = H / 2;
    return {
      x: cx + Math.cos(p.angle) * p.radius,
      y: cy + Math.sin(p.angle) * p.radius
    };
  }

  function drawTrails() {
    for (var i = 0; i < app.planets.length; i++) {
      var p = app.planets[i];
      var tr = p.trail;
      for (var j = 0; j < tr.length; j++) {
        var alpha = (j + 1) / tr.length * 0.5;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(tr[j].x, tr[j].y, p.size * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawPlanets() {
    for (var i = 0; i < app.planets.length; i++) {
      var p = app.planets[i];
      var pos = planetPos(p);
      ctx.globalAlpha = 1;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawMoons() {
    for (var i = 0; i < app.moons.length; i++) {
      var m = app.moons[i];
      var parent = app.planets[m.parentIndex];
      var pp = planetPos(parent);
      var x = pp.x + Math.cos(m.angle) * m.dist;
      var y = pp.y + Math.sin(m.angle) * m.dist;
      ctx.globalAlpha = 1;
      ctx.fillStyle = m.color;
      ctx.beginPath();
      ctx.arc(x, y, m.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawParticles() {
    for (var i = 0; i < app.particles.length; i++) {
      var p = app.particles[i];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = "hsl(" + p.hue + ", 90%, 70%)";
      ctx.shadowColor = "hsl(" + p.hue + ", 90%, 70%)";
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  // ---- HUD ----
  function updateHUD(fps) {
    fpsEl.textContent = String(Math.round(fps));
    simTimeEl.textContent = app.simTime.toFixed(1);
    particleCountEl.textContent = String(app.particles.length);
  }

  // ---- Loop ----
  var last = performance.now();
  var fps = 0;
  var fpsAccum = 0;
  var fpsFrames = 0;

  function frame(now) {
    var rawDt = (now - last) / 1000;
    last = now;
    if (rawDt < 0) rawDt = 0;
    if (rawDt > 0.1) rawDt = 0.1;

    fpsAccum += rawDt;
    fpsFrames++;
    if (fpsAccum >= 0.5) {
      fps = fpsFrames / fpsAccum;
      fpsAccum = 0;
      fpsFrames = 0;
    }

    var dt = app.paused ? 0 : rawDt * app.speed;
    app.simTime += dt;
    var t = app.simTime;

    if (!app.paused) {
      for (var i = 0; i < app.planets.length; i++) {
        var p = app.planets[i];
        p.angle += p.speed * dt;
        var pos = planetPos(p);
        if (app.trails) {
          p.trail.push({ x: pos.x, y: pos.y });
          if (p.trail.length > TRAIL_LEN) p.trail.shift();
        }
      }
      for (var j = 0; j < app.moons.length; j++) {
        app.moons[j].angle += app.moons[j].speed * dt;
      }
      updateParticles(rawDt);
    }

    ctx.clearRect(0, 0, W, H);
    drawStarfield(t);
    drawCentralStar(t);
    if (app.trails) drawTrails();
    drawPlanets();
    drawMoons();
    drawParticles();

    updateHUD(fps);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- Controls ----
  playPauseBtn.addEventListener("click", function () {
    app.paused = !app.paused;
    playPauseBtn.textContent = app.paused ? "Play" : "Pause";
  });

  trailsToggleBtn.addEventListener("click", function () {
    app.trails = !app.trails;
    trailsToggleBtn.textContent = app.trails ? "Trails: ON" : "Trails: OFF";
    if (!app.trails) {
      for (var i = 0; i < app.planets.length; i++) app.planets[i].trail = [];
    }
  });

  resetBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    app.simTime = 0;
    app.particles = [];
    app.paused = false;
    playPauseBtn.textContent = "Pause";
    app.speed = 1.0;
    speedSlider.value = "1.0";
    speedVal.textContent = "1.0x";
    buildPlanets();
    buildMoons();
  });

  speedSlider.addEventListener("input", function () {
    app.speed = parseFloat(speedSlider.value);
    speedVal.textContent = app.speed.toFixed(1) + "x";
  });

  canvas.addEventListener("click", function (e) {
    var rect = canvas.getBoundingClientRect();
    spawnBurst(e.clientX - rect.left, e.clientY - rect.top);
  });
})();
</script>
</body>
</html>
