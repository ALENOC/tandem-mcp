<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON PORTAL 3D</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05010a;
  }
  #c {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
  }
  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    min-width: 210px;
    padding: 14px 16px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 14px;
    color: #e8f7ff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    user-select: none;
  }
  #hud h1 {
    margin: 0 0 8px 0;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #e8f7ff;
    text-shadow: 0 0 8px rgba(0,240,255,0.6);
  }
  #hud .row {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  #hud .stat {
    font-variant-numeric: tabular-nums;
    color: #e8f7ff;
  }
  #hud button {
    font-family: inherit;
    font-size: 12px;
    color: #e8f7ff;
    background: rgba(0,240,255,0.12);
    border: 1px solid rgba(0,240,255,0.4);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  #hud button:hover {
    background: rgba(0,240,255,0.25);
  }
  #hud .slider {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  #hud .slider label {
    color: #e8f7ff;
    font-size: 12px;
  }
  #speed {
    width: 120px;
    accent-color: #00f0ff;
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <h1>NEON PORTAL 3D</h1>
    <div class="row">
      <span id="fps" class="stat">FPS: 0</span>
      <span id="polys" class="stat">POLYS: 0</span>
      <span id="parts" class="stat">PARTS: 110</span>
    </div>
    <div class="row">
      <button id="pause">Pause</button>
      <button id="orbit">Orbit ON</button>
      <button id="reset">Reset</button>
    </div>
    <div class="slider">
      <label for="speed">Speed</label>
      <input type="range" id="speed" min="0" max="3" step="0.1" value="1">
    </div>
  </div>
  <script src="engine3d.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
