<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boids – Simulazione di stormo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #070b14; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e6ecff; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; background: #070b14; cursor: crosshair; }
  .hud {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    padding: 14px 18px; min-width: 220px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 16px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    user-select: none;
  }
  .hud h1 { font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .85; margin-bottom: 10px; }
  .stats { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin-bottom: 12px; }
  .stats dt { opacity: .65; }
  .stats dd { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
  .controls { display: flex; gap: 8px; margin-bottom: 12px; }
  button {
    flex: 1; padding: 7px 10px; font: inherit; font-size: 13px; font-weight: 600; color: #e6ecff;
    background: rgba(255, 255, 255, 0.10); border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 10px; cursor: pointer; transition: background .15s, transform .1s;
  }
  button:hover { background: rgba(255, 255, 255, 0.2); }
  button:active { transform: scale(.96); }
  button:focus-visible, input:focus-visible { outline: 2px solid #7aa2ff; outline-offset: 2px; }
  label { display: block; font-size: 12px; opacity: .8; margin-bottom: 4px; }
  input[type=range] { width: 100%; accent-color: #7aa2ff; cursor: pointer; }
  .hint { margin-top: 10px; font-size: 11px; opacity: .55; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="hud" id="hud">
  <h1>Boids</h1>
  <dl class="stats">
    <dt>FPS</dt><dd id="fps">0</dd>
    <dt>Boids</dt><dd id="count">0</dd>
    <dt>Velocità</dt><dd id="speedVal">1.0×</dd>
  </dl>
  <div class="controls">
    <button id="playBtn" type="button" aria-label="Play">Play</button>
    <button id="stepBtn" type="button">Step</button>
    <button id="resetBtn" type="button">Reset</button>
  </div>
  <label for="speed">Velocità simulazione</label>
  <input id="speed" type="range" min="0.5" max="3.0" step="0.1" value="1.0">
  <div class="hint">Click sul canvas per aggiungere un boid</div>
</div>
<script>
(function () {
  "use strict";

  var INITIAL_COUNT = 60;
  var MAX_SPEED = 3;
  var MAX_FORCE = 0.06;
  var VIEW_RADIUS = 50;
  var SEP_RADIUS = 22;
  var W_SEP = 1.6, W_ALI = 1.0, W_COH = 0.9;

  var canvas = document.getElementById("canvas");
  var ctx = canvas.getContext("2d");
  var fpsEl = document.getElementById("fps");
  var countEl = document.getElementById("count");
  var speedValEl = document.getElementById("speedVal");
  var playBtn = document.getElementById("playBtn");
  var stepBtn = document.getElementById("stepBtn");
  var resetBtn = document.getElementById("resetBtn");
  var speedInput = document.getElementById("speed");

  var width = 0, height = 0, dpr = 1;
  var boids = [];
  var running = false;
  var speedMul = 1.0;

  function resize() {
    dpr = Math.max(1, window.devicePixelRatio || 1);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function Boid(x, y) {
    var a = Math.random() * Math.PI * 2;
    var s = 1 + Math.random() * (MAX_SPEED - 1);
    this.x = x; this.y = y;
    this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
    this.hue = 190 + Math.random() * 60;
  }

  function limit(vx, vy, max) {
    var m = Math.sqrt(vx * vx + vy * vy);
    if (m > max && m > 0) { return [vx / m * max, vy / m * max]; }
    return [vx, vy];
  }

  function steer(dx, dy, b) {
    var m = Math.sqrt(dx * dx + dy * dy);
    if (m === 0) return [0, 0];
    dx = dx / m * MAX_SPEED - b.vx;
    dy = dy / m * MAX_SPEED - b.vy;
    return limit(dx, dy, MAX_FORCE);
  }

  function wrapDelta(d, size) {
    if (d > size / 2) return d - size;
    if (d < -size / 2) return d + size;
    return d;
  }

  function reset() {
    boids = [];
    var w = width || 800, h = height || 600;
    for (var i = 0; i < INITIAL_COUNT; i++) {
      boids.push(new Boid(Math.random() * w, Math.random() * h));
    }
    updateHud();
    draw();
  }

  function update(dt) {
    var n = boids.length, i, j;
    var acc = new Array(n);
    var vr2 = VIEW_RADIUS * VIEW_RADIUS, sr2 = SEP_RADIUS * SEP_RADIUS;
    for (i = 0; i < n; i++) {
      var b = boids[i];
      var sx = 0, sy = 0, ax = 0, ay = 0, cx = 0, cy = 0, cnt = 0, scnt = 0;
      for (j = 0; j < n; j++) {
        if (i === j) continue;
        var o = boids[j];
        var dx = wrapDelta(o.x - b.x, width);
        var dy = wrapDelta(o.y - b.y, height);
        var d2 = dx * dx + dy * dy;
        if (d2 < vr2) {
          ax += o.vx; ay += o.vy;
          cx += dx; cy += dy;
          cnt++;
          if (d2 < sr2 && d2 > 0) {
            sx -= dx / d2; sy -= dy / d2;
            scnt++;
          }
        }
      }
      var fx = 0, fy = 0, f;
      if (cnt > 0) {
        f = steer(ax / cnt, ay / cnt, b); fx += f[0] * W_ALI; fy += f[1] * W_ALI;
        f = steer(cx / cnt, cy / cnt, b); fx += f[0] * W_COH; fy += f[1] * W_COH;
      }
      if (scnt > 0) {
        f = steer(sx, sy, b); fx += f[0] * W_SEP; fy += f[1] * W_SEP;
      }
      acc[i] = [fx, fy];
    }
    for (i = 0; i < n; i++) {
      var p = boids[i];
      p.vx += acc[i][0] * dt; p.vy += acc[i][1] * dt;
      var v = limit(p.vx, p.vy, MAX_SPEED);
      p.vx = v[0]; p.vy = v[1];
      var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      if (sp < 0.8 && sp > 0) { p.vx = p.vx / sp * 0.8; p.vy = p.vy / sp * 0.8; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.x < 0) p.x += width; else if (p.x >= width) p.x -= width;
      if (p.y < 0) p.y += height; else if (p.y >= height) p.y -= height;
    }
  }

  function draw() {
    ctx.fillStyle = "#070b14";
    ctx.fillRect(0, 0, width, height);
    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      var ang = Math.atan2(b.vy, b.vx);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(9, 0);
      ctx.lineTo(-6, 4.5);
      ctx.lineTo(-3, 0);
      ctx.lineTo(-6, -4.5);
      ctx.closePath();
      ctx.fillStyle = "hsl(" + b.hue.toFixed(0) + ", 85%, 65%)";
      ctx.fill();
      ctx.restore();
    }
  }

  function updateHud() {
    countEl.textContent = String(boids.length);
    speedValEl.textContent = speedMul.toFixed(1) + "×";
  }

  function setRunning(r) {
    running = r;
    playBtn.textContent = running ? "Pause" : "Play";
    playBtn.setAttribute("aria-label", running ? "Pause" : "Play");
  }

  // FPS measurement (rAF-based, measured always)
  var lastTime = performance.now();
  var frames = 0, fpsAcc = 0;

  function loop(now) {
    var elapsed = now - lastTime;
    lastTime = now;
    if (!(elapsed >= 0)) elapsed = 16.67;
    frames++; fpsAcc += elapsed;
    if (fpsAcc >= 500) {
      fpsEl.textContent = String(Math.round(frames * 1000 / fpsAcc));
      frames = 0; fpsAcc = 0;
    }
    if (running) {
      var dt = Math.min(elapsed, 50) / 16.67 * speedMul;
      update(dt);
      draw();
    }
    requestAnimationFrame(loop);
  }

  playBtn.addEventListener("click", function () { setRunning(!running); });
  stepBtn.addEventListener("click", function () {
    setRunning(false);
    update(speedMul);
    draw();
  });
  resetBtn.addEventListener("click", function () {
    setRunning(false);
    reset();
  });
  speedInput.addEventListener("input", function () {
    var v = parseFloat(speedInput.value);
    if (isFinite(v)) speedMul = Math.min(3, Math.max(0.5, v));
    updateHud();
  });
  canvas.addEventListener("click", function (e) {
    var rect = canvas.getBoundingClientRect();
    boids.push(new Boid(e.clientX - rect.left, e.clientY - rect.top));
    updateHud();
    draw();
  });
  window.addEventListener("resize", resize);

  resize();
  reset();
  setRunning(false);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
