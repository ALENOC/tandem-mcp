<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Particle Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #060913;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e6ecff;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: crosshair; }
  .hud {
    position: fixed; top: 16px; left: 16px;
    padding: 16px 18px; min-width: 250px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 16px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    user-select: none; z-index: 10;
  }
  .hud h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #9fb4ff; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  button {
    flex: 1; padding: 8px 10px; font-size: 12px; font-weight: 600;
    color: #e6ecff; background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 10px;
    cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  button:hover { background: rgba(255, 255, 255, 0.16); border-color: rgba(160, 190, 255, 0.5); }
  button:active { transform: scale(0.96); }
  button.off { color: #8a93ad; background: rgba(0, 0, 0, 0.2); }
  label { display: flex; justify-content: space-between; font-size: 12px; color: #b8c3e6; margin-bottom: 6px; }
  #speedVal { font-variant-numeric: tabular-nums; color: #ffd27a; font-weight: 600; }
  input[type=range] { width: 100%; accent-color: #7fa2ff; margin-bottom: 12px; cursor: pointer; }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 12px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }
  .stats span:nth-child(odd) { color: #8f9bc2; }
  .stats span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; color: #e6ecff; font-weight: 600; }
  .hint { margin-top: 10px; font-size: 11px; color: #6f7a9c; }
</style>
</head>
<body>
<canvas id="sim"></canvas>

<div class="hud" id="hud">
  <h1>Orbital Simulation</h1>
  <div class="row">
    <button id="playBtn" type="button">Pause</button>
    <button id="trailBtn" type="button">Trails: ON</button>
    <button id="resetBtn" type="button">Reset</button>
  </div>
  <label for="speed"><span>Speed</span><span id="speedVal">1.0×</span></label>
  <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
  <div class="stats">
    <span>FPS</span><span id="fps">0</span>
    <span>Sim time</span><span id="simTime">0.0 s</span>
    <span>Burst particles</span><span id="pCount">0</span>
  </div>
  <div class="hint">Click anywhere to spawn a particle burst</div>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("sim");
  var ctx = canvas.getContext("2d");
  var playBtn = document.getElementById("playBtn");
  var trailBtn = document.getElementById("trailBtn");
  var resetBtn = document.getElementById("resetBtn");
  var speedInput = document.getElementById("speed");
  var speedVal = document.getElementById("speedVal");
  var fpsEl = document.getElementById("fps");
  var simTimeEl = document.getElementById("simTime");
  var pCountEl = document.getElementById("pCount");

  var W = 0, H = 0, dpr = 1, cx = 0, cy = 0, scale = 1;
  var running = true;
  var trailsOn = true;
  var speed = 1.0;
  var simTime = 0;
  var MAX_PARTICLES = 4000;
  var TRAIL_LEN = 90;

  // ---------- Planet definitions ----------
  var PLANET_DEFS = [
    { name: "Mercury", r: 70,  size: 4,  period: 4.0,  color: "#c9b79c", phase: 0.3 },
    { name: "Venus",   r: 110, size: 7,  period: 7.0,  color: "#f2c66d", phase: 2.1 },
    { name: "Terra",   r: 160, size: 8,  period: 11.0, color: "#4fa3ff", phase: 4.0,
      moons: [{ r: 18, size: 2.5, period: 1.6, color: "#d8dde8", phase: 0 }] },
    { name: "Ares",    r: 215, size: 6,  period: 16.0, color: "#ff6a4d", phase: 1.0,
      moons: [{ r: 13, size: 1.8, period: 1.1, color: "#bfae9e", phase: 1 },
              { r: 19, size: 1.5, period: 2.0, color: "#9e9184", phase: 3 }] },
    { name: "Jove",    r: 290, size: 15, period: 26.0, color: "#e0a872", phase: 5.2,
      moons: [{ r: 26, size: 2.8, period: 1.4, color: "#f5e6c8", phase: 0.5 },
              { r: 34, size: 2.2, period: 2.3, color: "#a8c8ff", phase: 2.5 },
              { r: 43, size: 3.0, period: 3.4, color: "#c4b59a", phase: 4.5 }] },
    { name: "Cronus",  r: 370, size: 12, period: 38.0, color: "#e8d9a0", phase: 3.3, ring: true,
      moons: [{ r: 30, size: 2.4, period: 2.6, color: "#ffe9b0", phase: 1.7 }] },
    { name: "Glacius", r: 440, size: 9,  period: 52.0, color: "#7fe7e0", phase: 0.8 }
  ];

  var planets = [];
  var particles = [];
  var stars = [];

  function buildPlanets() {
    planets = PLANET_DEFS.map(function (d) {
      return {
        def: d,
        angle: d.phase,
        omega: (Math.PI * 2) / d.period,
        x: 0, y: 0,
        trail: [],
        moons: (d.moons || []).map(function (m) {
          return { def: m, angle: m.phase, omega: (Math.PI * 2) / m.period, x: 0, y: 0, trail: [] };
        })
      };
    });
    updatePositions();
  }

  function buildStars() {
    stars = [];
    var count = Math.max(220, Math.floor((W * H) / 5000));
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.3 + 0.2,
        base: Math.random() * 0.6 + 0.25,
        tw: Math.random() * 2.5 + 0.5,
        ph: Math.random() * Math.PI * 2,
        hue: Math.random() < 0.15 ? 30 : (Math.random() < 0.3 ? 210 : 0)
      });
    }
  }

  function resize() {
    dpr = Math.max(1, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2;
    cy = H / 2;
    scale = Math.min(1.4, Math.max(0.35, (Math.min(W, H) * 0.47) / 480));
    buildStars();
    // trails are in screen space; clear them so they don't jump
    planets.forEach(function (p) { p.trail = []; p.moons.forEach(function (m) { m.trail = []; }); });
    updatePositions();
  }

  function updatePositions() {
    for (var i = 0; i < planets.length; i++) {
      var p = planets[i];
      var R = p.def.r * scale;
      p.x = cx + Math.cos(p.angle) * R;
      p.y = cy + Math.sin(p.angle) * R * 0.92;
      for (var j = 0; j < p.moons.length; j++) {
        var m = p.moons[j];
        var mr = m.def.r * Math.max(scale, 0.6);
        m.x = p.x + Math.cos(m.angle) * mr;
        m.y = p.y + Math.sin(m.angle) * mr;
      }
    }
  }

  function pushTrail(arr, x, y, max) {
    arr.push(x, y);
    while (arr.length > max * 2) arr.splice(0, 2);
  }

  function step(dt) {
    for (var i = 0; i < planets.length; i++) {
      var p = planets[i];
      p.angle += p.omega * dt;
      for (var j = 0; j < p.moons.length; j++) p.moons[j].angle += p.moons[j].omega * dt;
    }
    updatePositions();
    for (i = 0; i < planets.length; i++) {
      pushTrail(planets[i].trail, planets[i].x, planets[i].y, TRAIL_LEN);
      for (j = 0; j < planets[i].moons.length; j++) {
        var mm = planets[i].moons[j];
        pushTrail(mm.trail, mm.x, mm.y, 28);
      }
    }
  }

  function updateParticles(dt) {
    // dt in seconds (scaled by speed)
    var damp = Math.pow(0.12, dt); // velocity damping per second
    for (var i = particles.length - 1; i >= 0; i--) {
      var q = particles[i];
      q.vx *= damp;
      q.vy *= damp;
      // gentle pull toward star
      var dx = cx - q.x, dy = cy - q.y;
      var d2 = dx * dx + dy * dy + 400;
      var g = 9000 / d2;
      var inv = 1 / Math.sqrt(d2);
      q.vx += dx * inv * g * dt;
      q.vy += dy * inv * g * dt;
      q.x += q.vx * dt;
      q.y += q.vy * dt;
      q.life -= dt;
      if (q.life <= 0) particles.splice(i, 1);
    }
  }

  function spawnBurst(x, y) {
    var n = 90 + Math.floor(Math.random() * 50);
    var hueBase = Math.random() * 360;
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.15;
      var s = 60 + Math.random() * 260;
      var life = 1.2 + Math.random() * 1.6;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: life, maxLife: life,
        size: 1 + Math.random() * 2.2,
        hue: (hueBase + Math.random() * 60) % 360
      });
    }
    if (particles.length > MAX_PARTICLES) particles.splice(0, particles.length - MAX_PARTICLES);
  }

  // ---------- Drawing ----------
  function drawBackground(realT) {
    ctx.fillStyle = "#060913";
    ctx.fillRect(0, 0, W, H);

    // faint nebula
    var neb = ctx.createRadialGradient(W * 0.78, H * 0.22, 0, W * 0.78, H * 0.22, Math.max(W, H) * 0.6);
    neb.addColorStop(0, "rgba(70, 40, 120, 0.10)");
    neb.addColorStop(1, "rgba(6, 9, 19, 0)");
    ctx.fillStyle = neb;
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var a = s.base * (0.55 + 0.45 * Math.sin(realT * s.tw + s.ph));
      if (a < 0) a = 0;
      ctx.fillStyle = s.hue === 0
        ? "rgba(255,255,255," + a.toFixed(3) + ")"
        : "hsla(" + s.hue + ",80%,80%," + a.toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawOrbits() {
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(140, 160, 220, 0.08)";
    for (var i = 0; i < planets.length; i++) {
      var R = planets[i].def.r * scale;
      ctx.beginPath();
      ctx.ellipse(cx, cy, R, R * 0.92, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawStar(t) {
    var pulse = 1 + 0.06 * Math.sin(t * 2.1) + 0.03 * Math.sin(t * 5.3);
    var coreR = 26 * Math.max(scale, 0.6);
    var coronaR = coreR * 4.2 * pulse;

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    var corona = ctx.createRadialGradient(cx, cy, coreR * 0.5, cx, cy, coronaR);
    corona.addColorStop(0, "rgba(255, 200, 110, 0.55)");
    corona.addColorStop(0.25, "rgba(255, 140, 50, 0.22)");
    corona.addColorStop(0.6, "rgba(255, 90, 30, 0.06)");
    corona.addColorStop(1, "rgba(255, 60, 20, 0)");
    ctx.fillStyle = corona;
    ctx.beginPath();
    ctx.arc(cx, cy, coronaR, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    var core = ctx.createRadialGradient(cx - coreR * 0.25, cy - coreR * 0.25, 0, cx, cy, coreR);
    core.addColorStop(0, "#ffffff");
    core.addColorStop(0.35, "#fff2c4");
    core.addColorStop(0.75, "#ffc35a");
    core.addColorStop(1, "#ff8a2a");
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
    ctx.fill();
  }

  function hexToRgb(hex) {
    var v = parseInt(hex.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }

  function drawTrail(arr, rgb, width, maxAlpha) {
    var n = arr.length / 2;
    if (n < 2) return;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    for (var i = 1; i < n; i++) {
      var a = (i / n) * maxAlpha;
      ctx.strokeStyle = "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + "," + a.toFixed(3) + ")";
      ctx.beginPath();
      ctx.moveTo(arr[(i - 1) * 2], arr[(i - 1) * 2 + 1]);
      ctx.lineTo(arr[i * 2], arr[i * 2 + 1]);
      ctx.stroke();
    }
  }

  function drawBody(x, y, r, color, lightFromX, lightFromY) {
    var rgb = hexToRgb(color);
    // glow
    var glow = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
    glow.addColorStop(0, "rgba(" + rgb.join(",") + ",0.35)");
    glow.addColorStop(1, "rgba(" + rgb.join(",") + ",0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, r * 3, 0, Math.PI * 2);
    ctx.fill();
    // lit sphere: highlight toward the star
    var dx = lightFromX - x, dy = lightFromY - y;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    var hx = x + (dx / d) * r * 0.45, hy = y + (dy / d) * r * 0.45;
    var body = ctx.createRadialGradient(hx, hy, r * 0.1, x, y, r);
    body.addColorStop(0, "rgba(255,255,255,0.95)");
    body.addColorStop(0.3, color);
    body.addColorStop(1, "rgba(" + Math.floor(rgb[0] * 0.25) + "," + Math.floor(rgb[1] * 0.25) + "," + Math.floor(rgb[2] * 0.25) + ",1)");
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlanets() {
    var bodyScale = Math.max(scale, 0.55);
    for (var i = 0; i < planets.length; i++) {
      var p = planets[i];
      var rgb = hexToRgb(p.def.color);
      if (trailsOn) {
        drawTrail(p.trail, rgb, Math.max(1.2, p.def.size * bodyScale * 0.35), 0.55);
        for (var j = 0; j < p.moons.length; j++) {
          drawTrail(p.moons[j].trail, hexToRgb(p.moons[j].def.color), 1, 0.4);
        }
      }
      var pr = p.def.size * bodyScale;
      if (p.def.ring) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(-0.4);
        ctx.strokeStyle = "rgba(232, 217, 160, 0.55)";
        ctx.lineWidth = 2.2 * bodyScale;
        ctx.beginPath();
        ctx.ellipse(0, 0, pr * 2.1, pr * 0.65, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      drawBody(p.x, p.y, pr, p.def.color, cx, cy);
      for (var k = 0; k < p.moons.length; k++) {
        var m = p.moons[k];
        drawBody(m.x, m.y, m.def.size * bodyScale, m.def.color, cx, cy);
      }
    }
  }

  function drawParticles() {
    if (!particles.length) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < particles.length; i++) {
      var q = particles[i];
      var f = q.life / q.maxLife;
      var a = f * f;
      var r = q.size * (0.6 + f * 0.8);
      ctx.fillStyle = "hsla(" + q.hue.toFixed(0) + ",100%,65%," + (a * 0.25).toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(q.x, q.y, r * 3.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "hsla(" + q.hue.toFixed(0) + ",100%,85%," + a.toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(q.x, q.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // ---------- Loop ----------
  var lastTs = 0;
  var realTime = 0;
  var fpsFrames = 0, fpsAccum = 0, fps = 0;
  var accumulator = 0;
  var FIXED = 1 / 120;

  function frame(ts) {
    if (!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (dt > 0.1) dt = 0.1; // avoid huge jumps after tab switch
    if (dt < 0) dt = 0;
    realTime += dt;

    fpsFrames++;
    fpsAccum += dt;
    if (fpsAccum >= 0.5) {
      fps = Math.round(fpsFrames / fpsAccum);
      fpsFrames = 0;
      fpsAccum = 0;
      fpsEl.textContent = String(fps);
    }

    if (running) {
      var sdt = dt * speed;
      simTime += sdt;
      // planets advance with a fixed sub-step for smooth trails
      accumulator += sdt;
      var steps = 0;
      while (accumulator >= FIXED && steps < 400) {
        step(FIXED);
        accumulator -= FIXED;
        steps++;
      }
      if (steps >= 400) accumulator = 0;
      updateParticles(sdt);
    }

    drawBackground(realTime);
    drawOrbits();
    drawStar(running ? simTime : simTime);
    drawPlanets();
    drawParticles();

    simTimeEl.textContent = simTime.toFixed(1) + " s";
    pCountEl.textContent = String(particles.length);

    requestAnimationFrame(frame);
  }

  // ---------- UI ----------
  playBtn.addEventListener("click", function () {
    running = !running;
    playBtn.textContent = running ? "Pause" : "Play";
    playBtn.classList.toggle("off", !running);
  });

  trailBtn.addEventListener("click", function () {
    trailsOn = !trailsOn;
    trailBtn.textContent = trailsOn ? "Trails: ON" : "Trails: OFF";
    trailBtn.classList.toggle("off", !trailsOn);
  });

  resetBtn.addEventListener("click", function () {
    simTime = 0;
    accumulator = 0;
    particles.length = 0;
    speed = 1.0;
    speedInput.value = "1.0";
    speedVal.textContent = "1.0×";
    buildPlanets();
  });

  speedInput.addEventListener("input", function () {
    var v = parseFloat(speedInput.value);
    if (!isFinite(v)) v = 1;
    speed = Math.min(3, Math.max(0.2, v));
    speedVal.textContent = speed.toFixed(1) + "×";
  });

  canvas.addEventListener("pointerdown", function (e) {
    var rect = canvas.getBoundingClientRect();
    spawnBurst(e.clientX - rect.left, e.clientY - rect.top);
  });

  window.addEventListener("resize", resize);

  buildPlanets();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
