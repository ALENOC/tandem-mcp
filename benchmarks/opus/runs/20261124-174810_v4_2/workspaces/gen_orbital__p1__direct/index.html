<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Particle Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #060913; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e6ecff; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: crosshair; }
  .hud {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    min-width: 250px; padding: 16px 18px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 16px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    user-select: none;
  }
  .hud h1 { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; color: #9fb4ff; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  button {
    flex: 1; padding: 8px 10px; font-size: 12px; font-weight: 600; color: #e6ecff; cursor: pointer;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 10px;
    transition: background 0.2s, border-color 0.2s, transform 0.1s;
  }
  button:hover { background: rgba(255, 255, 255, 0.16); border-color: rgba(160, 190, 255, 0.5); }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 2px solid #7fa2ff; outline-offset: 2px; }
  button.off { color: #8b93ad; background: rgba(255, 255, 255, 0.03); }
  .slider { margin-bottom: 12px; }
  .slider label { display: flex; justify-content: space-between; font-size: 12px; color: #b8c4e6; margin-bottom: 6px; }
  .slider output { font-variant-numeric: tabular-nums; color: #ffd27a; font-weight: 600; }
  input[type=range] { width: 100%; accent-color: #7fa2ff; cursor: pointer; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: rgba(0, 0, 0, 0.22); border-radius: 10px; padding: 7px 8px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.06); }
  .stat span { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #8b97bd; }
  .stat b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; margin-top: 2px; color: #fff; }
  .hint { margin-top: 10px; font-size: 11px; color: #7f8aad; text-align: center; }
</style>
</head>
<body>
<canvas id="sky" aria-label="Orbital particle simulation"></canvas>

<div class="hud" id="hud">
  <h1>Orbital Simulation</h1>
  <div class="row">
    <button id="btnPlay" type="button">Pause</button>
    <button id="btnTrails" type="button">Trails: ON</button>
    <button id="btnReset" type="button">Reset</button>
  </div>
  <div class="slider">
    <label for="speed">Speed <output id="speedOut">1.0×</output></label>
    <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
  </div>
  <div class="stats">
    <div class="stat"><span>FPS</span><b id="fps">0</b></div>
    <div class="stat"><span>Time (s)</span><b id="simTime">0.0</b></div>
    <div class="stat"><span>Particles</span><b id="pCount">0</b></div>
  </div>
  <div class="hint">Click anywhere to spawn a burst</div>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("sky");
  var ctx = canvas.getContext("2d");
  var btnPlay = document.getElementById("btnPlay");
  var btnTrails = document.getElementById("btnTrails");
  var btnReset = document.getElementById("btnReset");
  var speedInput = document.getElementById("speed");
  var speedOut = document.getElementById("speedOut");
  var fpsEl = document.getElementById("fps");
  var timeEl = document.getElementById("simTime");
  var countEl = document.getElementById("pCount");

  var W = 0, H = 0, DPR = 1, CX = 0, CY = 0, SCALE = 1;
  var TAU = Math.PI * 2;
  var MAX_PARTICLES = 3000;
  var TRAIL_LEN = 70;

  var state = {
    playing: true,
    trails: true,
    speed: 1.0,
    simTime: 0
  };

  // ---------- Planet definitions ----------
  var PLANET_DEFS = [
    { name: "Mercury", r: 70,  size: 4,  speed: 1.60, color: "#c9b8a6", glow: "rgba(201,184,166,", moons: [] },
    { name: "Venus",   r: 110, size: 7,  speed: 1.15, color: "#f2c46d", glow: "rgba(242,196,109,", moons: [] },
    { name: "Terra",   r: 160, size: 8,  speed: 0.85, color: "#4fa3ff", glow: "rgba(79,163,255,",
      moons: [{ r: 16, size: 2.2, speed: 4.2, color: "#d8dde8" }] },
    { name: "Ares",    r: 215, size: 6,  speed: 0.65, color: "#ff6b4a", glow: "rgba(255,107,74,",
      moons: [{ r: 11, size: 1.5, speed: 5.5, color: "#bfa89a" }, { r: 17, size: 1.2, speed: -3.6, color: "#a89a90" }] },
    { name: "Jove",    r: 295, size: 15, speed: 0.38, color: "#e0a873", glow: "rgba(224,168,115,",
      moons: [{ r: 24, size: 2.6, speed: 3.2, color: "#f5e6c8" }, { r: 32, size: 2.0, speed: 2.3, color: "#c8d8f0" }, { r: 41, size: 2.4, speed: 1.6, color: "#e0d0b0" }] },
    { name: "Cronus",  r: 375, size: 12, speed: 0.26, color: "#d9c58a", glow: "rgba(217,197,138,", ring: true,
      moons: [{ r: 30, size: 2.0, speed: 2.0, color: "#ece3c4" }] },
    { name: "Glacius", r: 445, size: 9,  speed: 0.17, color: "#7fe6e0", glow: "rgba(127,230,224,", moons: [] }
  ];

  var planets = [];
  var stars = [];
  var particles = [];

  function initPlanets() {
    planets = PLANET_DEFS.map(function (d, i) {
      return {
        def: d,
        angle: (i * 2.399963) % TAU, // golden-angle spread
        x: 0, y: 0,
        trail: [],
        moons: d.moons.map(function (m, j) {
          return { def: m, angle: j * 2.1, x: 0, y: 0, trail: [] };
        })
      };
    });
  }

  function initStars() {
    var count = Math.max(180, Math.floor((W * H) / 5000));
    count = Math.min(count, 600);
    stars = [];
    for (var i = 0; i < count; i++) {
      var hueRoll = Math.random();
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.3 + 0.25,
        base: Math.random() * 0.55 + 0.25,
        amp: Math.random() * 0.4 + 0.1,
        freq: Math.random() * 2.5 + 0.5,
        phase: Math.random() * TAU,
        color: hueRoll < 0.15 ? "180,200,255" : hueRoll < 0.25 ? "255,225,190" : "255,255,255"
      });
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2;
    CY = H / 2;
    // Fit the outermost orbit (+ moons) into the viewport
    var maxR = 445 + 20;
    SCALE = Math.min(1.4, Math.max(0.35, (Math.min(W, H) * 0.5 - 16) / maxR));
    initStars();
    // Trails are in screen space; clear them to avoid streaks after resize
    planets.forEach(function (p) { p.trail.length = 0; p.moons.forEach(function (m) { m.trail.length = 0; }); });
  }

  function reset() {
    state.simTime = 0;
    particles.length = 0;
    initPlanets();
    updateBodies(0);
  }

  // ---------- Simulation ----------
  function updateBodies(dt) {
    for (var i = 0; i < planets.length; i++) {
      var p = planets[i];
      p.angle += p.def.speed * 0.5 * dt;
      p.x = CX + Math.cos(p.angle) * p.def.r * SCALE;
      p.y = CY + Math.sin(p.angle) * p.def.r * SCALE;
      if (dt > 0) {
        p.trail.push(p.x, p.y);
        if (p.trail.length > TRAIL_LEN * 2) p.trail.splice(0, 2);
      }
      for (var j = 0; j < p.moons.length; j++) {
        var m = p.moons[j];
        m.angle += m.def.speed * 0.5 * dt;
        var mr = (m.def.r + p.def.size * 0.4) * Math.max(SCALE, 0.6);
        m.x = p.x + Math.cos(m.angle) * mr;
        m.y = p.y + Math.sin(m.angle) * mr;
        if (dt > 0) {
          m.trail.push(m.x, m.y);
          if (m.trail.length > 30 * 2) m.trail.splice(0, 2);
        }
      }
    }
  }

  function spawnBurst(x, y) {
    var count = 90 + Math.floor(Math.random() * 50);
    var hue = Math.floor(Math.random() * 360);
    for (var i = 0; i < count; i++) {
      if (particles.length >= MAX_PARTICLES) particles.shift();
      var a = Math.random() * TAU;
      var s = 60 + Math.random() * 260;
      var life = 1.2 + Math.random() * 1.4;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: life,
        maxLife: life,
        size: 1 + Math.random() * 2.4,
        hue: (hue + Math.random() * 50 - 25 + 360) % 360
      });
    }
  }

  function updateParticles(dt) {
    var damping = Math.pow(0.12, dt); // ~88% velocity loss per second
    for (var i = particles.length - 1; i >= 0; i--) {
      var q = particles[i];
      q.vx *= damping;
      q.vy *= damping;
      // faint pull toward the star for an orbital feel
      var dx = CX - q.x, dy = CY - q.y;
      var d2 = dx * dx + dy * dy + 2500;
      var g = 9000 / d2;
      var inv = 1 / Math.sqrt(d2);
      q.vx += dx * inv * g * dt;
      q.vy += dy * inv * g * dt;
      q.x += q.vx * dt;
      q.y += q.vy * dt;
      q.life -= dt;
      if (q.life <= 0) particles.splice(i, 1);
    }
  }

  // ---------- Rendering ----------
  function drawBackground(realT) {
    ctx.fillStyle = "#060913";
    ctx.fillRect(0, 0, W, H);

    // faint nebula haze
    var neb = ctx.createRadialGradient(W * 0.8, H * 0.2, 0, W * 0.8, H * 0.2, Math.max(W, H) * 0.6);
    neb.addColorStop(0, "rgba(70,40,120,0.10)");
    neb.addColorStop(1, "rgba(6,9,19,0)");
    ctx.fillStyle = neb;
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var a = s.base + Math.sin(realT * s.freq + s.phase) * s.amp;
      if (a < 0.05) a = 0.05;
      if (a > 1) a = 1;
      ctx.fillStyle = "rgba(" + s.color + "," + a.toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fill();
      if (s.r > 1.2 && a > 0.75) {
        ctx.fillStyle = "rgba(" + s.color + "," + (a * 0.15).toFixed(3) + ")";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 3, 0, TAU);
        ctx.fill();
      }
    }
  }

  function drawOrbits() {
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(140,160,220,0.08)";
    for (var i = 0; i < planets.length; i++) {
      ctx.beginPath();
      ctx.arc(CX, CY, planets[i].def.r * SCALE, 0, TAU);
      ctx.stroke();
    }
  }

  function drawStar(t) {
    var base = 34 * Math.max(SCALE, 0.6);
    var pulse = 1 + Math.sin(t * 1.6) * 0.06 + Math.sin(t * 3.7) * 0.025;

    // outer corona
    var coronaR = base * 4.2 * pulse;
    var g1 = ctx.createRadialGradient(CX, CY, base * 0.5, CX, CY, coronaR);
    g1.addColorStop(0, "rgba(255,200,110,0.45)");
    g1.addColorStop(0.35, "rgba(255,140,60,0.16)");
    g1.addColorStop(0.7, "rgba(255,90,40,0.05)");
    g1.addColorStop(1, "rgba(255,80,30,0)");
    ctx.fillStyle = g1;
    ctx.beginPath();
    ctx.arc(CX, CY, coronaR, 0, TAU);
    ctx.fill();

    // core
    var g2 = ctx.createRadialGradient(CX - base * 0.2, CY - base * 0.2, 0, CX, CY, base);
    g2.addColorStop(0, "#fffef2");
    g2.addColorStop(0.4, "#ffe9a8");
    g2.addColorStop(0.8, "#ffb347");
    g2.addColorStop(1, "rgba(255,140,40,0.0)");
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(CX, CY, base * (1 + (pulse - 1) * 0.5), 0, TAU);
    ctx.fill();
  }

  function drawTrail(trail, rgbaPrefix, width) {
    var n = trail.length / 2;
    if (n < 2) return;
    ctx.lineCap = "round";
    for (var i = 1; i < n; i++) {
      var f = i / n;
      ctx.strokeStyle = rgbaPrefix + (f * 0.55).toFixed(3) + ")";
      ctx.lineWidth = width * (0.3 + f * 0.7);
      ctx.beginPath();
      ctx.moveTo(trail[(i - 1) * 2], trail[(i - 1) * 2 + 1]);
      ctx.lineTo(trail[i * 2], trail[i * 2 + 1]);
      ctx.stroke();
    }
  }

  function drawPlanets() {
    var sizeScale = Math.max(SCALE, 0.55);
    for (var i = 0; i < planets.length; i++) {
      var p = planets[i], d = p.def;
      var r = d.size * sizeScale;

      if (state.trails) {
        drawTrail(p.trail, d.glow, Math.max(1, r * 0.5));
        for (var k = 0; k < p.moons.length; k++) {
          drawTrail(p.moons[k].trail, "rgba(220,225,240,", 1);
        }
      }

      // glow
      var gl = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 3);
      gl.addColorStop(0, d.glow + "0.35)");
      gl.addColorStop(1, d.glow + "0)");
      ctx.fillStyle = gl;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 3, 0, TAU);
      ctx.fill();

      // ring (back half drawn with whole ellipse for simplicity)
      if (d.ring) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(-0.45);
        ctx.strokeStyle = "rgba(230,215,170,0.55)";
        ctx.lineWidth = Math.max(1, r * 0.25);
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 2.1, r * 0.7, 0, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }

      // body with day/night shading relative to the star
      var lx = CX - p.x, ly = CY - p.y;
      var ll = Math.sqrt(lx * lx + ly * ly) || 1;
      lx /= ll; ly /= ll;
      var body = ctx.createRadialGradient(p.x + lx * r * 0.45, p.y + ly * r * 0.45, r * 0.1, p.x, p.y, r);
      body.addColorStop(0, "#ffffff");
      body.addColorStop(0.25, d.color);
      body.addColorStop(1, "rgba(10,12,25,1)");
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, TAU);
      ctx.fill();

      // moons
      for (var j = 0; j < p.moons.length; j++) {
        var m = p.moons[j];
        var mr = Math.max(1, m.def.size * sizeScale);
        ctx.fillStyle = m.def.color;
        ctx.shadowColor = m.def.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(m.x, m.y, mr, 0, TAU);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
  }

  function drawParticles() {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < particles.length; i++) {
      var q = particles[i];
      var f = q.life / q.maxLife;
      var a = f * f;
      var sz = q.size * (0.5 + f * 0.8);
      ctx.fillStyle = "hsla(" + q.hue.toFixed(0) + ",100%,65%," + (a * 0.25).toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(q.x, q.y, sz * 3, 0, TAU);
      ctx.fill();
      ctx.fillStyle = "hsla(" + q.hue.toFixed(0) + ",100%,85%," + a.toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(q.x, q.y, sz, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  // ---------- Loop ----------
  var lastTs = performance.now();
  var realTime = 0;
  var fpsFrames = 0, fpsAccum = 0, fpsValue = 0;
  var hudAccum = 0;

  function frame(ts) {
    var rawDt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (!(rawDt >= 0)) rawDt = 0;
    var dt = Math.min(rawDt, 0.05); // clamp after tab switches
    realTime += dt;

    // FPS (measured on real frame time)
    fpsFrames++;
    fpsAccum += rawDt;
    if (fpsAccum >= 0.5) {
      fpsValue = Math.round(fpsFrames / fpsAccum);
      fpsFrames = 0;
      fpsAccum = 0;
    }

    if (state.playing) {
      var sdt = dt * state.speed;
      state.simTime += sdt;
      updateBodies(sdt);
      updateParticles(sdt);
    }

    drawBackground(realTime);
    drawOrbits();
    drawStar(realTime);
    drawPlanets();
    drawParticles();

    hudAccum += rawDt;
    if (hudAccum >= 0.1) {
      hudAccum = 0;
      fpsEl.textContent = String(fpsValue);
      timeEl.textContent = state.simTime.toFixed(1);
      countEl.textContent = String(particles.length);
    }

    requestAnimationFrame(frame);
  }

  // ---------- Events ----------
  btnPlay.addEventListener("click", function () {
    state.playing = !state.playing;
    btnPlay.textContent = state.playing ? "Pause" : "Play";
    btnPlay.classList.toggle("off", !state.playing);
  });

  btnTrails.addEventListener("click", function () {
    state.trails = !state.trails;
    btnTrails.textContent = state.trails ? "Trails: ON" : "Trails: OFF";
    btnTrails.classList.toggle("off", !state.trails);
  });

  btnReset.addEventListener("click", function () {
    reset();
    countEl.textContent = "0";
    timeEl.textContent = "0.0";
  });

  function onSpeed() {
    var v = parseFloat(speedInput.value);
    if (!isFinite(v)) v = 1;
    state.speed = v;
    speedOut.textContent = v.toFixed(1) + "×";
  }
  speedInput.addEventListener("input", onSpeed);

  canvas.addEventListener("pointerdown", function (e) {
    var rect = canvas.getBoundingClientRect();
    spawnBurst(e.clientX - rect.left, e.clientY - rect.top);
  });

  window.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "INPUT") return;
    if (e.code === "Space") { e.preventDefault(); btnPlay.click(); }
    else if (e.key === "t" || e.key === "T") btnTrails.click();
    else if (e.key === "r" || e.key === "R") btnReset.click();
  });

  window.addEventListener("resize", resize);

  // ---------- Boot ----------
  initPlanets();
  resize();
  onSpeed();
  updateBodies(0);
  requestAnimationFrame(function (ts) { lastTs = ts; frame(ts); });
})();
</script>
</body>
</html>
