<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Particle Simulation</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #060913;
  width: 100%;
  height: 100%;
}
canvas#sim {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  display: block;
}
#hud {
  position: fixed;
  top: 16px;
  left: 16px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 14px;
  padding: 14px 18px;
  color: #e0e6f0;
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 13px;
  z-index: 10;
  user-select: none;
  min-width: 180px;
}
#hud h3 {
  margin: 0 0 8px 0;
  font-size: 14px;
  font-weight: 600;
  color: #fff;
}
#hud .row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
#hud button {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  color: #e0e6f0;
  padding: 6px 12px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
}
#hud button:hover {
  background: rgba(255,255,255,0.18);
}
#hud input[type="range"] {
  width: 100px;
  accent-color: #8fd3ff;
}
#hud .stats {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: rgba(224,230,240,0.7);
  margin-top: 4px;
}
#hud .stats span {
  font-variant-numeric: tabular-nums;
}
</style>
</head>
<body>
<canvas id="sim"></canvas>
<div id="hud">
  <h3>Orbital Sim</h3>
  <div class="row">
    <button id="playBtn">Pause</button>
    <button id="trailsBtn">Trails: ON</button>
    <button id="resetBtn">Reset</button>
  </div>
  <div class="row">
    <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
    <span id="speedVal">1.0x</span>
  </div>
  <div class="stats">
    <span class="stat">FPS <span id="fps">0</span></span>
    <span class="sep">·</span>
    <span class="stat">Time <span id="simTime">0.0</span> s</span>
    <span class="sep">·</span>
    <span class="stat">Particles <span id="particles">0</span></span>
  </div>
</div>
<script>
(function() {
  "use strict";

  var canvas = document.getElementById("sim");
  var ctx = canvas.getContext("2d");

  // State
  var paused = false;
  var trailsOn = true;
  var speed = 1.0;
  var simTime = 0;
  var lastTimestamp = 0;
  var fpsCounter = 0;
  var fpsTime = 0;
  var currentFps = 0;

  // DOM refs
  var playBtn = document.getElementById("playBtn");
  var trailsBtn = document.getElementById("trailsBtn");
  var resetBtn = document.getElementById("resetBtn");
  var speedSlider = document.getElementById("speed");
  var speedVal = document.getElementById("speedVal");
  var fpsEl = document.getElementById("fps");
  var simTimeEl = document.getElementById("simTime");
  var particlesEl = document.getElementById("particles");

  // Starfield
  var stars = [];
  function generateStars() {
    stars = [];
    var count = 250;
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * canvas.width / (window.devicePixelRatio || 1),
        y: Math.random() * canvas.height / (window.devicePixelRatio || 1),
        base: 0.3 + Math.random() * 0.5,
        amp: 0.1 + Math.random() * 0.3,
        spd: 0.5 + Math.random() * 2.0,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  // Planets
  var planets = [
    { orbitRadius: 80,  angSpeed: 0.8,  color: "#8fd3ff", size: 6,  angle: 0,    trail: [] },
    { orbitRadius: 130, angSpeed: 0.5,  color: "#ff7a7a", size: 8,  angle: 1.2,  trail: [] },
    { orbitRadius: 190, angSpeed: 0.35, color: "#7dffb0", size: 7,  angle: 2.5,  trail: [] },
    { orbitRadius: 260, angSpeed: 0.22, color: "#ffd27a", size: 10, angle: 4.0,  trail: [] },
    { orbitRadius: 340, angSpeed: 0.15, color: "#c59bff", size: 9,  angle: 5.5,  trail: [] },
    { orbitRadius: 420, angSpeed: 0.1,  color: "#ff9de2", size: 11, angle: 0.8,  trail: [] }
  ];

  // Store initial angles for reset
  var initialAngles = planets.map(function(p) { return p.angle; });

  // Moons
  var moons = [
    { parent: 0, orbitRadius: 18, angSpeed: 2.0, color: "#aaddff", size: 3, angle: 0 },
    { parent: 1, orbitRadius: 22, angSpeed: 1.5, color: "#ffaaaa", size: 3, angle: 1.0 },
    { parent: 3, orbitRadius: 28, angSpeed: 1.2, color: "#ffeebb", size: 4, angle: 2.0 }
  ];
  var initialMoonAngles = moons.map(function(m) { return m.angle; });

  // Burst particles
  var particles = [];

  function spawnBurst(x, y) {
    var count = 60 + Math.floor(Math.random() * 61); // 60-120
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var spd = 30 + Math.random() * 120;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        life: 1.0,
        decay: 0.4 + Math.random() * 0.6,
        color: ["#8fd3ff", "#ff7a7a", "#7dffb0", "#ffd27a", "#c59bff", "#ff9de2"][Math.floor(Math.random() * 6)],
        size: 1.5 + Math.random() * 2.5
      });
    }
  }

  // Resize
  function resize() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    generateStars();
  }
  window.addEventListener("resize", resize);
  resize();

  // Input handlers
  playBtn.addEventListener("click", function(e) {
    e.stopPropagation();
    paused = !paused;
    playBtn.textContent = paused ? "Play" : "Pause";
  });

  trailsBtn.addEventListener("click", function(e) {
    e.stopPropagation();
    trailsOn = !trailsOn;
    trailsBtn.textContent = trailsOn ? "Trails: ON" : "Trails: OFF";
    if (!trailsOn) {
      for (var i = 0; i < planets.length; i++) {
        planets[i].trail = [];
      }
    }
  });

  resetBtn.addEventListener("click", function(e) {
    e.stopPropagation();
    simTime = 0;
    for (var i = 0; i < planets.length; i++) {
      planets[i].angle = initialAngles[i];
      planets[i].trail = [];
    }
    for (var j = 0; j < moons.length; j++) {
      moons[j].angle = initialMoonAngles[j];
    }
    particles = [];
    speed = 1.0;
    speedSlider.value = "1.0";
    speedVal.textContent = "1.0x";
    paused = false;
    playBtn.textContent = "Pause";
  });

  speedSlider.addEventListener("input", function() {
    speed = parseFloat(speedSlider.value);
    speedVal.textContent = speed.toFixed(1) + "x";
  });

  // Canvas click for burst
  canvas.addEventListener("pointerdown", function(e) {
    spawnBurst(e.clientX, e.clientY);
  });
  canvas.addEventListener("click", function(e) {
    spawnBurst(e.clientX, e.clientY);
  });

  // Prevent HUD events from reaching canvas
  var hud = document.getElementById("hud");
  hud.addEventListener("pointerdown", function(e) { e.stopPropagation(); });
  hud.addEventListener("click", function(e) { e.stopPropagation(); });

  // Drawing helpers
  function drawStar(cx, cy) {
    var t = performance.now() / 1000;
    var pulse = 1 + 0.05 * Math.sin(t * 2);
    var baseR = 40 * pulse;

    var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR);
    grad.addColorStop(0, "rgba(255,255,255,1)");
    grad.addColorStop(0.2, "rgba(255,210,122,0.9)");
    grad.addColorStop(0.5, "rgba(255,138,61,0.5)");
    grad.addColorStop(1, "rgba(255,138,61,0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, baseR, 0, Math.PI * 2);
    ctx.fill();

    // Corona
    var coronaR = baseR * 2.5 * (1 + 0.03 * Math.sin(t * 1.5));
    var cGrad = ctx.createRadialGradient(cx, cy, baseR * 0.5, cx, cy, coronaR);
    cGrad.addColorStop(0, "rgba(255,210,122,0.15)");
    cGrad.addColorStop(1, "rgba(255,138,61,0)");
    ctx.fillStyle = cGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, coronaR, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawStarfield(t) {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var alpha = s.base + s.amp * Math.sin(t * s.spd + s.phase);
      if (alpha < 0) alpha = 0;
      if (alpha > 1) alpha = 1;
      ctx.fillStyle = "rgba(255,255,255," + alpha.toFixed(3) + ")";
      ctx.fillRect(s.x, s.y, 1.2, 1.2);
    }
  }

  function drawOrbitPaths(cx, cy) {
    ctx.strokeStyle = "rgba(255,255,255,0.06)";
    ctx.lineWidth = 1;
    for (var i = 0; i < planets.length; i++) {
      ctx.beginPath();
      ctx.arc(cx, cy, planets[i].orbitRadius, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawTrails(cx, cy) {
    if (!trailsOn) return;
    for (var i = 0; i < planets.length; i++) {
      var p = planets[i];
      var trail = p.trail;
      if (trail.length < 2) continue;
      for (var j = 1; j < trail.length; j++) {
        var alpha = (j / trail.length) * 0.4;
        ctx.strokeStyle = p.color;
        ctx.globalAlpha = alpha;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(trail[j - 1].x, trail[j - 1].y);
        ctx.lineTo(trail[j].x, trail[j].y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawPlanets(cx, cy) {
    for (var i = 0; i < planets.length; i++) {
      var p = planets[i];
      var px = cx + Math.cos(p.angle) * p.orbitRadius;
      var py = cy + Math.sin(p.angle) * p.orbitRadius;

      // Glow
      var g = ctx.createRadialGradient(px, py, 0, px, py, p.size * 2);
      g.addColorStop(0, p.color);
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, p.size * 2, 0, Math.PI * 2);
      ctx.fill();

      // Body
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(px, py, p.size, 0, Math.PI * 2);
      ctx.fill();

      // Update trail
      if (trailsOn) {
        p.trail.push({ x: px, y: py });
        if (p.trail.length > 50) p.trail.shift();
      }
    }
  }

  function drawMoons(cx, cy) {
    for (var i = 0; i < moons.length; i++) {
      var m = moons[i];
      var parent = planets[m.parent];
      var px = cx + Math.cos(parent.angle) * parent.orbitRadius;
      var py = cy + Math.sin(parent.angle) * parent.orbitRadius;
      var mx = px + Math.cos(m.angle) * m.orbitRadius;
      var my = py + Math.sin(m.angle) * m.orbitRadius;

      ctx.fillStyle = m.color;
      ctx.beginPath();
      ctx.arc(mx, my, m.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawParticles() {
    if (particles.length === 0) return;
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var alpha = Math.max(0, p.life);
      var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3);
      g.addColorStop(0, p.color);
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalAlpha = alpha;
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  // Main loop
  function loop(timestamp) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    var dt = (timestamp - lastTimestamp) / 1000;
    lastTimestamp = timestamp;
    if (dt > 0.05) dt = 0.05;

    // FPS
    fpsCounter++;
    fpsTime += dt;
    if (fpsTime >= 0.5) {
      currentFps = Math.round(fpsCounter / fpsTime);
      fpsCounter = 0;
      fpsTime = 0;
    }

    var t = performance.now() / 1000;
    var w = window.innerWidth;
    var h = window.innerHeight;
    var cx = w / 2;
    var cy = h / 2;

    // Clear
    ctx.fillStyle = "#060913";
    ctx.fillRect(0, 0, w, h);

    // Starfield (always animates)
    drawStarfield(t);

    // Update simulation
    if (!paused) {
      simTime += dt * speed;

      // Update planet angles
      for (var i = 0; i < planets.length; i++) {
        planets[i].angle += planets[i].angSpeed * dt * speed;
      }
      // Update moon angles
      for (var j = 0; j < moons.length; j++) {
        moons[j].angle += moons[j].angSpeed * dt * speed;
      }

      // Update particles
      var damp = Math.pow(0.9, dt * 60);
      for (var k = particles.length - 1; k >= 0; k--) {
        var p = particles[k];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= damp;
        p.vy *= damp;
        p.life -= p.decay * dt;
        if (p.life <= 0) {
          particles.splice(k, 1);
        }
      }
    }

    // Draw
    drawOrbitPaths(cx, cy);
    drawTrails(cx, cy);
    drawStar(cx, cy);
    drawPlanets(cx, cy);
    drawMoons(cx, cy);
    drawParticles();

    // Update HUD stats
    fpsEl.textContent = currentFps;
    simTimeEl.textContent = simTime.toFixed(1);
    particlesEl.textContent = particles.length;

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);

  // Expose API
  window.app = {
    get paused() { return paused; },
    get trails() { return trailsOn; },
    get speed() { return speed; },
    get simTime() { return simTime; },
    get particleCount() { return particles.length; },
    planets: planets,
    moons: moons,
    spawnBurst: spawnBurst
  };

})();
</script>
</body>
</html>
