<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON PORTAL 3D</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05010f;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  #c {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }
  #hud {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 10;
    min-width: 210px;
    padding: 16px 18px;
    color: #eaf6ff;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    user-select: none;
  }
  #hud h1 {
    margin: 0 0 12px 0;
    font-size: 18px;
    letter-spacing: 2px;
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 0 12px rgba(0, 229, 255, 0.9);
  }
  .stat {
    display: flex;
    justify-content: space-between;
    gap: 18px;
    font-size: 13px;
    margin: 4px 0;
    font-variant-numeric: tabular-nums;
  }
  .stat .k {
    color: #9fd8ff;
    letter-spacing: 1px;
  }
  .stat .v {
    color: #ffffff;
    font-weight: 600;
  }
  #controls {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #controls button {
    cursor: pointer;
    color: #eaf6ff;
    background: rgba(255, 255, 255, 0.10);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    letter-spacing: 1px;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  #controls button:hover {
    background: rgba(255, 255, 255, 0.18);
    box-shadow: 0 0 14px rgba(0, 229, 255, 0.5);
  }
  .sliderRow {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: #9fd8ff;
  }
  #speed {
    flex: 1;
    accent-color: #00e5ff;
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <h1>NEON PORTAL 3D</h1>
    <div class="stat"><span class="k">FPS</span><span class="v" id="fpsVal">0</span></div>
    <div class="stat"><span class="k">POLYS</span><span class="v" id="polysVal">0</span></div>
    <div class="stat"><span class="k">PARTS</span><span class="v" id="partsVal">110</span></div>
    <div id="controls">
      <button id="pauseBtn">Pause</button>
      <button id="orbitBtn">Orbit ON</button>
      <button id="resetBtn">Reset</button>
      <div class="sliderRow">
        <span>Speed</span>
        <input type="range" id="speed" min="0" max="3" step="0.1" value="1">
      </div>
    </div>
  </div>
  <script src="engine3d.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
