<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boids – Simulazione di stormo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #070b14; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e6edf7; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: crosshair; background: #070b14; }
  .glass {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  #hud { position: fixed; top: 16px; left: 16px; padding: 14px 18px; min-width: 190px; user-select: none; }
  #hud h1 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #8fb6ff; margin-bottom: 8px; font-weight: 600; }
  .row { display: flex; justify-content: space-between; gap: 20px; font-size: 14px; line-height: 1.7; }
  .row span:first-child { color: #9aa8c0; }
  .row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  #state { margin-top: 6px; font-size: 12px; color: #ffcf6e; }
  #state.running { color: #6ee7a8; }
  #controls { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 24px); }
  button {
    font: inherit; font-size: 14px; font-weight: 600; color: #e6edf7; cursor: pointer;
    padding: 8px 16px; border-radius: 10px; min-width: 76px;
    background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.18);
    transition: background .15s, transform .08s, border-color .15s;
  }
  button:hover { background: rgba(255,255,255,0.17); border-color: rgba(143,182,255,0.55); }
  button:active { transform: scale(0.96); }
  button:focus-visible, input:focus-visible { outline: 2px solid #8fb6ff; outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #playBtn { background: rgba(110, 160, 255, 0.28); border-color: rgba(143,182,255,0.55); min-width: 92px; }
  label { font-size: 13px; color: #9aa8c0; display: flex; align-items: center; gap: 8px; margin-left: 6px; }
  input[type=range] { width: 140px; accent-color: #8fb6ff; cursor: pointer; }
  #speedVal { font-variant-numeric: tabular-nums; color: #e6edf7; font-weight: 600; min-width: 38px; }
  #hint { position: fixed; top: 16px; right: 16px; padding: 10px 14px; font-size: 12px; color: #9aa8c0; user-select: none; }
</style>
</head>
<body>
<canvas id="canvas" aria-label="Simulazione Boids: clicca per aggiungere un boid"></canvas>

<div id="hud" class="glass" aria-live="polite">
  <h1>Boids</h1>
  <div class="row"><span>FPS</span><span id="fps">0</span></div>
  <div class="row"><span>Boids</span><span id="count">0</span></div>
  <div class="row"><span>Velocità</span><span id="speedHud">1.0×</span></div>
  <div id="state">⏸ In pausa</div>
</div>

<div id="hint" class="glass">Clicca sul canvas per aggiungere un boid</div>

<div id="controls" class="glass">
  <button id="playBtn" type="button" aria-label="Play">▶ Play</button>
  <button id="stepBtn" type="button">Step</button>
  <button id="resetBtn" type="button">Reset</button>
  <label for="speed">Velocità
    <input id="speed" type="range" min="0.5" max="3.0" step="0.1" value="1.0">
    <span id="speedVal">1.0×</span>
  </label>
</div>

<script>
(function () {
  'use strict';

  var INITIAL_COUNT = 60;
  var MAX_BOIDS = 600;
  var PERCEPTION = 60;
  var SEP_DIST = 24;
  var MAX_SPEED = 2.4;
  var MAX_FORCE = 0.06;
  var W_SEP = 1.6, W_ALI = 1.0, W_COH = 0.85;

  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var playBtn = document.getElementById('playBtn');
  var stepBtn = document.getElementById('stepBtn');
  var resetBtn = document.getElementById('resetBtn');
  var speedInput = document.getElementById('speed');
  var speedVal = document.getElementById('speedVal');
  var fpsEl = document.getElementById('fps');
  var countEl = document.getElementById('count');
  var speedHud = document.getElementById('speedHud');
  var stateEl = document.getElementById('state');

  var width = 0, height = 0, dpr = 1;
  var boids = [];
  var running = false;
  var speed = 1.0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      if (b.x > width) b.x = Math.random() * width;
      if (b.y > height) b.y = Math.random() * height;
    }
    if (!running) draw();
  }

  function makeBoid(x, y) {
    var a = Math.random() * Math.PI * 2;
    var s = MAX_SPEED * (0.5 + Math.random() * 0.5);
    return { x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, hue: 195 + Math.random() * 50 };
  }

  function reset() {
    boids = [];
    var margin = 40;
    for (var i = 0; i < INITIAL_COUNT; i++) {
      boids.push(makeBoid(
        margin + Math.random() * Math.max(1, width - margin * 2),
        margin + Math.random() * Math.max(1, height - margin * 2)
      ));
    }
    updateHud();
    draw();
  }

  function limit(vx, vy, max) {
    var m = Math.sqrt(vx * vx + vy * vy);
    if (m > max && m > 0) { var k = max / m; return [vx * k, vy * k]; }
    return [vx, vy];
  }

  function steerTo(dx, dy, b) {
    var m = Math.sqrt(dx * dx + dy * dy);
    if (m === 0) return [0, 0];
    dx = dx / m * MAX_SPEED - b.vx;
    dy = dy / m * MAX_SPEED - b.vy;
    return limit(dx, dy, MAX_FORCE);
  }

  // dt: time scale (1 = one frame at 60fps) multiplied by speed
  function update(dt) {
    var n = boids.length;
    var p2 = PERCEPTION * PERCEPTION, s2 = SEP_DIST * SEP_DIST;
    var hw = width / 2, hh = height / 2;
    var ax = new Float32Array(n), ay = new Float32Array(n);

    for (var i = 0; i < n; i++) {
      var b = boids[i];
      var aliX = 0, aliY = 0, cohX = 0, cohY = 0, sepX = 0, sepY = 0;
      var cnt = 0, sepCnt = 0;
      for (var j = 0; j < n; j++) {
        if (i === j) continue;
        var o = boids[j];
        var dx = o.x - b.x, dy = o.y - b.y;
        // toroidal shortest distance
        if (dx > hw) dx -= width; else if (dx < -hw) dx += width;
        if (dy > hh) dy -= height; else if (dy < -hh) dy += height;
        var d2 = dx * dx + dy * dy;
        if (d2 < p2) {
          aliX += o.vx; aliY += o.vy;
          cohX += dx; cohY += dy;
          cnt++;
          if (d2 < s2 && d2 > 0) {
            sepX -= dx / d2; sepY -= dy / d2;
            sepCnt++;
          }
        }
      }
      var fx = 0, fy = 0, f;
      if (cnt > 0) {
        f = steerTo(aliX / cnt, aliY / cnt, b); fx += f[0] * W_ALI; fy += f[1] * W_ALI;
        f = steerTo(cohX / cnt, cohY / cnt, b); fx += f[0] * W_COH; fy += f[1] * W_COH;
      }
      if (sepCnt > 0) {
        f = steerTo(sepX, sepY, b); fx += f[0] * W_SEP; fy += f[1] * W_SEP;
      }
      ax[i] = fx; ay[i] = fy;
    }

    for (var k = 0; k < n; k++) {
      var bb = boids[k];
      bb.vx += ax[k] * dt; bb.vy += ay[k] * dt;
      var v = limit(bb.vx, bb.vy, MAX_SPEED);
      bb.vx = v[0]; bb.vy = v[1];
      var m = Math.sqrt(bb.vx * bb.vx + bb.vy * bb.vy);
      var minS = MAX_SPEED * 0.4;
      if (m < minS) {
        if (m === 0) { bb.vx = minS; bb.vy = 0; }
        else { bb.vx *= minS / m; bb.vy *= minS / m; }
      }
      bb.x += bb.vx * dt; bb.y += bb.vy * dt;
      if (bb.x < 0) bb.x += width; else if (bb.x >= width) bb.x -= width;
      if (bb.y < 0) bb.y += height; else if (bb.y >= height) bb.y -= height;
    }
  }

  function draw() {
    ctx.fillStyle = '#070b14';
    ctx.fillRect(0, 0, width, height);

    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      var ang = Math.atan2(b.vy, b.vx);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(9, 0);
      ctx.lineTo(-6, 4.5);
      ctx.lineTo(-3, 0);
      ctx.lineTo(-6, -4.5);
      ctx.closePath();
      ctx.fillStyle = 'hsl(' + b.hue.toFixed(0) + ', 90%, 68%)';
      ctx.shadowColor = 'hsla(' + b.hue.toFixed(0) + ', 100%, 60%, 0.8)';
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.restore();
    }
  }

  function updateHud() {
    countEl.textContent = String(boids.length);
    var s = speed.toFixed(1) + '×';
    speedHud.textContent = s;
    speedVal.textContent = s;
  }

  function setRunning(r) {
    running = r;
    playBtn.textContent = r ? '⏸ Pause' : '▶ Play';
    playBtn.setAttribute('aria-label', r ? 'Pause' : 'Play');
    stepBtn.disabled = r;
    stateEl.textContent = r ? '▶ In esecuzione' : '⏸ In pausa';
    stateEl.className = r ? 'running' : '';
  }

  // Main loop
  var last = performance.now();
  var fpsFrames = 0, fpsTime = 0;
  function frame(now) {
    var elapsed = now - last;
    last = now;
    if (!(elapsed > 0)) elapsed = 16.67;
    if (elapsed > 100) elapsed = 100;

    fpsFrames++; fpsTime += elapsed;
    if (fpsTime >= 500) {
      fpsEl.textContent = String(Math.round(fpsFrames * 1000 / fpsTime));
      fpsFrames = 0; fpsTime = 0;
    }

    if (running) {
      var dt = (elapsed / 16.667) * speed;
      // sub-step for stability at high speed
      var steps = Math.max(1, Math.ceil(dt));
      for (var s = 0; s < steps; s++) update(dt / steps);
    }
    draw();
    requestAnimationFrame(frame);
  }

  // Events
  playBtn.addEventListener('click', function () { setRunning(!running); });
  stepBtn.addEventListener('click', function () {
    if (running) return;
    update(speed);
    draw();
  });
  resetBtn.addEventListener('click', function () { reset(); });
  speedInput.addEventListener('input', function () {
    var v = parseFloat(speedInput.value);
    if (isFinite(v)) speed = Math.min(3, Math.max(0.5, v));
    updateHud();
  });
  canvas.addEventListener('click', function (e) {
    if (boids.length >= MAX_BOIDS) return;
    var rect = canvas.getBoundingClientRect();
    var b = makeBoid(e.clientX - rect.left, e.clientY - rect.top);
    b.hue = 30 + Math.random() * 25; // new boids stand out in warm tones
    boids.push(b);
    updateHud();
    if (!running) draw();
  });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); setRunning(!running); }
  });
  window.addEventListener('resize', resize);

  resize();
  reset();
  setRunning(false);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
