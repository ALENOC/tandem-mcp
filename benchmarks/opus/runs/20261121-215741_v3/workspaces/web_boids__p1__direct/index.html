<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boids — Simulazione di stormo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #070b14;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #e6ecff;
  }
  #canvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    display: block; background: #070b14; cursor: crosshair;
  }
  .glass {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 16px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  #hud {
    position: fixed; top: 16px; left: 16px;
    padding: 14px 18px; min-width: 190px;
    font-size: 14px; user-select: none; pointer-events: none;
  }
  #hud h1 {
    margin: 0 0 8px; font-size: 13px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase; color: #8fb4ff;
  }
  .row { display: flex; justify-content: space-between; gap: 16px; padding: 2px 0; }
  .row span:first-child { color: #9aa7c7; }
  .row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  #status { margin-top: 6px; font-size: 12px; color: #ffcf6b; }
  #status.running { color: #6bffb0; }
  #controls {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    justify-content: center; padding: 12px 16px; max-width: calc(100vw - 24px);
  }
  button {
    font: inherit; font-size: 14px; font-weight: 600; color: #e6ecff;
    background: rgba(255, 255, 255, 0.10);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 10px; padding: 8px 16px; cursor: pointer;
    transition: background 0.15s, transform 0.08s, border-color 0.15s;
  }
  button:hover { background: rgba(255, 255, 255, 0.18); border-color: rgba(143,180,255,0.6); }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 2px solid #8fb4ff; outline-offset: 2px; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #playBtn { min-width: 92px; background: rgba(107, 160, 255, 0.25); }
  label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #c3cdea; }
  input[type="range"] { width: 140px; accent-color: #8fb4ff; cursor: pointer; }
  #speedVal { min-width: 40px; font-variant-numeric: tabular-nums; font-weight: 600; color: #e6ecff; }
  #hint {
    position: fixed; top: 16px; right: 16px; padding: 10px 14px;
    font-size: 12px; color: #9aa7c7; pointer-events: none;
  }
  @media (max-width: 600px) { #hint { display: none; } }
</style>
</head>
<body>
<canvas id="canvas" aria-label="Simulazione Boids"></canvas>

<div id="hud" class="glass" aria-live="polite">
  <h1>Boids</h1>
  <div class="row"><span>FPS</span><span id="fps">0</span></div>
  <div class="row"><span>Boids</span><span id="count">0</span></div>
  <div class="row"><span>Velocità</span><span id="speedHud">1.0×</span></div>
  <div id="status">In pausa</div>
</div>

<div id="hint" class="glass">Clicca sul canvas per aggiungere un boid</div>

<div id="controls" class="glass">
  <button id="playBtn" type="button" aria-label="Play">▶ Play</button>
  <button id="stepBtn" type="button">Step</button>
  <button id="resetBtn" type="button">Reset</button>
  <label for="speed">Velocità
    <input id="speed" type="range" min="0.5" max="3.0" step="0.1" value="1.0">
    <span id="speedVal">1.0×</span>
  </label>
</div>

<script>
(function () {
  "use strict";

  var INITIAL_COUNT = 60;
  var MAX_BOIDS = 600;
  var PERCEPTION = 60;
  var SEP_DIST = 24;
  var BASE_MAX_SPEED = 2.6;
  var MAX_FORCE = 0.06;
  var W_SEP = 1.6, W_ALI = 1.0, W_COH = 0.8;
  var MARGIN = 40, TURN = 0.25;

  var canvas = document.getElementById("canvas");
  var ctx = canvas.getContext("2d");
  var playBtn = document.getElementById("playBtn");
  var stepBtn = document.getElementById("stepBtn");
  var resetBtn = document.getElementById("resetBtn");
  var speedInput = document.getElementById("speed");
  var speedVal = document.getElementById("speedVal");
  var fpsEl = document.getElementById("fps");
  var countEl = document.getElementById("count");
  var speedHud = document.getElementById("speedHud");
  var statusEl = document.getElementById("status");

  var width = 0, height = 0, dpr = 1;
  var boids = [];
  var running = false;
  var speed = 1.0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.max(1, Math.floor(width * dpr));
    canvas.height = Math.max(1, Math.floor(height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      if (b.x > width) b.x = Math.random() * width;
      if (b.y > height) b.y = Math.random() * height;
    }
    draw();
  }

  function makeBoid(x, y) {
    var a = Math.random() * Math.PI * 2;
    var s = BASE_MAX_SPEED * (0.5 + Math.random() * 0.5);
    return { x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, hue: 190 + Math.random() * 60 };
  }

  function reset() {
    boids = [];
    var pad = 60;
    for (var i = 0; i < INITIAL_COUNT; i++) {
      boids.push(makeBoid(
        pad + Math.random() * Math.max(1, width - pad * 2),
        pad + Math.random() * Math.max(1, height - pad * 2)
      ));
    }
    updateHud();
    draw();
  }

  function limit(vx, vy, max) {
    var m = Math.sqrt(vx * vx + vy * vy);
    if (m > max && m > 0) { var k = max / m; return [vx * k, vy * k]; }
    return [vx, vy];
  }

  function steerTo(dx, dy, b, maxSpeed) {
    var m = Math.sqrt(dx * dx + dy * dy);
    if (m === 0) return [0, 0];
    dx = dx / m * maxSpeed - b.vx;
    dy = dy / m * maxSpeed - b.vy;
    return limit(dx, dy, MAX_FORCE * speed);
  }

  function update() {
    var maxSpeed = BASE_MAX_SPEED * speed;
    var p2 = PERCEPTION * PERCEPTION, s2 = SEP_DIST * SEP_DIST;
    var n = boids.length, i, j;
    var acc = new Array(n);

    for (i = 0; i < n; i++) {
      var b = boids[i];
      var sx = 0, sy = 0, ax = 0, ay = 0, cx = 0, cy = 0, cnt = 0, scnt = 0;
      for (j = 0; j < n; j++) {
        if (i === j) continue;
        var o = boids[j];
        var dx = o.x - b.x, dy = o.y - b.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < p2) {
          ax += o.vx; ay += o.vy;
          cx += o.x; cy += o.y;
          cnt++;
          if (d2 < s2 && d2 > 0) {
            sx -= dx / d2; sy -= dy / d2;
            scnt++;
          }
        }
      }
      var fx = 0, fy = 0, f;
      if (cnt > 0) {
        f = steerTo(ax / cnt, ay / cnt, b, maxSpeed);
        fx += f[0] * W_ALI; fy += f[1] * W_ALI;
        f = steerTo(cx / cnt - b.x, cy / cnt - b.y, b, maxSpeed);
        fx += f[0] * W_COH; fy += f[1] * W_COH;
      }
      if (scnt > 0) {
        f = steerTo(sx, sy, b, maxSpeed);
        fx += f[0] * W_SEP; fy += f[1] * W_SEP;
      }
      // morbido contenimento ai bordi
      var t = TURN * speed;
      if (b.x < MARGIN) fx += t * 0.2;
      if (b.x > width - MARGIN) fx -= t * 0.2;
      if (b.y < MARGIN) fy += t * 0.2;
      if (b.y > height - MARGIN) fy -= t * 0.2;
      acc[i] = [fx, fy];
    }

    for (i = 0; i < n; i++) {
      var bb = boids[i];
      bb.vx += acc[i][0]; bb.vy += acc[i][1];
      var v = limit(bb.vx, bb.vy, maxSpeed);
      bb.vx = v[0]; bb.vy = v[1];
      var m = Math.sqrt(bb.vx * bb.vx + bb.vy * bb.vy);
      var minS = maxSpeed * 0.35;
      if (m < minS) {
        if (m === 0) { bb.vx = minS; bb.vy = 0; }
        else { bb.vx *= minS / m; bb.vy *= minS / m; }
      }
      bb.x += bb.vx; bb.y += bb.vy;
      // fallback: wrap se esce dallo schermo
      if (bb.x < -20) bb.x = width + 20;
      else if (bb.x > width + 20) bb.x = -20;
      if (bb.y < -20) bb.y = height + 20;
      else if (bb.y > height + 20) bb.y = -20;
    }
  }

  function draw() {
    ctx.fillStyle = "#070b14";
    ctx.fillRect(0, 0, width, height);
    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      var ang = Math.atan2(b.vy, b.vx);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(9, 0);
      ctx.lineTo(-6, 4.5);
      ctx.lineTo(-3, 0);
      ctx.lineTo(-6, -4.5);
      ctx.closePath();
      ctx.fillStyle = "hsl(" + b.hue.toFixed(0) + ", 90%, 68%)";
      ctx.shadowColor = "hsla(" + b.hue.toFixed(0) + ", 100%, 60%, 0.6)";
      ctx.shadowBlur = 6;
      ctx.fill();
      ctx.restore();
    }
  }

  function updateHud() {
    countEl.textContent = String(boids.length);
    speedHud.textContent = speed.toFixed(1) + "×";
    speedVal.textContent = speed.toFixed(1) + "×";
  }

  function setRunning(r) {
    running = r;
    playBtn.textContent = running ? "❚❚ Pause" : "▶ Play";
    playBtn.setAttribute("aria-label", running ? "Pause" : "Play");
    stepBtn.disabled = running;
    statusEl.textContent = running ? "In esecuzione" : "In pausa";
    statusEl.className = running ? "running" : "";
  }

  // FPS
  var frames = 0, lastFpsT = performance.now();

  function loop(now) {
    if (running) update();
    draw();
    frames++;
    if (now - lastFpsT >= 500) {
      fpsEl.textContent = String(Math.round(frames * 1000 / (now - lastFpsT)));
      frames = 0; lastFpsT = now;
    }
    requestAnimationFrame(loop);
  }

  playBtn.addEventListener("click", function () { setRunning(!running); });
  stepBtn.addEventListener("click", function () {
    if (!running) { update(); draw(); }
  });
  resetBtn.addEventListener("click", function () { reset(); });
  speedInput.addEventListener("input", function () {
    var v = parseFloat(speedInput.value);
    if (!isFinite(v)) v = 1;
    speed = Math.min(3.0, Math.max(0.5, v));
    updateHud();
  });
  canvas.addEventListener("click", function (e) {
    if (boids.length >= MAX_BOIDS) boids.shift();
    var r = canvas.getBoundingClientRect();
    boids.push(makeBoid(e.clientX - r.left, e.clientY - r.top));
    updateHud();
    draw();
  });
  window.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "INPUT") return;
    if (e.code === "Space") { e.preventDefault(); setRunning(!running); }
  });
  window.addEventListener("resize", resize);

  resize();
  reset();
  setRunning(false);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
