<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Particle Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #060913; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e6ecff; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: crosshair; }
  .hud {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    padding: 16px 18px; width: 260px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 16px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    user-select: none;
  }
  .hud h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #9fb4ff; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  button {
    flex: 1; padding: 8px 6px; font: inherit; font-size: 12px; font-weight: 600; color: #e6ecff;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 10px; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.08s;
  }
  button:hover { background: rgba(255, 255, 255, 0.16); border-color: rgba(160, 190, 255, 0.5); }
  button:active { transform: scale(0.96); }
  button:focus-visible, input:focus-visible { outline: 2px solid #7fa2ff; outline-offset: 2px; }
  button.on { background: rgba(110, 150, 255, 0.28); border-color: rgba(140, 175, 255, 0.6); }
  .slider { margin-bottom: 12px; }
  .slider label { display: flex; justify-content: space-between; font-size: 12px; color: #b8c5ea; margin-bottom: 6px; }
  .slider output { font-variant-numeric: tabular-nums; color: #fff; font-weight: 600; }
  input[type=range] { width: 100%; accent-color: #7fa2ff; cursor: pointer; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .stat { background: rgba(0, 0, 0, 0.22); border-radius: 10px; padding: 7px 4px; text-align: center; }
  .stat span { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #8a99c4; }
  .stat b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .hint { margin-top: 10px; font-size: 11px; color: #7d8bb3; text-align: center; }
</style>
</head>
<body>
<canvas id="sim" aria-label="Orbital particle simulation"></canvas>

<div class="hud" role="region" aria-label="Simulation controls">
  <h1>Orbital Simulator</h1>
  <div class="row">
    <button id="playBtn" class="on" aria-pressed="true">⏸ Pause</button>
    <button id="trailBtn" class="on" aria-pressed="true">Trails ON</button>
    <button id="resetBtn">↺ Reset</button>
  </div>
  <div class="slider">
    <label for="speed">Speed <output id="speedOut" for="speed">1.0×</output></label>
    <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
  </div>
  <div class="stats">
    <div class="stat"><span>FPS</span><b id="fps">0</b></div>
    <div class="stat"><span>Time (s)</span><b id="time">0.0</b></div>
    <div class="stat"><span>Particles</span><b id="parts">0</b></div>
  </div>
  <div class="hint">Click anywhere to spawn a burst</div>
</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('sim');
  const ctx = canvas.getContext('2d');
  const playBtn = document.getElementById('playBtn');
  const trailBtn = document.getElementById('trailBtn');
  const resetBtn = document.getElementById('resetBtn');
  const speedInput = document.getElementById('speed');
  const speedOut = document.getElementById('speedOut');
  const fpsEl = document.getElementById('fps');
  const timeEl = document.getElementById('time');
  const partsEl = document.getElementById('parts');

  let W = 0, H = 0, dpr = 1, cx = 0, cy = 0, scale = 1;
  let running = true;
  let trailsOn = true;
  let speed = 1.0;
  let simTime = 0;
  let lastTs = null;
  let fpsFrames = 0, fpsAccum = 0;

  const TRAIL_LEN = 70;
  const MAX_PARTICLES = 3000;

  // ---------- Starfield ----------
  let stars = [];
  function buildStars() {
    const count = Math.max(180, Math.floor((W * H) / 6000));
    stars = [];
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.3 + 0.2,
        base: Math.random() * 0.6 + 0.25,
        phase: Math.random() * Math.PI * 2,
        freq: Math.random() * 2.5 + 0.6,
        hue: Math.random() < 0.15 ? 210 : (Math.random() < 0.1 ? 40 : 0)
      });
    }
  }

  // ---------- Planets ----------
  const PLANET_DEFS = [
    { name: 'Ember',  r: 70,  size: 4,   speed: 1.55, color: '#ff8a5c', moons: [] },
    { name: 'Azure',  r: 115, size: 7,   speed: 1.05, color: '#4fb6ff', moons: [{ r: 15, size: 2, speed: 4.2, color: '#d9e6ff' }] },
    { name: 'Verdant',r: 168, size: 8,   speed: 0.72, color: '#5ee69a', moons: [{ r: 17, size: 2.2, speed: 3.4, color: '#e8e8e8' }, { r: 25, size: 1.6, speed: -2.4, color: '#b0c4de' }] },
    { name: 'Crimson',r: 222, size: 6,   speed: 0.52, color: '#ff4f6d', moons: [] },
    { name: 'Saffron',r: 290, size: 12,  speed: 0.34, color: '#ffd166', moons: [{ r: 22, size: 2.6, speed: 2.6, color: '#fff1c9' }, { r: 32, size: 2, speed: 1.8, color: '#ffc8a0' }], ring: true },
    { name: 'Violet', r: 355, size: 9,   speed: 0.23, color: '#b98cff', moons: [{ r: 18, size: 2, speed: -3.0, color: '#e2d4ff' }] }
  ];
  let planets = [];

  function buildPlanets() {
    planets = PLANET_DEFS.map(function (d, i) {
      return {
        def: d,
        angle: (i * 1.7) % (Math.PI * 2),
        trail: [],
        x: 0, y: 0,
        moons: d.moons.map(function (m, j) {
          return { def: m, angle: j * 2.1, trail: [], x: 0, y: 0 };
        })
      };
    });
    updatePositions();
  }

  function updatePositions() {
    for (const p of planets) {
      p.x = cx + Math.cos(p.angle) * p.def.r * scale;
      p.y = cy + Math.sin(p.angle) * p.def.r * scale * 0.92;
      for (const m of p.moons) {
        m.x = p.x + Math.cos(m.angle) * m.def.r * scale;
        m.y = p.y + Math.sin(m.angle) * m.def.r * scale;
      }
    }
  }

  function pushTrail(arr, x, y, max) {
    arr.push(x, y);
    if (arr.length > max * 2) arr.splice(0, arr.length - max * 2);
  }

  // ---------- Burst particles ----------
  let particles = [];
  const BURST_COLORS = [[255, 200, 120], [120, 200, 255], [255, 120, 200], [160, 255, 200], [255, 255, 255]];

  function spawnBurst(x, y) {
    const n = 90 + Math.floor(Math.random() * 50);
    const base = BURST_COLORS[Math.floor(Math.random() * BURST_COLORS.length)];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.15;
      const v = 80 + Math.random() * 260;
      const life = 1.2 + Math.random() * 1.4;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: life, maxLife: life,
        size: 1 + Math.random() * 2.2,
        c: [
          Math.min(255, base[0] + (Math.random() * 60 - 30)) | 0,
          Math.min(255, base[1] + (Math.random() * 60 - 30)) | 0,
          Math.min(255, base[2] + (Math.random() * 60 - 30)) | 0
        ]
      });
    }
    if (particles.length > MAX_PARTICLES) particles.splice(0, particles.length - MAX_PARTICLES);
    partsEl.textContent = particles.length;
  }

  // ---------- Resize ----------
  function resize() {
    const oldW = W, oldH = H;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2;
    cy = H / 2;
    scale = Math.min(W, H) / 800;
    scale = Math.max(0.45, Math.min(scale, 1.6));
    buildStars();
    // Shift trails / particles to stay relative to new center
    if (oldW && oldH) {
      const dx = (W - oldW) / 2, dy = (H - oldH) / 2;
      for (const p of particles) { p.x += dx; p.y += dy; }
    }
    for (const p of planets) {
      p.trail.length = 0;
      for (const m of p.moons) m.trail.length = 0;
    }
    updatePositions();
  }

  // ---------- Update ----------
  function update(dt) {
    const sdt = dt * speed;
    simTime += sdt;
    for (const p of planets) {
      p.angle += p.def.speed * 0.35 * sdt;
      for (const m of p.moons) m.angle += m.def.speed * 0.5 * sdt;
    }
    updatePositions();
    for (const p of planets) {
      pushTrail(p.trail, p.x, p.y, TRAIL_LEN);
      for (const m of p.moons) pushTrail(m.trail, m.x, m.y, 28);
    }
    const damp = Math.pow(0.12, sdt); // velocity damping per second
    for (let i = particles.length - 1; i >= 0; i--) {
      const q = particles[i];
      q.vx *= damp;
      q.vy *= damp;
      q.x += q.vx * sdt;
      q.y += q.vy * sdt;
      q.life -= sdt;
      if (q.life <= 0) {
        particles[i] = particles[particles.length - 1];
        particles.pop();
      }
    }
  }

  // ---------- Draw ----------
  function drawStars(t) {
    for (const s of stars) {
      const tw = s.base + Math.sin(t * s.freq + s.phase) * 0.35;
      const a = Math.max(0.05, Math.min(1, tw));
      if (s.hue === 210) ctx.fillStyle = 'rgba(170,200,255,' + a + ')';
      else if (s.hue === 40) ctx.fillStyle = 'rgba(255,220,170,' + a + ')';
      else ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawOrbits() {
    ctx.strokeStyle = 'rgba(140,160,220,0.08)';
    ctx.lineWidth = 1;
    for (const p of planets) {
      ctx.beginPath();
      ctx.ellipse(cx, cy, p.def.r * scale, p.def.r * scale * 0.92, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function drawTrail(arr, rgb, width) {
    const n = arr.length / 2;
    if (n < 2) return;
    ctx.lineCap = 'round';
    for (let i = 1; i < n; i++) {
      const a = (i / n);
      ctx.strokeStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + (a * a * 0.6).toFixed(3) + ')';
      ctx.lineWidth = width * a;
      ctx.beginPath();
      ctx.moveTo(arr[(i - 1) * 2], arr[(i - 1) * 2 + 1]);
      ctx.lineTo(arr[i * 2], arr[i * 2 + 1]);
      ctx.stroke();
    }
  }

  function drawStar(t) {
    const pulse = 1 + Math.sin(t * 1.6) * 0.06 + Math.sin(t * 3.7) * 0.025;
    const coreR = 26 * scale;
    const coronaR = coreR * 4.2 * pulse;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const corona = ctx.createRadialGradient(cx, cy, coreR * 0.5, cx, cy, coronaR);
    corona.addColorStop(0, 'rgba(255,210,120,0.55)');
    corona.addColorStop(0.3, 'rgba(255,150,60,0.22)');
    corona.addColorStop(0.65, 'rgba(255,90,40,0.06)');
    corona.addColorStop(1, 'rgba(255,60,20,0)');
    ctx.fillStyle = corona;
    ctx.beginPath();
    ctx.arc(cx, cy, coronaR, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const core = ctx.createRadialGradient(cx - coreR * 0.25, cy - coreR * 0.25, 0, cx, cy, coreR);
    core.addColorStop(0, '#ffffff');
    core.addColorStop(0.35, '#fff3c4');
    core.addColorStop(0.75, '#ffc35a');
    core.addColorStop(1, '#ff8a2a');
    ctx.fillStyle = core;
    ctx.shadowColor = 'rgba(255,190,90,0.9)';
    ctx.shadowBlur = 40 * scale * pulse;
    ctx.beginPath();
    ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawBody(x, y, size, color, rgb) {
    // glow
    const g = ctx.createRadialGradient(x, y, 0, x, y, size * 3);
    g.addColorStop(0, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0.35)');
    g.addColorStop(1, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, size * 3, 0, Math.PI * 2);
    ctx.fill();
    // lit sphere: shade away from the star
    const ang = Math.atan2(y - cy, x - cx);
    const lx = x - Math.cos(ang) * size * 0.45, ly = y - Math.sin(ang) * size * 0.45;
    const s = ctx.createRadialGradient(lx, ly, size * 0.1, x, y, size);
    s.addColorStop(0, '#ffffff');
    s.addColorStop(0.25, color);
    s.addColorStop(1, 'rgba(' + (rgb[0] * 0.25 | 0) + ',' + (rgb[1] * 0.25 | 0) + ',' + (rgb[2] * 0.25 | 0) + ',1)');
    ctx.fillStyle = s;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlanets() {
    for (const p of planets) {
      const rgb = p.def.rgb || (p.def.rgb = hexToRgb(p.def.color));
      if (trailsOn) drawTrail(p.trail, rgb, Math.max(1.2, p.def.size * scale * 0.6));
      for (const m of p.moons) {
        const mrgb = m.def.rgb || (m.def.rgb = hexToRgb(m.def.color));
        if (trailsOn) drawTrail(m.trail, mrgb, 1);
      }
    }
    for (const p of planets) {
      const size = p.def.size * scale;
      const rgb = p.def.rgb;
      if (p.def.ring) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(-0.4);
        ctx.strokeStyle = 'rgba(255,225,160,0.45)';
        ctx.lineWidth = Math.max(1, 2.2 * scale);
        ctx.beginPath();
        ctx.ellipse(0, 0, size * 2, size * 0.6, 0, Math.PI, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      drawBody(p.x, p.y, size, p.def.color, rgb);
      if (p.def.ring) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(-0.4);
        ctx.strokeStyle = 'rgba(255,225,160,0.6)';
        ctx.lineWidth = Math.max(1, 2.2 * scale);
        ctx.beginPath();
        ctx.ellipse(0, 0, size * 2, size * 0.6, 0, 0, Math.PI);
        ctx.stroke();
        ctx.restore();
      }
      for (const m of p.moons) {
        drawBody(m.x, m.y, Math.max(1, m.def.size * scale), m.def.color, m.def.rgb);
      }
    }
  }

  function drawParticles() {
    if (!particles.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const q of particles) {
      const k = q.life / q.maxLife;
      const a = k * k;
      const r = q.size * (0.6 + k * 0.8);
      const c = q.c;
      ctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a * 0.25).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(q.x, q.y, r * 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(' + Math.min(255, c[0] + 60) + ',' + Math.min(255, c[1] + 60) + ',' + Math.min(255, c[2] + 60) + ',' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(q.x, q.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function render(realT) {
    ctx.fillStyle = '#060913';
    ctx.fillRect(0, 0, W, H);
    drawStars(realT);
    drawOrbits();
    drawStar(simTime);
    drawPlanets();
    drawParticles();
  }

  // ---------- Loop ----------
  function frame(ts) {
    if (lastTs === null) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (dt > 0.1) dt = 0.1; // clamp after tab switch
    if (dt < 0) dt = 0;

    fpsFrames++;
    fpsAccum += dt;
    if (fpsAccum >= 0.5) {
      fpsEl.textContent = Math.round(fpsFrames / fpsAccum);
      fpsFrames = 0;
      fpsAccum = 0;
    }

    if (running) update(dt);
    render(ts / 1000);

    timeEl.textContent = simTime.toFixed(1);
    partsEl.textContent = particles.length;
    requestAnimationFrame(frame);
  }

  // ---------- UI ----------
  function setRunning(v) {
    running = v;
    playBtn.textContent = running ? '⏸ Pause' : '▶ Play';
    playBtn.classList.toggle('on', running);
    playBtn.setAttribute('aria-pressed', String(running));
  }
  function setTrails(v) {
    trailsOn = v;
    trailBtn.textContent = trailsOn ? 'Trails ON' : 'Trails OFF';
    trailBtn.classList.toggle('on', trailsOn);
    trailBtn.setAttribute('aria-pressed', String(trailsOn));
  }
  function setSpeed(v) {
    speed = Math.min(3, Math.max(0.2, v));
    speedOut.textContent = speed.toFixed(1) + '×';
  }

  playBtn.addEventListener('click', function () { setRunning(!running); });
  trailBtn.addEventListener('click', function () { setTrails(!trailsOn); });
  resetBtn.addEventListener('click', function () {
    simTime = 0;
    particles = [];
    speedInput.value = '1.0';
    setSpeed(1.0);
    setRunning(true);
    setTrails(true);
    buildPlanets();
  });
  speedInput.addEventListener('input', function () { setSpeed(parseFloat(speedInput.value)); });

  canvas.addEventListener('pointerdown', function (e) {
    const rect = canvas.getBoundingClientRect();
    spawnBurst(e.clientX - rect.left, e.clientY - rect.top);
  });

  window.addEventListener('keydown', function (e) {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); setRunning(!running); }
    else if (e.key === 't' || e.key === 'T') setTrails(!trailsOn);
    else if (e.key === 'r' || e.key === 'R') resetBtn.click();
  });

  window.addEventListener('resize', resize);

  // ---------- Init ----------
  buildPlanets();
  resize();
  setSpeed(parseFloat(speedInput.value));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
