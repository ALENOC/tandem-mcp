<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Particle Simulation</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #060913;
  }
  #sim {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #060913;
  }
  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    background: rgba(255,255,255,0.08);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 16px;
    padding: 16px;
    color: #e6ecff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    min-width: 220px;
    user-select: none;
  }
  #hud h1 {
    margin: 0 0 10px 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    opacity: 0.9;
  }
  .row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  button {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 10px;
    color: #e6ecff;
    padding: 6px 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    transition: background 0.15s ease;
  }
  button:hover {
    background: rgba(255,255,255,0.2);
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .slider-row label {
    font-size: 12px;
    opacity: 0.85;
  }
  #speed {
    width: 120px;
    accent-color: #ffd76a;
  }
  #speed-val {
    font-size: 12px;
    min-width: 34px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .stats {
    display: flex;
    gap: 14px;
    font-size: 12px;
    opacity: 0.9;
    font-variant-numeric: tabular-nums;
  }
  .stats span {
    display: inline-block;
  }
  .hint {
    margin-top: 10px;
    font-size: 11px;
    opacity: 0.55;
  }
</style>
</head>
<body>
<canvas id="sim"></canvas>
<div id="hud">
  <h1>Orbital Simulation</h1>
  <div class="row">
    <button id="btn-play">Pause</button>
    <button id="btn-trails">Trails: ON</button>
    <button id="btn-reset">Reset</button>
  </div>
  <div class="slider-row">
    <label for="speed">Speed</label>
    <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
    <span id="speed-val">1.0x</span>
  </div>
  <div class="stats">
    <span id="fps">0 FPS</span>
    <span id="time">0.0 s</span>
    <span id="count">0</span>
  </div>
  <div class="hint">Click the canvas to spawn particles</div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('sim');
  var ctx = canvas.getContext('2d');

  var btnPlay = document.getElementById('btn-play');
  var btnTrails = document.getElementById('btn-trails');
  var btnReset = document.getElementById('btn-reset');
  var speedInput = document.getElementById('speed');
  var speedVal = document.getElementById('speed-val');
  var fpsEl = document.getElementById('fps');
  var timeEl = document.getElementById('time');
  var countEl = document.getElementById('count');

  var dpr = 1;
  var W = 0;
  var H = 0;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = '100vw';
    canvas.style.height = '100vh';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scaleRadii();
  }
  window.addEventListener('resize', resize);

  // ---- app state ----
  var app = {
    running: true,
    trails: true,
    speed: 1,
    time: 0,
    fps: 0,
    planets: [],
    moons: [],
    stars: [],
    particles: [],
    spawnBurst: spawnBurst
  };
  window.app = app;

  // ---- planets ----
  var planetDefs = [
    { name: 'Mercury', baseRadius: 70,  speed: 0.90, size: 4,  color: '#c9a27a' },
    { name: 'Venus',   baseRadius: 105, speed: 0.62, size: 6,  color: '#e8c07a' },
    { name: 'Earth',   baseRadius: 145, speed: 0.45, size: 7,  color: '#5aa9ff' },
    { name: 'Mars',    baseRadius: 185, speed: 0.34, size: 5,  color: '#ff7a59' },
    { name: 'Jupiter', baseRadius: 235, speed: 0.22, size: 12, color: '#e0a878' },
    { name: 'Saturn',  baseRadius: 290, speed: 0.15, size: 10, color: '#f0d9a0' }
  ];

  function buildPlanets() {
    app.planets = planetDefs.map(function (d) {
      return {
        name: d.name,
        radius: d.baseRadius,
        speed: d.speed,
        size: d.size,
        color: d.color,
        angle: Math.random() * Math.PI * 2,
        trail: []
      };
    });
  }

  // ---- moons ----
  var moonDefs = [
    { parent: 2, radius: 16, speed: 1.6, size: 2.5, color: '#cfd8ff' },
    { parent: 4, radius: 22, speed: 1.1, size: 3,   color: '#ffd9a0' },
    { parent: 5, radius: 26, speed: 0.9, size: 3,   color: '#e6ecff' }
  ];

  function buildMoons() {
    app.moons = moonDefs.map(function (d) {
      return {
        parent: d.parent,
        radius: d.radius,
        speed: d.speed,
        size: d.size,
        color: d.color,
        angle: Math.random() * Math.PI * 2
      };
    });
  }

  // ---- stars ----
  function buildStars() {
    app.stars = [];
    for (var i = 0; i < 220; i++) {
      app.stars.push({
        x: Math.random(),
        y: Math.random(),
        r: 0.4 + Math.random() * 1.4,
        phase: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.5 + Math.random() * 2.5
      });
    }
  }

  buildPlanets();
  buildMoons();
  buildStars();

  // ---- scale orbital radii to fit the viewport ----
  var BASE_MAX_RADIUS = 290;
  function scaleRadii() {
    var minDim = Math.min(W, H);
    var maxOrbit = minDim / 2 - 24;
    var scale = maxOrbit / BASE_MAX_RADIUS;
    if (scale < 0.4) scale = 0.4;
    if (scale > 1.6) scale = 1.6;
    for (var i = 0; i < app.planets.length; i++) {
      app.planets[i].radius = planetDefs[i].baseRadius * scale;
    }
  }
  resize();

  // ---- particles ----
  function spawnBurst(x, y) {
    for (var i = 0; i < 60; i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = 80 + Math.random() * 240;
      var life = 1.0 + Math.random() * 1.0;
      var hue = Math.floor(Math.random() * 360);
      app.particles.push({
        x: x,
        y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: life,
        maxLife: life,
        color: 'hsl(' + hue + ',100%,65%)',
        size: 1.5 + Math.random() * 2.5
      });
    }
  }

  // ---- controls ----
  function updatePlayBtn() {
    btnPlay.textContent = app.running ? 'Pause' : 'Play';
  }
  function updateTrailsBtn() {
    btnTrails.textContent = app.trails ? 'Trails: ON' : 'Trails: OFF';
  }

  btnPlay.addEventListener('click', function () {
    app.running = !app.running;
    updatePlayBtn();
  });

  btnTrails.addEventListener('click', function () {
    app.trails = !app.trails;
    if (!app.trails) {
      for (var i = 0; i < app.planets.length; i++) {
        app.planets[i].trail.length = 0;
      }
    }
    updateTrailsBtn();
  });

  btnReset.addEventListener('click', function () {
    app.time = 0;
    for (var i = 0; i < app.planets.length; i++) {
      app.planets[i].angle = planetDefs[i].angle0;
      app.planets[i].trail.length = 0;
    }
    for (var m = 0; m < app.moons.length; m++) {
      app.moons[m].angle = moonDefs[m].angle0;
    }
    app.particles.length = 0;
    app.speed = 1;
    speedInput.value = '1.0';
    speedVal.textContent = '1.0x';
    app.running = true;
    updatePlayBtn();
  });

  speedInput.addEventListener('input', function () {
    app.speed = parseFloat(speedInput.value);
    speedVal.textContent = app.speed.toFixed(1) + 'x';
  });

  // store initial angles for reset
  for (var pi = 0; pi < app.planets.length; pi++) {
    planetDefs[pi].angle0 = app.planets[pi].angle;
  }
  for (var mi = 0; mi < app.moons.length; mi++) {
    moonDefs[mi].angle0 = app.moons[mi].angle;
  }

  // ---- canvas click -> spawn ----
  canvas.addEventListener('mousedown', function (e) {
    var rect = canvas.getBoundingClientRect();
    spawnBurst(e.clientX - rect.left, e.clientY - rect.top);
  });

  // ---- drawing helpers ----
  function drawStar(cx, cy) {
    var t = app.time;
    var pulse = 1 + 0.06 * Math.sin(t * 2.0);
    var coreR = 26 * pulse;
    var coronaR = 90 * pulse;

    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.35, 'rgba(255,215,106,0.95)');
    g.addColorStop(0.7, 'rgba(255,154,60,0.55)');
    g.addColorStop(1, 'rgba(255,154,60,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
    ctx.fill();

    var cg = ctx.createRadialGradient(cx, cy, coreR * 0.5, cx, cy, coronaR);
    cg.addColorStop(0, 'rgba(255,180,90,0.35)');
    cg.addColorStop(1, 'rgba(255,154,60,0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(cx, cy, coronaR, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawStarfield() {
    var t = wallClock;
    for (var i = 0; i < app.stars.length; i++) {
      var s = app.stars[i];
      var alpha = 0.3 + 0.7 * Math.abs(Math.sin(t * s.twinkleSpeed + s.phase));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawOrbitCircles(cx, cy) {
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    for (var i = 0; i < app.planets.length; i++) {
      var p = app.planets[i];
      ctx.beginPath();
      ctx.arc(cx, cy, p.radius, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawTrails(cx, cy) {
    for (var i = 0; i < app.planets.length; i++) {
      var p = app.planets[i];
      var trail = p.trail;
      var n = trail.length;
      if (n < 2) continue;
      for (var j = 1; j < n; j++) {
        var a = (j / n) * 0.6;
        ctx.strokeStyle = p.color;
        ctx.globalAlpha = a;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(trail[j - 1].x, trail[j - 1].y);
        ctx.lineTo(trail[j].x, trail[j].y);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawPlanets(cx, cy) {
    for (var i = 0; i < app.planets.length; i++) {
      var p = app.planets[i];
      var x = cx + Math.cos(p.angle) * p.radius;
      var y = cy + Math.sin(p.angle) * p.radius;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(x, y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawMoons(cx, cy) {
    for (var i = 0; i < app.moons.length; i++) {
      var m = app.moons[i];
      var p = app.planets[m.parent];
      var px = cx + Math.cos(p.angle) * p.radius;
      var py = cy + Math.sin(p.angle) * p.radius;
      var x = px + Math.cos(m.angle) * m.radius;
      var y = py + Math.sin(m.angle) * m.radius;
      ctx.fillStyle = m.color;
      ctx.beginPath();
      ctx.arc(x, y, m.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawParticles() {
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < app.particles.length; i++) {
      var pt = app.particles[i];
      var alpha = pt.life / pt.maxLife;
      var g = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, pt.size * 3);
      g.addColorStop(0, pt.color);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = alpha;
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size * 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---- update ----
  function update(dt) {
    var cx = W / 2;
    var cy = H / 2;
    var sdt = dt * app.speed;

    for (var i = 0; i < app.planets.length; i++) {
      var p = app.planets[i];
      p.angle += p.speed * sdt;
      if (app.trails) {
        var x = cx + Math.cos(p.angle) * p.radius;
        var y = cy + Math.sin(p.angle) * p.radius;
        p.trail.push({ x: x, y: y });
        if (p.trail.length > 80) p.trail.shift();
      }
    }
    for (var m = 0; m < app.moons.length; m++) {
      app.moons[m].angle += app.moons[m].speed * sdt;
    }

    var damp = Math.pow(0.04, sdt);
    for (var k = app.particles.length - 1; k >= 0; k--) {
      var pt = app.particles[k];
      pt.vx *= damp;
      pt.vy *= damp;
      pt.x += pt.vx * sdt;
      pt.y += pt.vy * sdt;
      pt.life -= sdt;
      if (pt.life <= 0) {
        app.particles.splice(k, 1);
      }
    }
  }

  // ---- main loop ----
  var last = performance.now();
  var wallClock = 0;
  var fpsAccum = 0;
  var fpsFrames = 0;
  var fpsTimer = 0;

  function frame(now) {
    var rawDt = (now - last) / 1000;
    last = now;
    if (rawDt < 0) rawDt = 0;
    var dt = rawDt > 0.05 ? 0.05 : rawDt;
    wallClock += rawDt;

    // fps
    fpsFrames++;
    fpsTimer += rawDt;
    if (fpsTimer >= 0.5) {
      app.fps = Math.round(fpsFrames / fpsTimer);
      fpsFrames = 0;
      fpsTimer = 0;
    }

    if (app.running) {
      app.time += dt * app.speed;
      update(dt);
    }

    // draw
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#060913';
    ctx.fillRect(0, 0, W, H);

    var cx = W / 2;
    var cy = H / 2;

    drawStarfield();
    drawOrbitCircles(cx, cy);
    if (app.trails) drawTrails(cx, cy);
    drawStar(cx, cy);
    drawPlanets(cx, cy);
    drawMoons(cx, cy);
    drawParticles();

    // stats
    fpsEl.textContent = app.fps + ' FPS';
    timeEl.textContent = app.time.toFixed(1) + ' s';
    countEl.textContent = String(app.particles.length);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
