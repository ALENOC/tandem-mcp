<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boids – Simulazione di stormo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #070b14; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e6edf7; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #070b14; cursor: crosshair; }
  .glass {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    border-radius: 16px;
  }
  #hud { position: fixed; top: 16px; left: 16px; padding: 14px 18px; min-width: 200px; user-select: none; }
  #hud h1 { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #8fb4ff; margin-bottom: 10px; font-weight: 600; }
  .stat { display: flex; justify-content: space-between; gap: 18px; font-size: 14px; line-height: 1.8; }
  .stat span:first-child { color: #9aa7bd; }
  .stat span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  #state { margin-top: 8px; font-size: 12px; color: #ffcf6e; }
  #state.running { color: #6ee7a8; }
  #controls { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 24px); }
  button {
    font: inherit; font-size: 14px; font-weight: 600; color: #e6edf7; cursor: pointer;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 10px; padding: 8px 16px; min-width: 84px; transition: background .15s, transform .1s;
  }
  button:hover { background: rgba(255,255,255,0.16); }
  button:active { transform: scale(0.96); }
  button:focus-visible, input:focus-visible { outline: 2px solid #8fb4ff; outline-offset: 2px; }
  #playBtn { background: rgba(110, 160, 255, 0.28); border-color: rgba(143, 180, 255, 0.5); }
  label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #9aa7bd; padding-left: 6px; }
  input[type=range] { width: 140px; accent-color: #8fb4ff; cursor: pointer; }
  #speedVal { min-width: 40px; color: #e6edf7; font-weight: 600; font-variant-numeric: tabular-nums; }
  #hint { position: fixed; top: 16px; right: 16px; padding: 10px 14px; font-size: 12px; color: #9aa7bd; user-select: none; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="hud" class="glass" aria-live="polite">
  <h1>Boids</h1>
  <div class="stat"><span>FPS</span><span id="fps">0</span></div>
  <div class="stat"><span>Boids</span><span id="count">0</span></div>
  <div class="stat"><span>Velocità</span><span id="speedHud">1.0×</span></div>
  <div id="state">In pausa</div>
</div>

<div id="hint" class="glass">Clicca sul canvas per aggiungere un boid</div>

<div id="controls" class="glass">
  <button id="playBtn" type="button">Play</button>
  <button id="stepBtn" type="button">Step</button>
  <button id="resetBtn" type="button">Reset</button>
  <label for="speed">Velocità
    <input id="speed" type="range" min="0.5" max="3.0" step="0.1" value="1.0">
    <span id="speedVal">1.0×</span>
  </label>
</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var fpsEl = document.getElementById('fps');
  var countEl = document.getElementById('count');
  var speedHudEl = document.getElementById('speedHud');
  var stateEl = document.getElementById('state');
  var playBtn = document.getElementById('playBtn');
  var stepBtn = document.getElementById('stepBtn');
  var resetBtn = document.getElementById('resetBtn');
  var speedInput = document.getElementById('speed');
  var speedVal = document.getElementById('speedVal');

  var INITIAL_COUNT = 60;
  var MAX_SPEED = 2.6;
  var MIN_SPEED = 1.0;
  var MAX_FORCE = 0.06;
  var PERCEPTION = 60;
  var SEPARATION_DIST = 24;
  var W_SEP = 1.6, W_ALI = 1.0, W_COH = 0.8;
  var MAX_BOIDS = 600;

  var width = 0, height = 0, dpr = 1;
  var boids = [];
  var running = false;
  var speed = 1.0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!running) draw();
  }

  function createBoid(x, y) {
    var a = Math.random() * Math.PI * 2;
    var s = MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED);
    return {
      x: x, y: y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      hue: 195 + Math.random() * 50
    };
  }

  function reset() {
    boids = [];
    for (var i = 0; i < INITIAL_COUNT; i++) {
      boids.push(createBoid(
        width * 0.1 + Math.random() * width * 0.8,
        height * 0.1 + Math.random() * height * 0.8
      ));
    }
    updateHud();
    draw();
  }

  function limit(vx, vy, max) {
    var m = Math.hypot(vx, vy);
    if (m > max && m > 0) { return [vx / m * max, vy / m * max]; }
    return [vx, vy];
  }

  function steer(tx, ty, b) {
    var m = Math.hypot(tx, ty);
    if (m === 0) return [0, 0];
    var dx = tx / m * MAX_SPEED - b.vx;
    var dy = ty / m * MAX_SPEED - b.vy;
    return limit(dx, dy, MAX_FORCE);
  }

  function update(dt) {
    var n = boids.length;
    var p2 = PERCEPTION * PERCEPTION;
    var s2 = SEPARATION_DIST * SEPARATION_DIST;
    var acc = new Array(n);

    for (var i = 0; i < n; i++) {
      var b = boids[i];
      var aliX = 0, aliY = 0, cohX = 0, cohY = 0, sepX = 0, sepY = 0;
      var count = 0, sepCount = 0;
      for (var j = 0; j < n; j++) {
        if (i === j) continue;
        var o = boids[j];
        var dx = o.x - b.x, dy = o.y - b.y;
        // wrap-aware distance
        if (dx > width / 2) dx -= width; else if (dx < -width / 2) dx += width;
        if (dy > height / 2) dy -= height; else if (dy < -height / 2) dy += height;
        var d2 = dx * dx + dy * dy;
        if (d2 < p2) {
          aliX += o.vx; aliY += o.vy;
          cohX += dx; cohY += dy;
          count++;
          if (d2 < s2 && d2 > 0) {
            sepX -= dx / d2; sepY -= dy / d2;
            sepCount++;
          }
        }
      }
      var ax = 0, ay = 0, f;
      if (count > 0) {
        f = steer(aliX / count, aliY / count, b);
        ax += f[0] * W_ALI; ay += f[1] * W_ALI;
        f = steer(cohX / count, cohY / count, b);
        ax += f[0] * W_COH; ay += f[1] * W_COH;
      }
      if (sepCount > 0) {
        f = steer(sepX, sepY, b);
        ax += f[0] * W_SEP; ay += f[1] * W_SEP;
      }
      acc[i] = [ax, ay];
    }

    for (var k = 0; k < n; k++) {
      var bk = boids[k];
      bk.vx += acc[k][0] * dt;
      bk.vy += acc[k][1] * dt;
      var v = limit(bk.vx, bk.vy, MAX_SPEED);
      bk.vx = v[0]; bk.vy = v[1];
      var m = Math.hypot(bk.vx, bk.vy);
      if (m < MIN_SPEED) {
        if (m === 0) { bk.vx = MIN_SPEED; bk.vy = 0; }
        else { bk.vx = bk.vx / m * MIN_SPEED; bk.vy = bk.vy / m * MIN_SPEED; }
      }
      bk.x += bk.vx * dt;
      bk.y += bk.vy * dt;
      if (bk.x < 0) bk.x += width; else if (bk.x >= width) bk.x -= width;
      if (bk.y < 0) bk.y += height; else if (bk.y >= height) bk.y -= height;
    }
  }

  function draw() {
    ctx.fillStyle = '#070b14';
    ctx.fillRect(0, 0, width, height);
    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      var ang = Math.atan2(b.vy, b.vx);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(9, 0);
      ctx.lineTo(-6, 4.5);
      ctx.lineTo(-3.5, 0);
      ctx.lineTo(-6, -4.5);
      ctx.closePath();
      ctx.fillStyle = 'hsl(' + b.hue.toFixed(0) + ', 85%, 66%)';
      ctx.shadowColor = 'hsla(' + b.hue.toFixed(0) + ', 90%, 60%, 0.7)';
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.restore();
    }
  }

  function updateHud() {
    countEl.textContent = String(boids.length);
    speedHudEl.textContent = speed.toFixed(1) + '×';
    speedVal.textContent = speed.toFixed(1) + '×';
    stateEl.textContent = running ? 'In esecuzione' : 'In pausa';
    stateEl.className = running ? 'running' : '';
    playBtn.textContent = running ? 'Pause' : 'Play';
    playBtn.setAttribute('aria-pressed', running ? 'true' : 'false');
  }

  // Main loop: always renders (for FPS), simulates only when running
  var lastTime = performance.now();
  var fpsFrames = 0, fpsTime = 0;
  function frame(now) {
    var elapsed = now - lastTime;
    lastTime = now;
    if (elapsed > 100) elapsed = 100;
    fpsFrames++;
    fpsTime += elapsed;
    if (fpsTime >= 500) {
      fpsEl.textContent = String(Math.round(fpsFrames * 1000 / fpsTime));
      fpsFrames = 0; fpsTime = 0;
    }
    if (running) {
      var dt = (elapsed / 16.667) * speed;
      // substeps to keep the simulation stable at high speed
      var steps = Math.max(1, Math.ceil(dt));
      for (var s = 0; s < steps; s++) update(dt / steps);
    }
    draw();
    requestAnimationFrame(frame);
  }

  playBtn.addEventListener('click', function () {
    running = !running;
    updateHud();
  });

  stepBtn.addEventListener('click', function () {
    if (running) { running = false; }
    update(speed);
    draw();
    updateHud();
  });

  resetBtn.addEventListener('click', function () {
    running = false;
    reset();
    updateHud();
  });

  speedInput.addEventListener('input', function () {
    var v = parseFloat(speedInput.value);
    if (!isFinite(v)) v = 1;
    speed = Math.min(3, Math.max(0.5, v));
    updateHud();
  });

  canvas.addEventListener('click', function (e) {
    if (boids.length >= MAX_BOIDS) return;
    var rect = canvas.getBoundingClientRect();
    boids.push(createBoid(e.clientX - rect.left, e.clientY - rect.top));
    updateHud();
    draw();
  });

  window.addEventListener('resize', resize);

  resize();
  reset();
  updateHud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
