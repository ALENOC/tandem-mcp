<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Portal 3D</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #1a0f3d 0%, #0a0820 45%, #03020a 100%);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #e8f4ff;
  }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: grab; }
  #c.drag { cursor: grabbing; }
  .hud {
    position: fixed; top: 18px; left: 18px; min-width: 230px;
    padding: 16px 18px 14px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(160, 220, 255, 0.22);
    border-radius: 16px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    user-select: none;
  }
  .hud h1 {
    margin: 0 0 10px; font-size: 17px; letter-spacing: 3px; font-weight: 800;
    background: linear-gradient(90deg, #00f0ff, #ff3df2);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.5));
  }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .stat {
    background: rgba(0, 0, 0, 0.25); border-radius: 8px; padding: 6px 4px; text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .stat .k { font-size: 9px; letter-spacing: 1.5px; opacity: 0.6; }
  .stat .v { font-size: 15px; font-weight: 700; color: #7ff9ff; font-variant-numeric: tabular-nums; }
  .btns { display: flex; gap: 6px; margin-bottom: 12px; }
  .btns button {
    flex: 1; padding: 7px 6px; font-size: 12px; font-weight: 600; color: #e8f4ff; cursor: pointer;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(160, 220, 255, 0.25);
    border-radius: 8px; transition: background 0.15s, box-shadow 0.15s;
  }
  .btns button:hover { background: rgba(0, 240, 255, 0.18); box-shadow: 0 0 10px rgba(0, 240, 255, 0.35); }
  .btns button.on { border-color: rgba(0, 240, 255, 0.7); color: #7ff9ff; }
  .slider { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 1px; }
  .slider span:first-child { opacity: 0.7; }
  .slider input { flex: 1; accent-color: #ff3df2; }
  .slider #spdv { width: 34px; text-align: right; color: #ff9cf8; font-variant-numeric: tabular-nums; }
  .hint { margin-top: 8px; font-size: 10px; opacity: 0.45; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <h1>NEON PORTAL 3D</h1>
  <div class="stats">
    <div class="stat"><div class="k">FPS</div><div class="v" id="fps">0</div></div>
    <div class="stat"><div class="k">POLYS</div><div class="v" id="polys">0</div></div>
    <div class="stat"><div class="k">PARTS</div><div class="v" id="parts">0</div></div>
  </div>
  <div class="btns">
    <button id="pause">Pause</button>
    <button id="orbit" class="on">Orbit ON</button>
    <button id="reset">Reset</button>
  </div>
  <div class="slider">
    <span>SPEED</span>
    <input id="speed" type="range" min="0" max="3" step="0.05" value="1">
    <span id="spdv">1.00x</span>
  </div>
  <div class="hint">Drag to rotate · wheel to zoom</div>
</div>

<script>
(() => {
  'use strict';

  // ---------- Canvas ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1, FOCAL = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    FOCAL = Math.min(W, H) * 1.05;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Vector math ----------
  const v3 = (x, y, z) => ({ x, y, z });
  const sub = (a, b) => v3(a.x - b.x, a.y - b.y, a.z - b.z);
  const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
  const cross = (a, b) => v3(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
  const norm = (a) => { const l = Math.hypot(a.x, a.y, a.z) || 1; return v3(a.x / l, a.y / l, a.z / l); };

  // ---------- Camera ----------
  const NEAR = 0.1;
  const cam = { yaw: 0.6, pitch: 0.28, dist: 12, target: v3(0, 2.4, 0), pos: v3(0, 0, 0), r: null, u: null, f: null };

  function updateCamera() {
    const cp = Math.cos(cam.pitch);
    cam.pos = v3(
      cam.target.x + cam.dist * cp * Math.sin(cam.yaw),
      cam.target.y + cam.dist * Math.sin(cam.pitch),
      cam.target.z + cam.dist * cp * Math.cos(cam.yaw)
    );
    cam.f = norm(sub(cam.target, cam.pos));
    cam.r = norm(cross(cam.f, v3(0, 1, 0)));
    cam.u = cross(cam.r, cam.f);
  }

  // world -> camera space
  function toCam(p) {
    const d = sub(p, cam.pos);
    return v3(dot(d, cam.r), dot(d, cam.u), dot(d, cam.f));
  }
  // camera space -> screen
  function proj(c) {
    const s = FOCAL / c.z;
    return { x: W * 0.5 + c.x * s, y: H * 0.5 - c.y * s, z: c.z, s };
  }

  // ---------- Scene geometry ----------
  // Light direction (towards light)
  const LIGHT = norm(v3(-0.4, 0.9, 0.5));

  // Boxes: 6 boxes x 6 faces = 36 faces
  // hue for neon edge color
  const boxes = [
    { c: v3(0, 0.25, 0),  s: v3(6.0, 0.5, 4.0), hue: 280, name: 'tier1' },
    { c: v3(0, 0.70, 0),  s: v3(4.4, 0.4, 2.8), hue: 255, name: 'tier2' },
    { c: v3(-1.6, 2.65, 0), s: v3(0.5, 3.5, 0.5), hue: 190, name: 'pillarL' },
    { c: v3(1.6, 2.65, 0),  s: v3(0.5, 3.5, 0.5), hue: 190, name: 'pillarR' },
    { c: v3(0, 4.65, 0),  s: v3(4.2, 0.5, 0.7), hue: 300, name: 'lintel' },
    { c: v3(0, 5.10, 0),  s: v3(1.6, 0.4, 0.5), hue: 320, name: 'crown' },
  ];

  const boxFaces = [];
  for (const b of boxes) {
    const hx = b.s.x / 2, hy = b.s.y / 2, hz = b.s.z / 2;
    const V = (sx, sy, sz) => v3(b.c.x + sx * hx, b.c.y + sy * hy, b.c.z + sz * hz);
    const defs = [
      { n: v3(1, 0, 0),  v: [V(1, -1, -1), V(1, 1, -1), V(1, 1, 1), V(1, -1, 1)] },
      { n: v3(-1, 0, 0), v: [V(-1, -1, 1), V(-1, 1, 1), V(-1, 1, -1), V(-1, -1, -1)] },
      { n: v3(0, 1, 0),  v: [V(-1, 1, -1), V(-1, 1, 1), V(1, 1, 1), V(1, 1, -1)] },
      { n: v3(0, -1, 0), v: [V(-1, -1, 1), V(-1, -1, -1), V(1, -1, -1), V(1, -1, 1)] },
      { n: v3(0, 0, 1),  v: [V(-1, -1, 1), V(1, -1, 1), V(1, 1, 1), V(-1, 1, 1)] },
      { n: v3(0, 0, -1), v: [V(1, -1, -1), V(-1, -1, -1), V(-1, 1, -1), V(1, 1, -1)] },
    ];
    for (const d of defs) {
      const c = v3(
        (d.v[0].x + d.v[2].x) / 2, (d.v[0].y + d.v[2].y) / 2, (d.v[0].z + d.v[2].z) / 2
      );
      boxFaces.push({ verts: d.v, n: d.n, center: c, hue: b.hue });
    }
  }

  // Crystals: 6 octahedra x 8 = 48 triangles
  const PORTAL_C = v3(0, 2.65, 0);
  const crystals = [];
  for (let i = 0; i < 6; i++) {
    crystals.push({
      phase: (i / 6) * Math.PI * 2,
      radius: 3.3,
      yOff: 0,
      bob: Math.random() * Math.PI * 2,
      spin: Math.random() * Math.PI * 2,
      spinSpeed: 1.2 + Math.random() * 0.8,
      hue: [185, 300, 55, 140, 330, 210][i],
    });
  }
  const OCTA_V = [v3(0, 1, 0), v3(0, -1, 0), v3(1, 0, 0), v3(-1, 0, 0), v3(0, 0, 1), v3(0, 0, -1)];
  const OCTA_F = [
    [0, 2, 4], [0, 4, 3], [0, 3, 5], [0, 5, 2],
    [1, 4, 2], [1, 3, 4], [1, 5, 3], [1, 2, 5],
  ];

  // Portal rings
  const RING_SEG = 48;

  // Stars: 180
  const STAR_COUNT = 180;
  const stars = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    // random direction biased to upper hemisphere
    const th = Math.random() * Math.PI * 2;
    const y = Math.random() * 1.15 - 0.25;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    stars.push({
      d: v3(Math.cos(th) * r, y, Math.sin(th) * r),
      size: Math.random() * 1.4 + 0.4,
      tw: Math.random() * Math.PI * 2,
      twSpeed: 1 + Math.random() * 3,
      hue: Math.random() < 0.25 ? 300 : (Math.random() < 0.5 ? 190 : 230),
    });
  }

  // Particles: 110
  const PART_COUNT = 110;
  const parts = [];
  function spawnPart(p, initial) {
    const a = Math.random() * Math.PI * 2;
    const r = 0.3 + Math.random() * 2.8;
    p.x = Math.cos(a) * r;
    p.z = Math.sin(a) * r * 0.75;
    p.y = initial ? 0.9 + Math.random() * 6 : 0.9 + Math.random() * 0.3;
    p.vy = 0.5 + Math.random() * 1.1;
    p.drift = Math.random() * Math.PI * 2;
    p.life = 6.5 + Math.random() * 1.5;
    p.size = 0.03 + Math.random() * 0.05;
    p.hue = Math.random() < 0.5 ? 185 + Math.random() * 20 : 290 + Math.random() * 30;
    return p;
  }
  for (let i = 0; i < PART_COUNT; i++) parts.push(spawnPart({}, true));

  // ---------- State ----------
  const state = { t: 0, paused: false, orbit: true, speed: 1 };
  const DEFAULTS = { yaw: 0.6, pitch: 0.28, dist: 12 };

  // ---------- Rendering helpers ----------
  function clipLine(a, b) {
    // a,b in camera space; clip against near plane
    if (a.z < NEAR && b.z < NEAR) return null;
    if (a.z < NEAR) { const t = (NEAR - a.z) / (b.z - a.z); a = v3(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, NEAR); }
    else if (b.z < NEAR) { const t = (NEAR - b.z) / (a.z - b.z); b = v3(b.x + (a.x - b.x) * t, b.y + (a.y - b.y) * t, NEAR); }
    return [a, b];
  }

  function drawBackground() {
    ctx.clearRect(0, 0, W, H);
    const g = ctx.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.45, Math.max(W, H) * 0.75);
    g.addColorStop(0, '#1c1145');
    g.addColorStop(0.45, '#0b0824');
    g.addColorStop(1, '#020108');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawStars(t) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const s of stars) {
      // stars at infinity: only rotation matters
      const cz = dot(s.d, cam.f);
      if (cz <= 0.05) continue;
      const cx = dot(s.d, cam.r), cy = dot(s.d, cam.u);
      const sx = W * 0.5 + (cx / cz) * FOCAL;
      const sy = H * 0.5 - (cy / cz) * FOCAL;
      if (sx < -5 || sx > W + 5 || sy < -5 || sy > H + 5) continue;
      const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.twSpeed + s.tw));
      ctx.fillStyle = `hsla(${s.hue}, 80%, 85%, ${tw})`;
      ctx.beginPath();
      ctx.arc(sx, sy, s.size * (0.7 + tw * 0.5), 0, Math.PI * 2);
      ctx.fill();
      if (s.size > 1.4) {
        ctx.fillStyle = `hsla(${s.hue}, 90%, 70%, ${tw * 0.18})`;
        ctx.beginPath();
        ctx.arc(sx, sy, s.size * 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawGrid(t) {
    const EXT = 16, STEP = 1;
    const scroll = (t * 0.6) % STEP;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 1;
    const line = (a, b, hue, baseA) => {
      const ca = toCam(a), cb = toCam(b);
      const cl = clipLine(ca, cb);
      if (!cl) return;
      const pa = proj(cl[0]), pb = proj(cl[1]);
      const mid = (cl[0].z + cl[1].z) * 0.5;
      const fade = Math.max(0, Math.min(1, 1 - mid / 30));
      ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${baseA * fade})`;
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.stroke();
    };
    // Lines split into segments for nicer distance fade
    const SEGS = 8;
    for (let i = -EXT; i <= EXT; i += STEP) {
      for (let k = 0; k < SEGS; k++) {
        const a0 = -EXT + (2 * EXT * k) / SEGS, a1 = -EXT + (2 * EXT * (k + 1)) / SEGS;
        // lines along X (scroll along z)
        const z = i + scroll;
        if (z <= EXT) line(v3(a0, 0, z), v3(a1, 0, z), 300, 0.32);
        line(v3(i, 0, a0), v3(i, 0, a1), 190, 0.32);
      }
    }
    ctx.restore();

    // floor glow under platform
    const c = toCam(v3(0, 0, 0));
    if (c.z > NEAR) {
      const p = proj(c);
      const r = 7 * p.s;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(p.x, p.y);
      ctx.scale(1, Math.max(0.15, Math.abs(Math.sin(cam.pitch)) * 1.2));
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
      g.addColorStop(0, 'rgba(255, 60, 240, 0.28)');
      g.addColorStop(0.5, 'rgba(0, 200, 255, 0.08)');
      g.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  // ---------- Frame build ----------
  let polyCount = 0;

  function buildDrawList(t) {
    const list = [];
    polyCount = 0;

    // Box faces
    for (const f of boxFaces) {
      const toFace = sub(f.center, cam.pos);
      if (dot(f.n, toFace) >= 0) continue; // backface cull
      const cv = f.verts.map(toCam);
      if (cv.some(c => c.z < NEAR)) continue;
      const pv = cv.map(proj);
      const depth = (cv[0].z + cv[1].z + cv[2].z + cv[3].z) / 4;
      const light = Math.max(0, dot(f.n, LIGHT));
      // portal glow on faces facing portal
      const toPortal = norm(sub(PORTAL_C, f.center));
      const glow = Math.max(0, dot(f.n, toPortal)) * 0.5;
      list.push({ type: 'face', pv, depth, light, glow, hue: f.hue });
      polyCount++;
    }

    // Crystals
    for (const c of crystals) {
      const ang = c.phase + t * 0.45;
      const cy = PORTAL_C.y + Math.sin(t * 1.3 + c.bob) * 0.35;
      const center = v3(Math.cos(ang) * c.radius, cy, Math.sin(ang) * c.radius * 0.8);
      const sp = c.spin + t * c.spinSpeed;
      const cs = Math.cos(sp), sn = Math.sin(sp);
      const wv = OCTA_V.map(v => {
        const x = v.x * 0.26, y = v.y * 0.46, z = v.z * 0.26;
        return v3(center.x + x * cs - z * sn, center.y + y, center.z + x * sn + z * cs);
      });
      const cvAll = wv.map(toCam);
      if (cvAll.some(q => q.z < NEAR)) continue;
      const pvAll = cvAll.map(proj);
      // glow halo item
      const cc = toCam(center);
      list.push({ type: 'halo', p: proj(cc), depth: cc.z + 0.6, hue: c.hue, r: 0.9 });
      for (const tri of OCTA_F) {
        const a = wv[tri[0]], b = wv[tri[1]], d = wv[tri[2]];
        let n = norm(cross(sub(b, a), sub(d, a)));
        const tc = v3((a.x + b.x + d.x) / 3, (a.y + b.y + d.y) / 3, (a.z + b.z + d.z) / 3);
        if (dot(n, sub(tc, center)) < 0) n = v3(-n.x, -n.y, -n.z);
        if (dot(n, sub(tc, cam.pos)) >= 0) continue;
        const depth = (cvAll[tri[0]].z + cvAll[tri[1]].z + cvAll[tri[2]].z) / 3;
        const light = Math.max(0, dot(n, LIGHT));
        list.push({ type: 'crystal', pv: [pvAll[tri[0]], pvAll[tri[1]], pvAll[tri[2]]], depth, light, hue: c.hue });
        polyCount++;
      }
    }

    // Portal core disc
    {
      const cc = toCam(PORTAL_C);
      if (cc.z > NEAR) {
        const pts = [];
        let ok = true;
        for (let i = 0; i < 40; i++) {
          const a = (i / 40) * Math.PI * 2;
          const q = toCam(v3(PORTAL_C.x + Math.cos(a) * 1.05, PORTAL_C.y + Math.sin(a) * 1.05, PORTAL_C.z));
          if (q.z < NEAR) { ok = false; break; }
          pts.push(proj(q));
        }
        if (ok) { list.push({ type: 'core', pts, p: proj(cc), depth: cc.z + 0.05 }); polyCount++; }
      }
    }

    // Rings: outer (spins +), inner (spins -), each as segmented quads
    const rings = [
      { r0: 1.12, r1: 1.24, rot: t * 0.9, tilt: 0, hue: 185, dz: 0.06 },
      { r0: 0.86, r1: 0.96, rot: -t * 1.4, tilt: 0, hue: 305, dz: -0.06 },
    ];
    for (const R of rings) {
      for (let i = 0; i < RING_SEG; i++) {
        const a0 = (i / RING_SEG) * Math.PI * 2 + R.rot;
        const a1 = ((i + 1) / RING_SEG) * Math.PI * 2 + R.rot;
        const mk = (a, r) => v3(PORTAL_C.x + Math.cos(a) * r, PORTAL_C.y + Math.sin(a) * r, PORTAL_C.z + R.dz);
        const wv = [mk(a0, R.r0), mk(a0, R.r1), mk(a1, R.r1), mk(a1, R.r0)];
        const cv = wv.map(toCam);
        if (cv.some(c => c.z < NEAR)) continue;
        const depth = (cv[0].z + cv[1].z + cv[2].z + cv[3].z) / 4;
        // dashed brightness pattern makes rotation visible
        const bright = (i % 6 < 4) ? 1 : 0.25;
        list.push({ type: 'ring', pv: cv.map(proj), depth, hue: R.hue + (i % 12) * 2, bright });
        polyCount++;
      }
    }

    // Particles
    for (const p of parts) {
      const wx = p.x + Math.sin(t * 0.8 + p.drift) * 0.15;
      const wz = p.z + Math.cos(t * 0.7 + p.drift) * 0.15;
      const c = toCam(v3(wx, p.y, wz));
      if (c.z < NEAR) continue;
      const life = Math.min(1, (p.y - 0.9) / 0.8) * Math.max(0, 1 - (p.y - 0.9) / p.life);
      list.push({ type: 'part', p: proj(c), depth: c.z, hue: p.hue, size: p.size, a: life });
    }

    list.sort((a, b) => b.depth - a.depth);
    return list;
  }

  function polyPath(pv) {
    ctx.beginPath();
    ctx.moveTo(pv[0].x, pv[0].y);
    for (let i = 1; i < pv.length; i++) ctx.lineTo(pv[i].x, pv[i].y);
    ctx.closePath();
  }

  function drawItem(it, t) {
    switch (it.type) {
      case 'face': {
        const l = 7 + it.light * 16 + it.glow * 14;
        polyPath(it.pv);
        ctx.fillStyle = `hsl(${it.hue}, 45%, ${l}%)`;
        ctx.fill();
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = `hsla(${it.hue}, 100%, 60%, 0.25)`;
        ctx.lineWidth = 5;
        ctx.stroke();
        ctx.strokeStyle = `hsla(${it.hue}, 100%, 72%, 0.95)`;
        ctx.lineWidth = 1.3;
        ctx.stroke();
        ctx.restore();
        break;
      }
      case 'crystal': {
        const l = 30 + it.light * 40;
        polyPath(it.pv);
        ctx.fillStyle = `hsla(${it.hue}, 95%, ${l}%, 0.88)`;
        ctx.fill();
        ctx.strokeStyle = `hsla(${it.hue}, 100%, 85%, 0.9)`;
        ctx.lineWidth = 1;
        ctx.stroke();
        break;
      }
      case 'halo': {
        const r = it.r * it.p.s;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(it.p.x, it.p.y, 0, it.p.x, it.p.y, r);
        g.addColorStop(0, `hsla(${it.hue}, 100%, 60%, 0.35)`);
        g.addColorStop(1, `hsla(${it.hue}, 100%, 50%, 0)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(it.p.x, it.p.y, r, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        break;
      }
      case 'core': {
        const p = it.p;
        const R = 1.05 * p.s;
        ctx.save();
        polyPath(it.pts);
        ctx.clip();
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
        const pulse = 0.5 + 0.5 * Math.sin(t * 3);
        g.addColorStop(0, `rgba(255, 255, 255, ${0.85 + pulse * 0.15})`);
        g.addColorStop(0.18, 'rgba(120, 250, 255, 0.95)');
        g.addColorStop(0.55, 'rgba(140, 40, 255, 0.85)');
        g.addColorStop(1, 'rgba(255, 40, 200, 0.75)');
        ctx.fillStyle = g;
        ctx.fillRect(p.x - R * 1.5, p.y - R * 1.5, R * 3, R * 3);
        // swirl arms
        ctx.globalCompositeOperation = 'lighter';
        ctx.lineWidth = Math.max(1, R * 0.05);
        for (let k = 0; k < 4; k++) {
          ctx.beginPath();
          for (let j = 0; j <= 30; j++) {
            const f = j / 30;
            const a = t * 2.2 + k * Math.PI / 2 + f * 4.2;
            const rr = f * R;
            const x = p.x + Math.cos(a) * rr, y = p.y + Math.sin(a) * rr;
            j ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
          }
          ctx.strokeStyle = `rgba(200, 255, 255, ${0.25 + 0.15 * Math.sin(t * 2 + k)})`;
          ctx.stroke();
        }
        ctx.restore();
        // outer bloom
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const g2 = ctx.createRadialGradient(p.x, p.y, R * 0.6, p.x, p.y, R * 2.4);
        g2.addColorStop(0, `rgba(160, 80, 255, ${0.28 + pulse * 0.1})`);
        g2.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = g2;
        ctx.beginPath(); ctx.arc(p.x, p.y, R * 2.4, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        break;
      }
      case 'ring': {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        polyPath(it.pv);
        ctx.fillStyle = `hsla(${it.hue}, 100%, ${45 + it.bright * 25}%, ${0.35 + it.bright * 0.6})`;
        ctx.fill();
        ctx.strokeStyle = `hsla(${it.hue}, 100%, 70%, ${0.2 * it.bright})`;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
        break;
      }
      case 'part': {
        if (it.a <= 0.01) break;
        const r = Math.max(0.6, it.size * it.p.s);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(it.p.x, it.p.y, 0, it.p.x, it.p.y, r * 3);
        g.addColorStop(0, `hsla(${it.hue}, 100%, 85%, ${it.a})`);
        g.addColorStop(0.3, `hsla(${it.hue}, 100%, 60%, ${it.a * 0.5})`);
        g.addColorStop(1, `hsla(${it.hue}, 100%, 50%, 0)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(it.p.x, it.p.y, r * 3, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        break;
      }
    }
  }

  // ---------- Update ----------
  function update(dt) {
    state.t += dt;
    if (state.orbit) cam.yaw += dt * 0.22;
    for (const p of parts) {
      p.y += p.vy * dt;
      if (p.y > 0.9 + p.life) spawnPart(p, false);
    }
  }

  // ---------- HUD ----------
  const $ = (id) => document.getElementById(id);
  const fpsEl = $('fps'), polysEl = $('polys'), partsEl = $('parts');
  const pauseBtn = $('pause'), orbitBtn = $('orbit'), resetBtn = $('reset');
  const speedEl = $('speed'), spdv = $('spdv');

  pauseBtn.addEventListener('click', () => {
    state.paused = !state.paused;
    pauseBtn.textContent = state.paused ? 'Play' : 'Pause';
    pauseBtn.classList.toggle('on', state.paused);
  });
  orbitBtn.addEventListener('click', () => {
    state.orbit = !state.orbit;
    orbitBtn.textContent = state.orbit ? 'Orbit ON' : 'Orbit OFF';
    orbitBtn.classList.toggle('on', state.orbit);
  });
  resetBtn.addEventListener('click', () => {
    cam.yaw = DEFAULTS.yaw; cam.pitch = DEFAULTS.pitch; cam.dist = DEFAULTS.dist;
    state.t = 0; state.speed = 1; speedEl.value = 1; spdv.textContent = '1.00x';
    for (const p of parts) spawnPart(p, true);
  });
  speedEl.addEventListener('input', () => {
    state.speed = parseFloat(speedEl.value);
    spdv.textContent = state.speed.toFixed(2) + 'x';
  });

  // Mouse / touch orbit
  let dragging = false, lx = 0, ly = 0;
  canvas.addEventListener('pointerdown', (e) => {
    dragging = true; lx = e.clientX; ly = e.clientY;
    canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    cam.yaw -= (e.clientX - lx) * 0.006;
    cam.pitch = Math.max(-0.05, Math.min(1.2, cam.pitch + (e.clientY - ly) * 0.005));
    lx = e.clientX; ly = e.clientY;
  });
  const endDrag = () => { dragging = false; canvas.classList.remove('drag'); };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    cam.dist = Math.max(6, Math.min(24, cam.dist * (1 + Math.sign(e.deltaY) * 0.08)));
  }, { passive: false });

  // ---------- Main loop ----------
  let last = performance.now(), fpsAcc = 0, fpsFrames = 0;
  function frame(now) {
    const rawDt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!state.paused) update(rawDt * state.speed);

    updateCamera();
    const t = state.t;
    drawBackground();
    drawStars(t);
    drawGrid(t);
    const list = buildDrawList(t);
    for (const it of list) drawItem(it, t);

    fpsAcc += now - (frame.prev || now); frame.prev = now; fpsFrames++;
    if (fpsAcc >= 500) {
      fpsEl.textContent = Math.round((fpsFrames * 1000) / fpsAcc);
      fpsAcc = 0; fpsFrames = 0;
    }
    polysEl.textContent = polyCount;
    partsEl.textContent = PART_COUNT;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
