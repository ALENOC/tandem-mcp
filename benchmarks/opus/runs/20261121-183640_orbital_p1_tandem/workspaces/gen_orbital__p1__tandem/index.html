<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Particle Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #060913;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e8ecff;
  }
  #sim {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    background: #060913;
    cursor: crosshair;
  }
  #hud {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 10;
    min-width: 232px;
    padding: 16px 18px;
    background: rgba(18, 24, 48, 0.35);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    user-select: none;
  }
  #hud h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.75);
    margin-bottom: 12px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 8px 0;
    font-size: 13px;
  }
  .stat {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    font-variant-numeric: tabular-nums;
  }
  .stat span:last-child {
    color: #9fd0ff;
    font-weight: 600;
  }
  .btns {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  button {
    flex: 1;
    padding: 8px 10px;
    font-size: 12px;
    font-weight: 600;
    color: #eaf0ff;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  button:hover { background: rgba(255, 255, 255, 0.16); }
  button:active { transform: translateY(1px); }
  .slider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
  }
  .slider label { font-size: 12px; color: rgba(255,255,255,0.7); }
  #speed {
    flex: 1;
    accent-color: #6ea8ff;
    cursor: pointer;
  }
  #speedVal {
    min-width: 34px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: #9fd0ff;
    font-weight: 600;
  }
  .hint {
    margin-top: 10px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.45);
  }
</style>
</head>
<body>
  <canvas id="sim"></canvas>
  <div id="hud">
    <h1>Orbital Sim</h1>
    <div class="row stat"><span>FPS</span><span id="fps">0</span></div>
    <div class="row stat"><span>Time</span><span id="time">0.0s</span></div>
    <div class="row stat"><span>Particles</span><span id="count">0</span></div>
    <div class="btns">
      <button id="playBtn">Pause</button>
      <button id="trailsBtn">Trails: ON</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div class="slider">
      <label for="speed">Speed</label>
      <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
      <span id="speedVal">1.0x</span>
    </div>
    <div class="hint">Click the canvas to spawn a burst.</div>
  </div>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("sim");
  var ctx = canvas.getContext("2d");

  var fpsEl = document.getElementById("fps");
  var timeEl = document.getElementById("time");
  var countEl = document.getElementById("count");
  var playBtn = document.getElementById("playBtn");
  var trailsBtn = document.getElementById("trailsBtn");
  var resetBtn = document.getElementById("resetBtn");
  var speedInput = document.getElementById("speed");
  var speedVal = document.getElementById("speedVal");

  var app = {
    running: true,
    trails: true,
    speed: 1,
    time: 0,
    planets: [],
    moons: [],
    stars: [],
    particles: []
  };
  window.app = app;

  var W = 0, H = 0, DPR = 1, cx = 0, cy = 0;

  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2;
    cy = H / 2;
  }

  function makeStars() {
    var stars = [];
    for (var i = 0; i < 180; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.4 + 0.3,
        base: Math.random() * 0.5 + 0.3,
        amp: Math.random() * 0.4 + 0.1,
        phase: Math.random() * Math.PI * 2,
        freq: Math.random() * 1.5 + 0.5
      });
    }
    return stars;
  }

  function makePlanets() {
    var base = Math.min(W, H);
    var defs = [
      { orbit: 0.16, size: 5,  color: "#5aa9ff", speed: 0.9,  moons: 0 },
      { orbit: 0.24, size: 8,  color: "#ff9d5c", speed: 0.6,  moons: 1 },
      { orbit: 0.33, size: 6,  color: "#7dffb0", speed: 0.45, moons: 1 },
      { orbit: 0.43, size: 10, color: "#c58bff", speed: 0.32, moons: 1 },
      { orbit: 0.55, size: 7,  color: "#ffd166", speed: 0.22, moons: 0 },
      { orbit: 0.68, size: 9,  color: "#ff6b9d", speed: 0.15, moons: 0 }
    ];
    var planets = [];
    var moons = [];
    for (var i = 0; i < defs.length; i++) {
      var d = defs[i];
      var angle = Math.random() * Math.PI * 2;
      var p = {
        orbitRadius: d.orbit * base,
        size: d.size,
        color: d.color,
        angularSpeed: d.speed,
        angle: angle,
        initAngle: angle,
        x: 0,
        y: 0,
        trail: []
      };
      planets.push(p);
      for (var m = 0; m < d.moons; m++) {
        moons.push({
          planet: p,
          orbitRadius: d.size + 12 + m * 8,
          size: 2.5,
          color: "#cfd8ff",
          angularSpeed: 1.6 + m * 0.5,
          angle: Math.random() * Math.PI * 2,
          x: 0,
          y: 0
        });
      }
    }
    return { planets: planets, moons: moons };
  }

  function build() {
    var sys = makePlanets();
    app.planets = sys.planets;
    app.moons = sys.moons;
    app.stars = makeStars();
    app.particles = [];
  }

  function spawnBurst(x, y) {
    var n = 40 + Math.floor(Math.random() * 41);
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = Math.random() * 220 + 40;
      app.particles.push({
        x: x,
        y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        maxLife: 1,
        size: Math.random() * 2.5 + 1,
        hue: Math.random() * 60 + 180
      });
    }
  }

  function update(dt) {
    var i, p, m;
    for (i = 0; i < app.planets.length; i++) {
      p = app.planets[i];
      p.angle += p.angularSpeed * dt * app.speed;
      p.x = cx + Math.cos(p.angle) * p.orbitRadius;
      p.y = cy + Math.sin(p.angle) * p.orbitRadius;
      if (app.trails) {
        p.trail.push({ x: p.x, y: p.y });
        if (p.trail.length > 40) p.trail.shift();
      }
    }
    for (i = 0; i < app.moons.length; i++) {
      m = app.moons[i];
      m.angle += m.angularSpeed * dt * app.speed;
      m.x = m.planet.x + Math.cos(m.angle) * m.orbitRadius;
      m.y = m.planet.y + Math.sin(m.angle) * m.orbitRadius;
    }
    for (i = app.particles.length - 1; i >= 0; i--) {
      var pt = app.particles[i];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vx *= 0.96;
      pt.vy *= 0.96;
      pt.life -= dt * 0.8;
      if (pt.life <= 0) app.particles.splice(i, 1);
    }
  }

  function drawStar() {
    var pulse = 1 + 0.08 * Math.sin(app.time * 2);
    var base = Math.min(W, H);
    var coreR = base * 0.05;
    var coronaR = base * 0.16 * pulse;
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, coronaR);
    g.addColorStop(0, "rgba(255,255,255,0.95)");
    g.addColorStop(0.25, "rgba(255,220,150,0.55)");
    g.addColorStop(0.6, "rgba(255,160,80,0.18)");
    g.addColorStop(1, "rgba(255,120,60,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, coronaR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.beginPath();
    ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#060913";
    ctx.fillRect(0, 0, W, H);

    var i, s;
    for (i = 0; i < app.stars.length; i++) {
      s = app.stars[i];
      var a = s.base + s.amp * Math.sin(app.time * s.freq + s.phase);
      if (a < 0) a = 0;
      if (a > 1) a = 1;
      ctx.globalAlpha = a;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawStar();

    var p, m, j;
    for (i = 0; i < app.planets.length; i++) {
      p = app.planets[i];
      if (app.trails && p.trail.length > 1) {
        for (j = 0; j < p.trail.length; j++) {
          var t = p.trail[j];
          var alpha = (j / p.trail.length) * 0.5;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(t.x, t.y, p.size * 0.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    }

    for (i = 0; i < app.planets.length; i++) {
      p = app.planets[i];
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    for (i = 0; i < app.moons.length; i++) {
      m = app.moons[i];
      ctx.fillStyle = m.color;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.size, 0, Math.PI * 2);
      ctx.fill();
    }

    if (app.particles.length > 0) {
      ctx.globalCompositeOperation = "lighter";
      for (i = 0; i < app.particles.length; i++) {
        var pt = app.particles[i];
        var la = pt.life / pt.maxLife;
        ctx.globalAlpha = la;
        ctx.fillStyle = "hsl(" + pt.hue + ",100%,70%)";
        ctx.shadowColor = "hsl(" + pt.hue + ",100%,70%)";
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }
  }

  var last = performance.now();
  var fpsAccum = 0;
  var fpsFrames = 0;
  var hudAccum = 0;

  function loop(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (dt < 0) dt = 0;
    if (dt > 0.1) dt = 0.1;

    fpsAccum += dt;
    fpsFrames++;
    hudAccum += dt;

    if (app.running) {
      app.time += dt * app.speed;
      update(dt);
    }
    draw();

    if (hudAccum >= 0.25) {
      hudAccum = 0;
      var fps = fpsAccum > 0 ? Math.round(fpsFrames / fpsAccum) : 0;
      fpsEl.textContent = String(fps);
      timeEl.textContent = app.time.toFixed(1) + "s";
      countEl.textContent = String(app.particles.length);
      fpsAccum = 0;
      fpsFrames = 0;
    }

    requestAnimationFrame(loop);
  }

  function onPointer(e) {
    var rect = canvas.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var y = e.clientY - rect.top;
    spawnBurst(x, y);
  }

  playBtn.addEventListener("click", function () {
    app.running = !app.running;
    playBtn.textContent = app.running ? "Pause" : "Play";
  });

  trailsBtn.addEventListener("click", function () {
    app.trails = !app.trails;
    trailsBtn.textContent = app.trails ? "Trails: ON" : "Trails: OFF";
    if (!app.trails) {
      for (var i = 0; i < app.planets.length; i++) app.planets[i].trail.length = 0;
    }
  });

  resetBtn.addEventListener("click", function () {
    app.time = 0;
    app.particles.length = 0;
    app.running = true;
    playBtn.textContent = "Pause";
    for (var i = 0; i < app.planets.length; i++) {
      var p = app.planets[i];
      p.trail.length = 0;
      p.angle = p.initAngle;
      p.x = cx + Math.cos(p.angle) * p.orbitRadius;
      p.y = cy + Math.sin(p.angle) * p.orbitRadius;
    }
  });

  speedInput.addEventListener("input", function () {
    app.speed = parseFloat(speedInput.value);
    speedVal.textContent = app.speed.toFixed(1) + "x";
  });

  canvas.addEventListener("pointerdown", onPointer);

  window.addEventListener("resize", function () {
    resize();
    build();
  });

  resize();
  build();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
