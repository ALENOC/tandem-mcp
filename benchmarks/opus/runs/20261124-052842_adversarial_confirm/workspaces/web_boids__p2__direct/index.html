<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boids – Stormo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #070b14; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e6edf7; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; background: #070b14; cursor: crosshair; }
  .glass {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 14px;
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }
  #hud {
    position: fixed; top: 16px; left: 16px; padding: 14px 18px;
    min-width: 190px; font-size: 14px; line-height: 1.7; user-select: none; z-index: 2;
  }
  #hud h1 { font-size: 15px; font-weight: 600; letter-spacing: .04em; margin-bottom: 4px; color: #9ecbff; }
  #hud .row { display: flex; justify-content: space-between; gap: 18px; }
  #hud .val { font-variant-numeric: tabular-nums; font-weight: 600; }
  #controls {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; padding: 12px 16px; z-index: 2;
    flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 24px);
  }
  button {
    font: inherit; font-size: 14px; color: #e6edf7; cursor: pointer;
    background: rgba(255, 255, 255, 0.10); border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 10px; padding: 8px 16px; min-width: 76px; transition: background .15s;
  }
  button:hover { background: rgba(255, 255, 255, 0.2); }
  button:focus-visible { outline: 2px solid #9ecbff; outline-offset: 2px; }
  label { font-size: 14px; display: flex; align-items: center; gap: 8px; }
  input[type="range"] { width: 140px; accent-color: #7cc4ff; }
  #speedLabel { font-variant-numeric: tabular-nums; min-width: 38px; display: inline-block; }
  #hint { position: fixed; top: 16px; right: 16px; padding: 10px 14px; font-size: 13px; opacity: .85; z-index: 2; user-select: none; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="hud" class="glass" aria-live="polite">
  <h1>BOIDS</h1>
  <div class="row"><span>FPS</span><span class="val" id="fps">0</span></div>
  <div class="row"><span>Boids</span><span class="val" id="count">0</span></div>
  <div class="row"><span>Velocità</span><span class="val" id="speedHud">1.0x</span></div>
  <div class="row"><span>Stato</span><span class="val" id="state">Pausa</span></div>
</div>

<div id="hint" class="glass">Click sul canvas per aggiungere un boid</div>

<div id="controls" class="glass">
  <button id="playBtn" type="button">Play</button>
  <button id="stepBtn" type="button">Step</button>
  <button id="resetBtn" type="button">Reset</button>
  <label for="speed">Velocità
    <input id="speed" type="range" min="0.5" max="3.0" step="0.1" value="1.0">
    <span id="speedLabel">1.0x</span>
  </label>
</div>

<script>
(function () {
  "use strict";

  var INITIAL_COUNT = 60;
  var MAX_BOIDS = 600;
  var PERCEPTION = 60;
  var SEP_DIST = 24;
  var BASE_MAX_SPEED = 2.4;
  var MAX_FORCE = 0.06;

  var canvas = document.getElementById("canvas");
  var ctx = canvas.getContext("2d");
  var fpsEl = document.getElementById("fps");
  var countEl = document.getElementById("count");
  var speedHud = document.getElementById("speedHud");
  var stateEl = document.getElementById("state");
  var playBtn = document.getElementById("playBtn");
  var stepBtn = document.getElementById("stepBtn");
  var resetBtn = document.getElementById("resetBtn");
  var speedInput = document.getElementById("speed");
  var speedLabel = document.getElementById("speedLabel");

  var W = 0, H = 0, dpr = 1;
  var boids = [];
  var running = false;
  var speed = 1.0;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.max(1, Math.floor(W * dpr));
    canvas.height = Math.max(1, Math.floor(H * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function Boid(x, y) {
    var a = Math.random() * Math.PI * 2;
    var s = BASE_MAX_SPEED * (0.5 + Math.random() * 0.5);
    this.x = x; this.y = y;
    this.vx = Math.cos(a) * s;
    this.vy = Math.sin(a) * s;
    this.hue = 190 + Math.random() * 50;
  }

  function reset() {
    boids = [];
    var w = W || 800, h = H || 600;
    for (var i = 0; i < INITIAL_COUNT; i++) {
      boids.push(new Boid(Math.random() * w, Math.random() * h));
    }
    updateHud();
    draw();
  }

  function limit(vx, vy, max) {
    var m = Math.sqrt(vx * vx + vy * vy);
    if (m > max && m > 0) { var k = max / m; return [vx * k, vy * k]; }
    return [vx, vy];
  }

  function steer(dx, dy, b) {
    // desired velocity with magnitude BASE_MAX_SPEED, minus current velocity, limited
    var m = Math.sqrt(dx * dx + dy * dy);
    if (m === 0) return [0, 0];
    dx = dx / m * BASE_MAX_SPEED - b.vx;
    dy = dy / m * BASE_MAX_SPEED - b.vy;
    return limit(dx, dy, MAX_FORCE);
  }

  function step(dt) {
    var n = boids.length;
    var p2 = PERCEPTION * PERCEPTION, s2 = SEP_DIST * SEP_DIST;
    var acc = new Array(n);
    for (var i = 0; i < n; i++) {
      var b = boids[i];
      var ax = 0, ay = 0, cx = 0, cy = 0, sx = 0, sy = 0, cnt = 0, scnt = 0;
      for (var j = 0; j < n; j++) {
        if (i === j) continue;
        var o = boids[j];
        var dx = o.x - b.x, dy = o.y - b.y;
        // toroidal wrap distance
        if (dx > W / 2) dx -= W; else if (dx < -W / 2) dx += W;
        if (dy > H / 2) dy -= H; else if (dy < -H / 2) dy += H;
        var d2 = dx * dx + dy * dy;
        if (d2 < p2) {
          ax += o.vx; ay += o.vy;
          cx += dx; cy += dy;
          cnt++;
          if (d2 < s2 && d2 > 0) {
            sx -= dx / d2; sy -= dy / d2;
            scnt++;
          }
        }
      }
      var fx = 0, fy = 0, f;
      if (cnt > 0) {
        f = steer(ax / cnt, ay / cnt, b); fx += f[0] * 1.0; fy += f[1] * 1.0;   // alignment
        f = steer(cx / cnt, cy / cnt, b); fx += f[0] * 0.9; fy += f[1] * 0.9;   // cohesion
      }
      if (scnt > 0) {
        f = steer(sx, sy, b); fx += f[0] * 1.6; fy += f[1] * 1.6;               // separation
      }
      acc[i] = [fx, fy];
    }
    var maxSp = BASE_MAX_SPEED;
    for (var k = 0; k < n; k++) {
      var bk = boids[k];
      bk.vx += acc[k][0] * dt;
      bk.vy += acc[k][1] * dt;
      var v = limit(bk.vx, bk.vy, maxSp);
      bk.vx = v[0]; bk.vy = v[1];
      var sp = Math.sqrt(bk.vx * bk.vx + bk.vy * bk.vy);
      if (sp < maxSp * 0.4 && sp > 0) { bk.vx *= (maxSp * 0.4) / sp; bk.vy *= (maxSp * 0.4) / sp; }
      bk.x += bk.vx * dt;
      bk.y += bk.vy * dt;
      if (bk.x < 0) bk.x += W; else if (bk.x >= W) bk.x -= W;
      if (bk.y < 0) bk.y += H; else if (bk.y >= H) bk.y -= H;
    }
  }

  function draw() {
    if (!ctx) return;
    ctx.fillStyle = "#070b14";
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      var ang = Math.atan2(b.vy, b.vx);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(9, 0);
      ctx.lineTo(-6, 4.5);
      ctx.lineTo(-3, 0);
      ctx.lineTo(-6, -4.5);
      ctx.closePath();
      ctx.fillStyle = "hsl(" + b.hue.toFixed(0) + ",85%,65%)";
      ctx.fill();
      ctx.restore();
    }
  }

  function updateHud() {
    countEl.textContent = String(boids.length);
    speedHud.textContent = speed.toFixed(1) + "x";
    speedLabel.textContent = speed.toFixed(1) + "x";
    stateEl.textContent = running ? "In corso" : "Pausa";
    playBtn.textContent = running ? "Pause" : "Play";
    playBtn.setAttribute("aria-pressed", running ? "true" : "false");
  }

  // Simulation step scaled by speed (sub-stepped for stability)
  function advance(mult) {
    var total = speed * mult;
    var subs = Math.max(1, Math.ceil(total));
    for (var s = 0; s < subs; s++) step(total / subs);
  }

  var lastTime = performance.now();
  var fpsFrames = 0, fpsTime = lastTime;

  function loop(now) {
    var elapsed = now - lastTime;
    lastTime = now;
    if (!(elapsed > 0)) elapsed = 16.67;
    if (elapsed > 100) elapsed = 100;
    if (running) advance(elapsed / 16.67);
    draw();

    fpsFrames++;
    if (now - fpsTime >= 500) {
      fpsEl.textContent = String(Math.round(fpsFrames * 1000 / (now - fpsTime)));
      fpsFrames = 0;
      fpsTime = now;
    }
    requestAnimationFrame(loop);
  }

  playBtn.addEventListener("click", function () {
    running = !running;
    updateHud();
  });
  stepBtn.addEventListener("click", function () {
    running = false;
    advance(1);
    updateHud();
    draw();
  });
  resetBtn.addEventListener("click", function () {
    running = false;
    reset();
  });
  speedInput.addEventListener("input", function () {
    var v = parseFloat(speedInput.value);
    if (isFinite(v)) speed = Math.min(3, Math.max(0.5, v));
    updateHud();
  });
  canvas.addEventListener("click", function (e) {
    if (boids.length >= MAX_BOIDS) boids.shift();
    var r = canvas.getBoundingClientRect();
    boids.push(new Boid(e.clientX - r.left, e.clientY - r.top));
    updateHud();
    draw();
  });
  window.addEventListener("resize", resize);

  resize();
  reset();
  updateHud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
