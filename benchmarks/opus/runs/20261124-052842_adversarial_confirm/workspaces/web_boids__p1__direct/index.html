<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boids – Simulazione di stormo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #070b14; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e6ecff; }
  #canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #070b14; cursor: crosshair; }
  .glass {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 14px;
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }
  #hud {
    position: fixed; top: 16px; left: 16px; padding: 14px 18px; min-width: 190px;
    font-size: 14px; line-height: 1.7; user-select: none; pointer-events: none;
  }
  #hud .row { display: flex; justify-content: space-between; gap: 18px; }
  #hud .label { color: #9fb0d6; }
  #hud .value { font-variant-numeric: tabular-nums; font-weight: 600; }
  #controls {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; padding: 12px 16px; flex-wrap: wrap; justify-content: center;
  }
  button {
    font: inherit; font-size: 14px; font-weight: 600; color: #e6ecff; cursor: pointer;
    background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 10px; padding: 8px 16px; min-width: 76px; transition: background 0.15s;
  }
  button:hover { background: rgba(255, 255, 255, 0.2); }
  button:focus-visible { outline: 2px solid #6ea8ff; outline-offset: 2px; }
  label { font-size: 14px; color: #9fb0d6; display: flex; align-items: center; gap: 8px; }
  input[type=range] { width: 140px; accent-color: #6ea8ff; cursor: pointer; }
  #speedValue { color: #e6ecff; font-variant-numeric: tabular-nums; min-width: 38px; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="hud" class="glass" aria-live="polite">
  <div class="row"><span class="label">FPS</span><span class="value" id="fps">0</span></div>
  <div class="row"><span class="label">Boids</span><span class="value" id="count">0</span></div>
  <div class="row"><span class="label">Velocità</span><span class="value" id="speedHud">1.0×</span></div>
  <div class="row"><span class="label">Stato</span><span class="value" id="state">In pausa</span></div>
</div>

<div id="controls" class="glass">
  <button id="playBtn" type="button">Play</button>
  <button id="stepBtn" type="button">Step</button>
  <button id="resetBtn" type="button">Reset</button>
  <label for="speed">Velocità
    <input id="speed" type="range" min="0.5" max="3.0" step="0.1" value="1.0">
    <span id="speedValue">1.0×</span>
  </label>
</div>

<script>
(function () {
  "use strict";

  var INITIAL_BOIDS = 60;
  var MAX_BOIDS = 600;
  var PERCEPTION = 60;
  var SEPARATION_DIST = 24;
  var MAX_SPEED = 2.6;
  var MAX_FORCE = 0.06;
  var W_SEP = 1.6, W_ALI = 1.0, W_COH = 0.9;

  var canvas = document.getElementById("canvas");
  var ctx = canvas.getContext("2d");
  var fpsEl = document.getElementById("fps");
  var countEl = document.getElementById("count");
  var speedHudEl = document.getElementById("speedHud");
  var stateEl = document.getElementById("state");
  var playBtn = document.getElementById("playBtn");
  var stepBtn = document.getElementById("stepBtn");
  var resetBtn = document.getElementById("resetBtn");
  var speedInput = document.getElementById("speed");
  var speedValueEl = document.getElementById("speedValue");

  var width = 0, height = 0, dpr = 1;
  var boids = [];
  var running = false;
  var speedMult = 1.0;

  function resize() {
    dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function Boid(x, y) {
    var a = Math.random() * Math.PI * 2;
    var s = MAX_SPEED * (0.5 + Math.random() * 0.5);
    this.x = x; this.y = y;
    this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;
    this.hue = 190 + Math.random() * 60;
  }

  function limit(vx, vy, max) {
    var m = Math.sqrt(vx * vx + vy * vy);
    if (m > max && m > 0) { var k = max / m; return [vx * k, vy * k]; }
    return [vx, vy];
  }

  function steerTowards(dx, dy, b) {
    var m = Math.sqrt(dx * dx + dy * dy);
    if (m === 0) return [0, 0];
    var sx = dx / m * MAX_SPEED - b.vx;
    var sy = dy / m * MAX_SPEED - b.vy;
    return limit(sx, sy, MAX_FORCE);
  }

  // Shortest offset on a torus (wrap-around world)
  function wrapDelta(d, size) {
    if (d > size / 2) return d - size;
    if (d < -size / 2) return d + size;
    return d;
  }

  function reset() {
    boids = [];
    for (var i = 0; i < INITIAL_BOIDS; i++) {
      boids.push(new Boid(Math.random() * width, Math.random() * height));
    }
    updateHud();
    draw();
  }

  function update(dt) {
    var n = boids.length, i, j;
    var p2 = PERCEPTION * PERCEPTION, s2 = SEPARATION_DIST * SEPARATION_DIST;
    var acc = new Array(n);

    for (i = 0; i < n; i++) {
      var b = boids[i];
      var sepX = 0, sepY = 0, aliX = 0, aliY = 0, cohX = 0, cohY = 0, count = 0, sepCount = 0;
      for (j = 0; j < n; j++) {
        if (i === j) continue;
        var o = boids[j];
        var dx = wrapDelta(o.x - b.x, width);
        var dy = wrapDelta(o.y - b.y, height);
        var d2 = dx * dx + dy * dy;
        if (d2 < p2) {
          aliX += o.vx; aliY += o.vy;
          cohX += dx; cohY += dy;
          count++;
          if (d2 < s2 && d2 > 0) {
            sepX -= dx / d2; sepY -= dy / d2;
            sepCount++;
          }
        }
      }
      var ax = 0, ay = 0, f;
      if (count > 0) {
        f = steerTowards(aliX / count, aliY / count, b);
        ax += f[0] * W_ALI; ay += f[1] * W_ALI;
        f = steerTowards(cohX / count, cohY / count, b);
        ax += f[0] * W_COH; ay += f[1] * W_COH;
      }
      if (sepCount > 0) {
        f = steerTowards(sepX, sepY, b);
        ax += f[0] * W_SEP; ay += f[1] * W_SEP;
      }
      acc[i] = [ax, ay];
    }

    for (i = 0; i < n; i++) {
      var bb = boids[i];
      bb.vx += acc[i][0] * dt;
      bb.vy += acc[i][1] * dt;
      var v = limit(bb.vx, bb.vy, MAX_SPEED);
      var m = Math.sqrt(v[0] * v[0] + v[1] * v[1]);
      if (m < MAX_SPEED * 0.4 && m > 0) { v[0] *= MAX_SPEED * 0.4 / m; v[1] *= MAX_SPEED * 0.4 / m; }
      bb.vx = v[0]; bb.vy = v[1];
      bb.x += bb.vx * dt;
      bb.y += bb.vy * dt;
      if (bb.x < 0) bb.x += width; else if (bb.x >= width) bb.x -= width;
      if (bb.y < 0) bb.y += height; else if (bb.y >= height) bb.y -= height;
    }
  }

  function draw() {
    ctx.fillStyle = "#070b14";
    ctx.fillRect(0, 0, width, height);
    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      var ang = Math.atan2(b.vy, b.vx);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(9, 0);
      ctx.lineTo(-6, 4.5);
      ctx.lineTo(-3, 0);
      ctx.lineTo(-6, -4.5);
      ctx.closePath();
      ctx.fillStyle = "hsl(" + b.hue.toFixed(0) + ", 90%, 65%)";
      ctx.fill();
      ctx.restore();
    }
  }

  function updateHud() {
    countEl.textContent = String(boids.length);
    speedHudEl.textContent = speedMult.toFixed(1) + "×";
    speedValueEl.textContent = speedMult.toFixed(1) + "×";
    stateEl.textContent = running ? "In esecuzione" : "In pausa";
    playBtn.textContent = running ? "Pause" : "Play";
    playBtn.setAttribute("aria-pressed", running ? "true" : "false");
  }

  // Main loop
  var lastTime = performance.now();
  var fpsFrames = 0, fpsTime = 0;

  function frame(now) {
    var elapsed = now - lastTime;
    lastTime = now;
    if (!(elapsed >= 0) || elapsed > 250) elapsed = 16.67;

    fpsFrames++;
    fpsTime += elapsed;
    if (fpsTime >= 500) {
      fpsEl.textContent = String(Math.round(fpsFrames * 1000 / fpsTime));
      fpsFrames = 0; fpsTime = 0;
    }

    if (running) {
      var dt = (elapsed / 16.67) * speedMult;
      // sub-step to keep the simulation stable at high speeds
      var steps = Math.max(1, Math.ceil(dt));
      for (var s = 0; s < steps; s++) update(dt / steps);
    }
    draw();
    requestAnimationFrame(frame);
  }

  // Events
  playBtn.addEventListener("click", function () {
    running = !running;
    updateHud();
  });

  stepBtn.addEventListener("click", function () {
    running = false;
    update(speedMult);
    updateHud();
    draw();
  });

  resetBtn.addEventListener("click", function () {
    running = false;
    reset();
  });

  speedInput.addEventListener("input", function () {
    var v = parseFloat(speedInput.value);
    if (!isFinite(v)) v = 1;
    speedMult = Math.min(3, Math.max(0.5, v));
    updateHud();
  });

  canvas.addEventListener("click", function (e) {
    if (boids.length >= MAX_BOIDS) boids.shift();
    var rect = canvas.getBoundingClientRect();
    boids.push(new Boid(e.clientX - rect.left, e.clientY - rect.top));
    updateHud();
    if (!running) draw();
  });

  window.addEventListener("resize", function () {
    var ow = width || 1, oh = height || 1;
    resize();
    for (var i = 0; i < boids.length; i++) {
      boids[i].x = boids[i].x / ow * width;
      boids[i].y = boids[i].y / oh * height;
    }
    draw();
  });

  // Init
  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
