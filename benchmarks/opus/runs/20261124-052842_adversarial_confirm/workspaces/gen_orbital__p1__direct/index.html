<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Particle Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #060913;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #dfe7ff;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: crosshair; }
  .hud {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    min-width: 250px; padding: 16px 18px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 16px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    user-select: none;
  }
  .hud h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 12px; color: #fff; opacity: 0.9; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  button {
    flex: 1; padding: 8px 10px; font: inherit; font-size: 12px; font-weight: 600;
    color: #eaf0ff; cursor: pointer;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    transition: background 0.15s, border-color 0.15s, transform 0.08s;
  }
  button:hover { background: rgba(255, 255, 255, 0.16); border-color: rgba(255,255,255,0.35); }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 2px solid #7fb0ff; outline-offset: 2px; }
  button.off { color: #9aa6c4; background: rgba(255,255,255,0.03); }
  label.speed { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; opacity: 0.85; }
  #speedVal { font-variant-numeric: tabular-nums; font-weight: 700; color: #ffd27a; }
  input[type="range"] { width: 100%; accent-color: #ffb347; margin-bottom: 12px; cursor: pointer; }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .stats span:nth-child(odd) { opacity: 0.65; }
  .stats span:nth-child(even) { text-align: right; font-weight: 600; color: #a8d4ff; }
  .hint { margin-top: 10px; font-size: 11px; opacity: 0.5; }
</style>
</head>
<body>
<canvas id="sim" aria-label="Orbital particle simulation"></canvas>

<div class="hud" role="region" aria-label="Simulation controls">
  <h1>Orbital Sim</h1>
  <div class="row">
    <button id="playBtn" type="button" aria-pressed="true">Pause</button>
    <button id="trailBtn" type="button" aria-pressed="true">Trails: ON</button>
    <button id="resetBtn" type="button">Reset</button>
  </div>
  <label class="speed" for="speed">Speed <span id="speedVal">1.0×</span></label>
  <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
  <div class="stats">
    <span>FPS</span><span id="fps">0</span>
    <span>Sim time</span><span id="simTime">0.0 s</span>
    <span>Burst particles</span><span id="pCount">0</span>
  </div>
  <div class="hint">Click anywhere to spawn a burst</div>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("sim");
  var ctx = canvas.getContext("2d");
  var playBtn = document.getElementById("playBtn");
  var trailBtn = document.getElementById("trailBtn");
  var resetBtn = document.getElementById("resetBtn");
  var speedInput = document.getElementById("speed");
  var speedVal = document.getElementById("speedVal");
  var fpsEl = document.getElementById("fps");
  var simTimeEl = document.getElementById("simTime");
  var pCountEl = document.getElementById("pCount");

  var W = 0, H = 0, DPR = 1, cx = 0, cy = 0, scale = 1;
  var TAU = Math.PI * 2;
  var MAX_PARTICLES = 4000;
  var TRAIL_LEN = 90;

  var state = {
    playing: true,
    trails: true,
    speed: 1.0,
    simTime: 0
  };

  // ---------- Starfield ----------
  var stars = [];
  function buildStars() {
    stars = [];
    var count = Math.max(220, Math.floor((W * H) / 5000));
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.3 + 0.2,
        base: Math.random() * 0.6 + 0.25,
        phase: Math.random() * TAU,
        freq: Math.random() * 2.5 + 0.5,
        hue: Math.random() < 0.15 ? 210 : (Math.random() < 0.1 ? 40 : 0)
      });
    }
  }

  // ---------- Planets ----------
  var planetDefs = [
    { name: "Ember",  r: 0.16, size: 4.5, speed: 1.60, color: "#ff8a5c", moons: [] },
    { name: "Azure",  r: 0.26, size: 7,   speed: 1.05, color: "#4fb3ff",
      moons: [{ r: 16, size: 2, speed: 4.2, color: "#d8e4f0" }] },
    { name: "Verdant",r: 0.37, size: 8,   speed: 0.72, color: "#5fe39a",
      moons: [{ r: 18, size: 2.2, speed: 3.6, color: "#cfd8c8" },
              { r: 26, size: 1.6, speed: -2.4, color: "#ffe9a8" }] },
    { name: "Rose",   r: 0.50, size: 6,   speed: 0.50, color: "#ff6fb5", moons: [] },
    { name: "Aurum",  r: 0.64, size: 11,  speed: 0.34, color: "#ffcf5a",
      ring: true,
      moons: [{ r: 24, size: 2.5, speed: 2.8, color: "#f5e6c8" },
              { r: 33, size: 1.8, speed: 1.9, color: "#bcd2ff" }] },
    { name: "Glacier",r: 0.80, size: 9,   speed: 0.22, color: "#9ad7ff",
      moons: [{ r: 20, size: 2, speed: -3.1, color: "#ffffff" }] }
  ];
  var planets = [];

  function initPlanets() {
    planets = planetDefs.map(function (d, i) {
      return {
        def: d,
        angle: (i * 1.37) % TAU,
        x: 0, y: 0,
        trail: [],
        moons: d.moons.map(function (m, j) {
          return { def: m, angle: j * 2.1, x: 0, y: 0, trail: [] };
        })
      };
    });
    updatePositions(0);
    clearTrails();
  }

  function clearTrails() {
    planets.forEach(function (p) {
      p.trail.length = 0;
      p.moons.forEach(function (m) { m.trail.length = 0; });
    });
  }

  function orbitRadius(p) {
    return p.def.r * scale;
  }

  function updatePositions(dt) {
    for (var i = 0; i < planets.length; i++) {
      var p = planets[i];
      p.angle += p.def.speed * 0.35 * dt;
      var R = orbitRadius(p);
      p.x = cx + Math.cos(p.angle) * R;
      p.y = cy + Math.sin(p.angle) * R * 0.92;
      for (var j = 0; j < p.moons.length; j++) {
        var m = p.moons[j];
        m.angle += m.def.speed * 0.35 * dt;
        var mr = m.def.r * Math.max(0.7, scale / 420);
        m.x = p.x + Math.cos(m.angle) * mr;
        m.y = p.y + Math.sin(m.angle) * mr;
      }
    }
  }

  function pushTrails() {
    for (var i = 0; i < planets.length; i++) {
      var p = planets[i];
      p.trail.push(p.x, p.y);
      if (p.trail.length > TRAIL_LEN * 2) p.trail.splice(0, 2);
      for (var j = 0; j < p.moons.length; j++) {
        var m = p.moons[j];
        m.trail.push(m.x, m.y);
        if (m.trail.length > 40 * 2) m.trail.splice(0, 2);
      }
    }
  }

  // ---------- Burst particles ----------
  var particles = [];
  var burstHues = [20, 45, 190, 280, 330, 160];

  function spawnBurst(x, y) {
    var count = 70 + Math.floor(Math.random() * 40);
    var hue = burstHues[Math.floor(Math.random() * burstHues.length)];
    for (var i = 0; i < count; i++) {
      if (particles.length >= MAX_PARTICLES) particles.shift();
      var a = (i / count) * TAU + (Math.random() - 0.5) * 0.25;
      var v = 80 + Math.random() * 260;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v,
        life: 1,
        decay: 0.45 + Math.random() * 0.55,
        size: 1.2 + Math.random() * 2.2,
        hue: hue + (Math.random() - 0.5) * 40
      });
    }
  }

  function updateParticles(dt) {
    var damping = Math.pow(0.12, dt); // velocity damping per second
    for (var i = particles.length - 1; i >= 0; i--) {
      var q = particles[i];
      q.vx *= damping;
      q.vy *= damping;
      q.x += q.vx * dt;
      q.y += q.vy * dt;
      q.life -= q.decay * dt;
      if (q.life <= 0) {
        particles[i] = particles[particles.length - 1];
        particles.pop();
      }
    }
  }

  // ---------- Resize ----------
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2;
    cy = H / 2;
    scale = Math.min(W, H) * 0.5;
    buildStars();
    if (planets.length) {
      updatePositions(0);
      clearTrails();
    }
  }

  // ---------- Drawing ----------
  function drawStars(t) {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var a = s.base * (0.55 + 0.45 * Math.sin(t * s.freq + s.phase));
      if (a < 0.02) continue;
      ctx.globalAlpha = a;
      ctx.fillStyle = s.hue === 210 ? "#bcd6ff" : (s.hue === 40 ? "#ffe2b0" : "#ffffff");
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawStar(t) {
    var base = Math.max(18, scale * 0.07);
    var pulse = 1 + 0.06 * Math.sin(t * 1.8) + 0.03 * Math.sin(t * 4.3);
    var coronaR = base * 4.2 * pulse;

    var g = ctx.createRadialGradient(cx, cy, base * 0.2, cx, cy, coronaR);
    g.addColorStop(0, "rgba(255, 244, 214, 0.95)");
    g.addColorStop(0.18, "rgba(255, 200, 110, 0.55)");
    g.addColorStop(0.45, "rgba(255, 130, 50, 0.16)");
    g.addColorStop(1, "rgba(255, 90, 30, 0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, coronaR, 0, TAU);
    ctx.fill();

    var core = ctx.createRadialGradient(cx - base * 0.25, cy - base * 0.25, 0, cx, cy, base);
    core.addColorStop(0, "#fffef5");
    core.addColorStop(0.5, "#ffe28a");
    core.addColorStop(1, "#ff9c38");
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(cx, cy, base, 0, TAU);
    ctx.fill();
  }

  function drawOrbits() {
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(140, 170, 255, 0.07)";
    for (var i = 0; i < planets.length; i++) {
      var R = orbitRadius(planets[i]);
      ctx.beginPath();
      ctx.ellipse(cx, cy, R, R * 0.92, 0, 0, TAU);
      ctx.stroke();
    }
  }

  function hexToRgb(hex) {
    var n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function drawTrail(trail, rgb, width) {
    var n = trail.length / 2;
    if (n < 2) return;
    ctx.lineCap = "round";
    for (var i = 1; i < n; i++) {
      var f = i / n;
      ctx.strokeStyle = "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + "," + (f * f * 0.75).toFixed(3) + ")";
      ctx.lineWidth = width * f;
      ctx.beginPath();
      ctx.moveTo(trail[(i - 1) * 2], trail[(i - 1) * 2 + 1]);
      ctx.lineTo(trail[i * 2], trail[i * 2 + 1]);
      ctx.stroke();
    }
  }

  function drawBody(x, y, size, color, rgb) {
    var glow = ctx.createRadialGradient(x, y, 0, x, y, size * 3);
    glow.addColorStop(0, "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",0.45)");
    glow.addColorStop(1, "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, size * 3, 0, TAU);
    ctx.fill();

    // lit from the star
    var dx = cx - x, dy = cy - y, d = Math.hypot(dx, dy) || 1;
    var lx = x + (dx / d) * size * 0.4, ly = y + (dy / d) * size * 0.4;
    var body = ctx.createRadialGradient(lx, ly, size * 0.1, x, y, size);
    body.addColorStop(0, "#ffffff");
    body.addColorStop(0.35, color);
    body.addColorStop(1, "rgba(10, 14, 30, 1)");
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, TAU);
    ctx.fill();
  }

  function drawPlanets() {
    var sz = Math.max(0.7, scale / 420);
    for (var i = 0; i < planets.length; i++) {
      var p = planets[i];
      var rgb = p.def.rgb || (p.def.rgb = hexToRgb(p.def.color));
      if (state.trails) {
        drawTrail(p.trail, rgb, p.def.size * sz * 0.9);
        for (var k = 0; k < p.moons.length; k++) {
          var mm = p.moons[k];
          drawTrail(mm.trail, mm.def.rgb || (mm.def.rgb = hexToRgb(mm.def.color)), 1.4);
        }
      }
      var size = p.def.size * sz;
      if (p.def.ring) {
        ctx.strokeStyle = "rgba(255, 220, 150, 0.45)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, size * 1.9, size * 0.6, -0.4, 0, TAU);
        ctx.stroke();
      }
      drawBody(p.x, p.y, size, p.def.color, rgb);
      for (var j = 0; j < p.moons.length; j++) {
        var m = p.moons[j];
        var mrgb = m.def.rgb || (m.def.rgb = hexToRgb(m.def.color));
        drawBody(m.x, m.y, m.def.size * sz, m.def.color, mrgb);
      }
    }
  }

  function drawParticles() {
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < particles.length; i++) {
      var q = particles[i];
      var a = Math.max(0, q.life);
      var r = q.size * (0.5 + a);
      ctx.fillStyle = "hsla(" + q.hue.toFixed(0) + ",100%,65%," + (a * 0.25).toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(q.x, q.y, r * 3, 0, TAU);
      ctx.fill();
      ctx.fillStyle = "hsla(" + q.hue.toFixed(0) + ",100%,85%," + a.toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(q.x, q.y, r, 0, TAU);
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  function render(realT) {
    ctx.fillStyle = "#060913";
    ctx.fillRect(0, 0, W, H);
    drawStars(realT);
    drawOrbits();
    drawStar(state.simTime + realT * 0.2);
    drawPlanets();
    drawParticles();
  }

  // ---------- Loop ----------
  var lastTs = 0;
  var fpsFrames = 0, fpsAccum = 0, fps = 0;
  var trailTimer = 0;
  var hudTimer = 0;

  function frame(ts) {
    var realDt = lastTs ? (ts - lastTs) / 1000 : 0;
    lastTs = ts;
    if (realDt > 0.1) realDt = 0.1; // clamp after tab switch

    fpsFrames++;
    fpsAccum += realDt;
    if (fpsAccum >= 0.5) {
      fps = fpsFrames / fpsAccum;
      fpsFrames = 0;
      fpsAccum = 0;
    }

    if (state.playing) {
      var dt = realDt * state.speed;
      state.simTime += dt;
      updatePositions(dt);
      updateParticles(dt);
      trailTimer += dt;
      if (trailTimer >= 1 / 60) {
        trailTimer = 0;
        pushTrails();
      }
    }

    render(ts / 1000);

    hudTimer += realDt;
    if (hudTimer >= 0.1) {
      hudTimer = 0;
      fpsEl.textContent = Math.round(fps);
      simTimeEl.textContent = state.simTime.toFixed(1) + " s";
      pCountEl.textContent = particles.length;
    }

    requestAnimationFrame(frame);
  }

  // ---------- Controls ----------
  function setPlaying(v) {
    state.playing = v;
    playBtn.textContent = v ? "Pause" : "Play";
    playBtn.setAttribute("aria-pressed", String(v));
  }

  playBtn.addEventListener("click", function () { setPlaying(!state.playing); });

  trailBtn.addEventListener("click", function () {
    state.trails = !state.trails;
    trailBtn.textContent = "Trails: " + (state.trails ? "ON" : "OFF");
    trailBtn.classList.toggle("off", !state.trails);
    trailBtn.setAttribute("aria-pressed", String(state.trails));
    if (!state.trails) clearTrails();
  });

  resetBtn.addEventListener("click", function () {
    state.simTime = 0;
    particles.length = 0;
    speedInput.value = "1.0";
    state.speed = 1.0;
    speedVal.textContent = "1.0×";
    initPlanets();
    setPlaying(true);
    pCountEl.textContent = "0";
    simTimeEl.textContent = "0.0 s";
  });

  speedInput.addEventListener("input", function () {
    var v = parseFloat(speedInput.value);
    if (!isFinite(v)) v = 1;
    state.speed = Math.min(3, Math.max(0.2, v));
    speedVal.textContent = state.speed.toFixed(1) + "×";
  });

  canvas.addEventListener("pointerdown", function (e) {
    var rect = canvas.getBoundingClientRect();
    spawnBurst(e.clientX - rect.left, e.clientY - rect.top);
  });

  window.addEventListener("resize", resize);

  resize();
  initPlanets();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
