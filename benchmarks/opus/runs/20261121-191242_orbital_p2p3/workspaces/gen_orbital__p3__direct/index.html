<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Particle Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #060913;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #e6ecff;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: crosshair; }
  .hud {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    width: 260px; padding: 16px 18px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 16px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    user-select: none;
  }
  .hud h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #9fb4ff; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  button {
    flex: 1; padding: 8px 6px; font: inherit; font-size: 12px; font-weight: 600;
    color: #e6ecff; background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 10px;
    cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  button:hover { background: rgba(255, 255, 255, 0.16); border-color: rgba(159, 180, 255, 0.5); }
  button:active { transform: scale(0.96); }
  button.off { color: #8a93ad; background: rgba(0, 0, 0, 0.2); }
  .slider-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; color: #c4cff0; }
  .slider-label span:last-child { font-variant-numeric: tabular-nums; color: #ffd27a; font-weight: 600; }
  input[type="range"] { width: 100%; accent-color: #8fa8ff; margin-bottom: 12px; cursor: pointer; }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 12px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
  .stats .k { color: #8a93ad; }
  .stats .v { font-variant-numeric: tabular-nums; text-align: right; color: #e6ecff; font-weight: 600; }
  .hint { margin-top: 10px; font-size: 11px; color: #6f7892; }
</style>
</head>
<body>
<canvas id="sim"></canvas>

<div class="hud" id="hud">
  <h1>Orbital Simulation</h1>
  <div class="row">
    <button id="playBtn" type="button">Pause</button>
    <button id="trailBtn" type="button">Trails: ON</button>
    <button id="resetBtn" type="button">Reset</button>
  </div>
  <div class="slider-label"><span>Speed</span><span id="speedOut">1.0×</span></div>
  <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
  <div class="stats">
    <span class="k">FPS</span><span class="v" id="fpsOut">0</span>
    <span class="k">Sim time</span><span class="v" id="timeOut">0.0 s</span>
    <span class="k">Burst particles</span><span class="v" id="partOut">0</span>
  </div>
  <div class="hint">Click anywhere on space to spawn a burst.</div>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("sim");
  var ctx = canvas.getContext("2d");
  var playBtn = document.getElementById("playBtn");
  var trailBtn = document.getElementById("trailBtn");
  var resetBtn = document.getElementById("resetBtn");
  var speedInput = document.getElementById("speed");
  var speedOut = document.getElementById("speedOut");
  var fpsOut = document.getElementById("fpsOut");
  var timeOut = document.getElementById("timeOut");
  var partOut = document.getElementById("partOut");

  var W = 0, H = 0, DPR = 1, CX = 0, CY = 0, SCALE = 1;
  var running = true;
  var trailsOn = true;
  var speed = 1.0;
  var simTime = 0;
  var lastTs = 0;
  var fpsFrames = 0, fpsAccum = 0;

  var TRAIL_LEN = 70;
  var MAX_PARTICLES = 4000;

  // ---------- Planet definitions (radii are relative to SCALE) ----------
  var PLANET_DEFS = [
    { name: "Ember",  r: 0.14, size: 4,   speed: 1.60, color: "#ff8a5c", phase: 0.0, moons: [] },
    { name: "Azure",  r: 0.22, size: 6.5, speed: 1.05, color: "#5cc8ff", phase: 1.9,
      moons: [{ r: 14, size: 1.8, speed: 4.2, color: "#d8e6ff", phase: 0 }] },
    { name: "Verdant",r: 0.31, size: 7,   speed: 0.78, color: "#6dff9e", phase: 3.6,
      moons: [{ r: 15, size: 2.0, speed: 3.4, color: "#e8ffe9", phase: 1.2 },
              { r: 22, size: 1.4, speed: -2.3, color: "#b7c4d8", phase: 4.0 }] },
    { name: "Amber",  r: 0.42, size: 10,  speed: 0.52, color: "#ffc857", phase: 5.1, ring: true,
      moons: [{ r: 20, size: 2.2, speed: 2.6, color: "#fff2cc", phase: 2.5 }] },
    { name: "Violet", r: 0.53, size: 8,   speed: 0.37, color: "#b48cff", phase: 2.4,
      moons: [{ r: 16, size: 1.7, speed: 3.0, color: "#efe4ff", phase: 0.7 }] },
    { name: "Frost",  r: 0.63, size: 5.5, speed: 0.26, color: "#9ff3ff", phase: 4.4, moons: [] }
  ];

  var planets = [];
  var stars = [];
  var particles = [];

  function buildPlanets() {
    planets = PLANET_DEFS.map(function (d) {
      return {
        def: d,
        angle: d.phase,
        x: 0, y: 0,
        trail: [],
        moons: d.moons.map(function (m) {
          return { def: m, angle: m.phase, x: 0, y: 0, trail: [] };
        })
      };
    });
    updatePositions();
  }

  function buildStars() {
    stars = [];
    var count = Math.max(180, Math.floor((W * H) / 6000));
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.3 + 0.2,
        base: Math.random() * 0.6 + 0.25,
        tw: Math.random() * 2.5 + 0.6,
        ph: Math.random() * Math.PI * 2,
        hue: Math.random() < 0.15 ? 210 : (Math.random() < 0.1 ? 40 : 0)
      });
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2;
    CY = H / 2;
    SCALE = Math.min(W, H) * 0.78;
    buildStars();
    // Trails reference old coordinates; clear them on resize
    planets.forEach(function (p) {
      p.trail.length = 0;
      p.moons.forEach(function (m) { m.trail.length = 0; });
    });
    updatePositions();
  }

  function updatePositions() {
    for (var i = 0; i < planets.length; i++) {
      var p = planets[i];
      var R = p.def.r * SCALE;
      p.x = CX + Math.cos(p.angle) * R;
      p.y = CY + Math.sin(p.angle) * R * 0.92;
      for (var j = 0; j < p.moons.length; j++) {
        var m = p.moons[j];
        m.x = p.x + Math.cos(m.angle) * m.def.r;
        m.y = p.y + Math.sin(m.angle) * m.def.r;
      }
    }
  }

  function pushTrail(arr, x, y, max) {
    arr.push(x, y);
    if (arr.length > max * 2) arr.splice(0, arr.length - max * 2);
  }

  // ---------- Simulation step ----------
  function step(dt) {
    simTime += dt;
    for (var i = 0; i < planets.length; i++) {
      var p = planets[i];
      p.angle += p.def.speed * dt * 0.6;
      for (var j = 0; j < p.moons.length; j++) {
        p.moons[j].angle += p.moons[j].def.speed * dt;
      }
    }
    updatePositions();
    for (i = 0; i < planets.length; i++) {
      p = planets[i];
      pushTrail(p.trail, p.x, p.y, TRAIL_LEN);
      for (j = 0; j < p.moons.length; j++) {
        pushTrail(p.moons[j].trail, p.moons[j].x, p.moons[j].y, 26);
      }
    }
  }

  function stepParticles(dt) {
    var damp = Math.pow(0.12, dt); // velocity damping per second
    for (var i = particles.length - 1; i >= 0; i--) {
      var q = particles[i];
      q.vx *= damp;
      q.vy *= damp;
      q.x += q.vx * dt;
      q.y += q.vy * dt;
      q.life -= dt;
      if (q.life <= 0) {
        particles[i] = particles[particles.length - 1];
        particles.pop();
      }
    }
  }

  function spawnBurst(x, y) {
    var count = 90 + Math.floor(Math.random() * 50);
    var baseHue = Math.random() * 360;
    for (var i = 0; i < count; i++) {
      if (particles.length >= MAX_PARTICLES) break;
      var a = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.25;
      var s = 60 + Math.random() * 260;
      var life = 1.0 + Math.random() * 1.4;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: life, maxLife: life,
        size: Math.random() * 2.2 + 0.8,
        hue: (baseHue + (Math.random() - 0.5) * 60 + 360) % 360
      });
    }
  }

  // ---------- Rendering ----------
  function drawStarfield(t) {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var a = s.base * (0.55 + 0.45 * Math.sin(t * s.tw + s.ph));
      if (a < 0.02) continue;
      ctx.globalAlpha = a;
      ctx.fillStyle = s.hue === 210 ? "#bcd4ff" : (s.hue === 40 ? "#ffe6b8" : "#ffffff");
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawOrbits() {
    ctx.strokeStyle = "rgba(140, 160, 220, 0.08)";
    ctx.lineWidth = 1;
    for (var i = 0; i < planets.length; i++) {
      var R = planets[i].def.r * SCALE;
      ctx.beginPath();
      ctx.ellipse(CX, CY, R, R * 0.92, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawStar(t) {
    var pulse = 1 + 0.06 * Math.sin(t * 1.7) + 0.03 * Math.sin(t * 4.3);
    var coreR = Math.max(18, SCALE * 0.045);

    // Outer corona
    var coronaR = coreR * 4.2 * pulse;
    var g = ctx.createRadialGradient(CX, CY, coreR * 0.5, CX, CY, coronaR);
    g.addColorStop(0, "rgba(255, 200, 110, 0.55)");
    g.addColorStop(0.35, "rgba(255, 140, 60, 0.18)");
    g.addColorStop(0.7, "rgba(255, 90, 40, 0.05)");
    g.addColorStop(1, "rgba(255, 80, 30, 0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(CX, CY, coronaR, 0, Math.PI * 2);
    ctx.fill();

    // Core
    var g2 = ctx.createRadialGradient(CX - coreR * 0.2, CY - coreR * 0.2, 0, CX, CY, coreR * 1.15);
    g2.addColorStop(0, "#fffef5");
    g2.addColorStop(0.4, "#fff1b8");
    g2.addColorStop(0.8, "#ffbf4d");
    g2.addColorStop(1, "rgba(255, 150, 40, 0)");
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(CX, CY, coreR * 1.15, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawTrail(arr, color, width) {
    var n = arr.length / 2;
    if (n < 2) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    for (var i = 1; i < n; i++) {
      ctx.globalAlpha = (i / n) * 0.7;
      ctx.beginPath();
      ctx.moveTo(arr[(i - 1) * 2], arr[(i - 1) * 2 + 1]);
      ctx.lineTo(arr[i * 2], arr[i * 2 + 1]);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawBody(x, y, size, color, glow) {
    // Glow halo
    var halo = ctx.createRadialGradient(x, y, 0, x, y, size * glow);
    halo.addColorStop(0, hexA(color, 0.45));
    halo.addColorStop(1, hexA(color, 0));
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(x, y, size * glow, 0, Math.PI * 2);
    ctx.fill();

    // Lit sphere, shaded away from the star
    var dx = CX - x, dy = CY - y;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    var lx = x + (dx / d) * size * 0.45;
    var ly = y + (dy / d) * size * 0.45;
    var body = ctx.createRadialGradient(lx, ly, size * 0.1, x, y, size);
    body.addColorStop(0, "#ffffff");
    body.addColorStop(0.35, color);
    body.addColorStop(1, shade(color, 0.25));
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawRing(p, back) {
    var s = p.def.size;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(-0.4);
    ctx.strokeStyle = hexA(p.def.color, 0.55);
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (back) ctx.ellipse(0, 0, s * 2.1, s * 0.6, 0, Math.PI, Math.PI * 2);
    else ctx.ellipse(0, 0, s * 2.1, s * 0.6, 0, 0, Math.PI);
    ctx.stroke();
    ctx.restore();
  }

  function drawPlanets() {
    var i, j, p, m;
    if (trailsOn) {
      for (i = 0; i < planets.length; i++) {
        p = planets[i];
        drawTrail(p.trail, p.def.color, Math.max(1.5, p.def.size * 0.35));
        for (j = 0; j < p.moons.length; j++) {
          drawTrail(p.moons[j].trail, p.moons[j].def.color, 1);
        }
      }
    }
    for (i = 0; i < planets.length; i++) {
      p = planets[i];
      if (p.def.ring) drawRing(p, true);
      drawBody(p.x, p.y, p.def.size, p.def.color, 3.2);
      if (p.def.ring) drawRing(p, false);
      for (j = 0; j < p.moons.length; j++) {
        m = p.moons[j];
        drawBody(m.x, m.y, m.def.size, m.def.color, 2.6);
      }
    }
  }

  function drawParticles() {
    if (!particles.length) return;
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < particles.length; i++) {
      var q = particles[i];
      var k = q.life / q.maxLife;
      var r = q.size * (0.6 + k * 0.8);
      ctx.globalAlpha = k * 0.35;
      ctx.fillStyle = "hsl(" + q.hue + ", 100%, 60%)";
      ctx.beginPath();
      ctx.arc(q.x, q.y, r * 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = k;
      ctx.fillStyle = "hsl(" + q.hue + ", 100%, 85%)";
      ctx.beginPath();
      ctx.arc(q.x, q.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  // ---------- Color helpers ----------
  function hexToRgb(hex) {
    var h = hex.replace("#", "");
    return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
  }
  function hexA(hex, a) {
    var c = hexToRgb(hex);
    return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
  }
  function shade(hex, f) {
    var c = hexToRgb(hex);
    return "rgb(" + Math.round(c[0] * f) + "," + Math.round(c[1] * f) + "," + Math.round(c[2] * f) + ")";
  }

  // ---------- Main loop ----------
  var realTime = 0;
  function frame(ts) {
    if (!lastTs) lastTs = ts;
    var rawDt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    realTime += rawDt;

    fpsFrames++;
    fpsAccum += rawDt;
    if (fpsAccum >= 0.5) {
      fpsOut.textContent = Math.round(fpsFrames / fpsAccum);
      fpsFrames = 0;
      fpsAccum = 0;
    }

    if (running) {
      var dt = rawDt * speed;
      step(dt);
      stepParticles(dt);
    }

    ctx.fillStyle = "#060913";
    ctx.fillRect(0, 0, W, H);
    drawStarfield(realTime);
    drawOrbits();
    drawStar(realTime);
    drawPlanets();
    drawParticles();

    timeOut.textContent = simTime.toFixed(1) + " s";
    partOut.textContent = particles.length;

    requestAnimationFrame(frame);
  }

  // ---------- Controls ----------
  playBtn.addEventListener("click", function () {
    running = !running;
    playBtn.textContent = running ? "Pause" : "Play";
  });

  trailBtn.addEventListener("click", function () {
    trailsOn = !trailsOn;
    trailBtn.textContent = trailsOn ? "Trails: ON" : "Trails: OFF";
    trailBtn.classList.toggle("off", !trailsOn);
  });

  resetBtn.addEventListener("click", function () {
    simTime = 0;
    particles.length = 0;
    buildPlanets();
  });

  function syncSpeed() {
    speed = parseFloat(speedInput.value) || 1;
    speedOut.textContent = speed.toFixed(1) + "×";
  }
  speedInput.addEventListener("input", syncSpeed);

  canvas.addEventListener("pointerdown", function (e) {
    var rect = canvas.getBoundingClientRect();
    spawnBurst(e.clientX - rect.left, e.clientY - rect.top);
  });

  window.addEventListener("resize", resize);

  // ---------- Init ----------
  buildPlanets();
  resize();
  syncSpeed();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
