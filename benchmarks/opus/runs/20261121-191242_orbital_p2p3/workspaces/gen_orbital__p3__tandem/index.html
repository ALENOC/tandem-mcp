<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Particle Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #060913;
  }
  body {
    background-color: #060913;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #cdd6f4;
  }
  #sim {
    position: fixed;
    top: 0;
    left: 0;
    display: block;
    width: 100vw;
    height: 100vh;
  }
  .hud {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 10;
    min-width: 236px;
    padding: 16px 18px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 16px;
    background: rgba(18, 24, 48, 0.34);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  .hud h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #9fb4ff;
    margin-bottom: 12px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .row:last-child { margin-bottom: 0; }
  button {
    font: inherit;
    font-size: 13px;
    color: #e6ecff;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 10px;
    padding: 8px 12px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  button:hover { background: rgba(255, 255, 255, 0.16); }
  button:active { transform: translateY(1px); }
  #speed {
    flex: 1;
    accent-color: #7aa2ff;
    cursor: pointer;
  }
  .label { font-size: 12px; color: #8ea0d0; min-width: 46px; }
  .val { font-size: 12px; color: #cdd6f4; min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  .stats {
    display: flex;
    gap: 14px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 12px;
    color: #8ea0d0;
  }
  .stats b { color: #cdd6f4; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <canvas id="sim"></canvas>
  <div class="hud">
    <h1>Orbital Sim</h1>
    <div class="row">
      <button id="playBtn">Pause</button>
      <button id="trailsBtn">Trails: ON</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div class="row">
      <span class="label">Speed</span>
      <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
      <span id="speedVal" class="val">1.0x</span>
    </div>
    <div class="stats">
      <span>FPS <b id="fps">0</b></span>
      <span>Time <b id="simTime">0.0</b></span>
      <span>Particles <b id="particles">0</b></span>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("sim");
  var ctx = canvas.getContext("2d");

  var playBtn = document.getElementById("playBtn");
  var trailsBtn = document.getElementById("trailsBtn");
  var resetBtn = document.getElementById("resetBtn");
  var speedInput = document.getElementById("speed");
  var speedVal = document.getElementById("speedVal");
  var fpsEl = document.getElementById("fps");
  var simTimeEl = document.getElementById("simTime");
  var particlesEl = document.getElementById("particles");

  var TAU = Math.PI * 2;

  // ---- Live app state (same object mutated each frame) ----
  var app = {
    running: true,
    trails: true,
    speed: 1.0,
    simTime: 0,
    particles: [],
    planets: [],
    moonCount: 0,
    stars: []
  };
  window.app = app;

  // ---- Sizing (devicePixelRatio aware) ----
  var W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---- Starfield (>= 150 twinkling stars) ----
  function makeStars() {
    var arr = [];
    for (var i = 0; i < 180; i++) {
      arr.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.4 + 0.3,
        base: Math.random() * 0.5 + 0.3,
        amp: Math.random() * 0.4 + 0.1,
        speed: Math.random() * 2 + 0.5,
        phase: Math.random() * TAU
      });
    }
    return arr;
  }
  app.stars = makeStars();

  // ---- Planets (>= 5, distinct radii / speeds / colors) ----
  var planetDefs = [
    { radius: 70,  size: 5,  speed: 0.90, color: "#ff6b6b", phase: 0.0 },
    { radius: 105, size: 7,  speed: 0.62, color: "#4ecdc4", phase: 1.1 },
    { radius: 145, size: 9,  speed: 0.45, color: "#ffd166", phase: 2.3 },
    { radius: 190, size: 11, speed: 0.32, color: "#a78bfa", phase: 3.6 },
    { radius: 240, size: 13, speed: 0.22, color: "#5eead4", phase: 4.9 },
    { radius: 295, size: 15, speed: 0.15, color: "#f472b6", phase: 5.8 }
  ];
  var TRAIL_LEN = 90;

  function makePlanets() {
    var arr = [];
    for (var i = 0; i < planetDefs.length; i++) {
      var d = planetDefs[i];
      arr.push({
        radius: d.radius,
        size: d.size,
        speed: d.speed,
        color: d.color,
        phase: d.phase,
        angle: d.phase,
        trail: []
      });
    }
    return arr;
  }
  app.planets = makePlanets();

  // ---- Moons (>= 3 orbiting planets) ----
  var moonDefs = [
    { planet: 1, dist: 16, size: 3, speed: 2.2, phase: 0.5 },
    { planet: 3, dist: 22, size: 4, speed: 1.7, phase: 2.0 },
    { planet: 5, dist: 26, size: 4, speed: 1.3, phase: 4.0 }
  ];
  var moons = [];
  for (var m = 0; m < moonDefs.length; m++) {
    var md = moonDefs[m];
    moons.push({
      planet: md.planet,
      dist: md.dist,
      size: md.size,
      speed: md.speed,
      phase: md.phase,
      angle: md.phase
    });
  }
  app.moonCount = moons.length;

  // ---- Burst particles ----
  function spawnBurst(x, y) {
    var n = 48;
    for (var i = 0; i < n; i++) {
      var a = (i / n) * TAU + Math.random() * 0.2;
      var sp = 60 + Math.random() * 160;
      app.particles.push({
        x: x,
        y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        decay: 0.5 + Math.random() * 0.5,
        size: 1.5 + Math.random() * 2.5,
        hue: 180 + Math.random() * 120
      });
    }
  }

  // ---- Controls ----
  function setRunning(v) {
    app.running = v;
    playBtn.textContent = v ? "Pause" : "Play";
  }
  playBtn.addEventListener("click", function () {
    setRunning(!app.running);
  });

  trailsBtn.addEventListener("click", function () {
    app.trails = !app.trails;
    trailsBtn.textContent = app.trails ? "Trails: ON" : "Trails: OFF";
    if (!app.trails) {
      for (var i = 0; i < app.planets.length; i++) app.planets[i].trail.length = 0;
    }
  });

  resetBtn.addEventListener("click", function () {
    app.simTime = 0;
    setRunning(true);
    for (var i = 0; i < app.planets.length; i++) {
      app.planets[i].angle = app.planets[i].phase;
      app.planets[i].trail.length = 0;
    }
    for (var j = 0; j < moons.length; j++) moons[j].angle = moons[j].phase;
    app.particles.length = 0;
  });

  function fmtSpeed(v) {
    return (Math.round(v * 10) / 10).toFixed(1) + "x";
  }
  speedInput.addEventListener("input", function () {
    app.speed = parseFloat(speedInput.value);
    speedVal.textContent = fmtSpeed(app.speed);
  });

  canvas.addEventListener("click", function (e) {
    var rect = canvas.getBoundingClientRect();
    spawnBurst(e.clientX - rect.left, e.clientY - rect.top);
  });

  // ---- Update ----
  function update(dt) {
    if (app.running) {
      app.simTime += dt * app.speed;
    }

    // burst particles always integrate (real time) so they fade out even when paused
    var ps = app.particles;
    for (var i = ps.length - 1; i >= 0; i--) {
      var p = ps[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.94;
      p.vy *= 0.94;
      p.life -= p.decay * dt;
      if (p.life <= 0) ps.splice(i, 1);
    }

    if (app.running) {
      var s = dt * app.speed;
      for (var k = 0; k < app.planets.length; k++) {
        var pl = app.planets[k];
        pl.angle += pl.speed * s;
        if (app.trails) {
          pl.trail.push({ x: Math.cos(pl.angle) * pl.radius, y: Math.sin(pl.angle) * pl.radius });
          if (pl.trail.length > TRAIL_LEN) pl.trail.shift();
        }
      }
      for (var j = 0; j < moons.length; j++) {
        moons[j].angle += moons[j].speed * s;
      }
    }
  }

  // ---- Draw ----
  function drawStar(cx, cy) {
    var t = app.simTime;
    var pulse = 0.5 + 0.5 * Math.sin(t * 1.6);
    var coreR = 26 + pulse * 6;
    var coronaR = 90 + pulse * 22;
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, coronaR);
    g.addColorStop(0, "rgba(255,255,255,0.95)");
    g.addColorStop(0.18, "rgba(255,236,180,0.85)");
    g.addColorStop(0.4, "rgba(255,180,90,0.35)");
    g.addColorStop(0.7, "rgba(255,120,60,0.12)");
    g.addColorStop(1, "rgba(255,120,60,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, coronaR, 0, TAU);
    ctx.fill();

    var cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
    cg.addColorStop(0, "rgba(255,255,255,1)");
    cg.addColorStop(0.6, "rgba(255,244,214,0.95)");
    cg.addColorStop(1, "rgba(255,210,150,0)");
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(cx, cy, coreR, 0, TAU);
    ctx.fill();
  }

  function draw() {
    var cx = W / 2, cy = H / 2;

    ctx.clearRect(0, 0, W, H);

    // starfield
    var t = app.simTime;
    for (var i = 0; i < app.stars.length; i++) {
      var st = app.stars[i];
      var a = st.base + st.amp * Math.sin(t * st.speed + st.phase);
      if (a < 0) a = 0;
      if (a > 1) a = 1;
      ctx.globalAlpha = a;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // central star
    drawStar(cx, cy);

    // planets + trails + moons
    for (var k = 0; k < app.planets.length; k++) {
      var pl = app.planets[k];
      var px = cx + Math.cos(pl.angle) * pl.radius;
      var py = cy + Math.sin(pl.angle) * pl.radius;

      if (app.trails && pl.trail.length > 1) {
        var n = pl.trail.length;
        for (var ti = 0; ti < n; ti++) {
          var tp = pl.trail[ti];
          var alpha = (ti / n) * 0.5;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = pl.color;
          ctx.beginPath();
          ctx.arc(cx + tp.x, cy + tp.y, pl.size * 0.35, 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      // planet glow
      var pg = ctx.createRadialGradient(px, py, 0, px, py, pl.size * 2.4);
      pg.addColorStop(0, pl.color);
      pg.addColorStop(0.5, pl.color);
      pg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.arc(px, py, pl.size * 2.4, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.fillStyle = pl.color;
      ctx.beginPath();
      ctx.arc(px, py, pl.size, 0, TAU);
      ctx.fill();
    }

    // moons
    for (var j = 0; j < moons.length; j++) {
      var mo = moons[j];
      var host = app.planets[mo.planet];
      var hx = cx + Math.cos(host.angle) * host.radius;
      var hy = cy + Math.sin(host.angle) * host.radius;
      var mx = hx + Math.cos(mo.angle) * mo.dist;
      var my = hy + Math.sin(mo.angle) * mo.dist;
      ctx.fillStyle = "#dfe6ff";
      ctx.beginPath();
      ctx.arc(mx, my, mo.size, 0, TAU);
      ctx.fill();
    }

    // burst particles
    for (var b = 0; b < app.particles.length; b++) {
      var p = app.particles[b];
      var la = p.life < 0 ? 0 : p.life;
      ctx.globalAlpha = la;
      ctx.fillStyle = "hsl(" + p.hue + ", 90%, 70%)";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---- Stats ----
  var fps = 0;
  var statAcc = 0;
  function updateStats(dt) {
    statAcc += dt;
    if (statAcc >= 0.2) {
      statAcc = 0;
      fpsEl.textContent = String(fps);
      simTimeEl.textContent = app.simTime.toFixed(1);
      particlesEl.textContent = String(app.particles.length);
    }
  }

  // ---- Main loop ----
  var last = performance.now();
  function frame(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1;
    if (dt > 0) fps = Math.round(1 / dt);

    update(dt);
    draw();
    updateStats(dt);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
