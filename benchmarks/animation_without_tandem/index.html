<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Particle Simulation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #060913; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #dbe7ff; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  .hud {
    position: fixed; top: 16px; left: 16px; width: 248px; padding: 14px 16px;
    background: rgba(18, 28, 54, 0.42); border: 1px solid rgba(140, 180, 255, 0.22);
    border-radius: 14px; backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    user-select: none;
  }
  .hud h1 { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #8fb8ff; margin-bottom: 10px; }
  .row { display: flex; gap: 6px; margin-bottom: 10px; }
  button {
    flex: 1; padding: 7px 0; font: inherit; font-size: 12px; color: #e6efff; cursor: pointer;
    background: rgba(90, 130, 220, 0.18); border: 1px solid rgba(140, 180, 255, 0.3); border-radius: 8px;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: rgba(110, 155, 255, 0.32); border-color: rgba(170, 205, 255, 0.6); }
  button.off { color: #8996b3; background: rgba(60, 70, 100, 0.2); }
  label { display: flex; justify-content: space-between; font-size: 12px; color: #a9bbdf; margin-bottom: 4px; }
  input[type=range] { width: 100%; accent-color: #6ea8ff; margin-bottom: 10px; }
  .stats { display: grid; grid-template-columns: 1fr auto; row-gap: 3px; font-size: 12px; color: #a9bbdf; }
  .stats b { color: #f2f6ff; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .hint { margin-top: 9px; font-size: 11px; color: #7385a8; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="hud">
  <h1>Orbital Simulation</h1>
  <div class="row">
    <button id="btnPlay">Pause</button>
    <button id="btnTrails">Trails ON</button>
    <button id="btnReset">Reset</button>
  </div>
  <label for="speed">Speed <span id="speedVal">1.0x</span></label>
  <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
  <div class="stats">
    <span>FPS</span><b id="fps">0</b>
    <span>Simulation time</span><b id="simTime">0.0 s</b>
    <span>Burst particles</span><b id="bursts">0</b>
  </div>
  <div class="hint">Click anywhere to spawn a particle burst.</div>
</div>
<script>
(function () {
  'use strict';
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;
  let W = 0, H = 0, dpr = 1, cx = 0, cy = 0, scale = 1;

  const PLANETS = [
    { name: 'Ember',  r: 62,  period: 4.2,  size: 4.5,  color: '#ff9b6b', moons: [] },
    { name: 'Verda',  r: 98,  period: 7.0,  size: 6.5,  color: '#7be0a4', moons: [{ r: 13, period: 1.1, size: 1.8, color: '#d8e6d0' }] },
    { name: 'Azure',  r: 140, period: 10.5, size: 7.5,  color: '#5fb4ff', moons: [{ r: 15, period: 1.4, size: 2.0, color: '#cfd8e8' }] },
    { name: 'Rust',   r: 186, period: 15.0, size: 5.5,  color: '#e2674e', moons: [{ r: 11, period: 0.9, size: 1.5, color: '#bfa79c' }, { r: 17, period: 1.9, size: 1.3, color: '#9c8f8a' }] },
    { name: 'Titan',  r: 246, period: 24.0, size: 13.0, color: '#e6c288', ring: true, moons: [{ r: 24, period: 1.6, size: 2.2, color: '#f0e3c8' }, { r: 32, period: 2.8, size: 1.8, color: '#c9d6e6' }] },
    { name: 'Glacia', r: 304, period: 36.0, size: 9.0,  color: '#a58bff', moons: [{ r: 18, period: 2.2, size: 1.9, color: '#dcd2ff' }] }
  ];
  const TRAIL_MAX = 90;
  const state = { running: true, trails: true, speed: 1, time: 0, stars: [], bodies: [], particles: [] };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; cy = H / 2;
    scale = Math.min(W, H) / 700;
    seedStars();
  }

  function seedStars() {
    state.stars = [];
    for (let i = 0; i < 180; i++) {
      state.stars.push({
        x: Math.random() * W, y: Math.random() * H, size: Math.random() * 1.3 + 0.3,
        base: Math.random() * 0.5 + 0.25, rate: Math.random() * 2.2 + 0.6, phase: Math.random() * TAU,
        tint: Math.random() < 0.2 ? '255, 214, 170' : (Math.random() < 0.3 ? '170, 205, 255' : '255, 255, 255')
      });
    }
  }

  function reset() {
    state.time = 0;
    state.particles = [];
    state.bodies = PLANETS.map(function (p, i) {
      return { def: p, phase: i * 1.37 + 0.4, trail: [], moonPhase: p.moons.map(function (_, k) { return k * 2.1 + i; }) };
    });
  }

  function spawnBurst(x, y) {
    const hue = Math.floor(Math.random() * 360);
    const count = 46 + Math.floor(Math.random() * 18);
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * TAU + Math.random() * 0.25;
      const speed = 70 + Math.random() * 210;
      state.particles.push({
        x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: 1, decay: 0.45 + Math.random() * 0.55, size: 1.2 + Math.random() * 2.2,
        hue: (hue + Math.random() * 50 - 25 + 360) % 360
      });
    }
  }

  function update(dt) {
    state.time += dt;
    for (const body of state.bodies) {
      const def = body.def;
      const angle = body.phase + (state.time / def.period) * TAU;
      body.x = cx + Math.cos(angle) * def.r * scale;
      body.y = cy + Math.sin(angle) * def.r * scale * 0.62;
      body.trail.push(body.x, body.y);
      if (body.trail.length > TRAIL_MAX * 2) body.trail.splice(0, 2);
    }
    const damping = Math.pow(0.12, dt);
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.vx *= damping; p.vy *= damping;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0) state.particles.splice(i, 1);
    }
  }

  function drawBackground(now) {
    ctx.fillStyle = '#060913';
    ctx.fillRect(0, 0, W, H);
    for (const s of state.stars) {
      const alpha = s.base + Math.sin(now * s.rate + s.phase) * 0.28;
      ctx.fillStyle = 'rgba(' + s.tint + ', ' + Math.max(0.05, alpha).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, TAU); ctx.fill();
    }
  }

  function drawStar(now) {
    const pulse = 1 + Math.sin(now * 1.7) * 0.07 + Math.sin(now * 4.3) * 0.02;
    const core = 24 * scale;
    const corona = ctx.createRadialGradient(cx, cy, core * 0.4, cx, cy, core * 5.2 * pulse);
    corona.addColorStop(0, 'rgba(255, 214, 130, 0.55)');
    corona.addColorStop(0.35, 'rgba(255, 150, 70, 0.16)');
    corona.addColorStop(1, 'rgba(255, 120, 40, 0)');
    ctx.fillStyle = corona;
    ctx.beginPath(); ctx.arc(cx, cy, core * 5.2 * pulse, 0, TAU); ctx.fill();
    const body = ctx.createRadialGradient(cx - core * 0.25, cy - core * 0.25, 0, cx, cy, core);
    body.addColorStop(0, '#fffbe6'); body.addColorStop(0.45, '#ffd76a'); body.addColorStop(1, '#ff8a2b');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(cx, cy, core * (1 + (pulse - 1) * 0.4), 0, TAU); ctx.fill();
  }

  function drawOrbits() {
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(130, 160, 220, 0.11)';
    for (const p of PLANETS) {
      ctx.beginPath(); ctx.ellipse(cx, cy, p.r * scale, p.r * scale * 0.62, 0, 0, TAU); ctx.stroke();
    }
  }

  function drawBody(body) {
    const def = body.def;
    if (state.trails) {
      const n = body.trail.length / 2;
      ctx.lineCap = 'round';
      for (let i = 1; i < n; i++) {
        ctx.globalAlpha = (i / n) * 0.55;
        ctx.strokeStyle = def.color;
        ctx.lineWidth = Math.max(0.6, def.size * scale * 0.42 * (i / n));
        ctx.beginPath();
        ctx.moveTo(body.trail[(i - 1) * 2], body.trail[(i - 1) * 2 + 1]);
        ctx.lineTo(body.trail[i * 2], body.trail[i * 2 + 1]);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    const radius = def.size * scale;
    const glow = ctx.createRadialGradient(body.x, body.y, 0, body.x, body.y, radius * 3);
    glow.addColorStop(0, def.color + '55'); glow.addColorStop(1, def.color + '00');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(body.x, body.y, radius * 3, 0, TAU); ctx.fill();
    if (def.ring) {
      ctx.strokeStyle = 'rgba(240, 220, 170, 0.55)'; ctx.lineWidth = 2 * scale;
      ctx.beginPath(); ctx.ellipse(body.x, body.y, radius * 1.9, radius * 0.6, -0.35, 0, TAU); ctx.stroke();
    }
    const shade = ctx.createRadialGradient(body.x - radius * 0.35, body.y - radius * 0.35, radius * 0.1, body.x, body.y, radius);
    shade.addColorStop(0, '#ffffff'); shade.addColorStop(0.25, def.color); shade.addColorStop(1, '#0a0f1f');
    ctx.fillStyle = shade;
    ctx.beginPath(); ctx.arc(body.x, body.y, radius, 0, TAU); ctx.fill();
    def.moons.forEach(function (m, k) {
      const a = body.moonPhase[k] + (state.time / m.period) * TAU;
      const mx = body.x + Math.cos(a) * (radius + m.r * scale);
      const my = body.y + Math.sin(a) * (radius + m.r * scale) * 0.7;
      ctx.fillStyle = m.color;
      ctx.beginPath(); ctx.arc(mx, my, Math.max(0.8, m.size * scale), 0, TAU); ctx.fill();
    });
  }

  function drawParticles() {
    ctx.globalCompositeOperation = 'lighter';
    for (const p of state.particles) {
      const alpha = Math.max(0, p.life);
      const radius = p.size * (0.6 + alpha);
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radius * 3);
      g.addColorStop(0, 'hsla(' + p.hue + ', 100%, 75%, ' + alpha.toFixed(3) + ')');
      g.addColorStop(1, 'hsla(' + p.hue + ', 100%, 55%, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, radius * 3, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  const ui = {
    play: document.getElementById('btnPlay'), trails: document.getElementById('btnTrails'),
    reset: document.getElementById('btnReset'), speed: document.getElementById('speed'),
    speedVal: document.getElementById('speedVal'), fps: document.getElementById('fps'),
    time: document.getElementById('simTime'), bursts: document.getElementById('bursts')
  };
  ui.play.addEventListener('click', function () {
    state.running = !state.running;
    ui.play.textContent = state.running ? 'Pause' : 'Play';
    ui.play.classList.toggle('off', !state.running);
  });
  ui.trails.addEventListener('click', function () {
    state.trails = !state.trails;
    ui.trails.textContent = state.trails ? 'Trails ON' : 'Trails OFF';
    ui.trails.classList.toggle('off', !state.trails);
  });
  ui.reset.addEventListener('click', reset);
  ui.speed.addEventListener('input', function () {
    state.speed = parseFloat(ui.speed.value);
    ui.speedVal.textContent = state.speed.toFixed(1) + 'x';
  });
  canvas.addEventListener('click', function (e) { spawnBurst(e.clientX, e.clientY); });
  window.addEventListener('resize', resize);

  let last = performance.now(), frames = 0, fpsClock = 0;
  function frame(nowMs) {
    const real = Math.min(0.05, (nowMs - last) / 1000);
    last = nowMs;
    if (state.running) update(real * state.speed);
    const now = nowMs / 1000;
    drawBackground(now);
    drawOrbits();
    drawStar(now);
    for (const body of state.bodies) drawBody(body);
    drawParticles();
    frames++; fpsClock += real;
    if (fpsClock >= 0.5) {
      ui.fps.textContent = Math.round(frames / fpsClock);
      frames = 0; fpsClock = 0;
    }
    ui.time.textContent = state.time.toFixed(1) + ' s';
    ui.bursts.textContent = state.particles.length;
    requestAnimationFrame(frame);
  }

  resize();
  reset();
  update(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
