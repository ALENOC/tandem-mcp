<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Neon Portal & Floating Monolith — Gemini Hydrogen (Cloud Direct)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #040610; color: #e2e8f0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(8, 13, 28, 0.78); backdrop-filter: blur(8px);
      border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 10px;
      padding: 10px 12px; min-width: 245px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
    }
    .hud h1 { font-size: 12.5px; font-weight: 600; color: #38bdf8; margin-bottom: 6px; letter-spacing: 0.03em; }
    .stats { font-size: 11px; color: #cbd5e1; margin-bottom: 8px; display: flex; gap: 10px; }
    .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    button {
      background: #0f172a; color: #f8fafc; border: 1px solid #334155;
      border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer;
    }
    button:hover { background: #1e293b; border-color: #38bdf8; }
    label { font-size: 11px; color: #cbd5e1; display: flex; align-items: center; gap: 5px; }
    input[type="range"] { width: 80px; accent-color: #38bdf8; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <h1>3D Neon Portal — Gemini Hydrogen</h1>
    <div class="stats">
      <span id="fps">FPS: 60</span>
      <span id="polys">Polys: 0</span>
      <span id="parts">Particles: 0</span>
    </div>
    <div class="controls">
      <button id="playBtn" type="button">Pause</button>
      <button id="orbitBtn" type="button">Orbit: ON</button>
      <button id="resetBtn" type="button">Reset</button>
      <label>Speed <input id="spd" type="range" min="0.2" max="3.0" step="0.1" value="1.0" /><span id="spdVal">1.0x</span></label>
    </div>
  </div>
  <script>
    (() => {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const fpsEl = document.getElementById('fps');
      const polyEl = document.getElementById('polys');
      const partEl = document.getElementById('parts');
      const playBtn = document.getElementById('playBtn');
      const orbitBtn = document.getElementById('orbitBtn');
      const resetBtn = document.getElementById('resetBtn');
      const spdRange = document.getElementById('spd');
      const spdVal = document.getElementById('spdVal');

      let W = 0, H = 0, dpr = 1;
      let running = true, autoOrbit = true, speed = 1.0, simTime = 0;
      let yaw = 0.55, pitch = 0.34, dist = 9.2;
      let dragging = false, lx = 0, ly = 0;
      let lastTs = performance.now(), frames = 0, fpsTs = performance.now();

      const stars = Array.from({ length: 180 }, () => ({
        x: (Math.random() - 0.5) * 80,
        y: (Math.random() - 0.5) * 50,
        z: (Math.random() - 0.5) * 80,
        r: 0.7 + Math.random() * 1.3,
        ph: Math.random() * Math.PI * 2
      }));

      const particles = Array.from({ length: 110 }, () => ({
        a: Math.random() * Math.PI * 2,
        r: 0.5 + Math.random() * 2.8,
        y: -1.8 + Math.random() * 4.8,
        vy: 0.4 + Math.random() * 0.9,
        va: (Math.random() - 0.5) * 0.8,
        sz: 1.5 + Math.random() * 2.5,
        hue: Math.random() < 0.65 ? 195 : 315
      }));

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      canvas.addEventListener('mousedown', e => { dragging = true; lx = e.clientX; ly = e.clientY; });
      window.addEventListener('mouseup', () => { dragging = false; });
      window.addEventListener('mousemove', e => {
        if (!dragging) return;
        yaw += (e.clientX - lx) * 0.008;
        pitch = Math.max(-0.55, Math.min(1.15, pitch + (e.clientY - ly) * 0.008));
        lx = e.clientX; ly = e.clientY;
      });
      canvas.addEventListener('wheel', e => {
        dist = Math.max(5.5, Math.min(16, dist + e.deltaY * 0.005));
      }, { passive: true });

      playBtn.addEventListener('click', () => { running = !running; playBtn.textContent = running ? 'Pause' : 'Play'; });
      orbitBtn.addEventListener('click', () => { autoOrbit = !autoOrbit; orbitBtn.textContent = autoOrbit ? 'Orbit: ON' : 'Orbit: OFF'; });
      resetBtn.addEventListener('click', () => { yaw = 0.55; pitch = 0.34; dist = 9.2; simTime = 0; });
      spdRange.addEventListener('input', () => { speed = parseFloat(spdRange.value); spdVal.textContent = speed.toFixed(1) + 'x'; });

      function project(x, y, z) {
        const cy = Math.cos(yaw), sy = Math.sin(yaw);
        const cp = Math.cos(pitch), sp = Math.sin(pitch);
        const x1 = x * cy - z * sy;
        const z1 = x * sy + z * cy;
        const y2 = y * cp - z1 * sp;
        const z2 = y * sp + z1 * cp + dist;
        if (z2 <= 0.3) return null;
        const fov = Math.min(W, H) * 0.92;
        return { x: W / 2 + (x1 * fov) / z2, y: H / 2 - (y2 * fov) / z2, z: z2 };
      }

      function addBox(polys, cx, cy, cz, sx, sy, sz, baseCol, glow = false) {
        const hx = sx / 2, hy = sy / 2, hz = sz / 2;
        const v = [
          [cx - hx, cy - hy, cz - hz], [cx + hx, cy - hy, cz - hz],
          [cx + hx, cy + hy, cz - hz], [cx - hx, cy + hy, cz - hz],
          [cx - hx, cy - hy, cz + hz], [cx + hx, cy - hy, cz + hz],
          [cx + hx, cy + hy, cz + hz], [cx - hx, cy + hy, cz + hz]
        ];
        const faces = [
          [0, 1, 2, 3, 0.72], [4, 5, 6, 7, 1.0],
          [0, 4, 7, 3, 0.62], [1, 5, 6, 2, 0.85],
          [3, 2, 6, 7, 1.15], [0, 1, 5, 4, 0.45]
        ];
        for (const [a, b, c, d, shade] of faces) {
          const pts = [v[a], v[b], v[c], v[d]].map(p => project(p[0], p[1], p[2]));
          if (pts.some(p => !p)) continue;
          const depth = (pts[0].z + pts[1].z + pts[2].z + pts[3].z) * 0.25;
          polys.push({ pts, depth, shade, baseCol, glow });
        }
      }

      function addOcta(polys, cx, cy, cz, r, h, rot, col) {
        const cr = Math.cos(rot), sr = Math.sin(rot);
        const rotPt = (x, y, z) => [cx + x * cr - z * sr, cy + y, cz + x * sr + z * cr];
        const top = rotPt(0, h, 0), bot = rotPt(0, -h, 0);
        const ring = [rotPt(r, 0, 0), rotPt(0, 0, r), rotPt(-r, 0, 0), rotPt(0, 0, -r)];
        const tris = [
          [top, ring[0], ring[1], 1.15], [top, ring[1], ring[2], 0.9],
          [top, ring[2], ring[3], 0.75], [top, ring[3], ring[0], 1.05],
          [bot, ring[1], ring[0], 0.6], [bot, ring[2], ring[1], 0.5],
          [bot, ring[3], ring[2], 0.45], [bot, ring[0], ring[3], 0.65]
        ];
        for (const [p0, p1, p2, shade] of tris) {
          const pts = [project(...p0), project(...p1), project(...p2)];
          if (pts.some(p => !p)) continue;
          polys.push({ pts, depth: (pts[0].z + pts[1].z + pts[2].z) / 3, shade, baseCol: col, glow: true });
        }
      }

      function render(now) {
        const dt = Math.min(0.05, (now - lastTs) / 1000);
        lastTs = now;
        if (running) {
          simTime += dt * speed;
          if (autoOrbit && !dragging) yaw += 0.28 * dt * speed;
          for (const p of particles) {
            p.y += p.vy * dt * speed;
            p.a += p.va * dt * speed;
            if (p.y > 3.2) { p.y = -1.8; p.r = 0.5 + Math.random() * 2.6; }
          }
        }

        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, '#03050d');
        bg.addColorStop(0.55, '#071126');
        bg.addColorStop(1, '#040610');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        for (const s of stars) {
          const p = project(s.x, s.y, s.z);
          if (!p) continue;
          const alpha = 0.3 + 0.65 * (0.5 + 0.5 * Math.sin(now * 0.002 + s.ph));
          ctx.fillStyle = `rgba(226,232,240,${alpha.toFixed(2)})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // Cyber grid floor
        ctx.lineWidth = 1;
        for (let g = -6; g <= 6; g++) {
          const a = project(g, -2.0, -6), b = project(g, -2.0, 6);
          if (a && b) {
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.14)';
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
          const c = project(-6, -2.0, g), d = project(6, -2.0, g);
          if (c && d) {
            ctx.strokeStyle = 'rgba(168, 85, 247, 0.14)';
            ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.stroke();
          }
        }

        const polys = [];
        const bob = Math.sin(simTime * 1.4) * 0.14;
        // Floating obsidian island + stepped plinth + twin monolith pillars
        addBox(polys, 0, -0.85 + bob, 0, 3.6, 0.45, 3.6, [24, 34, 62]);
        addBox(polys, 0, -1.25 + bob, 0, 2.3, 0.42, 2.3, [15, 23, 42]);
        addBox(polys, 0, -0.45 + bob, 0, 2.2, 0.35, 2.2, [34, 48, 86]);
        addBox(polys, -1.25, 0.75 + bob, 0, 0.45, 2.2, 0.55, [30, 41, 78]);
        addBox(polys, 1.25, 0.75 + bob, 0, 0.45, 2.2, 0.55, [30, 41, 78]);
        addBox(polys, 0, 1.95 + bob, 0, 3.0, 0.32, 0.65, [42, 58, 102]);

        // Floating crystals
        for (let i = 0; i < 6; i++) {
          const ang = simTime * 0.65 + (i * Math.PI * 2) / 6;
          const cr = 2.45;
          const cy = 0.25 + Math.sin(simTime * 2.1 + i) * 0.35 + bob;
          addOcta(polys, Math.cos(ang) * cr, cy, Math.sin(ang) * cr, 0.22, 0.46, simTime * 1.8 + i, i % 2 === 0 ? [56, 189, 248] : [232, 121, 249]);
        }

        polys.sort((a, b) => b.depth - a.depth);
        for (const poly of polys) {
          const [r, g, b] = poly.baseCol;
          const cr = Math.min(255, Math.round(r * poly.shade));
          const cg = Math.min(255, Math.round(g * poly.shade));
          const cb = Math.min(255, Math.round(b * poly.shade));
          ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
          ctx.strokeStyle = poly.glow ? 'rgba(255,255,255,0.35)' : 'rgba(56,189,248,0.22)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(poly.pts[0].x, poly.pts[0].y);
          for (let i = 1; i < poly.pts.length; i++) ctx.lineTo(poly.pts[i].x, poly.pts[i].y);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }

        // Volumetric portal core + rotating 3D energy rings
        const core = project(0, 0.78 + bob, 0);
        if (core) {
          const pulse = 1 + 0.1 * Math.sin(simTime * 3.5);
          const rad = Math.max(24, (280 / core.z) * pulse);
          const grad = ctx.createRadialGradient(core.x, core.y, 4, core.x, core.y, rad);
          grad.addColorStop(0, 'rgba(224, 242, 254, 0.98)');
          grad.addColorStop(0.35, 'rgba(56, 189, 248, 0.72)');
          grad.addColorStop(0.7, 'rgba(192, 132, 252, 0.35)');
          grad.addColorStop(1, 'rgba(192, 132, 252, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath(); ctx.arc(core.x, core.y, rad, 0, Math.PI * 2); ctx.fill();
        }

        for (let ringIdx = 0; ringIdx < 2; ringIdx++) {
          const rr = ringIdx === 0 ? 0.92 : 0.68;
          const tilt = ringIdx === 0 ? simTime * 1.4 : -simTime * 1.9;
          ctx.strokeStyle = ringIdx === 0 ? 'rgba(56, 189, 248, 0.88)' : 'rgba(232, 121, 249, 0.88)';
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          let started = false;
          for (let k = 0; k <= 40; k++) {
            const a = (k / 40) * Math.PI * 2;
            const lx3 = Math.cos(a) * rr;
            const ly3 = Math.sin(a) * rr * Math.cos(tilt);
            const lz3 = Math.sin(a) * rr * Math.sin(tilt);
            const p = project(lx3, 0.78 + bob + ly3, lz3);
            if (!p) continue;
            if (!started) { ctx.moveTo(p.x, p.y); started = true; } else ctx.lineTo(p.x, p.y);
          }
          ctx.stroke();
        }

        for (const pt of particles) {
          const p = project(Math.cos(pt.a) * pt.r, pt.y, Math.sin(pt.a) * pt.r);
          if (!p) continue;
          const alpha = Math.max(0, 1 - Math.abs(pt.y - 0.7) / 2.6);
          ctx.fillStyle = `hsla(${pt.hue}, 95%, 70%, ${alpha.toFixed(2)})`;
          ctx.beginPath(); ctx.arc(p.x, p.y, pt.sz * (6 / p.z), 0, Math.PI * 2); ctx.fill();
        }

        frames++;
        if (now - fpsTs >= 500) {
          fpsEl.textContent = 'FPS: ' + Math.round((frames * 1000) / (now - fpsTs));
          frames = 0; fpsTs = now;
        }
        polyEl.textContent = 'Polys: ' + polys.length;
        partEl.textContent = 'Particles: ' + particles.length;
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
