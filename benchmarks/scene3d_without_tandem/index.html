<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Portal 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #020309; }
  body { background: radial-gradient(ellipse at 50% 42%, #0d1633 0%, #050814 55%, #020309 100%); }
  #c { display: block; width: 100vw; height: 100vh; cursor: grab; }
  #c:active { cursor: grabbing; }
  .hud {
    position: fixed; top: 14px; left: 14px; width: 268px; padding: 10px 12px;
    font: 11px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #c8d4ee;
    background: rgba(20, 30, 60, 0.38); border: 1px solid rgba(120, 220, 255, 0.22); border-radius: 12px;
    backdrop-filter: blur(14px) saturate(150%); -webkit-backdrop-filter: blur(14px) saturate(150%);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    user-select: none;
  }
  .hud-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .hud-title { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #eaf6ff; }
  .hud-badge {
    font-size: 9px; letter-spacing: 0.08em; padding: 2px 6px; border-radius: 5px; color: #7fe9ff; white-space: nowrap;
    background: rgba(0, 220, 255, 0.12); border: 1px solid rgba(0, 220, 255, 0.35);
  }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 8px; }
  .stat { padding: 4px 0; text-align: center; border-radius: 6px; background: rgba(255, 255, 255, 0.05); }
  .stat b { display: block; font-size: 13px; color: #fff; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 9px; letter-spacing: 0.1em; color: #7f93bd; }
  .btns { display: flex; gap: 5px; margin-bottom: 8px; }
  button {
    flex: 1; padding: 5px 0; font: inherit; color: #dff3ff; cursor: pointer; border-radius: 6px;
    background: rgba(0, 200, 255, 0.12); border: 1px solid rgba(0, 220, 255, 0.3);
  }
  button:hover { background: rgba(0, 220, 255, 0.26); }
  button.off { color: #8792ad; background: rgba(255, 255, 255, 0.04); border-color: rgba(255, 255, 255, 0.14); }
  .slider { display: flex; align-items: center; gap: 8px; }
  .slider input { flex: 1; accent-color: #ff4fd8; }
  .slider b { width: 34px; text-align: right; color: #fff; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="hud-head"><span class="hud-title">NEON PORTAL 3D</span><span class="hud-badge">CLOUD DIRECT</span></div>
  <div class="stats">
    <div class="stat"><b id="fps">0</b><span>FPS</span></div>
    <div class="stat"><b id="polys">0</b><span>POLYS</span></div>
    <div class="stat"><b id="parts">0</b><span>PARTS</span></div>
  </div>
  <div class="btns">
    <button id="btnPause">Pause</button>
    <button id="btnOrbit">Orbit ON</button>
    <button id="btnReset">Reset</button>
  </div>
  <div class="slider"><span>Speed</span><input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0"><b id="spdVal">1.0x</b></div>
</div>
<script>
(function () {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;
  const CAM0 = { yaw: 0.55, pitch: 0.34, dist: 9.6, fov: 580 };
  const TARGET = [0, 0.35, 0];
  const LIGHT = norm([0.45, 0.8, -0.4]);
  const cam = Object.assign({}, CAM0);
  const state = { paused: false, orbit: true, speed: 1, time: 0 };
  let W = 0, H = 0, dpr = 1, view = 1;

  function norm(v) { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }

  // camera: rotate the world by yaw around Y and pitch around X, then push it away by dist
  let cyw = 1, syw = 0, cpt = 1, spt = 0;
  function project(p) {
    const x = p[0] - TARGET[0], y = p[1] - TARGET[1], z = p[2] - TARGET[2];
    const x1 = x * cyw - z * syw, z1 = x * syw + z * cyw;
    const y2 = y * cpt + z1 * spt, z2 = -y * spt + z1 * cpt;
    const depth = z2 + cam.dist;
    if (depth < 0.2) return null;
    const s = cam.fov * view / depth;
    return { x: W / 2 + x1 * s, y: H * 0.5 - y2 * s, z: depth, s: s };
  }

  // geometry -----------------------------------------------------------------------------------
  const solids = [];
  function box(cx, cy, cz, sx, sy, sz, color, glow) {
    const x0 = cx - sx / 2, x1 = cx + sx / 2, y0 = cy - sy / 2, y1 = cy + sy / 2, z0 = cz - sz / 2, z1 = cz + sz / 2;
    const v = [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]];
    [[0, 1, 2, 3], [5, 4, 7, 6], [4, 0, 3, 7], [1, 5, 6, 2], [3, 2, 6, 7], [4, 5, 1, 0]].forEach(function (f) {
      solids.push({ pts: f.map(function (i) { return v[i]; }), color: color, glow: glow || 0 });
    });
  }
  const OBSIDIAN = [26, 30, 52], PILLAR = [34, 40, 70], CROWN = [52, 44, 92];
  box(0, -1.45, 0, 5.6, 0.4, 3.6, OBSIDIAN, 0.05);        // lower tier, top at y = -1.25
  box(0, -1.05, 0, 4.2, 0.4, 2.4, [32, 36, 62], 0.08);    // upper tier, top at y = -0.85
  box(-1.25, 0.42, 0, 0.5, 2.55, 0.5, PILLAR, 0.12);      // twin pillars at x = -1.25 and x = 1.25
  box(1.25, 0.42, 0, 0.5, 2.55, 0.5, PILLAR, 0.12);
  box(0, 1.95, 0, 3.4, 0.5, 0.7, [40, 46, 80], 0.14);     // lintel at y = 1.95
  box(0, 2.32, 0, 2.2, 0.24, 0.5, CROWN, 0.3);            // crown cap at y = 2.32

  const crystals = [];
  for (let i = 0; i < 6; i++) {
    crystals.push({ angle: (i / 6) * TAU, color: i % 2 ? [255, 70, 215] : [40, 225, 255], spin: 0.9 + i * 0.13, phase: i * 1.7 });
  }
  const OCTA = [[0, 0.42, 0], [0, -0.42, 0], [0.24, 0, 0], [-0.24, 0, 0], [0, 0, 0.24], [0, 0, -0.24]];
  const OCTA_FACES = [[0, 2, 4], [0, 4, 3], [0, 3, 5], [0, 5, 2], [1, 4, 2], [1, 3, 4], [1, 5, 3], [1, 2, 5]];

  const stars = [];
  for (let i = 0; i < 180; i++) {
    const a = Math.random() * TAU, e = Math.random() * 1.25 - 0.1;
    stars.push({ p: [Math.cos(a) * Math.cos(e) * 42, Math.sin(e) * 42 + 3, Math.sin(a) * Math.cos(e) * 42],
                 size: 0.5 + Math.random() * 1.2, rate: 0.7 + Math.random() * 2.4, phase: Math.random() * TAU });
  }
  const particles = [];
  function seedParticle(p, anywhere) {
    const a = Math.random() * TAU, r = 0.3 + Math.random() * 3.1;
    p.x = Math.cos(a) * r; p.z = Math.sin(a) * r;
    p.y = anywhere ? -1.9 + Math.random() * 5.4 : -1.9;
    p.v = 0.35 + Math.random() * 0.75; p.sway = Math.random() * TAU;
    p.hue = Math.random() < 0.5 ? 188 : 312; p.size = 0.02 + Math.random() * 0.035;
  }
  for (let i = 0; i < 110; i++) { const p = {}; seedParticle(p, true); particles.push(p); }

  // drawing ------------------------------------------------------------------------------------
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    view = Math.min(W / 1180, H / 720) * 1.05;
  }

  function line3(a, b) {
    const pa = project(a), pb = project(b);
    if (!pa || !pb) return;
    ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y);
  }

  function drawStars(t) {
    for (const s of stars) {
      const p = project(s.p);
      if (!p) continue;
      ctx.globalAlpha = 0.35 + 0.4 * Math.sin(t * s.rate + s.phase) ** 2;
      ctx.fillStyle = '#dfe9ff';
      ctx.fillRect(p.x, p.y, s.size, s.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawGrid(t) {
    const Y = -2.0, N = 12, STEP = 1.0;
    for (let pass = 0; pass < 2; pass++) {
      ctx.beginPath();
      for (let i = -N; i <= N; i++) {
        const major = i % 4 === 0;
        if ((pass === 1) !== major) continue;
        line3([i * STEP, Y, -N * STEP], [i * STEP, Y, N * STEP]);
        line3([-N * STEP, Y, i * STEP], [N * STEP, Y, i * STEP]);
      }
      ctx.strokeStyle = pass ? 'rgba(0, 225, 255, ' + (0.42 + 0.1 * Math.sin(t * 1.3)).toFixed(3) + ')' : 'rgba(70, 110, 220, 0.2)';
      ctx.lineWidth = pass ? 1.3 : 1;
      ctx.stroke();
    }
  }

  function shade(face, pts) {
    const n = norm(cross(sub(pts[1], pts[0]), sub(pts[2], pts[0])));
    const lit = Math.max(0, n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2]);
    const k = 0.42 + lit * 0.95 + face.glow;
    const c = face.color;
    return 'rgb(' + Math.min(255, c[0] * k | 0) + ',' + Math.min(255, c[1] * k | 0) + ',' + Math.min(255, c[2] * k | 0) + ')';
  }

  function ring(t, radius, tiltX, tiltZ, spin, color, width) {
    ctx.beginPath();
    const ca = Math.cos(tiltX), sa = Math.sin(tiltX), cb = Math.cos(tiltZ), sb = Math.sin(tiltZ);
    for (let i = 0; i <= 64; i++) {
      const a = (i / 64) * TAU + spin;
      let x = Math.cos(a) * radius, y = Math.sin(a) * radius, z = 0;
      const y1 = y * ca - z * sa, z1 = y * sa + z * ca;       // tilt around X
      const x2 = x * cb - z1 * sb, z2 = x * sb + z1 * cb;     // tilt around Y
      const p = project([x2, 0.55 + y1, z2]);
      if (!p) continue;
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
  }

  function drawPortal(t) {
    const c = project([0, 0.55, 0]);
    if (!c) return;
    const pulse = 1 + 0.06 * Math.sin(t * 2.4);
    const r = 1.05 * c.s * pulse;
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, r * 1.9);
    g.addColorStop(0, 'rgba(235, 255, 255, 0.95)');
    g.addColorStop(0.18, 'rgba(90, 235, 255, 0.75)');
    g.addColorStop(0.45, 'rgba(190, 70, 255, 0.34)');
    g.addColorStop(1, 'rgba(255, 60, 210, 0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(c.x, c.y, r * 1.9, 0, TAU); ctx.fill();
    ring(t, 1.0, 0.35, 0.3, t * 0.9, 'rgba(60, 235, 255, 0.9)', 2.4);
    ring(t, 1.0, 0.35, 0.3, t * 0.9, 'rgba(60, 235, 255, 0.22)', 7);
    ring(t, 0.78, -0.5, -0.45, -t * 1.25, 'rgba(255, 80, 220, 0.9)', 2);
    ring(t, 0.78, -0.5, -0.45, -t * 1.25, 'rgba(255, 80, 220, 0.2)', 6);
    ctx.globalCompositeOperation = 'source-over';
  }

  function render(t) {
    cyw = Math.cos(cam.yaw); syw = Math.sin(cam.yaw); cpt = Math.cos(cam.pitch); spt = Math.sin(cam.pitch);
    ctx.clearRect(0, 0, W, H);
    drawStars(t);
    drawGrid(t);
    const items = [];
    function addFace(face, pts) {
      const proj = pts.map(project);
      if (proj.some(function (p) { return !p; })) return;
      let depth = 0;
      for (const p of proj) depth += p.z;
      items.push({ depth: depth / proj.length, proj: proj, fill: shade(face, pts), edge: face.edge });
    }
    for (const face of solids) addFace(face, face.pts);
    for (const c of crystals) {
      const a = c.angle + t * 0.35, spin = t * c.spin;
      const ox = Math.cos(a) * 2.45, oz = Math.sin(a) * 2.45, oy = 0.5 + Math.sin(t * 1.4 + c.phase) * 0.28;
      const cs = Math.cos(spin), sn = Math.sin(spin);
      const v = OCTA.map(function (p) { return [ox + p[0] * cs - p[2] * sn, oy + p[1], oz + p[0] * sn + p[2] * cs]; });
      for (const f of OCTA_FACES) addFace({ color: c.color, glow: 0.35, edge: true }, [v[f[0]], v[f[1]], v[f[2]]]);
    }
    const portal = project([0, 0.55, 0]);
    if (portal) items.push({ depth: portal.z, portal: true });
    items.sort(function (a, b) { return b.depth - a.depth; });
    let polys = 0;
    for (const it of items) {
      if (it.portal) { drawPortal(t); continue; }
      ctx.beginPath();
      ctx.moveTo(it.proj[0].x, it.proj[0].y);
      for (let i = 1; i < it.proj.length; i++) ctx.lineTo(it.proj[i].x, it.proj[i].y);
      ctx.closePath();
      ctx.fillStyle = it.fill; ctx.fill();
      ctx.strokeStyle = it.edge ? 'rgba(255, 255, 255, 0.55)' : 'rgba(0, 215, 255, 0.34)';
      ctx.lineWidth = 1; ctx.stroke();
      polys++;
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      const q = project([p.x + Math.sin(t * 1.1 + p.sway) * 0.12, p.y, p.z + Math.cos(t * 0.9 + p.sway) * 0.12]);
      if (!q) continue;
      const r = Math.max(0.7, p.size * q.s);
      const fade = Math.min(1, (p.y + 1.9) / 0.6) * Math.min(1, (3.6 - p.y) / 1.2);
      ctx.fillStyle = 'hsla(' + p.hue + ', 100%, 68%, ' + (Math.max(0, fade) * 0.85).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    return polys;
  }

  // loop and controls --------------------------------------------------------------------------
  const ui = {};
  ['fps', 'polys', 'parts', 'btnPause', 'btnOrbit', 'btnReset', 'speed', 'spdVal'].forEach(function (id) { ui[id] = document.getElementById(id); });
  ui.btnPause.addEventListener('click', function () {
    state.paused = !state.paused;
    ui.btnPause.textContent = state.paused ? 'Play' : 'Pause';
    ui.btnPause.classList.toggle('off', state.paused);
  });
  ui.btnOrbit.addEventListener('click', function () {
    state.orbit = !state.orbit;
    ui.btnOrbit.textContent = state.orbit ? 'Orbit ON' : 'Orbit OFF';
    ui.btnOrbit.classList.toggle('off', !state.orbit);
  });
  ui.btnReset.addEventListener('click', function () {
    Object.assign(cam, CAM0);
    state.time = 0;
    for (const p of particles) seedParticle(p, true);
  });
  ui.speed.addEventListener('input', function () {
    state.speed = parseFloat(ui.speed.value);
    ui.spdVal.textContent = state.speed.toFixed(1) + 'x';
  });
  let drag = null;
  canvas.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointerup', function () { drag = null; });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag) return;
    cam.yaw += (e.clientX - drag.x) * 0.006;
    cam.pitch = Math.max(0.05, Math.min(1.2, cam.pitch + (e.clientY - drag.y) * 0.004));
    drag = { x: e.clientX, y: e.clientY };
  });
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    cam.dist = Math.max(5, Math.min(18, cam.dist + e.deltaY * 0.01));
  }, { passive: false });
  window.addEventListener('resize', resize);

  let last = performance.now(), frames = 0, clock = 0;
  function frame(now) {
    const real = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!state.paused) {
      const dt = real * state.speed;
      state.time += dt;
      if (state.orbit && !drag) cam.yaw += dt * 0.22;
      for (const p of particles) {
        p.y += p.v * dt;
        if (p.y > 3.6) seedParticle(p, false);
      }
    }
    const polys = render(state.time);
    frames++; clock += real;
    if (clock >= 0.5) {
      ui.fps.textContent = Math.round(frames / clock);
      ui.polys.textContent = polys;
      ui.parts.textContent = particles.length;
      frames = 0; clock = 0;
    }
    requestAnimationFrame(frame);
  }
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
