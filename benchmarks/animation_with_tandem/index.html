<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Particle Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #060913; }
  #sky { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    width: 248px;
    background: rgba(18, 28, 54, 0.42);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(140, 180, 255, 0.22);
    border-radius: 14px;
    padding: 16px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #cdd8f0;
    user-select: none;
  }
  #hud h1 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    margin-bottom: 14px;
    color: #e8eeff;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .btn-row button {
    flex: 1;
    white-space: nowrap;
    padding: 8px 4px;
    font-size: 12px;
    font-weight: 600;
    color: #dfe8ff;
    background: rgba(90, 130, 220, 0.18);
    border: 1px solid rgba(140, 180, 255, 0.3);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-row button:hover { background: rgba(90, 130, 220, 0.32); }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .slider-row label { font-size: 11px; white-space: nowrap; }
  .slider-row input[type="range"] { flex: 1; accent-color: #5fb4ff; }
  #speedVal {
    font-size: 12px;
    font-weight: 700;
    min-width: 34px;
    text-align: right;
    color: #8fc4ff;
    font-variant-numeric: tabular-nums;
  }
  .readouts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 12px;
    font-variant-numeric: tabular-nums;
  }
  .readouts .cell {
    display: flex;
    flex-direction: column;
  }
  .readouts .lbl {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #7a8db5;
    margin-bottom: 2px;
  }
  .readouts .val {
    font-size: 15px;
    font-weight: 700;
    color: #eaf0ff;
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="hud">
  <h1>Orbital Sim</h1>
  <div class="btn-row">
    <button id="btnPlay">Pause</button>
    <button id="btnTrails">Trails ON</button>
    <button id="btnReset">Reset</button>
  </div>
  <div class="slider-row">
    <label for="speed">Speed</label>
    <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
    <span id="speedVal">1.0x</span>
  </div>
  <div class="readouts">
    <div class="cell"><span class="lbl">FPS</span><span class="val" id="fps">0</span></div>
    <div class="cell"><span class="lbl">Time</span><span class="val" id="simTime">0.0 s</span></div>
    <div class="cell"><span class="lbl">Bursts</span><span class="val" id="bursts">0</span></div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var btnPlay = document.getElementById('btnPlay');
  var btnTrails = document.getElementById('btnTrails');
  var btnReset = document.getElementById('btnReset');
  var speedEl = document.getElementById('speed');
  var speedVal = document.getElementById('speedVal');
  var fpsEl = document.getElementById('fps');
  var simTimeEl = document.getElementById('simTime');
  var burstsEl = document.getElementById('bursts');

  var W = 0, H = 0, dpr = 1, scale = 1, cx = 0, cy = 0;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scale = Math.min(W, H) / 700;
    cx = W / 2;
    cy = H / 2;
  }
  resize();
  window.addEventListener('resize', resize);

  // ---- State ----
  var playing = true;
  var trailsOn = true;
  var speed = 1.0;
  var simT = 0;
  var lastNow = 0;
  var fps = 0;
  var fpsAcc = 0, fpsCount = 0;

  // ---- Planets ----
  var orbitRadii = [62, 98, 140, 186, 246, 304];
  var periods = [4.2, 7, 10.5, 15, 24, 36];
  var sizes = [4.5, 6.5, 7.5, 5.5, 13, 9];
  var colors = ['#ff9b6b', '#7be0a4', '#5fb4ff', '#e2674e', '#e6c288', '#a58bff'];
  var moonsPer = [0, 1, 1, 2, 2, 1];
  var startPhases = [];
  for (var i = 0; i < 6; i++) startPhases[i] = i * 1.37 + 0.4;

  var trails = [];
  for (var i = 0; i < 6; i++) trails[i] = [];

  // ---- Background stars ----
  var bgStars = [];
  for (var i = 0; i < 180; i++) {
    var r = 0.3 + Math.random() * 1.3;
    var base = 0.35 + Math.random() * 0.45;
    var rate = 1.5 + Math.random() * 3;
    var phase = Math.random() * Math.PI * 2;
    var tint = Math.random();
    var col;
    if (tint < 0.2) col = 'rgb(255, 214, 170)';
    else if (tint < 0.55) col = 'rgb(170, 205, 255)';
    else col = 'rgb(255, 255, 255)';
    bgStars.push({
      x: Math.random(),
      y: Math.random(),
      r: r,
      base: base,
      rate: rate,
      phase: phase,
      col: col
    });
  }

  // ---- Burst particles ----
  var bursts = [];

  function spawnBurst(px, py) {
    var count = 46 + Math.floor(Math.random() * 19);
    for (var i = 0; i < count; i++) {
      var ang = (i / count) * Math.PI * 2 + Math.random() * 0.1;
      var spd = 70 + Math.random() * 210;
      var hue = Math.floor(Math.random() * 360);
      var size = 1.5 + Math.random() * 2.5;
      var decay = 0.45 + Math.random() * 0.55;
      bursts.push({
        x: px, y: py,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        hue: hue,
        size: size,
        life: 1,
        decay: decay
      });
    }
  }

  canvas.addEventListener('click', function (e) {
    var rect = canvas.getBoundingClientRect();
    var px = e.clientX - rect.left;
    var py = e.clientY - rect.top;
    spawnBurst(px, py);
  });

  // ---- HUD ----
  btnPlay.addEventListener('click', function () {
    playing = !playing;
    btnPlay.textContent = playing ? 'Pause' : 'Play';
  });
  btnTrails.addEventListener('click', function () {
    trailsOn = !trailsOn;
    btnTrails.textContent = trailsOn ? 'Trails ON' : 'Trails OFF';
  });
  btnReset.addEventListener('click', function () {
    simT = 0;
    for (var i = 0; i < 6; i++) trails[i] = [];
    bursts.length = 0;
  });
  speedEl.addEventListener('input', function () {
    speed = parseFloat(speedEl.value);
    speedVal.textContent = speed.toFixed(1) + 'x';
  });

  // ---- Drawing helpers ----
  function drawStar() {
    var t = simT;
    var coreR = 24 * scale;
    var pulse = 1 + 0.07 * Math.sin(1.7 * t);
    var coronaR = coreR * 5.2 * pulse;

    // Corona
    var cg = ctx.createRadialGradient(cx, cy, coreR * 0.5, cx, cy, coronaR);
    cg.addColorStop(0, 'rgba(255, 214, 130, 0.55)');
    cg.addColorStop(1, 'rgba(255, 214, 130, 0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(cx, cy, coronaR, 0, Math.PI * 2);
    ctx.fill();

    // Core
    var sg = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
    sg.addColorStop(0, '#fffbe6');
    sg.addColorStop(0.45, '#ffd76a');
    sg.addColorStop(1, '#ff8a2b');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawOrbits() {
    ctx.strokeStyle = 'rgba(130, 160, 220, 0.11)';
    ctx.lineWidth = 1;
    for (var i = 0; i < 6; i++) {
      var rx = orbitRadii[i] * scale;
      var ry = rx * 0.62;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function planetPos(i, t) {
    var ang = startPhases[i] + (t / periods[i]) * Math.PI * 2;
    var rx = orbitRadii[i] * scale;
    var ry = rx * 0.62;
    return {
      x: cx + Math.cos(ang) * rx,
      y: cy + Math.sin(ang) * ry
    };
  }

  function drawTrails() {
    if (!trailsOn) return;
    for (var i = 0; i < 6; i++) {
      var tr = trails[i];
      var n = tr.length;
      if (n < 2) continue;
      ctx.lineCap = 'round';
      ctx.strokeStyle = colors[i];
      for (var j = 1; j < n; j++) {
        var idx = j - 1;
        ctx.globalAlpha = (j / n) * 0.55;
        ctx.lineWidth = Math.max(0.6, sizes[i] * scale * 0.42 * j / n);
        ctx.beginPath();
        ctx.moveTo(tr[idx].x, tr[idx].y);
        ctx.lineTo(tr[j].x, tr[j].y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawPlanets(t) {
    for (var i = 0; i < 6; i++) {
      var p = planetPos(i, t);
      var sz = sizes[i] * scale;
      var col = colors[i];

      // Glow
      var glowR = sz * 3;
      var gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR);
      gg.addColorStop(0, col + '55');
      gg.addColorStop(1, col + '00');
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
      ctx.fill();

      // Disc
      var ix = p.x - 0.35 * sz;
      var iy = p.y - 0.35 * sz;
      var dg = ctx.createRadialGradient(ix, iy, 0, p.x, p.y, sz);
      dg.addColorStop(0, '#ffffff');
      dg.addColorStop(0.25, col);
      dg.addColorStop(1, '#0a0f1f');
      ctx.fillStyle = dg;
      ctx.beginPath();
      ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
      ctx.fill();

      // Ring for fifth planet (index 4)
      if (i === 4) {
        ctx.strokeStyle = 'rgba(230, 194, 136, 0.5)';
        ctx.lineWidth = 1.5 * scale;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, sz * 2.2, sz * 0.7, 0.3, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Moons
      var mc = moonsPer[i];
      for (var m = 0; m < mc; m++) {
        var mAng = t * (1.5 + m * 0.7) + i * 2.1 + m * 1.8;
        var mR = sz * (2.0 + m * 0.8);
        var mx = p.x + Math.cos(mAng) * mR;
        var my = p.y + Math.sin(mAng) * mR * 0.6;
        var mSz = Math.max(1.2, sz * 0.25);
        ctx.fillStyle = 'rgba(200, 210, 230, 0.7)';
        ctx.beginPath();
        ctx.arc(mx, my, mSz, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawBgStars(t) {
    for (var i = 0; i < bgStars.length; i++) {
      var s = bgStars[i];
      var alpha = s.base + 0.28 * Math.sin(t * s.rate + s.phase);
      if (alpha < 0) alpha = 0;
      if (alpha > 1) alpha = 1;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = s.col;
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawBursts(dt) {
    if (bursts.length === 0) return;
    ctx.globalCompositeOperation = 'lighter';
    for (var i = bursts.length - 1; i >= 0; i--) {
      var b = bursts[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      var damp = Math.pow(0.12, dt);
      b.vx *= damp;
      b.vy *= damp;
      b.life -= b.decay * dt;
      if (b.life <= 0) {
        bursts.splice(i, 1);
        continue;
      }
      var r = b.size * 3;
      var g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
      g.addColorStop(0, 'hsla(' + b.hue + ', 100%, 75%, ' + b.life + ')');
      g.addColorStop(1, 'hsla(' + b.hue + ', 100%, 75%, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function updateHUD() {
    fpsEl.textContent = String(fps);
    simTimeEl.textContent = simT.toFixed(1) + ' s';
    burstsEl.textContent = String(bursts.length);
  }

  // ---- Main loop ----
  function frame(now) {
    if (!lastNow) lastNow = now;
    var rawDt = (now - lastNow) / 1000;
    lastNow = now;
    var dt = Math.min(rawDt, 0.05);

    // FPS
    fpsAcc += rawDt;
    fpsCount++;
    if (fpsAcc >= 0.5) {
      fps = Math.round(fpsCount / fpsAcc);
      fpsAcc = 0;
      fpsCount = 0;
    }

    if (playing) {
      simT += dt * speed;
    }

    // Update trails
    if (playing && trailsOn) {
      for (var i = 0; i < 6; i++) {
        var p = planetPos(i, simT);
        trails[i].push({ x: p.x, y: p.y });
        if (trails[i].length > 90) trails[i].shift();
      }
    }

    // Draw
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#060913';
    ctx.fillRect(0, 0, W, H);

    drawBgStars(simT);
    drawOrbits();
    drawTrails();
    drawStar();
    drawPlanets(simT);
    drawBursts(dt);

    updateHUD();
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
