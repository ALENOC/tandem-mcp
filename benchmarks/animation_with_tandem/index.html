<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Particle Simulation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }
canvas { display: block; width: 100vw; height: 100vh; }
#hud {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  z-index: 10;
}
#hud button {
  padding: 8px 16px;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  background: rgba(255,255,255,0.08);
  color: #e0e0e0;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s;
}
#hud button:hover { background: rgba(255,255,255,0.15); }
#hud button.active { background: rgba(100,180,255,0.2); border-color: rgba(100,180,255,0.4); }
#hud label { color: #aaa; font-size: 12px; }
#hud input[type=range] { width: 100px; accent-color: #64b4ff; }
#readout {
  color: #8ecfff;
  font-size: 12px;
  font-family: monospace;
  min-width: 180px;
  text-align: right;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <button id="btnPlay">Pause</button>
  <button id="btnTrails" class="active">Trails</button>
  <button id="btnReset">Reset</button>
  <label>Speed <input type="range" id="speedSlider" min="0.2" max="3.0" step="0.1" value="1.0"></label>
  <span id="readout">FPS: 0 | T: 0.0s | Bursts: 0</span>
</div>
<script>
(function() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, cx, cy;
  let dpr = window.devicePixelRatio || 1;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2;
    cy = H / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // State
  let playing = true;
  let showTrails = true;
  let speed = 1.0;
  let simTime = 0;
  let bursts = 0;
  let lastTime = performance.now();
  let fps = 0;
  let fpsFrames = 0;
  let fpsTime = 0;

  // Background stars
  const bgStars = [];
  for (let i = 0; i < 180; i++) {
    bgStars.push({
      x: Math.random(),
      y: Math.random(),
      r: 0.5 + Math.random() * 1.5,
      phase: Math.random() * Math.PI * 2,
      speed: 0.5 + Math.random() * 2
    });
  }

  // Planets
  const planets = [
    { dist: 60, size: 4, speed: 0.8, angle: 0, color: '#ff6b6b', moons: [{ dist: 12, size: 2, speed: 2.0, angle: 0, color: '#ffa0a0' }] },
    { dist: 90, size: 6, speed: 0.5, angle: 1, color: '#ffd93d', moons: [{ dist: 14, size: 2, speed: 1.5, angle: 0.5, color: '#fff3b0' }] },
    { dist: 130, size: 8, speed: 0.3, angle: 2, color: '#6bcb77', moons: [{ dist: 16, size: 3, speed: 1.2, angle: 1, color: '#a8e6cf' }, { dist: 22, size: 2, speed: 0.9, angle: 2, color: '#d4f5e0' }] },
    { dist: 170, size: 5, speed: 0.2, angle: 3, color: '#4d96ff', moons: [{ dist: 13, size: 2, speed: 1.8, angle: 0, color: '#a0c4ff' }] },
    { dist: 210, size: 7, speed: 0.15, angle: 4, color: '#b197fc', moons: [{ dist: 15, size: 2, speed: 1.0, angle: 1.5, color: '#d4c4ff' }] },
    { dist: 250, size: 5, speed: 0.1, angle: 5, color: '#ff9ff3', moons: [{ dist: 14, size: 2, speed: 1.4, angle: 0.8, color: '#ffc4f7' }] }
  ];

  // Trails
  const trails = planets.map(() => []);
  const maxTrailLen = 80;

  // Burst particles
  let burstParticles = [];

  function spawnBurst(x, y) {
    bursts++;
    const count = 30 + Math.floor(Math.random() * 20);
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2 + Math.random() * 0.3;
      const spd = 1 + Math.random() * 3;
      burstParticles.push({
        x, y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        life: 1,
        decay: 0.01 + Math.random() * 0.02,
        size: 1.5 + Math.random() * 2.5,
        hue: Math.random() * 60 + 180
      });
    }
  }

  canvas.addEventListener('click', function(e) {
    const rect = canvas.getBoundingClientRect();
    spawnBurst(e.clientX - rect.left, e.clientY - rect.top);
  });

  // HUD
  const btnPlay = document.getElementById('btnPlay');
  const btnTrails = document.getElementById('btnTrails');
  const btnReset = document.getElementById('btnReset');
  const speedSlider = document.getElementById('speedSlider');
  const readout = document.getElementById('readout');

  btnPlay.addEventListener('click', function() {
    playing = !playing;
    btnPlay.textContent = playing ? 'Pause' : 'Play';
  });
  btnTrails.addEventListener('click', function() {
    showTrails = !showTrails;
    btnTrails.classList.toggle('active', showTrails);
    if (!showTrails) trails.forEach(t => t.length = 0);
  });
  btnReset.addEventListener('click', function() {
    simTime = 0;
    bursts = 0;
    burstParticles = [];
    trails.forEach(t => t.length = 0);
    planets.forEach((p, i) => {
      p.angle = i;
      p.moons.forEach((m, j) => { m.angle = j * 0.5; });
    });
  });
  speedSlider.addEventListener('input', function() {
    speed = parseFloat(speedSlider.value);
  });

  function drawStar(t) {
    const pulse = 1 + 0.15 * Math.sin(t * 2);
    const radius = 25 * pulse;
    // Corona
    const coronaR = radius * 2.5;
    const corona = ctx.createRadialGradient(cx, cy, radius * 0.5, cx, cy, coronaR);
    corona.addColorStop(0, 'rgba(255,200,50,0.3)');
    corona.addColorStop(0.5, 'rgba(255,150,0,0.1)');
    corona.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, coronaR, 0, Math.PI * 2);
    ctx.fillStyle = corona;
    ctx.fill();
    // Star body
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(0.3, '#ffe066');
    grad.addColorStop(0.7, '#ff9f1c');
    grad.addColorStop(1, 'rgba(255,100,0,0.3)');
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }

  function drawBgStars(t) {
    for (let i = 0; i < bgStars.length; i++) {
      const s = bgStars[i];
      const alpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(2) + ')';
      ctx.fill();
    }
  }

  function drawOrbit(dist) {
    ctx.beginPath();
    ctx.arc(cx, cy, dist, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawTrails() {
    for (let i = 0; i < planets.length; i++) {
      const trail = trails[i];
      if (trail.length < 2) continue;
      for (let j = 1; j < trail.length; j++) {
        const alpha = (j / trail.length) * 0.5;
        ctx.beginPath();
        ctx.moveTo(trail[j - 1].x, trail[j - 1].y);
        ctx.lineTo(trail[j].x, trail[j].y);
        ctx.strokeStyle = planets[i].color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }
  }

  function drawPlanets() {
    for (let i = 0; i < planets.length; i++) {
      const p = planets[i];
      const px = cx + Math.cos(p.angle) * p.dist;
      const py = cy + Math.sin(p.angle) * p.dist;
      // Planet
      ctx.beginPath();
      ctx.arc(px, py, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      // Moons
      for (let m = 0; m < p.moons.length; m++) {
        const moon = p.moons[m];
        const mx = px + Math.cos(moon.angle) * moon.dist;
        const my = py + Math.sin(moon.angle) * moon.dist;
        ctx.beginPath();
        ctx.arc(mx, my, moon.size, 0, Math.PI * 2);
        ctx.fillStyle = moon.color;
        ctx.fill();
      }
    }
  }

  function drawBursts() {
    for (let i = burstParticles.length - 1; i >= 0; i--) {
      const p = burstParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.98;
      p.vy *= 0.98;
      p.life -= p.decay;
      if (p.life <= 0) {
        burstParticles.splice(i, 1);
        continue;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fillStyle = 'hsla(' + p.hue + ',80%,60%,' + p.life.toFixed(2) + ')';
      ctx.fill();
    }
  }

  function update(dt) {
    const sdt = dt * speed;
    simTime += sdt;
    for (let i = 0; i < planets.length; i++) {
      const p = planets[i];
      p.angle += p.speed * sdt;
      const px = cx + Math.cos(p.angle) * p.dist;
      const py = cy + Math.sin(p.angle) * p.dist;
      if (showTrails) {
        trails[i].push({ x: px, y: py });
        if (trails[i].length > maxTrailLen) trails[i].shift();
      }
      for (let m = 0; m < p.moons.length; m++) {
        p.moons[m].angle += p.moons[m].speed * sdt;
      }
    }
  }

  function render(t) {
    ctx.clearRect(0, 0, W, H);
    // Background
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
    bg.addColorStop(0, '#0a0a1a');
    bg.addColorStop(1, '#000005');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    drawBgStars(t);
    for (let i = 0; i < planets.length; i++) drawOrbit(planets[i].dist);
    if (showTrails) drawTrails();
    drawStar(t);
    drawPlanets();
    drawBursts();
  }

  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;
    // FPS
    fpsFrames++;
    fpsTime += dt;
    if (fpsTime >= 0.5) {
      fps = Math.round(fpsFrames / fpsTime);
      fpsFrames = 0;
      fpsTime = 0;
    }
    if (playing) update(dt);
    render(simTime);
    readout.textContent = 'FPS: ' + fps + ' | T: ' + simTime.toFixed(1) + 's | Bursts: ' + bursts;
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
