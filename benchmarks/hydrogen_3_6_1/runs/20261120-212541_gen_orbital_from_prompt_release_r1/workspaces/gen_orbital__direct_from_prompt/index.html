<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbital Particle Simulation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060913;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #spaceCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 280px;
      max-width: calc(100vw - 32px);
      padding: 16px;
      border-radius: 16px;
      background: rgba(10, 16, 34, 0.58);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      z-index: 10;
    }

    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .hud-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f8fafc;
    }

    .hud-badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.16);
      border: 1px solid rgba(56, 189, 248, 0.32);
      color: #7dd3fc;
    }

    .controls-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(148, 163, 184, 0.24);
      background: rgba(30, 41, 59, 0.6);
      color: #e2e8f0;
      border-radius: 10px;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.1s ease;
    }

    .btn:hover {
      background: rgba(51, 65, 85, 0.78);
      border-color: rgba(148, 163, 184, 0.45);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn.active {
      background: rgba(56, 189, 248, 0.22);
      border-color: rgba(56, 189, 248, 0.55);
      color: #bae6fd;
    }

    .slider-group {
      margin-bottom: 14px;
    }

    .slider-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .slider-value {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: #7dd3fc;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
      height: 5px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.25);
    }

    .telemetry {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid rgba(148, 163, 184, 0.16);
    }

    .metric {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 10px;
      padding: 8px 6px;
      text-align: center;
    }

    .metric-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      margin-bottom: 3px;
    }

    .metric-value {
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #f8fafc;
    }

    .hud-hint {
      margin-top: 10px;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="spaceCanvas"></canvas>

  <aside class="hud" aria-label="Simulation Controls">
    <div class="hud-header">
      <span class="hud-title">Orbital Sim</span>
      <span class="hud-badge" id="statusBadge">Running</span>
    </div>

    <div class="controls-row">
      <button type="button" class="btn active" id="playPauseBtn">Pause</button>
      <button type="button" class="btn active" id="trailsBtn">Trails: ON</button>
      <button type="button" class="btn" id="resetBtn">Reset</button>
    </div>

    <div class="slider-group">
      <div class="slider-label-row">
        <label for="speedSlider">Time Speed</label>
        <span class="slider-value" id="speedValue">1.0x</span>
      </div>
      <input id="speedSlider" type="range" min="0.2" max="3.0" step="0.1" value="1.0" />
    </div>

    <div class="telemetry">
      <div class="metric">
        <div class="metric-label">FPS</div>
        <div class="metric-value" id="fpsValue">60</div>
      </div>
      <div class="metric">
        <div class="metric-label">Time</div>
        <div class="metric-value" id="simTimeValue">0.0s</div>
      </div>
      <div class="metric">
        <div class="metric-label">Particles</div>
        <div class="metric-value" id="particleCountValue">0</div>
      </div>
    </div>

    <div class="hud-hint">Click anywhere in space to spawn a particle burst</div>
  </aside>

  <script>
    (() => {
      const canvas = document.getElementById("spaceCanvas");
      const ctx = canvas.getContext("2d");

      const playPauseBtn = document.getElementById("playPauseBtn");
      const trailsBtn = document.getElementById("trailsBtn");
      const resetBtn = document.getElementById("resetBtn");
      const speedSlider = document.getElementById("speedSlider");
      const speedValueEl = document.getElementById("speedValue");
      const statusBadge = document.getElementById("statusBadge");
      const fpsValueEl = document.getElementById("fpsValue");
      const simTimeValueEl = document.getElementById("simTimeValue");
      const particleCountValueEl = document.getElementById("particleCountValue");

      const BG_COLOR = "#060913";
      const STAR_COUNT = 220;
      const MAX_TRAIL_POINTS = 70;

      let width = window.innerWidth;
      let height = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      let isPlaying = true;
      let trailsEnabled = true;
      let speedMultiplier = parseFloat(speedSlider.value);
      let simTime = 0;

      // FPS tracking
      let lastFrameTime = performance.now();
      let fpsAccumTime = 0;
      let fpsFrameCount = 0;
      let currentFps = 60;

      // Background starfield
      const starColors = ["#ffffff", "#dbeafe", "#fef3c7", "#e0e7ff", "#bae6fd"];
      const stars = Array.from({ length: STAR_COUNT }, () => ({
        nx: Math.random(),
        ny: Math.random(),
        radius: 0.5 + Math.random() * 1.4,
        baseAlpha: 0.25 + Math.random() * 0.65,
        twinkleSpeed: 0.8 + Math.random() * 2.6,
        twinklePhase: Math.random() * Math.PI * 2,
        color: starColors[Math.floor(Math.random() * starColors.length)]
      }));

      // Planet definitions (6 planets, 4 moons total)
      const planetConfigs = [
        {
          name: "Mercury",
          orbitFactor: 0.11,
          radius: 4.5,
          speed: 1.55,
          initialAngle: 0.4,
          color: "#cbd5e1",
          glow: "rgba(203, 213, 225, 0.35)",
          moons: []
        },
        {
          name: "Venus",
          orbitFactor: 0.165,
          radius: 7,
          speed: 1.08,
          initialAngle: 2.1,
          color: "#fbbf24",
          glow: "rgba(251, 191, 36, 0.38)",
          moons: []
        },
        {
          name: "Terra",
          orbitFactor: 0.23,
          radius: 8.5,
          speed: 0.78,
          initialAngle: 4.2,
          color: "#38bdf8",
          glow: "rgba(56, 189, 248, 0.45)",
          moons: [
            { distance: 17, radius: 2.2, speed: 3.4, initialAngle: 0.8, color: "#e2e8f0" }
          ]
        },
        {
          name: "Ares",
          orbitFactor: 0.295,
          radius: 6.5,
          speed: 0.56,
          initialAngle: 1.1,
          color: "#f87171",
          glow: "rgba(248, 113, 113, 0.4)",
          moons: [
            { distance: 14, radius: 1.8, speed: 4.1, initialAngle: 2.5, color: "#fca5a5" }
          ]
        },
        {
          name: "Jove",
          orbitFactor: 0.375,
          radius: 14,
          speed: 0.34,
          initialAngle: 3.3,
          color: "#fb923c",
          glow: "rgba(251, 146, 60, 0.42)",
          hasRing: true,
          moons: [
            { distance: 24, radius: 2.6, speed: 2.8, initialAngle: 0.2, color: "#fde68a" },
            { distance: 32, radius: 2.1, speed: -2.1, initialAngle: 3.7, color: "#bae6fd" }
          ]
        },
        {
          name: "Neptune",
          orbitFactor: 0.455,
          radius: 10.5,
          speed: 0.22,
          initialAngle: 5.4,
          color: "#818cf8",
          glow: "rgba(129, 140, 248, 0.45)",
          moons: []
        }
      ];

      let planets = [];
      let burstParticles = [];

      function initSimulationState() {
        simTime = 0;
        burstParticles = [];
        planets = planetConfigs.map((cfg) => ({
          ...cfg,
          angle: cfg.initialAngle,
          trail: [],
          moons: cfg.moons.map((m) => ({
            ...m,
            angle: m.initialAngle
          }))
        }));
      }

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function spawnBurst(x, y) {
        const palette = ["#38bdf8", "#818cf8", "#f472b6", "#fbbf24", "#34d399", "#f8fafc"];
        const count = 42;
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.22;
          const speed = 70 + Math.random() * 210;
          const maxLife = 0.75 + Math.random() * 0.85;
          burstParticles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: 1.5 + Math.random() * 2.8,
            life: maxLife,
            maxLife,
            damping: 2.4 + Math.random() * 1.4,
            color: palette[Math.floor(Math.random() * palette.length)]
          });
        }
      }

      function update(dt) {
        const simDt = dt * speedMultiplier;
        simTime += simDt;

        const cx = width / 2;
        const cy = height / 2;
        const minDim = Math.min(width, height);

        for (const planet of planets) {
          planet.angle += planet.speed * simDt;
          const orbitRadius = minDim * planet.orbitFactor;
          const px = cx + Math.cos(planet.angle) * orbitRadius;
          const py = cy + Math.sin(planet.angle) * orbitRadius;

          if (trailsEnabled) {
            const last = planet.trail[planet.trail.length - 1];
            if (!last || Math.hypot(px - last.x, py - last.y) >= 2.5) {
              planet.trail.push({ x: px, y: py });
              if (planet.trail.length > MAX_TRAIL_POINTS) {
                planet.trail.shift();
              }
            }
          }

          for (const moon of planet.moons) {
            moon.angle += moon.speed * simDt;
          }
        }

        // Update burst particles with exponential velocity damping and fade-out
        for (let i = burstParticles.length - 1; i >= 0; i--) {
          const p = burstParticles[i];
          const dampFactor = Math.exp(-p.damping * simDt);
          p.vx *= dampFactor;
          p.vy *= dampFactor;
          p.x += p.vx * simDt;
          p.y += p.vy * simDt;
          p.life -= simDt;
          if (p.life <= 0) {
            burstParticles.splice(i, 1);
          }
        }
      }

      function drawStarfield(realTimeSec) {
        for (const star of stars) {
          const twinkle = 0.55 + 0.45 * Math.sin(realTimeSec * star.twinkleSpeed + star.twinklePhase);
          ctx.globalAlpha = star.baseAlpha * twinkle;
          ctx.fillStyle = star.color;
          ctx.beginPath();
          ctx.arc(star.nx * width, star.ny * height, star.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawCentralStar(cx, cy, minDim) {
        const pulse = Math.sin(simTime * 2.4);
        const coreRadius = Math.max(18, minDim * 0.036);
        const coronaRadius = coreRadius * (3.2 + 0.35 * pulse);

        // Outer pulsing corona
        const coronaGrad = ctx.createRadialGradient(cx, cy, coreRadius * 0.35, cx, cy, coronaRadius);
        coronaGrad.addColorStop(0, "rgba(255, 248, 200, 0.95)");
        coronaGrad.addColorStop(0.28, "rgba(253, 224, 71, 0.55)");
        coronaGrad.addColorStop(0.6, "rgba(249, 115, 22, 0.2)");
        coronaGrad.addColorStop(1, "rgba(249, 115, 22, 0)");

        ctx.fillStyle = coronaGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, coronaRadius, 0, Math.PI * 2);
        ctx.fill();

        // Photosphere core
        const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius);
        coreGrad.addColorStop(0, "#ffffff");
        coreGrad.addColorStop(0.55, "#fef08a");
        coreGrad.addColorStop(1, "#f59e0b");

        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, coreRadius, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawPlanets(cx, cy, minDim) {
        for (const planet of planets) {
          const orbitRadius = minDim * planet.orbitFactor;

          // Subtle orbital guide ring
          ctx.strokeStyle = "rgba(148, 163, 184, 0.08)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(cx, cy, orbitRadius, 0, Math.PI * 2);
          ctx.stroke();

          // Fading orbital trail
          if (trailsEnabled && planet.trail.length > 1) {
            ctx.lineCap = "round";
            for (let i = 1; i < planet.trail.length; i++) {
              const prev = planet.trail[i - 1];
              const curr = planet.trail[i];
              const progress = i / planet.trail.length;
              ctx.strokeStyle = planet.color;
              ctx.globalAlpha = progress * 0.5;
              ctx.lineWidth = Math.max(1, planet.radius * 0.42 * progress);
              ctx.beginPath();
              ctx.moveTo(prev.x, prev.y);
              ctx.lineTo(curr.x, curr.y);
              ctx.stroke();
            }
            ctx.globalAlpha = 1;
          }

          const px = cx + Math.cos(planet.angle) * orbitRadius;
          const py = cy + Math.sin(planet.angle) * orbitRadius;

          // Planet ambient glow
          const glowGrad = ctx.createRadialGradient(px, py, planet.radius * 0.4, px, py, planet.radius * 2.2);
          glowGrad.addColorStop(0, planet.glow);
          glowGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = glowGrad;
          ctx.beginPath();
          ctx.arc(px, py, planet.radius * 2.2, 0, Math.PI * 2);
          ctx.fill();

          // Optional planetary ring
          if (planet.hasRing) {
            ctx.save();
            ctx.translate(px, py);
            ctx.rotate(-0.35);
            ctx.strokeStyle = "rgba(253, 230, 138, 0.45)";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.ellipse(0, 0, planet.radius * 1.85, planet.radius * 0.55, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }

          // Planet body
          ctx.fillStyle = planet.color;
          ctx.beginPath();
          ctx.arc(px, py, planet.radius, 0, Math.PI * 2);
          ctx.fill();

          // Moons / satellites
          for (const moon of planet.moons) {
            const mx = px + Math.cos(moon.angle) * moon.distance;
            const my = py + Math.sin(moon.angle) * moon.distance;

            ctx.strokeStyle = "rgba(148, 163, 184, 0.14)";
            ctx.lineWidth = 0.75;
            ctx.beginPath();
            ctx.arc(px, py, moon.distance, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = moon.color;
            ctx.beginPath();
            ctx.arc(mx, my, moon.radius, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function drawBurstParticles() {
        if (burstParticles.length === 0) return;

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (const p of burstParticles) {
          const alpha = Math.max(0, p.life / p.maxLife);
          const glowRadius = p.radius * 3.2;
          const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowRadius);
          grad.addColorStop(0, p.color);
          grad.addColorStop(1, "rgba(0, 0, 0, 0)");

          ctx.globalAlpha = alpha;
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, glowRadius, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius * 0.65, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function render(nowMs) {
        const realTimeSec = nowMs * 0.001;
        const cx = width / 2;
        const cy = height / 2;
        const minDim = Math.min(width, height);

        ctx.fillStyle = BG_COLOR;
        ctx.fillRect(0, 0, width, height);

        drawStarfield(realTimeSec);
        drawCentralStar(cx, cy, minDim);
        drawPlanets(cx, cy, minDim);
        drawBurstParticles();
      }

      function updateTelemetry(rawDt) {
        fpsAccumTime += rawDt;
        fpsFrameCount += 1;
        if (fpsAccumTime >= 0.4) {
          currentFps = Math.round(fpsFrameCount / fpsAccumTime);
          fpsAccumTime = 0;
          fpsFrameCount = 0;
        }
        fpsValueEl.textContent = String(currentFps);
        simTimeValueEl.textContent = `${simTime.toFixed(1)}s`;
        particleCountValueEl.textContent = String(burstParticles.length);
      }

      function frame(nowMs) {
        const rawDt = Math.min((nowMs - lastFrameTime) / 1000, 0.05);
        lastFrameTime = nowMs;

        if (isPlaying) {
          update(rawDt);
        }

        render(nowMs);
        updateTelemetry(rawDt);
        requestAnimationFrame(frame);
      }

      // Event listeners
      window.addEventListener("resize", resizeCanvas);

      canvas.addEventListener("click", (event) => {
        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        spawnBurst(x, y);
      });

      playPauseBtn.addEventListener("click", () => {
        isPlaying = !isPlaying;
        playPauseBtn.textContent = isPlaying ? "Pause" : "Play";
        playPauseBtn.classList.toggle("active", isPlaying);
        statusBadge.textContent = isPlaying ? "Running" : "Paused";
      });

      trailsBtn.addEventListener("click", () => {
        trailsEnabled = !trailsEnabled;
        trailsBtn.textContent = trailsEnabled ? "Trails: ON" : "Trails: OFF";
        trailsBtn.classList.toggle("active", trailsEnabled);
        if (!trailsEnabled) {
          for (const planet of planets) {
            planet.trail = [];
          }
        }
      });

      resetBtn.addEventListener("click", () => {
        initSimulationState();
      });

      speedSlider.addEventListener("input", () => {
        speedMultiplier = parseFloat(speedSlider.value);
        speedValueEl.textContent = `${speedMultiplier.toFixed(1)}x`;
      });

      // Initialize and start loop
      resizeCanvas();
      initSimulationState();
      requestAnimationFrame((now) => {
        lastFrameTime = now;
        requestAnimationFrame(frame);
      });
    })();
  </script>
</body>
</html>
