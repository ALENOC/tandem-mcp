<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Particle Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #060913;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  #scene {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #060913;
    cursor: crosshair;
  }
  #hud {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 10;
    min-width: 250px;
    padding: 16px 18px;
    border-radius: 16px;
    color: #eaf0ff;
    background: rgba(10, 16, 34, 0.42);
    border: 1px solid rgba(140, 170, 255, 0.22);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    user-select: none;
  }
  #hud h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.85;
    margin-bottom: 12px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  button {
    flex: 1;
    padding: 9px 12px;
    font-size: 13px;
    font-weight: 600;
    color: #eaf0ff;
    background: rgba(120, 150, 255, 0.14);
    border: 1px solid rgba(140, 170, 255, 0.28);
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.08s ease;
  }
  button:hover { background: rgba(120, 150, 255, 0.26); }
  button:active { transform: translateY(1px); }
  button.active { background: rgba(120, 200, 255, 0.30); border-color: rgba(150, 220, 255, 0.5); }
  .slider-wrap { margin-bottom: 12px; }
  .slider-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    opacity: 0.85;
    margin-bottom: 6px;
  }
  #speedVal { font-variant-numeric: tabular-nums; font-weight: 700; color: #9fd0ff; }
  input[type="range"] {
    width: 100%;
    height: 6px;
    border-radius: 6px;
    background: rgba(140, 170, 255, 0.25);
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #9fd0ff;
    border: 2px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 0 10px rgba(159, 208, 255, 0.8);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #9fd0ff;
    border: 2px solid rgba(255, 255, 255, 0.7);
  }
  .telemetry {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .stat {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(140, 170, 255, 0.14);
    border-radius: 10px;
    padding: 8px 6px;
    text-align: center;
  }
  .stat .k { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.6; }
  .stat .v { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  #hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: rgba(200, 220, 255, 0.55);
    pointer-events: none;
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <h1>Orbital Sim</h1>
    <div class="row">
      <button id="playBtn" class="active">Pause</button>
      <button id="trailsBtn" class="active">Trails ON</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div class="slider-wrap">
      <div class="slider-label">
        <span>Speed</span>
        <span id="speedVal">1.0x</span>
      </div>
      <input id="speed" type="range" min="0.2" max="3.0" step="0.1" value="1.0">
    </div>
    <div class="telemetry">
      <div class="stat"><div class="k">FPS</div><div class="v" id="fpsVal">60</div></div>
      <div class="stat"><div class="k">Time</div><div class="v" id="timeVal">0.0s</div></div>
      <div class="stat"><div class="k">Burst</div><div class="v" id="burstVal">0</div></div>
    </div>
  </div>

  <div id="hint">Click anywhere to spawn a particle burst</div>

  <script>
  (function () {
    "use strict";

    var canvas = document.getElementById("scene");
    var ctx = canvas.getContext("2d");

    var W = 0, H = 0, DPR = 1;
    var cx = 0, cy = 0;

    function resize() {
      DPR = window.devicePixelRatio || 1;
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.round(W * DPR);
      canvas.height = Math.round(H * DPR);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      cx = W / 2;
      cy = H / 2;
    }
    window.addEventListener("resize", resize);
    resize();

    // ---- State ----
    var playing = true;
    var trailsOn = true;
    var speed = 1.0;
    var simTime = 0;
    var lastT = performance.now();
    var fpsSmooth = 60;

    // ---- Background starfield ----
    var STAR_COUNT = 180;
    var stars = [];
    function buildStars() {
      stars = [];
      for (var i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x: Math.random(),
          y: Math.random(),
          r: Math.random() * 1.3 + 0.3,
          base: Math.random() * 0.45 + 0.25,
          tw: Math.random() * 2.2 + 0.6,
          ph: Math.random() * Math.PI * 2
        });
      }
    }
    buildStars();

    // ---- Planets and moons ----
    var planets = [
      { orbit: 0.15, speed: 0.95, size: 7,  color: "#5b8cff", angle: 0.0,  moons: [] },
      { orbit: 0.23, speed: 0.62, size: 11, color: "#ff8c5b", angle: 1.1,  moons: [
          { orbit: 0.045, speed: 2.4, size: 3, color: "#cfd8ff", angle: 0.5 }
        ] },
      { orbit: 0.31, speed: 0.44, size: 9,  color: "#4fd1c5", angle: 2.3,  moons: [
          { orbit: 0.05, speed: 2.0, size: 3, color: "#e6f0ff", angle: 2.0 }
        ] },
      { orbit: 0.40, speed: 0.30, size: 13, color: "#c084fc", angle: 3.6,  moons: [
          { orbit: 0.055, speed: 1.8, size: 4, color: "#f0e6ff", angle: 4.0 },
          { orbit: 0.075, speed: 1.2, size: 3, color: "#d8c8ff", angle: 1.0 }
        ] },
      { orbit: 0.50, speed: 0.20, size: 10, color: "#f4d35e", angle: 5.0,  moons: [] }
    ];

    var TRAIL_LEN = 46;
    function resetBodies() {
      for (var i = 0; i < planets.length; i++) {
        planets[i].trail = [];
        for (var j = 0; j < planets[i].moons.length; j++) {
          planets[i].moons[j].trail = [];
        }
      }
    }
    resetBodies();

    // ---- Burst particles ----
    var bursts = [];
    function spawnBurst(x, y) {
      var n = 26 + Math.floor(Math.random() * 10);
      var hue = Math.floor(Math.random() * 360);
      for (var i = 0; i < n; i++) {
        var a = (i / n) * Math.PI * 2 + Math.random() * 0.3;
        var sp = 60 + Math.random() * 160;
        bursts.push({
          x: x, y: y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          life: 1.0,
          decay: 0.5 + Math.random() * 0.6,
          size: 1.5 + Math.random() * 2.5,
          hue: hue + Math.floor(Math.random() * 40 - 20)
        });
      }
    }

    canvas.addEventListener("pointerdown", function (e) {
      var rect = canvas.getBoundingClientRect();
      spawnBurst(e.clientX - rect.left, e.clientY - rect.top);
    });

    // ---- HUD wiring ----
    var playBtn = document.getElementById("playBtn");
    var trailsBtn = document.getElementById("trailsBtn");
    var resetBtn = document.getElementById("resetBtn");
    var speedInput = document.getElementById("speed");
    var speedVal = document.getElementById("speedVal");
    var fpsVal = document.getElementById("fpsVal");
    var timeVal = document.getElementById("timeVal");
    var burstVal = document.getElementById("burstVal");

    playBtn.addEventListener("click", function () {
      playing = !playing;
      playBtn.textContent = playing ? "Pause" : "Play";
      playBtn.classList.toggle("active", playing);
      lastT = performance.now();
    });
    trailsBtn.addEventListener("click", function () {
      trailsOn = !trailsOn;
      trailsBtn.textContent = trailsOn ? "Trails ON" : "Trails OFF";
      trailsBtn.classList.toggle("active", trailsOn);
      if (!trailsOn) resetBodies();
    });
    resetBtn.addEventListener("click", function () {
      simTime = 0;
      bursts = [];
      for (var i = 0; i < planets.length; i++) {
        planets[i].angle = Math.random() * Math.PI * 2;
        for (var j = 0; j < planets[i].moons.length; j++) {
          planets[i].moons[j].angle = Math.random() * Math.PI * 2;
        }
      }
      resetBodies();
      buildStars();
    });
    speedInput.addEventListener("input", function () {
      speed = parseFloat(speedInput.value);
      speedVal.textContent = speed.toFixed(1) + "x";
    });

    // ---- Drawing helpers ----
    function drawStarfield(t) {
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var a = s.base + Math.sin(t * s.tw + s.ph) * 0.3;
        if (a < 0.05) a = 0.05;
        if (a > 1) a = 1;
        ctx.globalAlpha = a;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawCentralStar(t) {
      var pulse = 0.5 + 0.5 * Math.sin(t * 1.6);
      var baseR = Math.min(W, H) * 0.06;
      var coreR = baseR * (1 + pulse * 0.12);
      var coronaR = baseR * (2.6 + pulse * 0.9);

      var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, coronaR);
      g.addColorStop(0, "rgba(255, 255, 255, 0.95)");
      g.addColorStop(0.18, "rgba(255, 236, 180, 0.85)");
      g.addColorStop(0.4, "rgba(255, 180, 90, 0.35)");
      g.addColorStop(0.7, "rgba(255, 120, 60, 0.10)");
      g.addColorStop(1, "rgba(255, 100, 40, 0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, coronaR, 0, Math.PI * 2);
      ctx.fill();

      var core = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
      core.addColorStop(0, "rgba(255, 255, 255, 1)");
      core.addColorStop(0.6, "rgba(255, 244, 214, 0.95)");
      core.addColorStop(1, "rgba(255, 210, 140, 0.4)");
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawTrail(trail, color) {
      var n = trail.length;
      for (var i = 1; i < n; i++) {
        var a = i / n;
        ctx.globalAlpha = a * 0.5;
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
        ctx.lineTo(trail[i].x, trail[i].y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    function drawBody(x, y, size, color) {
      var g = ctx.createRadialGradient(x - size * 0.3, y - size * 0.3, size * 0.1, x, y, size);
      g.addColorStop(0, "rgba(255,255,255,0.9)");
      g.addColorStop(0.5, color);
      g.addColorStop(1, "rgba(0,0,0,0.35)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBursts(dt) {
      for (var i = bursts.length - 1; i >= 0; i--) {
        var p = bursts[i];
        p.life -= p.decay * dt;
        if (p.life <= 0) {
          bursts.splice(i, 1);
          continue;
        }
        p.vx *= Math.pow(0.92, dt * 60);
        p.vy *= Math.pow(0.92, dt * 60);
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        var a = p.life;
        var r = p.size * (0.6 + p.life * 0.8);
        var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 3);
        g.addColorStop(0, "hsla(" + p.hue + ", 100%, 80%, " + a + ")");
        g.addColorStop(0.5, "hsla(" + p.hue + ", 100%, 60%, " + (a * 0.5) + ")");
        g.addColorStop(1, "hsla(" + p.hue + ", 100%, 50%, 0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r * 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ---- Main loop ----
    function frame(now) {
      var rawDt = (now - lastT) / 1000;
      lastT = now;
      if (rawDt > 0.1) rawDt = 0.1;
      var dt = playing ? rawDt * speed : 0;

      if (rawDt > 0) {
        var inst = 1 / rawDt;
        fpsSmooth = fpsSmooth * 0.9 + inst * 0.1;
      }

      simTime += dt;
      var t = simTime;

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#060913";
      ctx.fillRect(0, 0, W, H);

      drawStarfield(t);
      drawCentralStar(t);

      var minDim = Math.min(W, H);
      for (var i = 0; i < planets.length; i++) {
        var pl = planets[i];
        pl.angle += pl.speed * dt;
        var px = cx + Math.cos(pl.angle) * pl.orbit * minDim;
        var py = cy + Math.sin(pl.angle) * pl.orbit * minDim;

        if (trailsOn) {
          pl.trail.push({ x: px, y: py });
          if (pl.trail.length > TRAIL_LEN) pl.trail.shift();
          drawTrail(pl.trail, pl.color);
        }
        drawBody(px, py, pl.size, pl.color);

        for (var j = 0; j < pl.moons.length; j++) {
          var m = pl.moons[j];
          m.angle += m.speed * dt;
          var mx = px + Math.cos(m.angle) * m.orbit * minDim;
          var my = py + Math.sin(m.angle) * m.orbit * minDim;
          if (trailsOn) {
            m.trail.push({ x: mx, y: my });
            if (m.trail.length > TRAIL_LEN) m.trail.shift();
            drawTrail(m.trail, m.color);
          }
          drawBody(mx, my, m.size, m.color);
        }
      }

      drawBursts(rawDt);

      // ---- Telemetry ----
      fpsVal.textContent = Math.round(fpsSmooth);
      timeVal.textContent = simTime.toFixed(1) + "s";
      burstVal.textContent = bursts.length;

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
