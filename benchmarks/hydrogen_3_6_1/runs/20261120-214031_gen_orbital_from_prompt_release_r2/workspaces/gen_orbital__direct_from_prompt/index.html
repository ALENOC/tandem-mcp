<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbital Particle Simulation</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #060913;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #space-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: 280px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(12, 18, 34, 0.58);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hud-title {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #f8fafc;
    }

    .hud-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.16);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #7dd3fc;
      font-weight: 500;
    }

    .hud-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .hud-btn {
      appearance: none;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(30, 41, 59, 0.55);
      color: #f1f5f9;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.1s ease;
    }

    .hud-btn:hover {
      background: rgba(51, 65, 85, 0.72);
      border-color: rgba(148, 163, 184, 0.45);
    }

    .hud-btn:active {
      transform: scale(0.97);
    }

    .hud-btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.5);
      color: #bae6fd;
    }

    .hud-btn-full {
      grid-column: span 2;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: #cbd5e1;
    }

    .slider-value {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: #7dd3fc;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.25);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #38bdf8;
      border: 2px solid #e0f2fe;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #38bdf8;
      border: 2px solid #e0f2fe;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
      cursor: pointer;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(148, 163, 184, 0.16);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 8px;
      padding: 6px 8px;
    }

    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
    }

    .stat-value {
      font-size: 0.85rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #f8fafc;
    }

    .hud-hint {
      font-size: 0.72rem;
      color: #94a3b8;
      text-align: center;
    }

    @media (max-width: 480px) {
      .hud {
        width: calc(100vw - 24px);
        left: 12px;
        top: 12px;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <canvas id="space-canvas"></canvas>

  <aside class="hud" aria-label="Simulation Controls">
    <div class="hud-header">
      <span class="hud-title">Orbital Sim</span>
      <span class="hud-badge" id="status-badge">Running</span>
    </div>

    <div class="hud-controls">
      <button type="button" id="btn-play-pause" class="hud-btn active">Pause</button>
      <button type="button" id="btn-trails" class="hud-btn active">Trails: ON</button>
      <button type="button" id="btn-reset" class="hud-btn hud-btn-full">Reset Simulation</button>
    </div>

    <div class="slider-group">
      <div class="slider-label-row">
        <label for="speed-slider">Orbital Speed</label>
        <span class="slider-value" id="speed-readout">1.0x</span>
      </div>
      <input id="speed-slider" type="range" min="0.2" max="3.0" step="0.1" value="1.0" />
    </div>

    <div class="stats-grid">
      <div class="stat-item">
        <span class="stat-label">FPS</span>
        <span class="stat-value" id="stat-fps">60</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Time</span>
        <span class="stat-value" id="stat-time">0.0s</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Particles</span>
        <span class="stat-value" id="stat-particles">0</span>
      </div>
    </div>

    <p class="hud-hint">Click anywhere on canvas to spawn particle bursts</p>
  </aside>

  <script>
    (() => {
      const canvas = document.getElementById("space-canvas");
      const ctx = canvas.getContext("2d");

      const btnPlayPause = document.getElementById("btn-play-pause");
      const btnTrails = document.getElementById("btn-trails");
      const btnReset = document.getElementById("btn-reset");
      const statusBadge = document.getElementById("status-badge");
      const speedSlider = document.getElementById("speed-slider");
      const speedReadout = document.getElementById("speed-readout");
      const statFps = document.getElementById("stat-fps");
      const statTime = document.getElementById("stat-time");
      const statParticles = document.getElementById("stat-particles");

      let width = window.innerWidth;
      let height = window.innerHeight;
      let dpr = window.devicePixelRatio || 1;
      let centerX = width / 2;
      let centerY = height / 2;
      let baseScale = Math.min(width, height) * 0.44;

      let isRunning = true;
      let trailsEnabled = true;
      let speedMultiplier = parseFloat(speedSlider.value);
      let simTime = 0;

      // FPS tracking
      let lastFrameTime = performance.now();
      let fpsAccum = 0;
      let fpsFrames = 0;
      let displayedFps = 60;

      // Background starfield (>= 150 stars)
      const STAR_COUNT = 220;
      const starColors = ["#ffffff", "#dbeafe", "#fef3c7", "#e0e7ff"];
      const stars = Array.from({ length: STAR_COUNT }, () => ({
        nx: Math.random(),
        ny: Math.random(),
        radius: 0.6 + Math.random() * 1.6,
        baseAlpha: 0.25 + Math.random() * 0.65,
        twinkleSpeed: 0.8 + Math.random() * 2.6,
        phase: Math.random() * Math.PI * 2,
        color: starColors[Math.floor(Math.random() * starColors.length)]
      }));

      // Planet definitions (>= 5 planets, >= 3 moons total)
      const planetSpecs = [
        {
          name: "Mercury",
          orbitFrac: 0.17,
          radius: 4.5,
          speed: 1.95,
          initialAngle: 0.4,
          color: "#94a3b8",
          glow: "rgba(148, 163, 184, 0.45)",
          trailMax: 42,
          moons: []
        },
        {
          name: "Venus",
          orbitFrac: 0.27,
          radius: 7.2,
          speed: 1.35,
          initialAngle: 2.1,
          color: "#f59e0b",
          glow: "rgba(245, 158, 11, 0.45)",
          trailMax: 56,
          moons: []
        },
        {
          name: "Terra",
          orbitFrac: 0.40,
          radius: 8.6,
          speed: 0.95,
          initialAngle: 4.0,
          color: "#38bdf8",
          glow: "rgba(56, 189, 248, 0.55)",
          trailMax: 72,
          moons: [
            { orbitPx: 17, radius: 2.3, speed: 4.2, initialAngle: 0.8, color: "#e2e8f0" }
          ]
        },
        {
          name: "Ares",
          orbitFrac: 0.54,
          radius: 6.4,
          speed: 0.70,
          initialAngle: 1.2,
          color: "#fb7185",
          glow: "rgba(251, 113, 133, 0.5)",
          trailMax: 84,
          moons: [
            { orbitPx: 14, radius: 1.8, speed: 4.8, initialAngle: 2.4, color: "#fda4af" }
          ]
        },
        {
          name: "Jove",
          orbitFrac: 0.74,
          radius: 13.5,
          speed: 0.42,
          initialAngle: 5.2,
          color: "#eab308",
          glow: "rgba(234, 179, 8, 0.5)",
          trailMax: 105,
          hasRing: true,
          moons: [
            { orbitPx: 23, radius: 2.6, speed: 3.1, initialAngle: 0.2, color: "#fde68a" },
            { orbitPx: 32, radius: 2.1, speed: 2.1, initialAngle: 3.5, color: "#cbd5e1" }
          ]
        },
        {
          name: "Neptune",
          orbitFrac: 0.94,
          radius: 10.2,
          speed: 0.26,
          initialAngle: 3.1,
          color: "#818cf8",
          glow: "rgba(129, 140, 248, 0.55)",
          trailMax: 120,
          moons: [
            { orbitPx: 20, radius: 2.2, speed: 3.4, initialAngle: 1.9, color: "#c7d2fe" }
          ]
        }
      ];

      let planets = [];
      let burstParticles = [];

      const burstPalette = [
        "#38bdf8",
        "#7dd3fc",
        "#fbbf24",
        "#f472b6",
        "#a78bfa",
        "#34d399",
        "#f8fafc"
      ];

      function initSimulation() {
        simTime = 0;
        burstParticles = [];
        planets = planetSpecs.map((spec) => ({
          ...spec,
          angle: spec.initialAngle,
          trail: [],
          moons: spec.moons.map((m) => ({
            ...m,
            angle: m.initialAngle
          }))
        }));
      }

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        centerX = width / 2;
        centerY = height / 2;
        baseScale = Math.min(width, height) * 0.44;
      }

      function spawnBurst(x, y) {
        const count = 42;
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.35;
          const speed = 70 + Math.random() * 210;
          const maxLife = 0.75 + Math.random() * 0.75;
          burstParticles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: 1.6 + Math.random() * 3.0,
            life: maxLife,
            maxLife,
            damping: 0.94 + Math.random() * 0.03,
            color: burstPalette[Math.floor(Math.random() * burstPalette.length)]
          });
        }
      }

      function drawBackgroundAndStars(nowSec) {
        ctx.fillStyle = "#060913";
        ctx.fillRect(0, 0, width, height);

        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          const twinkle = 0.55 + 0.45 * Math.sin(nowSec * s.twinkleSpeed + s.phase);
          const alpha = Math.max(0.08, Math.min(1, s.baseAlpha * twinkle));
          ctx.globalAlpha = alpha;
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.arc(s.nx * width, s.ny * height, s.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawCentralStar() {
        const starCoreRadius = Math.max(18, Math.min(30, baseScale * 0.085));
        const pulse = Math.sin(simTime * 2.4);
        const coronaRadius = starCoreRadius * (3.6 + pulse * 0.35);

        // Outer pulsing corona
        const coronaGrad = ctx.createRadialGradient(
          centerX,
          centerY,
          starCoreRadius * 0.35,
          centerX,
          centerY,
          coronaRadius
        );
        coronaGrad.addColorStop(0, "rgba(255, 248, 220, 0.95)");
        coronaGrad.addColorStop(0.22, "rgba(253, 224, 71, 0.72)");
        coronaGrad.addColorStop(0.48, "rgba(249, 115, 22, 0.28)");
        coronaGrad.addColorStop(0.78, "rgba(234, 88, 12, 0.08)");
        coronaGrad.addColorStop(1, "rgba(6, 9, 19, 0)");

        ctx.fillStyle = coronaGrad;
        ctx.beginPath();
        ctx.arc(centerX, centerY, coronaRadius, 0, Math.PI * 2);
        ctx.fill();

        // Bright photosphere core
        const coreGrad = ctx.createRadialGradient(
          centerX - starCoreRadius * 0.2,
          centerY - starCoreRadius * 0.2,
          starCoreRadius * 0.1,
          centerX,
          centerY,
          starCoreRadius
        );
        coreGrad.addColorStop(0, "#ffffff");
        coreGrad.addColorStop(0.55, "#fef08a");
        coreGrad.addColorStop(1, "#f59e0b");

        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.arc(centerX, centerY, starCoreRadius, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawOrbitalGuides() {
        ctx.strokeStyle = "rgba(148, 163, 184, 0.09)";
        ctx.lineWidth = 1;
        for (let i = 0; i < planets.length; i++) {
          const orbitRadius = planets[i].orbitFrac * baseScale;
          ctx.beginPath();
          ctx.arc(centerX, centerY, orbitRadius, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      function updateAndDrawPlanets(dt) {
        for (let i = 0; i < planets.length; i++) {
          const p = planets[i];
          const orbitRadius = p.orbitFrac * baseScale;

          if (isRunning) {
            p.angle += p.speed * speedMultiplier * dt;
          }

          const px = centerX + Math.cos(p.angle) * orbitRadius;
          const py = centerY + Math.sin(p.angle) * orbitRadius;

          if (isRunning && trailsEnabled) {
            p.trail.push({ x: px, y: py });
            if (p.trail.length > p.trailMax) {
              p.trail.shift();
            }
          }

          // Fading orbital trail
          if (trailsEnabled && p.trail.length > 1) {
            for (let t = 1; t < p.trail.length; t++) {
              const ratio = t / p.trail.length;
              ctx.strokeStyle = p.color;
              ctx.globalAlpha = ratio * 0.55;
              ctx.lineWidth = Math.max(1, p.radius * 0.42 * ratio);
              ctx.beginPath();
              ctx.moveTo(p.trail[t - 1].x, p.trail[t - 1].y);
              ctx.lineTo(p.trail[t].x, p.trail[t].y);
              ctx.stroke();
            }
            ctx.globalAlpha = 1;
          }

          // Planet glow halo
          const haloGrad = ctx.createRadialGradient(px, py, p.radius * 0.2, px, py, p.radius * 2.4);
          haloGrad.addColorStop(0, p.glow);
          haloGrad.addColorStop(1, "rgba(6, 9, 19, 0)");
          ctx.fillStyle = haloGrad;
          ctx.beginPath();
          ctx.arc(px, py, p.radius * 2.4, 0, Math.PI * 2);
          ctx.fill();

          // Optional planetary ring
          if (p.hasRing) {
            ctx.save();
            ctx.translate(px, py);
            ctx.rotate(-0.35);
            ctx.strokeStyle = "rgba(253, 230, 138, 0.45)";
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.ellipse(0, 0, p.radius * 1.85, p.radius * 0.55, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }

          // Planet body
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(px, py, p.radius, 0, Math.PI * 2);
          ctx.fill();

          // Orbiting moons
          for (let m = 0; m < p.moons.length; m++) {
            const moon = p.moons[m];
            if (isRunning) {
              moon.angle += moon.speed * speedMultiplier * dt;
            }
            const mx = px + Math.cos(moon.angle) * moon.orbitPx;
            const my = py + Math.sin(moon.angle) * moon.orbitPx;

            ctx.strokeStyle = "rgba(148, 163, 184, 0.16)";
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.arc(px, py, moon.orbitPx, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = moon.color;
            ctx.beginPath();
            ctx.arc(mx, my, moon.radius, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function updateAndDrawBurstParticles(dt) {
        if (burstParticles.length === 0) return;

        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        for (let i = burstParticles.length - 1; i >= 0; i--) {
          const pt = burstParticles[i];
          if (isRunning) {
            const damp = Math.pow(pt.damping, dt * 60);
            pt.vx *= damp;
            pt.vy *= damp;
            pt.x += pt.vx * dt;
            pt.y += pt.vy * dt;
            pt.life -= dt;
          }

          if (pt.life <= 0) {
            burstParticles.splice(i, 1);
            continue;
          }

          const alpha = Math.max(0, pt.life / pt.maxLife);
          const glowRadius = pt.radius * 3.2;

          ctx.globalAlpha = alpha * 0.55;
          ctx.fillStyle = pt.color;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, glowRadius, 0, Math.PI * 2);
          ctx.fill();

          ctx.globalAlpha = alpha;
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.radius * 0.75, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      function animate(now) {
        const rawDt = Math.min(0.05, (now - lastFrameTime) / 1000);
        lastFrameTime = now;

        if (isRunning) {
          simTime += rawDt * speedMultiplier;
        }

        // Smooth FPS readout
        fpsAccum += rawDt;
        fpsFrames++;
        if (fpsAccum >= 0.3) {
          displayedFps = Math.round(fpsFrames / fpsAccum);
          statFps.textContent = String(displayedFps);
          fpsAccum = 0;
          fpsFrames = 0;
        }

        drawBackgroundAndStars(now / 1000);
        drawOrbitalGuides();
        drawCentralStar();
        updateAndDrawPlanets(rawDt);
        updateAndDrawBurstParticles(rawDt);

        statTime.textContent = `${simTime.toFixed(1)}s`;
        statParticles.textContent = String(burstParticles.length);

        requestAnimationFrame(animate);
      }

      // Event Listeners
      window.addEventListener("resize", resizeCanvas);

      canvas.addEventListener("click", (event) => {
        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        spawnBurst(x, y);
      });

      btnPlayPause.addEventListener("click", () => {
        isRunning = !isRunning;
        btnPlayPause.textContent = isRunning ? "Pause" : "Play";
        btnPlayPause.classList.toggle("active", isRunning);
        statusBadge.textContent = isRunning ? "Running" : "Paused";
      });

      btnTrails.addEventListener("click", () => {
        trailsEnabled = !trailsEnabled;
        btnTrails.textContent = trailsEnabled ? "Trails: ON" : "Trails: OFF";
        btnTrails.classList.toggle("active", trailsEnabled);
        if (!trailsEnabled) {
          for (let i = 0; i < planets.length; i++) {
            planets[i].trail.length = 0;
          }
        }
      });

      btnReset.addEventListener("click", () => {
        initSimulation();
      });

      speedSlider.addEventListener("input", () => {
        speedMultiplier = parseFloat(speedSlider.value);
        speedReadout.textContent = `${speedMultiplier.toFixed(1)}x`;
      });

      // Initialize and start
      resizeCanvas();
      initSimulation();
      requestAnimationFrame((t) => {
        lastFrameTime = t;
        requestAnimationFrame(animate);
      });
    })();
  </script>
</body>
</html>
