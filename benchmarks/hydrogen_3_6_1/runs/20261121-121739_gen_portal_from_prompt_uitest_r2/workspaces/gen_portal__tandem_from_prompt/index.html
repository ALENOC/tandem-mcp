<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON PORTAL 3D</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #010108;
  }
  #c {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }
  #hud {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 10;
    min-width: 230px;
    padding: 16px 18px;
    border-radius: 16px;
    color: #eafcff;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: rgba(10, 20, 40, 0.35);
    border: 1px solid rgba(0, 245, 255, 0.35);
    box-shadow: 0 0 24px rgba(0, 245, 255, 0.25), inset 0 0 18px rgba(255, 42, 230, 0.12);
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
  }
  #hud h1 {
    margin: 0 0 10px 0;
    font-size: 20px;
    letter-spacing: 3px;
    font-weight: 700;
    color: #00f5ff;
    text-shadow: 0 0 10px rgba(0, 245, 255, 0.8);
  }
  .row {
    display: flex;
    gap: 8px;
    margin: 8px 0;
    font-size: 13px;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(0, 245, 255, 0.08);
    border: 1px solid rgba(0, 245, 255, 0.2);
    border-radius: 8px;
    padding: 4px 8px;
  }
  .stat b { color: #ff2ae6; text-shadow: 0 0 8px rgba(255, 42, 230, 0.7); }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button {
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    color: #eafcff;
    background: rgba(0, 245, 255, 0.12);
    border: 1px solid rgba(0, 245, 255, 0.4);
    border-radius: 8px;
    padding: 7px 12px;
    transition: background 0.15s, box-shadow 0.15s;
  }
  button:hover {
    background: rgba(0, 245, 255, 0.25);
    box-shadow: 0 0 12px rgba(0, 245, 255, 0.5);
  }
  .slider {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 12px;
  }
  input[type="range"] {
    width: 130px;
    accent-color: #ff2ae6;
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <h1>NEON PORTAL 3D</h1>
    <div class="row">
      <span class="stat">FPS <b id="fps">0</b></span>
      <span class="stat">POLYS <b id="polys">0</b></span>
      <span class="stat">PARTS <b id="parts">110</b></span>
    </div>
    <div class="btns">
      <button id="btn-pause">Pause</button>
      <button id="btn-orbit">Orbit ON</button>
      <button id="btn-reset">Reset</button>
    </div>
    <div class="slider">
      <span>Speed</span>
      <input id="speed" type="range" min="0.1" max="3" step="0.1" value="1">
      <span id="speed-val">1.0</span>
    </div>
  </div>
  <script src="engine3d.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
