<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON PORTAL 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #c {
    display: block;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(ellipse at center, #0a0e2a 0%, #050818 45%, #010208 100%);
  }
  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    padding: 14px 18px;
    border-radius: 14px;
    background: rgba(10, 14, 42, 0.35);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(0, 229, 255, 0.25);
    box-shadow: 0 0 24px rgba(0, 229, 255, 0.15), inset 0 0 18px rgba(124, 77, 255, 0.08);
    color: #e8f4ff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-width: 220px;
    user-select: none;
  }
  #hud h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #00e5ff, #7c4dff, #ff2ec4);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
  }
  .stats {
    display: flex;
    gap: 14px;
    margin-bottom: 10px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4px 8px;
    border-radius: 6px;
    background: rgba(0, 229, 255, 0.06);
    border: 1px solid rgba(0, 229, 255, 0.12);
  }
  .stat .label {
    font-size: 9px;
    letter-spacing: 1px;
    color: rgba(0, 229, 255, 0.7);
    margin-bottom: 2px;
  }
  .stat .value {
    font-size: 15px;
    font-weight: 600;
    color: #00e5ff;
    text-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
  }
  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .controls button {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid rgba(0, 229, 255, 0.3);
    border-radius: 6px;
    background: rgba(0, 229, 255, 0.08);
    color: #00e5ff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .controls button:hover {
    background: rgba(0, 229, 255, 0.18);
    box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: rgba(232, 244, 255, 0.7);
  }
  .slider-row input[type="range"] {
    flex: 1;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(0, 229, 255, 0.2);
    border-radius: 2px;
    outline: none;
  }
  .slider-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #00e5ff;
    box-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h1>NEON PORTAL 3D</h1>
  <div class="stats">
    <div class="stat"><span class="label">FPS</span><span class="value" id="fps">0</span></div>
    <div class="stat"><span class="label">POLYS</span><span class="value" id="polys">0</span></div>
    <div class="stat"><span class="label">PARTS</span><span class="value" id="parts">0</span></div>
  </div>
  <div class="controls">
    <button id="btnPause">Pause</button>
    <button id="btnOrbit">Orbit ON</button>
    <button id="btnReset">Reset</button>
  </div>
  <div class="slider-row">
    <span>Speed</span>
    <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1">
  </div>
</div>
<script src="engine3d.js"></script>
<script src="scene.js"></script>
<script src="app.js"></script>
</body>
</html>
