<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEON PORTAL 3D</title>
  <style>
    :root {
      --bg-glass: rgba(10, 12, 28, 0.58);
      --border-glass: rgba(110, 231, 255, 0.24);
      --neon-cyan: #5ef2ff;
      --neon-magenta: #ff4fd8;
      --text-main: #eef6ff;
      --text-dim: #95a7c6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #04030c;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      user-select: none;
    }

    #c {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }

    #c:active {
      cursor: grabbing;
    }

    .hud {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 280px;
      padding: 16px 18px;
      border-radius: 16px;
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow:
        0 12px 36px rgba(0, 0, 0, 0.55),
        0 0 24px rgba(94, 242, 255, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      z-index: 10;
    }

    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
    }

    .hud-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.14em;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 18px rgba(94, 242, 255, 0.25);
    }

    .hud-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--neon-cyan);
      box-shadow: 0 0 10px var(--neon-cyan);
      animation: pulseDot 1.8s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.55; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat {
      padding: 8px 6px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
    }

    .stat-label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 3px;
    }

    .stat-value {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--neon-cyan);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    button {
      appearance: none;
      border: 1px solid rgba(94, 242, 255, 0.26);
      background: rgba(94, 242, 255, 0.09);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      padding: 8px 6px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.12s ease, box-shadow 0.16s ease;
    }

    button:hover {
      background: rgba(94, 242, 255, 0.18);
      border-color: rgba(94, 242, 255, 0.55);
      box-shadow: 0 0 12px rgba(94, 242, 255, 0.22);
    }

    button:active {
      transform: translateY(1px);
    }

    button.active {
      background: rgba(255, 79, 216, 0.2);
      border-color: rgba(255, 79, 216, 0.65);
      box-shadow: 0 0 12px rgba(255, 79, 216, 0.25);
    }

    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }

    .slider-head span:last-child {
      color: var(--text-main);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--neon-cyan);
      border: 2px solid #090b18;
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    input[type="range"]::-moz-range-thumb {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--neon-cyan);
      border: 2px solid #090b18;
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    .hud-hint {
      margin-top: 10px;
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <aside class="hud" aria-label="Neon Portal Controls">
    <div class="hud-header">
      <div class="hud-title">NEON PORTAL 3D</div>
      <div class="hud-dot" aria-hidden="true"></div>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">FPS</span>
        <span class="stat-value" id="stat-fps">60</span>
      </div>
      <div class="stat">
        <span class="stat-label">POLYS</span>
        <span class="stat-value" id="stat-polys">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">PARTS</span>
        <span class="stat-value" id="stat-parts">110</span>
      </div>
    </div>

    <div class="controls">
      <button id="btn-pause" type="button">Pause</button>
      <button id="btn-orbit" type="button" class="active">Orbit ON</button>
      <button id="btn-reset" type="button">Reset</button>
    </div>

    <div class="slider-row">
      <div class="slider-head">
        <span>SPEED</span>
        <span id="speed-val">1.0x</span>
      </div>
      <input id="speed-slider" type="range" min="0.1" max="3.0" step="0.1" value="1.0" />
    </div>

    <div class="hud-hint">Drag to orbit &bull; Scroll to zoom</div>
  </aside>

  <script defer src="engine3d.js"></script>
  <script defer src="scene.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
