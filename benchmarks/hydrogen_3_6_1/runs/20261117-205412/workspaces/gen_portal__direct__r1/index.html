<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON PORTAL 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 42%, #0d1633 0%, #050814 55%, #020309 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      color: #e6f6ff;
      user-select: none;
    }

    #c {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      touch-action: none;
    }

    #c:active {
      cursor: grabbing;
    }

    .hud {
      position: fixed;
      top: 14px;
      left: 14px;
      width: 268px;
      padding: 14px;
      background: rgba(20, 30, 60, 0.38);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(120, 220, 255, 0.22);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .hud-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      white-space: nowrap;
      color: #dff6ff;
      text-shadow: 0 0 10px rgba(0, 220, 255, 0.45);
    }

    .hud-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(255, 79, 216, 0.16);
      border: 1px solid rgba(255, 79, 216, 0.45);
      color: #ff9ce8;
      white-space: nowrap;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }

    .stat {
      background: rgba(8, 14, 32, 0.45);
      border: 1px solid rgba(120, 220, 255, 0.14);
      border-radius: 8px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat b {
      font-size: 14px;
      font-weight: 700;
      color: #6ce8ff;
      font-variant-numeric: tabular-nums;
    }

    .stat span {
      font-size: 9px;
      letter-spacing: 0.08em;
      color: rgba(200, 230, 255, 0.65);
    }

    .controls {
      display: flex;
      gap: 6px;
    }

    .controls button {
      flex: 1;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(0, 200, 255, 0.12);
      border: 1px solid rgba(0, 220, 255, 0.3);
      color: #dff6ff;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .controls button:hover {
      background: rgba(0, 200, 255, 0.24);
      border-color: rgba(0, 220, 255, 0.55);
    }

    .speed-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: rgba(210, 235, 255, 0.85);
    }

    .speed-row input[type="range"] {
      flex: 1;
      accent-color: #ff4fd8;
      cursor: pointer;
    }

    .speed-row b {
      min-width: 34px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #ff9ce8;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="hud">
    <div class="hud-header">
      <div class="hud-title">NEON PORTAL 3D</div>
      <span class="hud-badge">TANDEM MCP</span>
    </div>

    <div class="stats">
      <div class="stat">
        <b id="fps">60</b>
        <span>FPS</span>
      </div>
      <div class="stat">
        <b id="polys">84</b>
        <span>POLYS</span>
      </div>
      <div class="stat">
        <b id="parts">110</b>
        <span>PARTS</span>
      </div>
    </div>

    <div class="controls">
      <button id="btnPause" type="button">Pause</button>
      <button id="btnOrbit" type="button">Orbit ON</button>
      <button id="btnReset" type="button">Reset</button>
    </div>

    <div class="speed-row">
      <span>Speed</span>
      <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
      <b id="spdVal">1.0x</b>
    </div>
  </div>

  <script src="scene.js"></script>
  <script src="engine3d.js"></script>
  <script src="app.js"></script>
</body>
</html>
