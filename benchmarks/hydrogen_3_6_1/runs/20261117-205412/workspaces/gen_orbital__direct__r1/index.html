<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbital Particle Simulation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060913;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      color: #e6eeff;
      user-select: none;
    }

    #sky {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 248px;
      padding: 14px 16px;
      background: rgba(18, 28, 54, 0.42);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(140, 180, 255, 0.22);
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      z-index: 10;
    }

    .hud-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #a8c4ff;
      margin-bottom: 12px;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .btn-row button {
      flex: 1;
      white-space: nowrap;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 600;
      color: #e6eeff;
      background: rgba(130, 170, 255, 0.14);
      border: 1px solid rgba(140, 180, 255, 0.28);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn-row button:hover {
      background: rgba(130, 170, 255, 0.26);
      border-color: rgba(160, 200, 255, 0.48);
    }

    .btn-row button:active {
      background: rgba(130, 170, 255, 0.34);
    }

    .slider-group {
      margin-bottom: 12px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #c2d4ff;
      margin-bottom: 6px;
    }

    #speedVal {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
    }

    #speed {
      width: 100%;
      accent-color: #79a8ff;
      cursor: pointer;
    }

    .readouts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid rgba(140, 180, 255, 0.16);
      font-variant-numeric: tabular-nums;
    }

    .readout-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .readout-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8ba6db;
    }

    .readout-value {
      font-size: 13px;
      font-weight: 600;
      color: #f0f5ff;
    }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>

  <div class="hud">
    <div class="hud-title">Orbital Telemetry</div>
    <div class="btn-row">
      <button id="btnPlay" type="button">Pause</button>
      <button id="btnTrails" type="button">Trails ON</button>
      <button id="btnReset" type="button">Reset</button>
    </div>
    <div class="slider-group">
      <div class="slider-header">
        <label for="speed">Time Scale</label>
        <span id="speedVal">1.0x</span>
      </div>
      <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0" />
    </div>
    <div class="readouts">
      <div class="readout-item">
        <span class="readout-label">FPS</span>
        <span class="readout-value" id="fps">60</span>
      </div>
      <div class="readout-item">
        <span class="readout-label">Sim Time</span>
        <span class="readout-value" id="simTime">0.0 s</span>
      </div>
      <div class="readout-item">
        <span class="readout-label">Bursts</span>
        <span class="readout-value" id="bursts">0</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('sky');
      const ctx = canvas.getContext('2d');

      const btnPlay = document.getElementById('btnPlay');
      const btnTrails = document.getElementById('btnTrails');
      const btnReset = document.getElementById('btnReset');
      const speedSlider = document.getElementById('speed');
      const speedVal = document.getElementById('speedVal');
      const fpsEl = document.getElementById('fps');
      const simTimeEl = document.getElementById('simTime');
      const burstsEl = document.getElementById('bursts');

      let W = window.innerWidth;
      let H = window.innerHeight;
      let dpr = window.devicePixelRatio || 1;

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      // Background starfield: 180 stars
      const STAR_COUNT = 180;
      const stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        const tintRoll = Math.random();
        let color = 'rgb(230, 238, 255)';
        if (tintRoll < 0.2) {
          color = 'rgb(255, 214, 170)';
        } else if (tintRoll < 0.533) {
          color = 'rgb(170, 205, 255)';
        }
        stars.push({
          nx: Math.random(),
          ny: Math.random(),
          r: 0.3 + Math.random() * 1.3,
          base: 0.32 + Math.random() * 0.45,
          rate: 0.8 + Math.random() * 2.2,
          phase: Math.random() * Math.PI * 2,
          color: color
        });
      }

      // Planet definitions
      const orbitRadii = [62, 98, 140, 186, 246, 304];
      const periods = [4.2, 7, 10.5, 15, 24, 36];
      const sizes = [4.5, 6.5, 7.5, 5.5, 13, 9];
      const colors = ['#ff9b6b', '#7be0a4', '#5fb4ff', '#e2674e', '#e6c288', '#a58bff'];
      const moonCounts = [0, 1, 1, 2, 2, 1];

      const planets = orbitRadii.map((orbit, i) => {
        const moons = [];
        for (let m = 0; m < moonCounts[i]; m++) {
          moons.push({
            orbit: sizes[i] * (1.9 + m * 0.95),
            period: 1.2 + m * 0.85 + i * 0.15,
            size: Math.max(1.4, sizes[i] * 0.24),
            phase: (i * 1.1 + m * 2.4) % (Math.PI * 2),
            color: m === 0 ? '#d8e3ff' : '#b7c7eb'
          });
        }
        return {
          orbit,
          period: periods[i],
          size: sizes[i],
          color: colors[i],
          startPhase: i * 1.37 + 0.4,
          phase: i * 1.37 + 0.4,
          moons,
          trail: []
        };
      });

      const particles = [];
      let playing = true;
      let trailsEnabled = true;
      let speed = parseFloat(speedSlider.value) || 1.0;
      let simTime = 0;
      let visualTime = 0;
      let lastTime = null;
      let fpsFrames = 0;
      let fpsAccum = 0;
      let currentFps = 60;

      function spawnBurst(x, y) {
        const count = 46 + Math.floor(Math.random() * 19);
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = 70 + Math.random() * 210;
          particles.push({
            x,
            y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            life: 1.0,
            decay: 0.45 + Math.random() * 0.55,
            size: 1.8 + Math.random() * 2.6,
            hue: Math.floor(Math.random() * 360)
          });
        }
      }

      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        spawnBurst(x, y);
      });

      btnPlay.addEventListener('click', () => {
        playing = !playing;
        btnPlay.textContent = playing ? 'Pause' : 'Play';
      });

      btnTrails.addEventListener('click', () => {
        trailsEnabled = !trailsEnabled;
        btnTrails.textContent = trailsEnabled ? 'Trails ON' : 'Trails OFF';
        if (!trailsEnabled) {
          for (const p of planets) p.trail.length = 0;
        }
      });

      btnReset.addEventListener('click', () => {
        simTime = 0;
        particles.length = 0;
        for (const p of planets) {
          p.trail.length = 0;
          p.phase = p.startPhase;
        }
        simTimeEl.textContent = '0.0 s';
        burstsEl.textContent = '0';
      });

      speedSlider.addEventListener('input', (e) => {
        speed = parseFloat(e.target.value);
        speedVal.textContent = speed.toFixed(1) + 'x';
      });

      function drawBackgroundStars(t) {
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          const alpha = Math.max(0.05, Math.min(1, s.base + 0.28 * Math.sin(t * s.rate + s.phase)));
          ctx.globalAlpha = alpha;
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.arc(s.nx * W, s.ny * H, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawCentralStar(cx, cy, scale, t) {
        const coreR = 24 * scale;
        const pulse = 1 + 0.07 * Math.sin(1.7 * t);
        const coronaR = coreR * 5.2 * pulse;

        const coronaGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coronaR);
        coronaGrad.addColorStop(0, 'rgba(255, 214, 130, 0.55)');
        coronaGrad.addColorStop(0.4, 'rgba(255, 170, 75, 0.18)');
        coronaGrad.addColorStop(1, 'rgba(255, 130, 30, 0)');
        ctx.fillStyle = coronaGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, coronaR, 0, Math.PI * 2);
        ctx.fill();

        const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
        coreGrad.addColorStop(0, '#fffbe6');
        coreGrad.addColorStop(0.45, '#ffd76a');
        coreGrad.addColorStop(1, '#ff8a2b');
        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawOrbits(cx, cy, scale) {
        ctx.strokeStyle = 'rgba(130, 160, 220, 0.11)';
        ctx.lineWidth = 1;
        for (let i = 0; i < planets.length; i++) {
          const rx = planets[i].orbit * scale;
          const ry = rx * 0.62;
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      function drawPlanets(cx, cy, scale) {
        for (let idx = 0; idx < planets.length; idx++) {
          const p = planets[idx];
          const rx = p.orbit * scale;
          const ry = rx * 0.62;
          const angle = p.phase + (simTime / p.period) * Math.PI * 2;
          const x = cx + Math.cos(angle) * rx;
          const y = cy + Math.sin(angle) * ry;
          const r = p.size * scale;

          if (trailsEnabled && playing) {
            p.trail.push({ x, y });
            if (p.trail.length > 90) {
              p.trail.shift();
            }
          }

          if (trailsEnabled && p.trail.length > 1) {
            const n = p.trail.length;
            ctx.strokeStyle = p.color;
            ctx.lineCap = 'round';
            for (let i = 1; i < n; i++) {
              ctx.lineWidth = Math.max(0.6, p.size * scale * 0.42 * i / n);
              ctx.globalAlpha = (i / n) * 0.55;
              ctx.beginPath();
              ctx.moveTo(p.trail[i - 1].x, p.trail[i - 1].y);
              ctx.lineTo(p.trail[i].x, p.trail[i].y);
              ctx.stroke();
            }
            ctx.globalAlpha = 1;
          }

          // Planet glow
          const glow = ctx.createRadialGradient(x, y, 0, x, y, 3 * r);
          glow.addColorStop(0, p.color + '55');
          glow.addColorStop(1, p.color + '00');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(x, y, 3 * r, 0, Math.PI * 2);
          ctx.fill();

          // Fifth planet tilted ring (back half)
          if (idx === 4) {
            ctx.save();
            ctx.strokeStyle = 'rgba(230, 194, 136, 0.52)';
            ctx.lineWidth = Math.max(1.2, r * 0.24);
            ctx.beginPath();
            ctx.ellipse(x, y, r * 2.15, r * 0.62, -0.35, Math.PI, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }

          // Planet disc
          const disc = ctx.createRadialGradient(
            x - 0.35 * r,
            y - 0.35 * r,
            0.05 * r,
            x,
            y,
            r
          );
          disc.addColorStop(0, '#ffffff');
          disc.addColorStop(0.25, p.color);
          disc.addColorStop(1, '#0a0f1f');
          ctx.fillStyle = disc;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();

          // Fifth planet tilted ring (front half)
          if (idx === 4) {
            ctx.save();
            ctx.strokeStyle = 'rgba(230, 194, 136, 0.72)';
            ctx.lineWidth = Math.max(1.2, r * 0.24);
            ctx.beginPath();
            ctx.ellipse(x, y, r * 2.15, r * 0.62, -0.35, 0, Math.PI);
            ctx.stroke();
            ctx.restore();
          }

          // Moons
          for (let m = 0; m < p.moons.length; m++) {
            const moon = p.moons[m];
            const mRx = moon.orbit * scale;
            const mRy = mRx * 0.62;
            const mAngle = moon.phase + (simTime / moon.period) * Math.PI * 2;
            const mx = x + Math.cos(mAngle) * mRx;
            const my = y + Math.sin(mAngle) * mRy;
            const mr = moon.size * scale;

            ctx.fillStyle = moon.color;
            ctx.beginPath();
            ctx.arc(mx, my, mr, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function updateAndDrawParticles(dt) {
        const damp = Math.pow(0.12, dt);
        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          pt.vx *= damp;
          pt.vy *= damp;
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.life -= pt.decay * dt;
          if (pt.life <= 0) {
            particles.splice(i, 1);
          }
        }

        if (particles.length > 0) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          for (let i = 0; i < particles.length; i++) {
            const pt = particles[i];
            const radius = 3 * pt.size;
            const grad = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, radius);
            grad.addColorStop(0, `hsla(${pt.hue}, 100%, 75%, ${pt.life})`);
            grad.addColorStop(0.45, `hsla(${pt.hue}, 100%, 65%, ${pt.life * 0.45})`);
            grad.addColorStop(1, `hsla(${pt.hue}, 100%, 50%, 0)`);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      function frame(now) {
        if (lastTime === null) lastTime = now;
        const rawDt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
        lastTime = now;

        visualTime += rawDt;
        if (playing) {
          simTime += rawDt * speed;
        }

        fpsFrames += 1;
        fpsAccum += rawDt;
        if (fpsAccum >= 0.25) {
          currentFps = Math.round(fpsFrames / fpsAccum);
          fpsEl.textContent = String(currentFps);
          fpsFrames = 0;
          fpsAccum = 0;
        }

        ctx.fillStyle = '#060913';
        ctx.fillRect(0, 0, W, H);

        const cx = W / 2;
        const cy = H / 2;
        const scale = Math.min(W, H) / 700;

        drawBackgroundStars(visualTime);
        drawOrbits(cx, cy, scale);
        drawCentralStar(cx, cy, scale, visualTime);
        drawPlanets(cx, cy, scale);
        updateAndDrawParticles(rawDt);

        simTimeEl.textContent = simTime.toFixed(1) + ' s';
        burstsEl.textContent = String(particles.length);

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
