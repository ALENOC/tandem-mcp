<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON PORTAL 3D</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 42%, #0d1633 0%, #050814 55%, #020309 100%);
  }
  #c {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  .hud {
    position: fixed;
    top: 14px;
    left: 14px;
    width: 268px;
    background: rgba(20, 30, 60, 0.38);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(120, 220, 255, 0.22);
    border-radius: 12px;
    padding: 14px 16px;
    color: #cfeeff;
    font-family: "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }
  .hud .title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: bold;
    letter-spacing: 2px;
    font-size: 15px;
    white-space: nowrap;
  }
  .hud .badge {
    font-size: 9px;
    letter-spacing: 1px;
    padding: 2px 6px;
    border: 1px solid rgba(120, 220, 255, 0.35);
    border-radius: 6px;
    color: #8fe6ff;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin: 12px 0;
    text-align: center;
  }
  .stats .cell {
    font-size: 10px;
    letter-spacing: 1px;
    color: #7fd8ff;
  }
  .stats b {
    display: block;
    font-size: 16px;
    color: #eafcff;
    font-variant-numeric: tabular-nums;
  }
  .row {
    display: flex;
    gap: 6px;
  }
  .row button {
    flex: 1;
    background: rgba(0, 200, 255, 0.12);
    border: 1px solid rgba(0, 220, 255, 0.3);
    border-radius: 8px;
    color: #d6f6ff;
    padding: 7px 4px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .row button:hover {
    background: rgba(0, 200, 255, 0.22);
  }
  .slider {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 1px;
  }
  .slider input[type="range"] {
    flex: 1;
    accent-color: #ff4fd8;
  }
  .slider b {
    color: #ffd6f5;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="title">NEON PORTAL 3D <span class="badge">TANDEM MCP</span></div>
  <div class="stats">
    <div class="cell"><b id="fps">0</b>FPS</div>
    <div class="cell"><b id="polys">0</b>POLYS</div>
    <div class="cell"><b id="parts">0</b>PARTS</div>
  </div>
  <div class="row">
    <button id="btnPause">Pause</button>
    <button id="btnOrbit">Orbit ON</button>
    <button id="btnReset">Reset</button>
  </div>
  <div class="slider">
    <span>SPEED</span>
    <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0">
    <b id="spdVal">1.0x</b>
  </div>
</div>
<script src="scene.js"></script>
<script src="engine3d.js"></script>
<script src="app.js"></script>
</body>
</html>
