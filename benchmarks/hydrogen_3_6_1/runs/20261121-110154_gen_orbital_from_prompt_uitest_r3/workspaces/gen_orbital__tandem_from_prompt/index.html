<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Particle Simulation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #060913; }
canvas#space-canvas { display: block; width: 100vw; height: 100vh; }
#hud {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 10;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 14px;
  padding: 16px 20px;
  font-family: 'Segoe UI', system-ui, sans-serif;
  color: #e0e6f0;
  min-width: 220px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
#hud h2 { font-size: 14px; margin-bottom: 10px; opacity: 0.8; letter-spacing: 1px; text-transform: uppercase; }
.hud-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.hud-btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  color: #e0e6f0;
  padding: 6px 14px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s;
}
.hud-btn:hover { background: rgba(255,255,255,0.15); }
.hud-label { font-size: 12px; opacity: 0.7; }
.hud-value { font-size: 13px; font-weight: 600; color: #7ec8f0; }
#speed-slider { width: 100px; accent-color: #7ec8f0; }
</style>
</head>
<body>
<canvas id="space-canvas"></canvas>
<div id="hud">
  <h2>Orbital Sim</h2>
  <div class="hud-row">
    <button id="toggle-play" class="hud-btn">Pause</button>
    <button id="toggle-trails" class="hud-btn">Trails: ON</button>
    <button id="reset-btn" class="hud-btn">Reset</button>
  </div>
  <div class="hud-row">
    <label class="hud-label" for="speed-slider">Speed</label>
    <input id="speed-slider" type="range" min="0.2" max="3.0" step="0.1" value="1.0">
    <span id="speed-value" class="hud-value">1.0x</span>
  </div>
  <div class="hud-row">
    <span class="hud-label">FPS:</span>
    <span id="fps" class="hud-value">0</span>
    <span class="hud-label">Time:</span>
    <span id="sim-time" class="hud-value">0</span>
    <span class="hud-label">Particles:</span>
    <span id="particle-count" class="hud-value">0</span>
  </div>
</div>
<script>
(function() {
  const canvas = document.getElementById('space-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // State
  let paused = false;
  let trailsOn = true;
  let speedMult = 1.0;
  let simTime = 0;
  let lastTime = performance.now();
  let fps = 0;
  let frameCount = 0;
  let fpsTimer = 0;

  // Starfield
  const stars = [];
  for (let i = 0; i < 200; i++) {
    stars.push({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.5 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 2 + 1
    });
  }

  // Planets
  const planets = [
    { orbitR: 0.12, speed: 0.8, color: '#4fc3f7', size: 6, angle: 0, moons: [] },
    { orbitR: 0.18, speed: 0.55, color: '#ff8a65', size: 8, angle: 1.2, moons: [
      { dist: 14, speed: 2.0, size: 3, angle: 0, color: '#b0bec5' }
    ]},
    { orbitR: 0.25, speed: 0.4, color: '#aed581', size: 7, angle: 2.5, moons: [
      { dist: 12, speed: 2.5, size: 2.5, angle: 0.5, color: '#e0e0e0' },
      { dist: 20, speed: 1.5, size: 3.5, angle: 2.0, color: '#90a4ae' }
    ]},
    { orbitR: 0.32, speed: 0.3, color: '#ce93d8', size: 9, angle: 3.8, moons: [
      { dist: 16, speed: 1.8, size: 3, angle: 1.0, color: '#cfd8dc' }
    ]},
    { orbitR: 0.40, speed: 0.2, color: '#ffd54f', size: 10, angle: 5.0, moons: [] },
    { orbitR: 0.48, speed: 0.15, color: '#ef5350', size: 11, angle: 0.8, moons: [] }
  ];

  // Trails
  const TRAIL_LEN = 60;
  planets.forEach(p => { p.trail = []; });

  // Burst particles
  let burstParticles = [];

  function spawnBurst(x, y) {
    const count = 30 + Math.floor(Math.random() * 20);
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      const speed = 1.5 + Math.random() * 3;
      burstParticles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1.0,
        decay: 0.01 + Math.random() * 0.015,
        size: 2 + Math.random() * 3,
        hue: Math.random() * 60 + 180
      });
    }
  }

  canvas.addEventListener('click', function(e) {
    const rect = canvas.getBoundingClientRect();
    spawnBurst(e.clientX - rect.left, e.clientY - rect.top);
  });

  // HUD
  const togglePlayBtn = document.getElementById('toggle-play');
  const toggleTrailsBtn = document.getElementById('toggle-trails');
  const resetBtn = document.getElementById('reset-btn');
  const speedSlider = document.getElementById('speed-slider');
  const speedValue = document.getElementById('speed-value');
  const fpsEl = document.getElementById('fps');
  const simTimeEl = document.getElementById('sim-time');
  const particleCountEl = document.getElementById('particle-count');

  togglePlayBtn.addEventListener('click', function() {
    paused = !paused;
    togglePlayBtn.textContent = paused ? 'Play' : 'Pause';
    if (!paused) lastTime = performance.now();
  });

  toggleTrailsBtn.addEventListener('click', function() {
    trailsOn = !trailsOn;
    toggleTrailsBtn.textContent = trailsOn ? 'Trails: ON' : 'Trails: OFF';
    if (!trailsOn) planets.forEach(p => { p.trail = []; });
  });

  resetBtn.addEventListener('click', function() {
    simTime = 0;
    burstParticles = [];
    paused = false;
    togglePlayBtn.textContent = 'Pause';
    lastTime = performance.now();
    planets.forEach(p => {
      p.trail = [];
      p.angle = Math.random() * Math.PI * 2;
      p.moons.forEach(m => { m.angle = Math.random() * Math.PI * 2; });
    });
  });

  speedSlider.addEventListener('input', function() {
    speedMult = parseFloat(speedSlider.value);
    speedValue.textContent = speedMult.toFixed(1) + 'x';
  });

  // Draw
  function drawStar(cx, cy, t) {
    const pulse = 1 + 0.08 * Math.sin(t * 2);
    const baseR = Math.min(W, H) * 0.04 * pulse;

    // Corona
    const coronaR = baseR * 3.5;
    const corona = ctx.createRadialGradient(cx, cy, baseR * 0.5, cx, cy, coronaR);
    corona.addColorStop(0, 'rgba(255, 200, 50, 0.3)');
    corona.addColorStop(0.5, 'rgba(255, 150, 0, 0.1)');
    corona.addColorStop(1, 'rgba(255, 100, 0, 0)');
    ctx.beginPath();
    ctx.arc(cx, cy, coronaR, 0, Math.PI * 2);
    ctx.fillStyle = corona;
    ctx.fill();

    // Star body
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.3, '#fff3b0');
    grad.addColorStop(0.7, '#ffb74d');
    grad.addColorStop(1, 'rgba(255, 120, 0, 0.4)');
    ctx.beginPath();
    ctx.arc(cx, cy, baseR, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }

  function drawStarfield(t) {
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const twinkle = 0.4 + 0.6 * Math.abs(Math.sin(t * s.speed + s.phase));
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + twinkle.toFixed(2) + ')';
      ctx.fill();
    }
  }

  function drawTrails(cx, cy) {
    if (!trailsOn) return;
    for (let i = 0; i < planets.length; i++) {
      const p = planets[i];
      const trail = p.trail;
      if (trail.length < 2) continue;
      for (let j = 1; j < trail.length; j++) {
        const alpha = (j / trail.length) * 0.5;
        ctx.beginPath();
        ctx.moveTo(trail[j - 1].x, trail[j - 1].y);
        ctx.lineTo(trail[j].x, trail[j].y);
        ctx.strokeStyle = p.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }
  }

  function drawPlanets(cx, cy) {
    for (let i = 0; i < planets.length; i++) {
      const p = planets[i];
      const px = cx + Math.cos(p.angle) * p.orbitR * Math.min(W, H);
      const py = cy + Math.sin(p.angle) * p.orbitR * Math.min(W, H);

      // Planet glow
      const glow = ctx.createRadialGradient(px, py, 0, px, py, p.size * 2);
      glow.addColorStop(0, p.color);
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath();
      ctx.arc(px, py, p.size * 2, 0, Math.PI * 2);
      ctx.fillStyle = glow;
      ctx.fill();

      // Planet body
      ctx.beginPath();
      ctx.arc(px, py, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();

      // Moons
      for (let m = 0; m < p.moons.length; m++) {
        const moon = p.moons[m];
        const mx = px + Math.cos(moon.angle) * moon.dist;
        const my = py + Math.sin(moon.angle) * moon.dist;
        ctx.beginPath();
        ctx.arc(mx, my, moon.size, 0, Math.PI * 2);
        ctx.fillStyle = moon.color;
        ctx.fill();
      }
    }
  }

  function drawBursts() {
    for (let i = 0; i < burstParticles.length; i++) {
      const p = burstParticles[i];
      const alpha = p.life;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fillStyle = 'hsla(' + p.hue + ', 80%, 65%, ' + alpha.toFixed(2) + ')';
      ctx.fill();
    }
  }

  function update(dt) {
    const scaledDt = dt * speedMult;
    simTime += scaledDt;

    // Update planets
    for (let i = 0; i < planets.length; i++) {
      const p = planets[i];
      p.angle += p.speed * scaledDt;
      const px = W / 2 + Math.cos(p.angle) * p.orbitR * Math.min(W, H);
      const py = H / 2 + Math.sin(p.angle) * p.orbitR * Math.min(W, H);
      if (trailsOn) {
        p.trail.push({ x: px, y: py });
        if (p.trail.length > TRAIL_LEN) p.trail.shift();
      }
      for (let m = 0; m < p.moons.length; m++) {
        p.moons[m].angle += p.moons[m].speed * scaledDt;
      }
    }

    // Update burst particles
    for (let i = burstParticles.length - 1; i >= 0; i--) {
      const p = burstParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.97;
      p.vy *= 0.97;
      p.life -= p.decay;
      if (p.life <= 0) burstParticles.splice(i, 1);
    }
  }

  function render(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#060913';
    ctx.fillRect(0, 0, W, H);

    drawStarfield(t);
    drawTrails(W / 2, H / 2);
    drawStar(W / 2, H / 2, t);
    drawPlanets(W / 2, H / 2);
    drawBursts();
  }

  function updateHUD() {
    fpsEl.textContent = fps;
    simTimeEl.textContent = Math.floor(simTime);
    particleCountEl.textContent = burstParticles.length;
  }

  function loop(now) {
    requestAnimationFrame(loop);

    const rawDt = (now - lastTime) / 1000;
    lastTime = now;

    // FPS
    frameCount++;
    fpsTimer += rawDt;
    if (fpsTimer >= 0.5) {
      fps = Math.round(frameCount / fpsTimer);
      frameCount = 0;
      fpsTimer = 0;
    }

    if (!paused) {
      const dt = Math.min(rawDt, 0.05);
      update(dt);
    }

    render(simTime);
    updateHUD();
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
