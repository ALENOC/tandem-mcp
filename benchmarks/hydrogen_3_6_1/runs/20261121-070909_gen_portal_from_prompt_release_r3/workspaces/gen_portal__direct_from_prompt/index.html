<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEON PORTAL 3D</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #03030b;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      color: #e8f4ff;
      user-select: none;
      -webkit-user-select: none;
    }

    #c {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }

    #c:active {
      cursor: grabbing;
    }

    .hud {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      min-width: 270px;
      padding: 16px 18px;
      border-radius: 16px;
      background: rgba(10, 12, 28, 0.58);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(110, 220, 255, 0.24);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 0 24px rgba(0, 210, 255, 0.12);
    }

    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(130, 210, 255, 0.15);
    }

    .hud-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.14em;
      background: linear-gradient(90deg, #5ef2ff, #c77dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 14px rgba(94, 242, 255, 0.35);
    }

    .hud-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ef5ff;
      box-shadow: 0 0 10px #4ef5ff;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      padding: 7px 8px;
      text-align: center;
    }

    .stat-label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: rgba(180, 215, 255, 0.65);
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #7df6ff;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .btn {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid rgba(110, 220, 255, 0.28);
      border-radius: 10px;
      background: rgba(30, 45, 85, 0.45);
      color: #e6f6ff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.1s ease;
    }

    .btn:hover {
      background: rgba(55, 95, 160, 0.55);
      border-color: rgba(110, 235, 255, 0.6);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn.active {
      background: rgba(0, 200, 255, 0.22);
      border-color: rgba(94, 242, 255, 0.75);
      color: #8af7ff;
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.2);
    }

    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: rgba(200, 225, 255, 0.78);
    }

    #speedVal {
      color: #d68cff;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5ef2ff, #c77dff);
      box-shadow: 0 0 10px rgba(94, 242, 255, 0.75);
      border: 1px solid #ffffff;
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5ef2ff, #c77dff);
      box-shadow: 0 0 10px rgba(94, 242, 255, 0.75);
      border: 1px solid #ffffff;
      cursor: pointer;
    }

    .hud-hint {
      margin-top: 10px;
      font-size: 10px;
      color: rgba(175, 200, 235, 0.55);
      text-align: center;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <aside class="hud" aria-label="Neon Portal 3D Controls">
    <div class="hud-header">
      <span class="hud-title">NEON PORTAL 3D</span>
      <span class="hud-dot" id="statusDot"></span>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">FPS</span>
        <span class="stat-value" id="fpsVal">60</span>
      </div>
      <div class="stat">
        <span class="stat-label">POLYS</span>
        <span class="stat-value" id="polysVal">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">PARTS</span>
        <span class="stat-value" id="partsVal">110</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="pauseBtn" type="button">Pause</button>
      <button class="btn active" id="orbitBtn" type="button">Orbit ON</button>
      <button class="btn" id="resetBtn" type="button">Reset</button>
    </div>

    <div class="slider-row">
      <div class="slider-header">
        <label for="speedSlider">PORTAL SPEED</label>
        <span id="speedVal">1.0x</span>
      </div>
      <input id="speedSlider" type="range" min="0.1" max="3.0" step="0.1" value="1.0" />
    </div>

    <div class="hud-hint">Drag to orbit · Scroll to zoom</div>
  </aside>

  <script src="engine3d.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
