<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>NEON PORTAL 3D</title>
<style>
  :root {
    --neon-cyan: #22e6ff;
    --neon-mag: #ff3df0;
    --neon-vio: #8a5bff;
    --hud-bg: rgba(10, 16, 34, 0.42);
    --hud-line: rgba(120, 220, 255, 0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #04060f;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #d7f6ff;
    -webkit-user-select: none;
    user-select: none;
  }
  #c {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #c.dragging { cursor: grabbing; }

  /* ---------- Glassmorphism HUD ---------- */
  .hud {
    position: fixed;
    z-index: 10;
    background: var(--hud-bg);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid var(--hud-line);
    border-radius: 16px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  .hud-title {
    top: 18px;
    left: 18px;
    padding: 14px 22px;
    pointer-events: none;
  }
  .hud-title h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 3px;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-mag));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 22px rgba(34, 230, 255, 0.35);
  }
  .hud-title p {
    margin-top: 3px;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(180, 230, 255, 0.6);
  }

  .hud-stats {
    top: 18px;
    right: 18px;
    padding: 14px 18px;
    display: flex;
    gap: 22px;
    pointer-events: none;
  }
  .stat { text-align: center; min-width: 58px; }
  .stat .k {
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(150, 220, 255, 0.65);
  }
  .stat .v {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #eafcff;
    text-shadow: 0 0 14px rgba(34, 230, 255, 0.5);
  }

  .hud-controls {
    left: 18px;
    bottom: 18px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 250px;
  }
  .row { display: flex; gap: 10px; align-items: center; }
  button {
    flex: 1;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #eafcff;
    background: rgba(34, 230, 255, 0.10);
    border: 1px solid rgba(34, 230, 255, 0.4);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button:hover {
    background: rgba(34, 230, 255, 0.22);
    box-shadow: 0 0 18px rgba(34, 230, 255, 0.4);
  }
  button.active {
    background: rgba(255, 61, 240, 0.18);
    border-color: rgba(255, 61, 240, 0.6);
    box-shadow: 0 0 18px rgba(255, 61, 240, 0.4);
  }
  .slider-wrap { display: flex; align-items: center; gap: 12px; }
  .slider-wrap label { font-size: 11px; letter-spacing: 1px; color: rgba(150, 220, 255, 0.7); white-space: nowrap; }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 6px;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-mag));
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #eafcff;
    box-shadow: 0 0 12px rgba(34, 230, 255, 0.9);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border: none;
    border-radius: 50%;
    background: #eafcff;
    box-shadow: 0 0 12px rgba(34, 230, 255, 0.9);
    cursor: pointer;
  }
  .hint {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 10;
    font-size: 11px;
    letter-spacing: 1px;
    color: rgba(150, 220, 255, 0.5);
    pointer-events: none;
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="hud hud-title">
    <h1>NEON PORTAL 3D</h1>
    <p>SOFTWARE RENDERER &middot; PAINTER'S ALGORITHM</p>
  </div>

  <div class="hud hud-stats">
    <div class="stat"><div class="k">FPS</div><div class="v" id="fps">0</div></div>
    <div class="stat"><div class="k">POLYS</div><div class="v" id="polys">0</div></div>
    <div class="stat"><div class="k">PARTS</div><div class="v" id="parts">0</div></div>
  </div>

  <div class="hud hud-controls">
    <div class="row">
      <button id="btnPause">Pause</button>
      <button id="btnOrbit" class="active">Orbit ON</button>
      <button id="btnReset">Reset</button>
    </div>
    <div class="slider-wrap">
      <label for="speed">SPEED</label>
      <input id="speed" type="range" min="0" max="3" step="0.05" value="1" />
    </div>
  </div>

  <div class="hint">DRAG TO ORBIT &middot; WHEEL TO ZOOM</div>

  <script src="engine3d.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
