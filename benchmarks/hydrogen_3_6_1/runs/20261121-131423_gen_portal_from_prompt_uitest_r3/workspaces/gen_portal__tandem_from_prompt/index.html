<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON PORTAL 3D</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020208;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  #c {
    display: block;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(ellipse at center, #0a0a24 0%, #030310 55%, #020208 100%);
  }
  #hud {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 10;
    min-width: 230px;
    padding: 16px 18px;
    border-radius: 16px;
    color: #d7f6ff;
    background: rgba(8, 10, 30, 0.42);
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    border: 1px solid rgba(0, 229, 255, 0.35);
    box-shadow: 0 0 24px rgba(0, 229, 255, 0.18), inset 0 0 22px rgba(255, 0, 200, 0.06);
  }
  #hud h1 {
    margin: 0 0 12px 0;
    font-size: 18px;
    letter-spacing: 3px;
    font-weight: 700;
    color: #00e5ff;
    text-shadow: 0 0 10px rgba(0, 229, 255, 0.8);
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    margin: 6px 0;
    letter-spacing: 1px;
  }
  .row .k { color: #8fb8ff; opacity: 0.85; }
  .row .v {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
  }
  .btns {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  button {
    flex: 1 1 auto;
    cursor: pointer;
    padding: 8px 10px;
    font-size: 12px;
    letter-spacing: 1px;
    color: #eafcff;
    background: rgba(0, 229, 255, 0.10);
    border: 1px solid rgba(0, 229, 255, 0.45);
    border-radius: 8px;
    transition: background 0.15s, box-shadow 0.15s;
  }
  button:hover {
    background: rgba(0, 229, 255, 0.22);
    box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
  }
  .speed {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .speed label { color: #8fb8ff; }
  #speed {
    flex: 1;
    accent-color: #ff00c8;
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <h1>NEON PORTAL 3D</h1>
    <div class="row"><span class="k">FPS</span><span class="v" id="fps">0</span></div>
    <div class="row"><span class="k">POLYS</span><span class="v" id="polys">0</span></div>
    <div class="row"><span class="k">PARTS</span><span class="v" id="parts">0</span></div>
    <div class="btns">
      <button id="btn-pause">Pause</button>
      <button id="btn-orbit">Orbit ON</button>
      <button id="btn-reset">Reset</button>
    </div>
    <div class="speed">
      <label for="speed">SPEED</label>
      <input type="range" id="speed" min="0.2" max="3" step="0.1" value="1">
    </div>
  </div>
  <script src="engine3d.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
