<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEON PORTAL 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #03040e;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #cfe9ff;
  }
  #c {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    background: radial-gradient(circle at 50% 42%, #0b1026 0%, #070a1c 45%, #03040e 100%);
    cursor: grab;
  }
  #c:active { cursor: grabbing; }

  #hud {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 10;
    min-width: 250px;
    padding: 16px 18px 18px;
    border-radius: 16px;
    background: rgba(10, 16, 40, 0.35);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(0, 240, 255, 0.35);
    box-shadow: 0 0 24px rgba(0, 240, 255, 0.18), inset 0 0 24px rgba(255, 42, 212, 0.06);
    user-select: none;
  }
  #hud h1 {
    font-size: 18px;
    letter-spacing: 3px;
    font-weight: 700;
    margin-bottom: 12px;
    color: #eafcff;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.8), 0 0 22px rgba(255, 42, 212, 0.5);
  }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat {
    background: rgba(3, 6, 20, 0.5);
    border: 1px solid rgba(0, 240, 255, 0.2);
    border-radius: 10px;
    padding: 8px 6px;
    text-align: center;
  }
  .stat .k {
    display: block;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #7fd8ff;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .stat .v {
    display: block;
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.7);
    font-variant-numeric: tabular-nums;
  }
  .controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row {
    display: flex;
    gap: 8px;
  }
  button {
    flex: 1;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1px solid rgba(0, 240, 255, 0.4);
    background: rgba(0, 240, 255, 0.08);
    color: #eafcff;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s, transform 0.05s;
  }
  button:hover {
    background: rgba(0, 240, 255, 0.18);
    box-shadow: 0 0 14px rgba(0, 240, 255, 0.35);
  }
  button:active { transform: translateY(1px); }
  #btn-orbit { border-color: rgba(255, 42, 212, 0.4); background: rgba(255, 42, 212, 0.08); }
  #btn-orbit:hover { background: rgba(255, 42, 212, 0.18); box-shadow: 0 0 14px rgba(255, 42, 212, 0.35); }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .slider-row label {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #7fd8ff;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #speed {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(90deg, #00f0ff, #ff2ad4);
    outline: none;
    cursor: pointer;
  }
  #speed::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid #00f0ff;
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
    cursor: pointer;
  }
  #speed::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid #00f0ff;
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
    cursor: pointer;
  }
  .hint {
    margin-top: 12px;
    font-size: 10px;
    letter-spacing: 1px;
    color: rgba(127, 216, 255, 0.6);
    text-align: center;
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud">
    <h1>NEON PORTAL 3D</h1>
    <div class="stats">
      <div class="stat"><span class="k">FPS</span><span class="v" id="fps">0</span></div>
      <div class="stat"><span class="k">Polys</span><span class="v" id="polys">0</span></div>
      <div class="stat"><span class="k">Parts</span><span class="v" id="parts">0</span></div>
    </div>
    <div class="controls">
      <div class="row">
        <button id="btn-pause">Pause</button>
        <button id="btn-orbit">Orbit ON</button>
      </div>
      <div class="row">
        <button id="btn-reset">Reset</button>
      </div>
      <div class="slider-row">
        <label for="speed">Speed</label>
        <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1" />
      </div>
    </div>
    <div class="hint">drag to orbit &middot; wheel to zoom</div>
  </div>

  <script src="engine3d.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
