<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbital Particle Simulation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060913;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      color: #e6eeff;
      user-select: none;
    }

    canvas#sky {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 248px;
      padding: 14px 16px;
      background: rgba(18, 28, 54, 0.42);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(140, 180, 255, 0.22);
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      z-index: 10;
    }

    .hud-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(200, 222, 255, 0.88);
      margin-bottom: 12px;
    }

    .hud-controls {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .hud-controls button {
      flex: 1;
      padding: 6px 8px;
      font-size: 11px;
      font-weight: 600;
      color: #e6eeff;
      background: rgba(120, 165, 255, 0.14);
      border: 1px solid rgba(140, 180, 255, 0.25);
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .hud-controls button:hover {
      background: rgba(120, 165, 255, 0.26);
      border-color: rgba(160, 200, 255, 0.45);
    }

    .hud-slider {
      margin-bottom: 12px;
    }

    .hud-slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: rgba(200, 222, 255, 0.8);
      margin-bottom: 5px;
    }

    .hud-slider-header span:last-child {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: #ffffff;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #79b8ff;
      cursor: pointer;
    }

    .hud-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(140, 180, 255, 0.16);
      font-variant-numeric: tabular-nums;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(180, 205, 245, 0.62);
    }

    .stat-value {
      font-size: 13px;
      font-weight: 600;
      color: #f0f5ff;
    }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>

  <div class="hud">
    <div class="hud-title">Orbital Telemetry</div>

    <div class="hud-controls">
      <button id="btnPlay" type="button">Pause</button>
      <button id="btnTrails" type="button">Trails ON</button>
      <button id="btnReset" type="button">Reset</button>
    </div>

    <div class="hud-slider">
      <div class="hud-slider-header">
        <span>Time Scale</span>
        <span id="speedVal">1.0x</span>
      </div>
      <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0" />
    </div>

    <div class="hud-stats">
      <div class="stat">
        <span class="stat-label">FPS</span>
        <span class="stat-value" id="fps">60</span>
      </div>
      <div class="stat">
        <span class="stat-label">Sim Time</span>
        <span class="stat-value" id="simTime">0.0 s</span>
      </div>
      <div class="stat">
        <span class="stat-label">Burst Particles</span>
        <span class="stat-value" id="bursts">0</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('sky');
      const ctx = canvas.getContext('2d');

      const btnPlay = document.getElementById('btnPlay');
      const btnTrails = document.getElementById('btnTrails');
      const btnReset = document.getElementById('btnReset');
      const speedSlider = document.getElementById('speed');
      const speedVal = document.getElementById('speedVal');
      const fpsEl = document.getElementById('fps');
      const simTimeEl = document.getElementById('simTime');
      const burstsEl = document.getElementById('bursts');

      let W = 0;
      let H = 0;
      let dpr = 1;
      let scale = 1;

      let playing = true;
      let showTrails = true;
      let speed = parseFloat(speedSlider.value) || 1.0;
      let simTime = 0;

      let lastFrameTime = null;
      let fpsFrames = 0;
      let fpsElapsed = 0;
      let currentFps = 60;

      const ELLIPSE_Y_RATIO = 0.62;
      const TRAIL_LENGTH = 90;

      // 6 planets with exact radii, periods, sizes, colors, moon counts, and fixed starting phases
      const PLANET_DEFS = [
        { radius: 62,  period: 4.2,  size: 4.5, color: '#ff9b6b', moons: 0 },
        { radius: 98,  period: 7,    size: 6.5, color: '#7be0a4', moons: 1 },
        { radius: 140, period: 10.5, size: 7.5, color: '#5fb4ff', moons: 1 },
        { radius: 186, period: 15,   size: 5.5, color: '#e2674e', moons: 2 },
        { radius: 246, period: 24,   size: 13,  color: '#e6c288', moons: 2, hasRing: true },
        { radius: 304, period: 36,   size: 9,   color: '#a58bff', moons: 1 }
      ];

      const planets = PLANET_DEFS.map((def, i) => {
        const moons = [];
        for (let m = 0; m < def.moons; m++) {
          moons.push({
            dist: def.size * (2.1 + m * 1.15),
            size: Math.max(1.4, def.size * (0.24 - m * 0.04)),
            period: 1.4 + m * 1.1 + i * 0.15,
            phase: m * 2.1 + i * 0.7
          });
        }
        return {
          ...def,
          startPhase: i * 1.37 + 0.4,
          phase: i * 1.37 + 0.4,
          trail: [],
          moonList: moons
        };
      });

      // 180 twinkling background stars
      const STAR_COUNT = 180;
      const stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        let color = 'rgb(255, 255, 255)';
        if (i % 5 === 0) {
          color = 'rgb(255, 214, 170)';
        } else if (i % 3 === 0) {
          color = 'rgb(170, 205, 255)';
        }
        stars.push({
          x: Math.random(),
          y: Math.random(),
          radius: 0.3 + Math.random() * 1.3,
          base: 0.35 + Math.random() * 0.45,
          rate: 1.2 + Math.random() * 2.8,
          phase: Math.random() * Math.PI * 2,
          color
        });
      }

      const burstParticles = [];

      function resize() {
        dpr = window.devicePixelRatio || 1;
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        scale = Math.min(W, H) / 700;
      }

      function spawnBurst(x, y) {
        const count = 46 + Math.floor(Math.random() * 19); // 46 to 64
        const baseHue = Math.floor(Math.random() * 360);
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.18;
          const spd = 70 + Math.random() * 210; // 70 to 280 px/s
          burstParticles.push({
            x,
            y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            size: 1.8 + Math.random() * 2.8,
            hue: (baseHue + Math.floor(Math.random() * 50) - 25 + 360) % 360,
            life: 1.0,
            decay: 0.45 + Math.random() * 0.55 // 0.45 to 1.0
          });
        }
      }

      function resetSimulation() {
        simTime = 0;
        burstParticles.length = 0;
        for (let i = 0; i < planets.length; i++) {
          planets[i].phase = planets[i].startPhase;
          planets[i].trail.length = 0;
        }
        updateHudReadouts();
      }

      function updateHudReadouts() {
        fpsEl.textContent = String(Math.round(currentFps));
        simTimeEl.textContent = simTime.toFixed(1) + ' s';
        burstsEl.textContent = String(burstParticles.length);
      }

      btnPlay.addEventListener('click', () => {
        playing = !playing;
        btnPlay.textContent = playing ? 'Pause' : 'Play';
      });

      btnTrails.addEventListener('click', () => {
        showTrails = !showTrails;
        btnTrails.textContent = showTrails ? 'Trails ON' : 'Trails OFF';
      });

      btnReset.addEventListener('click', () => {
        resetSimulation();
      });

      speedSlider.addEventListener('input', (e) => {
        speed = parseFloat(e.target.value);
        speedVal.textContent = speed.toFixed(1) + 'x';
      });

      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = (typeof e.clientX === 'number' ? e.clientX - rect.left : e.offsetX || W / 2);
        const y = (typeof e.clientY === 'number' ? e.clientY - rect.top : e.offsetY || H / 2);
        spawnBurst(x, y);
      });

      window.addEventListener('resize', resize);
      resize();

      function drawStars(t) {
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          const alpha = Math.max(0.05, Math.min(1, s.base + 0.28 * Math.sin(t * s.rate + s.phase)));
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.arc(s.x * W, s.y * H, s.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawCentralStar(cx, cy, t) {
        const coreR = 24 * scale;
        const pulse = 1 + 0.07 * Math.sin(1.7 * t);
        const coronaR = coreR * 5.2 * pulse;

        const coronaGrad = ctx.createRadialGradient(cx, cy, coreR * 0.2, cx, cy, coronaR);
        coronaGrad.addColorStop(0, 'rgba(255, 214, 130, 0.55)');
        coronaGrad.addColorStop(1, 'rgba(255, 214, 130, 0)');
        ctx.fillStyle = coronaGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, coronaR, 0, Math.PI * 2);
        ctx.fill();

        const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
        coreGrad.addColorStop(0, '#fffbe6');
        coreGrad.addColorStop(0.45, '#ffd76a');
        coreGrad.addColorStop(1, '#ff8a2b');
        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawOrbits(cx, cy) {
        ctx.save();
        ctx.strokeStyle = 'rgba(130, 160, 220, 0.11)';
        ctx.lineWidth = 1;
        for (let i = 0; i < planets.length; i++) {
          const rx = planets[i].radius * scale;
          const ry = rx * ELLIPSE_Y_RATIO;
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawPlanetAndMoons(p, cx, cy, t) {
        const rx = p.radius * scale;
        const ry = rx * ELLIPSE_Y_RATIO;
        const angle = p.startPhase + (t / p.period) * Math.PI * 2;
        const px = cx + Math.cos(angle) * rx;
        const py = cy + Math.sin(angle) * ry;
        const size = p.size * scale;

        if (playing) {
          p.trail.push({ x: px, y: py });
          if (p.trail.length > TRAIL_LENGTH) {
            p.trail.shift();
          }
        }

        // Draw trail
        if (showTrails && p.trail.length > 1) {
          const n = p.trail.length - 1;
          ctx.save();
          ctx.lineCap = 'round';
          ctx.strokeStyle = p.color;
          for (let i = 0; i < n; i++) {
            const pt0 = p.trail[i];
            const pt1 = p.trail[i + 1];
            ctx.globalAlpha = (i / n) * 0.55;
            ctx.lineWidth = Math.max(0.6, p.size * scale * 0.42 * i / n);
            ctx.beginPath();
            ctx.moveTo(pt0.x, pt0.y);
            ctx.lineTo(pt1.x, pt1.y);
            ctx.stroke();
          }
          ctx.restore();
        }

        // Planet glow
        const glowGrad = ctx.createRadialGradient(px, py, 0, px, py, 3 * size);
        glowGrad.addColorStop(0, p.color + '55');
        glowGrad.addColorStop(1, p.color + '00');
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(px, py, 3 * size, 0, Math.PI * 2);
        ctx.fill();

        // Fifth planet tilted ring (behind & around)
        if (p.hasRing) {
          ctx.save();
          ctx.strokeStyle = 'rgba(230, 194, 136, 0.55)';
          ctx.lineWidth = Math.max(1.5, size * 0.28);
          ctx.beginPath();
          ctx.ellipse(px, py, size * 2.15, size * 0.65, -0.38, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // Planet disc
        const discGrad = ctx.createRadialGradient(
          px - 0.35 * size,
          py - 0.35 * size,
          0,
          px,
          py,
          size
        );
        discGrad.addColorStop(0, '#ffffff');
        discGrad.addColorStop(0.25, p.color);
        discGrad.addColorStop(1, '#0a0f1f');
        ctx.fillStyle = discGrad;
        ctx.beginPath();
        ctx.arc(px, py, size, 0, Math.PI * 2);
        ctx.fill();

        // Moons
        for (let m = 0; m < p.moonList.length; m++) {
          const moon = p.moonList[m];
          const mAngle = moon.phase + (t / moon.period) * Math.PI * 2;
          const mDist = moon.dist * scale;
          const mx = px + Math.cos(mAngle) * mDist;
          const my = py + Math.sin(mAngle) * mDist * 0.72;
          const mSize = moon.size * scale;

          ctx.fillStyle = '#dce6ff';
          ctx.beginPath();
          ctx.arc(mx, my, mSize, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function updateAndDrawBursts(dt) {
        const damping = Math.pow(0.12, dt);
        for (let i = burstParticles.length - 1; i >= 0; i--) {
          const p = burstParticles[i];
          p.vx *= damping;
          p.vy *= damping;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= p.decay * dt;
          if (p.life <= 0) {
            burstParticles.splice(i, 1);
          }
        }

        if (burstParticles.length === 0) return;

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < burstParticles.length; i++) {
          const p = burstParticles[i];
          const r = 3 * p.size;
          const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
          grad.addColorStop(0, 'hsla(' + p.hue + ', 100%, 75%, ' + p.life + ')');
          grad.addColorStop(1, 'hsla(' + p.hue + ', 100%, 75%, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function frame(now) {
        const dt = lastFrameTime === null ? 0 : Math.min(0.05, Math.max(0, (now - lastFrameTime) / 1000));
        lastFrameTime = now;

        if (dt > 0) {
          fpsFrames++;
          fpsElapsed += dt;
          if (fpsElapsed >= 0.25) {
            currentFps = fpsFrames / fpsElapsed;
            fpsFrames = 0;
            fpsElapsed = 0;
          }
        }

        if (playing) {
          simTime += dt * speed;
        }

        ctx.fillStyle = '#060913';
        ctx.fillRect(0, 0, W, H);

        const cx = W / 2;
        const cy = H / 2;

        drawStars(simTime);
        drawOrbits(cx, cy);
        drawCentralStar(cx, cy, simTime);

        for (let i = 0; i < planets.length; i++) {
          drawPlanetAndMoons(planets[i], cx, cy, simTime);
        }

        updateAndDrawBursts(dt);
        updateHudReadouts();

        window.requestAnimationFrame(frame);
      }

      window.requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
