<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbital Particle Simulation</title>
  <style>
    :root {
      --bg-space: #060913;
      --hud-bg: rgba(12, 18, 36, 0.58);
      --hud-border: rgba(148, 163, 184, 0.22);
      --hud-text: #e2e8f0;
      --hud-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --btn-bg: rgba(30, 41, 59, 0.65);
      --btn-hover: rgba(51, 65, 85, 0.85);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-space);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--hud-text);
      user-select: none;
    }

    #space-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: 280px;
      padding: 16px;
      border-radius: 16px;
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      padding-bottom: 10px;
    }

    .hud-title {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #f8fafc;
    }

    .hud-hint {
      font-size: 0.7rem;
      color: var(--hud-muted);
    }

    .controls-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    button {
      appearance: none;
      border: 1px solid rgba(148, 163, 184, 0.24);
      background: var(--btn-bg);
      color: var(--hud-text);
      padding: 7px 8px;
      border-radius: 9px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
    }

    button:hover {
      background: var(--btn-hover);
      border-color: rgba(148, 163, 184, 0.45);
    }

    button:active {
      transform: scale(0.97);
    }

    button.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.55);
      color: #e0f2fe;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--hud-muted);
    }

    .slider-value {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--accent);
    }

    input[type="range"] {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.24);
      outline: none;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid rgba(148, 163, 184, 0.14);
    }

    .metric {
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 8px;
      padding: 6px 8px;
    }

    .metric-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--hud-muted);
    }

    .metric-value {
      font-size: 0.85rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #f8fafc;
    }

    @media (max-width: 480px) {
      .hud {
        width: calc(100% - 24px);
        top: 12px;
        left: 12px;
      }
    }
  </style>
</head>
<body>
  <canvas id="space-canvas"></canvas>

  <aside class="hud" aria-label="Simulation Controls">
    <div class="hud-header">
      <span class="hud-title">Orbital Sim</span>
      <span class="hud-hint">Click space for burst</span>
    </div>

    <div class="controls-row">
      <button id="play-pause-btn" class="active" type="button">Pause</button>
      <button id="trails-btn" class="active" type="button">Trails: ON</button>
      <button id="reset-btn" type="button">Reset</button>
    </div>

    <div class="slider-group">
      <div class="slider-label">
        <span>Simulation Speed</span>
        <span id="speed-readout" class="slider-value">1.0x</span>
      </div>
      <input id="speed-slider" type="range" min="0.2" max="3.0" step="0.1" value="1.0" />
    </div>

    <div class="metrics">
      <div class="metric">
        <span class="metric-label">FPS</span>
        <span id="fps-value" class="metric-value">60</span>
      </div>
      <div class="metric">
        <span class="metric-label">Time (s)</span>
        <span id="time-value" class="metric-value">0.0</span>
      </div>
      <div class="metric">
        <span class="metric-label">Particles</span>
        <span id="particles-value" class="metric-value">0</span>
      </div>
    </div>
  </aside>

  <script>
    (() => {
      const canvas = document.getElementById("space-canvas");
      const ctx = canvas.getContext("2d");

      const playPauseBtn = document.getElementById("play-pause-btn");
      const trailsBtn = document.getElementById("trails-btn");
      const resetBtn = document.getElementById("reset-btn");
      const speedSlider = document.getElementById("speed-slider");
      const speedReadout = document.getElementById("speed-readout");
      const fpsValueEl = document.getElementById("fps-value");
      const timeValueEl = document.getElementById("time-value");
      const particlesValueEl = document.getElementById("particles-value");

      const SPACE_BG = "#060913";
      const STAR_COUNT = 220;
      const MAX_TRAIL_POINTS = 70;

      let width = window.innerWidth;
      let height = window.innerHeight;
      let dpr = window.devicePixelRatio || 1;

      let isPlaying = true;
      let trailsEnabled = true;
      let speedMultiplier = 1.0;
      let simTime = 0;

      let lastFrameTime = performance.now();
      let fpsFrames = 0;
      let fpsElapsed = 0;
      let currentFps = 60;

      const starColors = ["#ffffff", "#cfe8ff", "#ffe9c4", "#b8d4ff"];
      const stars = Array.from({ length: STAR_COUNT }, () => ({
        nx: Math.random(),
        ny: Math.random(),
        radius: 0.5 + Math.random() * 1.4,
        baseAlpha: 0.25 + Math.random() * 0.65,
        twinkleSpeed: 0.8 + Math.random() * 2.6,
        phase: Math.random() * Math.PI * 2,
        color: starColors[Math.floor(Math.random() * starColors.length)]
      }));

      const planetDefinitions = [
        {
          name: "Mercury-like",
          orbitFactor: 0.14,
          radius: 4.5,
          speed: 1.55,
          initialAngle: 0.4,
          color: "#94a3b8",
          glow: "rgba(148, 163, 184, 0.45)",
          moons: []
        },
        {
          name: "Aurelia",
          orbitFactor: 0.21,
          radius: 7,
          speed: 1.05,
          initialAngle: 2.1,
          color: "#f59e0b",
          glow: "rgba(245, 158, 11, 0.45)",
          moons: []
        },
        {
          name: "Terra",
          orbitFactor: 0.29,
          radius: 8.5,
          speed: 0.75,
          initialAngle: 4.2,
          color: "#38bdf8",
          glow: "rgba(56, 189, 248, 0.5)",
          moons: [
            { orbitRadius: 17, radius: 2.3, speed: 3.4, initialAngle: 0.5, color: "#cbd5e1" }
          ]
        },
        {
          name: "Pyros",
          orbitFactor: 0.37,
          radius: 6.5,
          speed: 0.55,
          initialAngle: 1.1,
          color: "#f87171",
          glow: "rgba(248, 113, 113, 0.45)",
          moons: [
            { orbitRadius: 14, radius: 1.9, speed: 4.1, initialAngle: 1.9, color: "#fca5a5" }
          ]
        },
        {
          name: "Jovian",
          orbitFactor: 0.46,
          radius: 13,
          speed: 0.35,
          initialAngle: 3.3,
          color: "#c084fc",
          glow: "rgba(192, 132, 252, 0.5)",
          moons: [
            { orbitRadius: 21, radius: 2.5, speed: 2.8, initialAngle: 0.0, color: "#e9d5ff" },
            { orbitRadius: 29, radius: 2.1, speed: -2.0, initialAngle: 2.7, color: "#a5f3fc" }
          ]
        },
        {
          name: "Cryo",
          orbitFactor: 0.54,
          radius: 9.5,
          speed: 0.23,
          initialAngle: 5.4,
          color: "#2dd4bf",
          glow: "rgba(45, 212, 191, 0.45)",
          moons: []
        }
      ];

      let planets = [];
      let burstParticles = [];

      function initPlanets() {
        planets = planetDefinitions.map((def) => ({
          ...def,
          angle: def.initialAngle,
          trail: [],
          moons: def.moons.map((m) => ({
            ...m,
            angle: m.initialAngle,
            trail: []
          }))
        }));
      }

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = window.devicePixelRatio || 1;

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function spawnBurst(x, y) {
        const count = 42;
        const palette = ["#38bdf8", "#facc15", "#f472b6", "#a78bfa", "#34d399", "#ffffff"];

        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.25;
          const speed = 60 + Math.random() * 210;
          const maxLife = 0.75 + Math.random() * 0.85;

          burstParticles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: 1.4 + Math.random() * 2.4,
            color: palette[Math.floor(Math.random() * palette.length)],
            life: maxLife,
            maxLife
          });
        }
      }

      function hexToRgba(hex, alpha) {
        const clean = hex.replace("#", "");
        const num = parseInt(clean, 16);
        const r = (num >> 16) & 255;
        const g = (num >> 8) & 255;
        const b = num & 255;
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }

      function drawBackground() {
        ctx.fillStyle = SPACE_BG;
        ctx.fillRect(0, 0, width, height);
      }

      function drawStars(nowSec) {
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          const twinkle = 0.55 + 0.45 * Math.sin(nowSec * s.twinkleSpeed + s.phase);
          const alpha = Math.max(0.08, Math.min(1, s.baseAlpha * twinkle));

          ctx.globalAlpha = alpha;
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.arc(s.nx * width, s.ny * height, s.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawCentralStar(cx, cy, nowSec) {
        const pulse = 1 + 0.08 * Math.sin(nowSec * 2.2);
        const coronaRadius = 72 * pulse;

        // Outer pulsing corona
        const coronaGrad = ctx.createRadialGradient(cx, cy, 8, cx, cy, coronaRadius);
        coronaGrad.addColorStop(0, "rgba(255, 240, 180, 0.95)");
        coronaGrad.addColorStop(0.28, "rgba(255, 190, 70, 0.55)");
        coronaGrad.addColorStop(0.62, "rgba(255, 110, 20, 0.16)");
        coronaGrad.addColorStop(1, "rgba(255, 80, 10, 0)");

        ctx.fillStyle = coronaGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, coronaRadius, 0, Math.PI * 2);
        ctx.fill();

        // Bright stellar core
        const coreRadius = 20 * (1 + 0.025 * Math.sin(nowSec * 4.1));
        const coreGrad = ctx.createRadialGradient(cx - 3, cy - 3, 2, cx, cy, coreRadius);
        coreGrad.addColorStop(0, "#ffffff");
        coreGrad.addColorStop(0.55, "#fde68a");
        coreGrad.addColorStop(1, "#f59e0b");

        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, coreRadius, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawTrail(trail, color, lineWidth) {
        if (trail.length < 2) return;
        for (let i = 1; i < trail.length; i++) {
          const t = i / trail.length;
          ctx.strokeStyle = hexToRgba(color, t * 0.55);
          ctx.lineWidth = lineWidth * t;
          ctx.beginPath();
          ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
          ctx.lineTo(trail[i].x, trail[i].y);
          ctx.stroke();
        }
      }

      function updateAndDrawPlanets(cx, cy, dt) {
        const minDim = Math.min(width, height);
        const scaledDt = dt * speedMultiplier;

        for (let i = 0; i < planets.length; i++) {
          const p = planets[i];
          const orbitRadius = minDim * 0.78 * p.orbitFactor;

          if (isPlaying) {
            p.angle += p.speed * scaledDt;
          }

          const px = cx + Math.cos(p.angle) * orbitRadius;
          const py = cy + Math.sin(p.angle) * orbitRadius;

          if (isPlaying && trailsEnabled) {
            p.trail.push({ x: px, y: py });
            if (p.trail.length > MAX_TRAIL_POINTS) {
              p.trail.shift();
            }
          }

          // Subtle orbital guide ring
          ctx.strokeStyle = "rgba(148, 163, 184, 0.08)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(cx, cy, orbitRadius, 0, Math.PI * 2);
          ctx.stroke();

          // Fading orbital trail
          if (trailsEnabled) {
            drawTrail(p.trail, p.color, Math.max(1.5, p.radius * 0.45));
          }

          // Planet glow & body
          ctx.save();
          ctx.shadowColor = p.glow;
          ctx.shadowBlur = 14;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(px, py, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // Moons / satellites
          for (let j = 0; j < p.moons.length; j++) {
            const m = p.moons[j];
            if (isPlaying) {
              m.angle += m.speed * scaledDt;
            }
            const mx = px + Math.cos(m.angle) * m.orbitRadius;
            const my = py + Math.sin(m.angle) * m.orbitRadius;

            if (isPlaying && trailsEnabled) {
              m.trail.push({ x: mx, y: my });
              if (m.trail.length > 28) {
                m.trail.shift();
              }
            }

            if (trailsEnabled) {
              drawTrail(m.trail, m.color, 1.2);
            }

            ctx.fillStyle = m.color;
            ctx.beginPath();
            ctx.arc(mx, my, m.radius, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function updateAndDrawBurstParticles(dt) {
        if (burstParticles.length === 0) return;

        const damping = Math.pow(0.94, dt * 60);
        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        for (let i = burstParticles.length - 1; i >= 0; i--) {
          const pt = burstParticles[i];
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.vx *= damping;
          pt.vy *= damping;
          pt.life -= dt;

          if (pt.life <= 0) {
            burstParticles.splice(i, 1);
            continue;
          }

          const alpha = Math.max(0, pt.life / pt.maxLife);
          const glowRadius = pt.radius * 2.8;
          const grad = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, glowRadius);
          grad.addColorStop(0, hexToRgba(pt.color, alpha));
          grad.addColorStop(0.5, hexToRgba(pt.color, alpha * 0.45));
          grad.addColorStop(1, hexToRgba(pt.color, 0));

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, glowRadius, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      function updateHud(dt) {
        fpsFrames++;
        fpsElapsed += dt;
        if (fpsElapsed >= 0.4) {
          currentFps = Math.round(fpsFrames / fpsElapsed);
          fpsFrames = 0;
          fpsElapsed = 0;
          fpsValueEl.textContent = String(currentFps);
        }

        timeValueEl.textContent = simTime.toFixed(1);
        particlesValueEl.textContent = String(burstParticles.length);
      }

      function animate(now) {
        const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
        lastFrameTime = now;

        if (isPlaying) {
          simTime += dt * speedMultiplier;
        }

        const nowSec = now / 1000;
        const cx = width / 2;
        const cy = height / 2;

        drawBackground();
        drawStars(nowSec);
        updateAndDrawPlanets(cx, cy, dt);
        drawCentralStar(cx, cy, nowSec);
        updateAndDrawBurstParticles(dt);
        updateHud(dt);

        requestAnimationFrame(animate);
      }

      // Event listeners
      window.addEventListener("resize", resizeCanvas);

      canvas.addEventListener("click", (event) => {
        spawnBurst(event.clientX, event.clientY);
      });

      playPauseBtn.addEventListener("click", () => {
        isPlaying = !isPlaying;
        playPauseBtn.textContent = isPlaying ? "Pause" : "Play";
        playPauseBtn.classList.toggle("active", isPlaying);
      });

      trailsBtn.addEventListener("click", () => {
        trailsEnabled = !trailsEnabled;
        trailsBtn.textContent = trailsEnabled ? "Trails: ON" : "Trails: OFF";
        trailsBtn.classList.toggle("active", trailsEnabled);
        if (!trailsEnabled) {
          planets.forEach((p) => {
            p.trail.length = 0;
            p.moons.forEach((m) => {
              m.trail.length = 0;
            });
          });
        }
      });

      resetBtn.addEventListener("click", () => {
        simTime = 0;
        burstParticles.length = 0;
        speedMultiplier = 1.0;
        speedSlider.value = "1.0";
        speedReadout.textContent = "1.0x";
        initPlanets();
      });

      speedSlider.addEventListener("input", () => {
        speedMultiplier = parseFloat(speedSlider.value);
        speedReadout.textContent = `${speedMultiplier.toFixed(1)}x`;
      });

      // Initialize & start loop
      resizeCanvas();
      initPlanets();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
