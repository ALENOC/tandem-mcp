<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Particle Simulation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #060913; }
canvas#canvas { display: block; width: 100vw; height: 100vh; }
#hud {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 10;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 14px;
  padding: 16px 20px;
  font-family: 'Segoe UI', system-ui, sans-serif;
  color: #e0e6f0;
  min-width: 220px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
#hud h2 {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 10px;
  letter-spacing: 0.5px;
  color: rgba(255,255,255,0.85);
}
.hud-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  font-size: 13px;
}
.hud-row label {
  min-width: 60px;
  color: rgba(255,255,255,0.6);
}
.hud-row span {
  font-variant-numeric: tabular-nums;
  color: rgba(255,255,255,0.9);
}
button {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  color: #e0e6f0;
  padding: 6px 14px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s;
}
button:hover { background: rgba(255,255,255,0.18); }
input[type="range"] {
  width: 100px;
  accent-color: #6ea8fe;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">
  <h2>Orbital Sim</h2>
  <div class="hud-row">
    <button id="btn-play-pause">Pause</button>
    <button id="btn-trails">Trails: ON</button>
    <button id="btn-reset">Reset</button>
  </div>
  <div class="hud-row">
    <label>Speed</label>
    <input id="speed-slider" type="range" min="0.2" max="3.0" step="0.1" value="1.0">
    <span id="speed-value">1.0x</span>
  </div>
  <div class="hud-row">
    <label>FPS</label>
    <span id="fps">0</span>
  </div>
  <div class="hud-row">
    <label>Time</label>
    <span id="sim-time">0.0s</span>
  </div>
  <div class="hud-row">
    <label>Bursts</label>
    <span id="burst-count">0</span>
  </div>
</div>
<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const btnPlayPause = document.getElementById('btn-play-pause');
  const btnTrails = document.getElementById('btn-trails');
  const btnReset = document.getElementById('btn-reset');
  const speedSlider = document.getElementById('speed-slider');
  const speedValue = document.getElementById('speed-value');
  const fpsEl = document.getElementById('fps');
  const simTimeEl = document.getElementById('sim-time');
  const burstCountEl = document.getElementById('burst-count');

  let W, H, cx, cy;
  let dpr = window.devicePixelRatio || 1;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2;
    cy = H / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // State
  let playing = true;
  let trailsOn = true;
  let speedMult = 1.0;
  let simTime = 0;
  let lastTime = performance.now();
  let fpsFrames = 0;
  let fpsTime = 0;
  let fpsVal = 0;

  // Starfield
  const STAR_COUNT = 200;
  let stars = [];
  function initStars() {
    stars = [];
    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 2 + 1
      });
    }
  }
  initStars();

  // Planets
  const planetDefs = [
    { radius: 80, speed: 0.8, size: 6, color: '#4fc3f7', angle: 0 },
    { radius: 130, speed: 0.5, size: 9, color: '#ff8a65', angle: 1.2 },
    { radius: 190, speed: 0.35, size: 12, color: '#aed581', angle: 2.5 },
    { radius: 260, speed: 0.22, size: 10, color: '#ce93d8', angle: 4.0 },
    { radius: 340, speed: 0.15, size: 14, color: '#ffd54f', angle: 5.5 },
    { radius: 420, speed: 0.1, size: 8, color: '#4dd0e1', angle: 0.8 }
  ];
  let planets = [];
  function initPlanets() {
    planets = planetDefs.map(d => ({
      radius: d.radius,
      speed: d.speed,
      size: d.size,
      color: d.color,
      angle: d.angle,
      trail: []
    }));
  }
  initPlanets();

  // Moons
  const moonDefs = [
    { planetIdx: 0, dist: 18, speed: 2.0, size: 3, color: '#b3e5fc', angle: 0 },
    { planetIdx: 2, dist: 24, speed: 1.5, size: 4, color: '#c5e1a5', angle: 1.0 },
    { planetIdx: 4, dist: 30, speed: 1.2, size: 5, color: '#ffe082', angle: 2.0 },
    { planetIdx: 5, dist: 20, speed: 1.8, size: 3, color: '#80deea', angle: 3.0 }
  ];
  let moons = [];
  function initMoons() {
    moons = moonDefs.map(d => ({
      planetIdx: d.planetIdx,
      dist: d.dist,
      speed: d.speed,
      size: d.size,
      color: d.color,
      angle: d.angle
    }));
  }
  initMoons();

  // Burst particles
  let bursts = [];
  function spawnBurst(x, y) {
    const count = 20 + Math.floor(Math.random() * 15);
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      const speed = 60 + Math.random() * 120;
      bursts.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1.0,
        size: 2 + Math.random() * 3,
        hue: Math.random() * 60 + 180
      });
    }
  }

  canvas.addEventListener('click', function(e) {
    const rect = canvas.getBoundingClientRect();
    spawnBurst(e.clientX - rect.left, e.clientY - rect.top);
  });

  // Controls
  btnPlayPause.addEventListener('click', function() {
    playing = !playing;
    btnPlayPause.textContent = playing ? 'Pause' : 'Play';
    if (playing) { lastTime = performance.now(); }
  });

  btnTrails.addEventListener('click', function() {
    trailsOn = !trailsOn;
    btnTrails.textContent = trailsOn ? 'Trails: ON' : 'Trails: OFF';
    if (!trailsOn) {
      planets.forEach(p => p.trail = []);
    }
  });

  btnReset.addEventListener('click', function() {
    simTime = 0;
    bursts = [];
    initPlanets();
    initMoons();
    burstCountEl.textContent = '0';
    playing = true;
    btnPlayPause.textContent = 'Pause';
    lastTime = performance.now();
  });

  speedSlider.addEventListener('input', function() {
    speedMult = parseFloat(speedSlider.value);
    speedValue.textContent = speedMult.toFixed(1) + 'x';
  });

  // Draw
  function drawStar(t) {
    const pulse = 1 + 0.08 * Math.sin(t * 2);
    const baseR = 30 * pulse;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR * 3);
    grad.addColorStop(0, 'rgba(255,255,240,1)');
    grad.addColorStop(0.2, 'rgba(255,220,100,0.9)');
    grad.addColorStop(0.5, 'rgba(255,160,50,0.3)');
    grad.addColorStop(1, 'rgba(255,100,20,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, baseR * 3, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Corona
    const coronaR = baseR * 4 + 10 * Math.sin(t * 1.5);
    const coronaGrad = ctx.createRadialGradient(cx, cy, baseR, cx, cy, coronaR);
    coronaGrad.addColorStop(0, 'rgba(255,200,80,0.15)');
    coronaGrad.addColorStop(1, 'rgba(255,100,20,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, coronaR, 0, Math.PI * 2);
    ctx.fillStyle = coronaGrad;
    ctx.fill();
  }

  function drawStarfield(t) {
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const alpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(2) + ')';
      ctx.fill();
    }
  }

  function drawTrails() {
    if (!trailsOn) return;
    for (let i = 0; i < planets.length; i++) {
      const p = planets[i];
      if (p.trail.length < 2) continue;
      for (let j = 1; j < p.trail.length; j++) {
        const alpha = (j / p.trail.length) * 0.4;
        ctx.beginPath();
        ctx.moveTo(p.trail[j - 1].x, p.trail[j - 1].y);
        ctx.lineTo(p.trail[j].x, p.trail[j].y);
        ctx.strokeStyle = p.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }
  }

  function drawPlanets() {
    for (let i = 0; i < planets.length; i++) {
      const p = planets[i];
      const px = cx + Math.cos(p.angle) * p.radius;
      const py = cy + Math.sin(p.angle) * p.radius;

      // Glow
      const glow = ctx.createRadialGradient(px, py, 0, px, py, p.size * 2.5);
      glow.addColorStop(0, p.color);
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath();
      ctx.arc(px, py, p.size * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = glow;
      ctx.fill();

      // Body
      ctx.beginPath();
      ctx.arc(px, py, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();

      // Moons
      for (let m = 0; m < moons.length; m++) {
        const moon = moons[m];
        if (moon.planetIdx !== i) continue;
        const mx = px + Math.cos(moon.angle) * moon.dist;
        const my = py + Math.sin(moon.angle) * moon.dist;
        ctx.beginPath();
        ctx.arc(mx, my, moon.size, 0, Math.PI * 2);
        ctx.fillStyle = moon.color;
        ctx.fill();
      }
    }
  }

  function drawBursts(dt) {
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.vx *= 0.97;
      b.vy *= 0.97;
      b.life -= dt * 0.8;
      if (b.life <= 0) {
        bursts.splice(i, 1);
        continue;
      }
      const alpha = b.life;
      const r = b.size * b.life;
      const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r * 2);
      grad.addColorStop(0, 'hsla(' + b.hue + ',80%,70%,' + alpha.toFixed(2) + ')');
      grad.addColorStop(1, 'hsla(' + b.hue + ',80%,50%,0)');
      ctx.beginPath();
      ctx.arc(b.x, b.y, r * 2, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }
  }

  function update(dt) {
    const sdt = dt * speedMult;
    simTime += sdt;

    for (let i = 0; i < planets.length; i++) {
      const p = planets[i];
      p.angle += p.speed * sdt;
      const px = cx + Math.cos(p.angle) * p.radius;
      const py = cy + Math.sin(p.angle) * p.radius;
      if (trailsOn) {
        p.trail.push({ x: px, y: py });
        if (p.trail.length > 60) p.trail.shift();
      }
    }
    for (let i = 0; i < moons.length; i++) {
      moons[i].angle += moons[i].speed * sdt;
    }
  }

  function render(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#060913';
    ctx.fillRect(0, 0, W, H);

    drawStarfield(t);
    drawStar(t);
    drawTrails();
    drawPlanets();
    drawBursts(playing ? (1 / 60) * speedMult : 0);
  }

  function loop(now) {
    requestAnimationFrame(loop);

    const rawDt = (now - lastTime) / 1000;
    lastTime = now;
    const dt = Math.min(rawDt, 0.05);

    // FPS
    fpsFrames++;
    fpsTime += rawDt;
    if (fpsTime >= 0.5) {
      fpsVal = Math.round(fpsFrames / fpsTime);
      fpsFrames = 0;
      fpsTime = 0;
      fpsEl.textContent = String(fpsVal);
    }

    if (playing) {
      update(dt);
    }

    const t = simTime;
    render(t);

    // HUD updates
    simTimeEl.textContent = simTime.toFixed(1) + 's';
    burstCountEl.textContent = String(bursts.length);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
