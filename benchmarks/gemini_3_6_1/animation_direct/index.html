<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbital Particle Simulation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060913;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #e2e8f0;
      user-select: none;
    }
    #sky {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }
    .hud {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 248px;
      padding: 14px 16px;
      background: rgba(18, 28, 54, 0.42);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(140, 180, 255, 0.22);
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    .hud-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #93c5fd;
    }
    .btn-row {
      display: flex;
      gap: 6px;
    }
    .btn-row button {
      flex: 1;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid rgba(140, 180, 255, 0.28);
      background: rgba(30, 50, 95, 0.48);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn-row button:hover {
      background: rgba(56, 92, 168, 0.58);
      border-color: rgba(165, 200, 255, 0.5);
    }
    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      color: #cbd5e1;
    }
    .slider-header span:last-child {
      font-variant-numeric: tabular-nums;
      color: #93c5fd;
      font-weight: 600;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #60a5fa;
      cursor: pointer;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 10px;
      padding-top: 6px;
      border-top: 1px solid rgba(140, 180, 255, 0.15);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .stat-label {
      color: #94a3b8;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .stat-value {
      color: #f8fafc;
      font-weight: 600;
    }
    .hint {
      font-size: 11px;
      color: #94a3b8;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>

  <aside class="hud">
    <div class="hud-title">Orbital Telemetry</div>
    <div class="btn-row">
      <button id="btnPlay" type="button">Pause</button>
      <button id="btnTrails" type="button">Trails ON</button>
      <button id="btnReset" type="button">Reset</button>
    </div>
    <div class="slider-row">
      <div class="slider-header">
        <span>Orbital Speed</span>
        <span id="speedVal">1.0x</span>
      </div>
      <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0" />
    </div>
    <div class="stats">
      <div>
        <div class="stat-label">FPS</div>
        <div class="stat-value" id="fps">60</div>
      </div>
      <div>
        <div class="stat-label">Sim Time</div>
        <div class="stat-value" id="simTime">0.0 s</div>
      </div>
      <div>
        <div class="stat-label">Bursts</div>
        <div class="stat-value" id="bursts">0</div>
      </div>
    </div>
    <div class="hint">Click space to spawn particle burst</div>
  </aside>

  <script>
    (function () {
      const canvas = document.getElementById('sky');
      const ctx = canvas.getContext('2d');

      const btnPlay = document.getElementById('btnPlay');
      const btnTrails = document.getElementById('btnTrails');
      const btnReset = document.getElementById('btnReset');
      const speedSlider = document.getElementById('speed');
      const speedVal = document.getElementById('speedVal');
      const fpsEl = document.getElementById('fps');
      const simTimeEl = document.getElementById('simTime');
      const burstsEl = document.getElementById('bursts');

      let W = 0;
      let H = 0;
      let dpr = 1;
      let playing = true;
      let showTrails = true;
      let speed = 1.0;
      let simTime = 0;
      let lastTs = null;
      let fpsFrames = 0;
      let fpsTimer = 0;
      let currentFps = 60;

      function resize() {
        dpr = window.devicePixelRatio || 1;
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      // Background starfield (180 stars)
      const stars = [];
      for (let i = 0; i < 180; i++) {
        let color = 'rgb(225, 235, 255)';
        if (i % 5 === 0) color = 'rgb(255, 214, 170)';
        else if (i % 3 === 0) color = 'rgb(170, 205, 255)';
        stars.push({
          nx: Math.random(),
          ny: Math.random(),
          r: 0.3 + Math.random() * 1.3,
          base: 0.35 + Math.random() * 0.45,
          rate: 0.8 + Math.random() * 2.4,
          phase: Math.random() * Math.PI * 2,
          color
        });
      }

      // Planets with moons and trails
      const planetSpecs = [
        { rx: 62, period: 4.2, size: 4.5, color: '#ff9b6b', moons: [] },
        { rx: 98, period: 7.0, size: 6.5, color: '#7be0a4', moons: [{ dist: 14, period: 1.4, size: 1.8, color: '#d8f3dc' }] },
        { rx: 140, period: 10.5, size: 7.5, color: '#5fb4ff', moons: [{ dist: 16, period: 1.8, size: 2.1, color: '#e2e8f0' }] },
        {
          rx: 186, period: 15.0, size: 5.5, color: '#e2674e',
          moons: [
            { dist: 12, period: 1.2, size: 1.4, color: '#f1f5f9' },
            { dist: 19, period: 2.3, size: 1.7, color: '#cbd5e1' }
          ]
        },
        {
          rx: 246, period: 24.0, size: 13.0, color: '#e6c288', ring: true,
          moons: [
            { dist: 26, period: 2.0, size: 2.4, color: '#fde68a' },
            { dist: 34, period: 3.4, size: 2.0, color: '#e2e8f0' }
          ]
        },
        { rx: 304, period: 36.0, size: 9.0, color: '#a58bff', moons: [{ dist: 20, period: 2.5, size: 2.2, color: '#ddd6fe' }] }
      ];

      const planets = planetSpecs.map((spec, idx) => ({
        ...spec,
        startPhase: idx * 1.37 + 0.4,
        trail: []
      }));

      const particles = [];

      function spawnBurst(x, y) {
        const count = 46 + Math.floor(Math.random() * 19);
        const baseHue = Math.floor(Math.random() * 360);
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.2;
          const spd = 70 + Math.random() * 210;
          particles.push({
            x,
            y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            size: 1.6 + Math.random() * 2.6,
            hue: (baseHue + (Math.random() - 0.5) * 45 + 360) % 360,
            life: 1.0,
            decay: 0.45 + Math.random() * 0.55
          });
        }
      }

      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        spawnBurst(e.clientX - rect.left, e.clientY - rect.top);
      });

      btnPlay.addEventListener('click', () => {
        playing = !playing;
        btnPlay.textContent = playing ? 'Pause' : 'Play';
      });

      btnTrails.addEventListener('click', () => {
        showTrails = !showTrails;
        btnTrails.textContent = showTrails ? 'Trails ON' : 'Trails OFF';
      });

      btnReset.addEventListener('click', () => {
        simTime = 0;
        particles.length = 0;
        for (const p of planets) p.trail.length = 0;
        simTimeEl.textContent = '0.0 s';
        burstsEl.textContent = '0';
      });

      speedSlider.addEventListener('input', (e) => {
        speed = parseFloat(e.target.value);
        speedVal.textContent = speed.toFixed(1) + 'x';
      });

      function frame(ts) {
        if (lastTs === null) lastTs = ts;
        const rawDt = Math.min(0.05, Math.max(0, (ts - lastTs) / 1000));
        lastTs = ts;

        fpsFrames++;
        fpsTimer += rawDt;
        if (fpsTimer >= 0.4) {
          currentFps = Math.round(fpsFrames / fpsTimer);
          fpsEl.textContent = String(currentFps);
          fpsFrames = 0;
          fpsTimer = 0;
        }

        if (playing) {
          simTime += rawDt * speed;
        }

        const cx = W / 2;
        const cy = H / 2;
        const scale = Math.min(W, H) / 700;

        // Clear background
        ctx.fillStyle = '#060913';
        ctx.fillRect(0, 0, W, H);

        // Twinkling starfield
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          const alpha = Math.max(0.08, Math.min(1, s.base + 0.28 * Math.sin(simTime * s.rate + s.phase)));
          ctx.globalAlpha = alpha;
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.arc(s.nx * W, s.ny * H, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Orbit ellipses
        ctx.strokeStyle = 'rgba(130, 160, 220, 0.11)';
        ctx.lineWidth = 1;
        for (const p of planets) {
          const rx = p.rx * scale;
          const ry = rx * 0.62;
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Central star corona + core
        const coreR = Math.max(4, 24 * scale);
        const pulse = 1 + 0.07 * Math.sin(1.7 * simTime);
        const coronaR = coreR * 5.2 * pulse;
        const coronaGrad = ctx.createRadialGradient(cx, cy, coreR * 0.2, cx, cy, coronaR);
        coronaGrad.addColorStop(0, 'rgba(255, 214, 130, 0.55)');
        coronaGrad.addColorStop(0.45, 'rgba(255, 160, 70, 0.18)');
        coronaGrad.addColorStop(1, 'rgba(255, 120, 30, 0)');
        ctx.fillStyle = coronaGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, coronaR, 0, Math.PI * 2);
        ctx.fill();

        const starGrad = ctx.createRadialGradient(cx - coreR * 0.2, cy - coreR * 0.2, 0, cx, cy, coreR);
        starGrad.addColorStop(0, '#fffbe6');
        starGrad.addColorStop(0.45, '#ffd76a');
        starGrad.addColorStop(1, '#ff8a2b');
        ctx.fillStyle = starGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
        ctx.fill();

        // Planets, trails, rings, moons
        for (const p of planets) {
          const angle = p.startPhase + (simTime / p.period) * Math.PI * 2;
          const rx = p.rx * scale;
          const ry = rx * 0.62;
          const px = cx + Math.cos(angle) * rx;
          const py = cy + Math.sin(angle) * ry;
          const pSize = Math.max(2, p.size * scale);

          if (playing) {
            p.trail.push({ x: px, y: py });
            if (p.trail.length > 90) p.trail.shift();
          }

          if (showTrails && p.trail.length > 1) {
            ctx.lineCap = 'round';
            ctx.strokeStyle = p.color;
            const n = p.trail.length;
            for (let i = 1; i < n; i++) {
              ctx.globalAlpha = (i / n) * 0.55;
              ctx.lineWidth = Math.max(0.6, pSize * 0.42 * (i / n));
              ctx.beginPath();
              ctx.moveTo(p.trail[i - 1].x, p.trail[i - 1].y);
              ctx.lineTo(p.trail[i].x, p.trail[i].y);
              ctx.stroke();
            }
            ctx.globalAlpha = 1;
          }

          // Planet glow
          const glowGrad = ctx.createRadialGradient(px, py, pSize * 0.3, px, py, pSize * 3);
          glowGrad.addColorStop(0, p.color + '55');
          glowGrad.addColorStop(1, p.color + '00');
          ctx.fillStyle = glowGrad;
          ctx.beginPath();
          ctx.arc(px, py, pSize * 3, 0, Math.PI * 2);
          ctx.fill();

          // Planet disc
          const discGrad = ctx.createRadialGradient(
            px - 0.35 * pSize, py - 0.35 * pSize, pSize * 0.08,
            px, py, pSize
          );
          discGrad.addColorStop(0, '#ffffff');
          discGrad.addColorStop(0.25, p.color);
          discGrad.addColorStop(1, '#0a0f1f');
          ctx.fillStyle = discGrad;
          ctx.beginPath();
          ctx.arc(px, py, pSize, 0, Math.PI * 2);
          ctx.fill();

          // Optional ring
          if (p.ring) {
            ctx.save();
            ctx.strokeStyle = 'rgba(230, 194, 136, 0.58)';
            ctx.lineWidth = Math.max(1.2, 2.5 * scale);
            ctx.beginPath();
            ctx.ellipse(px, py, pSize * 1.9, pSize * 0.62, -0.35, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }

          // Moons
          for (let mIdx = 0; mIdx < p.moons.length; mIdx++) {
            const m = p.moons[mIdx];
            const mAngle = mIdx * 2.1 + (simTime / m.period) * Math.PI * 2;
            const md = m.dist * scale;
            const mx = px + Math.cos(mAngle) * md;
            const my = py + Math.sin(mAngle) * md * 0.72;
            const mSize = Math.max(1.2, m.size * scale);
            ctx.fillStyle = m.color;
            ctx.beginPath();
            ctx.arc(mx, my, mSize, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Click burst particles
        const damping = Math.pow(0.12, rawDt);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          pt.x += pt.vx * rawDt;
          pt.y += pt.vy * rawDt;
          pt.vx *= damping;
          pt.vy *= damping;
          pt.life -= pt.decay * rawDt;
          if (pt.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          const r = pt.size * 3;
          const grad = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, r);
          grad.addColorStop(0, `hsla(${pt.hue}, 100%, 75%, ${pt.life})`);
          grad.addColorStop(1, `hsla(${pt.hue}, 100%, 75%, 0)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        simTimeEl.textContent = simTime.toFixed(1) + ' s';
        burstsEl.textContent = String(particles.length);

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
