<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Neon Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 42%, #0d1633 0%, #050814 55%, #020309 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #e2e8f0;
      user-select: none;
    }
    #c {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
      touch-action: none;
    }
    #c:active { cursor: grabbing; }
    .hud {
      position: fixed;
      top: 14px;
      left: 14px;
      width: 268px;
      padding: 13px 15px;
      background: rgba(20, 30, 60, 0.38);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(120, 220, 255, 0.22);
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .hud-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #7dd3fc;
      white-space: nowrap;
    }
    .badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(255, 79, 216, 0.18);
      border: 1px solid rgba(255, 79, 216, 0.4);
      color: #f9a8d4;
      white-space: nowrap;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      text-align: center;
      padding: 6px 0;
      border-top: 1px solid rgba(120, 220, 255, 0.14);
      border-bottom: 1px solid rgba(120, 220, 255, 0.14);
      font-variant-numeric: tabular-nums;
    }
    .stat b {
      display: block;
      font-size: 14px;
      color: #f8fafc;
    }
    .stat span {
      font-size: 10px;
      letter-spacing: 0.08em;
      color: #94a3b8;
    }
    .btn-row {
      display: flex;
      gap: 6px;
    }
    .btn-row button {
      flex: 1;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(0, 200, 255, 0.12);
      border: 1px solid rgba(0, 220, 255, 0.3);
      color: #e0f2fe;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .btn-row button:hover {
      background: rgba(0, 200, 255, 0.24);
    }
    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
    }
    .slider-top {
      display: flex;
      justify-content: space-between;
      color: #cbd5e1;
    }
    .slider-top b {
      color: #f9a8d4;
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #ff4fd8;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="hud">
    <div class="hud-header">
      <div class="hud-title">NEON PORTAL 3D</div>
      <span class="badge">GEMINI DIRECT</span>
    </div>
    <div class="stats">
      <div class="stat"><b id="fps">60</b><span>FPS</span></div>
      <div class="stat"><b id="polys">84</b><span>POLYS</span></div>
      <div class="stat"><b id="parts">110</b><span>PARTS</span></div>
    </div>
    <div class="btn-row">
      <button id="btnPause" type="button">Pause</button>
      <button id="btnOrbit" type="button">Orbit ON</button>
      <button id="btnReset" type="button">Reset</button>
    </div>
    <div class="slider-row">
      <div class="slider-top">
        <span>Simulation Speed</span>
        <b id="spdVal">1.0x</b>
      </div>
      <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0" />
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const fpsEl = document.getElementById('fps');
      const polysEl = document.getElementById('polys');
      const partsEl = document.getElementById('parts');
      const btnPause = document.getElementById('btnPause');
      const btnOrbit = document.getElementById('btnOrbit');
      const btnReset = document.getElementById('btnReset');
      const speedSlider = document.getElementById('speed');
      const spdVal = document.getElementById('spdVal');

      let W = 0, H = 0, dpr = 1;
      function resize() {
        dpr = window.devicePixelRatio || 1;
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      function makeBox(cx, cy, cz, sx, sy, sz, color, glow) {
        const hx = sx / 2, hy = sy / 2, hz = sz / 2;
        const v = [
          [cx - hx, cy - hy, cz - hz],
          [cx + hx, cy - hy, cz - hz],
          [cx + hx, cy + hy, cz - hz],
          [cx - hx, cy + hy, cz - hz],
          [cx - hx, cy - hy, cz + hz],
          [cx + hx, cy - hy, cz + hz],
          [cx + hx, cy + hy, cz + hz],
          [cx - hx, cy + hy, cz + hz]
        ];
        const idx = [
          [0, 3, 2, 1], [4, 5, 6, 7],
          [0, 1, 5, 4], [3, 7, 6, 2],
          [0, 4, 7, 3], [1, 2, 6, 5]
        ];
        return idx.map((f) => ({ pts: f.map((i) => v[i]), color, glow }));
      }

      const faces = [
        ...makeBox(0, -1.45, 0, 5.6, 0.4, 3.6, [34, 48, 86], 0.08),
        ...makeBox(0, -1.05, 0, 4.2, 0.4, 2.4, [42, 60, 94], 0.11),
        ...makeBox(-1.25, 0.42, 0, 0.5, 2.55, 0.5, [38, 55, 90], 0.12),
        ...makeBox(1.25, 0.42, 0, 0.5, 2.55, 0.5, [38, 55, 90], 0.12),
        ...makeBox(0, 1.95, 0, 3.4, 0.5, 0.7, [44, 64, 95], 0.14),
        ...makeBox(0, 2.32, 0, 2.2, 0.24, 0.5, [52, 76, 95], 0.3)
      ];

      const crystals = Array.from({ length: 6 }, (_, i) => ({
        angle: (i * Math.PI) / 3,
        color: i % 2 === 0 ? [40, 225, 255] : [255, 70, 215],
        spin: 0.9 + (i * 0.13),
        phase: i * 1.7
      }));

      const stars = Array.from({ length: 180 }, () => {
        const theta = Math.random() * Math.PI * 2;
        const y = -4 + Math.random() * 46;
        const r = Math.sqrt(Math.max(0, 42 * 42 - y * y));
        return {
          p: [Math.cos(theta) * r, y, Math.sin(theta) * r],
          size: 0.5 + Math.random() * 1.2,
          rate: 0.7 + Math.random() * 2.4,
          phase: Math.random() * Math.PI * 2
        };
      });

      const particles = Array.from({ length: 110 }, (_, i) => {
        const ang = Math.random() * Math.PI * 2;
        const rad = Math.sqrt(Math.random()) * 3.4;
        return {
          x: Math.cos(ang) * rad,
          y: -1.9 + Math.random() * 5.4,
          z: Math.sin(ang) * rad,
          v: 0.35 + Math.random() * 0.75,
          sway: Math.random() * Math.PI * 2,
          hue: i % 2 === 0 ? 188 : 312,
          size: 0.02 + Math.random() * 0.035
        };
      });

      const lightLen = Math.hypot(0.45, 0.8, -0.4);
      const light = [0.45 / lightLen, 0.8 / lightLen, -0.4 / lightLen];

      let yaw = 0.55;
      let pitch = 0.34;
      const dist = 9.6;
      const fov = 580;
      const target = [0, 0.35, 0];

      let paused = false;
      let orbit = true;
      let speed = 1.0;
      let simTime = 0;
      let lastTs = null;
      let fps = 60;
      let fpsFrames = 0;
      let fpsTimer = 0;
      let lastPolys = 84;

      let dragging = false;
      let lastX = 0, lastY = 0;

      canvas.addEventListener('pointerdown', (e) => {
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        yaw += dx * 0.008;
        pitch = Math.max(-1.1, Math.min(1.2, pitch + dy * 0.008));
      });
      window.addEventListener('pointerup', () => { dragging = false; });

      btnPause.addEventListener('click', () => {
        paused = !paused;
        btnPause.textContent = paused ? 'Play' : 'Pause';
      });
      btnOrbit.addEventListener('click', () => {
        orbit = !orbit;
        btnOrbit.textContent = orbit ? 'Orbit ON' : 'Orbit OFF';
      });
      btnReset.addEventListener('click', () => {
        yaw = 0.55;
        pitch = 0.34;
        simTime = 0;
      });
      speedSlider.addEventListener('input', (e) => {
        speed = parseFloat(e.target.value);
        spdVal.textContent = speed.toFixed(1) + 'x';
      });

      function project(pt) {
        const x = pt[0] - target[0];
        const y = pt[1] - target[1];
        const z = pt[2] - target[2];
        const cy = Math.cos(yaw), sy = Math.sin(yaw);
        const cp = Math.cos(pitch), sp = Math.sin(pitch);
        const x1 = x * cy - z * sy;
        const z1 = x * sy + z * cy;
        const y2 = y * cp + z1 * sp;
        const z2 = -y * sp + z1 * cp;
        const depth = z2 + dist;
        if (depth < 0.2) return null;
        const view = Math.min(W / 1180, H / 720);
        const s = (fov * view) / depth;
        return { x: W / 2 + x1 * s, y: H / 2 - y2 * s, depth, s };
      }

      function faceNormal(pts) {
        const ax = pts[1][0] - pts[0][0], ay = pts[1][1] - pts[0][1], az = pts[1][2] - pts[0][2];
        const bx = pts[2][0] - pts[0][0], by = pts[2][1] - pts[0][1], bz = pts[2][2] - pts[0][2];
        const nx = ay * bz - az * by;
        const ny = az * bx - ax * bz;
        const nz = ax * by - ay * bx;
        const len = Math.hypot(nx, ny, nz) || 1;
        return [nx / len, ny / len, nz / len];
      }

      function crystalTris(c, t) {
        const a = c.angle + 0.35 * t;
        const cx = 2.45 * Math.cos(a);
        const cz = 2.45 * Math.sin(a);
        const cy = 0.5 + 0.28 * Math.sin(1.4 * t + c.phase);
        const rot = t * c.spin;
        const cr = Math.cos(rot), sr = Math.sin(rot);
        const w = 0.24, h = 0.42;
        const local = [
          [w, 0, 0], [0, 0, w], [-w, 0, 0], [0, 0, -w]
        ].map(([vx, vy, vz]) => [
          cx + vx * cr - vz * sr,
          cy + vy,
          cz + vx * sr + vz * cr
        ]);
        const top = [cx, cy + h, cz];
        const bot = [cx, cy - h, cz];
        const tris = [];
        for (let i = 0; i < 4; i++) {
          const j = (i + 1) % 4;
          tris.push({ pts: [top, local[i], local[j]], color: c.color, glow: 0.35, crystal: true });
          tris.push({ pts: [bot, local[j], local[i]], color: c.color, glow: 0.25, crystal: true });
        }
        return tris;
      }

      function drawRing(radius, tiltX, tiltZ, rotY, color) {
        const steps = 48;
        const cxR = Math.cos(tiltX), sxR = Math.sin(tiltX);
        const czR = Math.cos(tiltZ), szR = Math.sin(tiltZ);
        const cyR = Math.cos(rotY), syR = Math.sin(rotY);
        ctx.beginPath();
        let started = false;
        for (let i = 0; i <= steps; i++) {
          const ang = (i / steps) * Math.PI * 2;
          let x = Math.cos(ang) * radius;
          let y = Math.sin(ang) * radius;
          let z = 0;
          // Rotate X
          const y1 = y * cxR - z * sxR, z1 = y * sxR + z * cxR;
          // Rotate Z
          const x2 = x * czR - y1 * szR, y2 = x * szR + y1 * czR;
          // Rotate Y
          const x3 = x2 * cyR - z1 * syR, z3 = x2 * syR + z1 * cyR;
          const p = project([x3, 0.55 + y2, z3]);
          if (!p) { started = false; continue; }
          if (!started) { ctx.moveTo(p.x, p.y); started = true; }
          else ctx.lineTo(p.x, p.y);
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      function frame(ts) {
        if (lastTs === null) lastTs = ts;
        const dt = Math.min(0.05, Math.max(0, (ts - lastTs) / 1000));
        lastTs = ts;

        fpsFrames++;
        fpsTimer += dt;
        if (fpsTimer >= 0.5) {
          fps = Math.round(fpsFrames / fpsTimer);
          fpsEl.textContent = String(fps);
          polysEl.textContent = String(lastPolys);
          partsEl.textContent = String(particles.length);
          fpsFrames = 0;
          fpsTimer = 0;
        }

        if (!paused) {
          simTime += dt * speed;
          if (orbit && !dragging) yaw += 0.22 * dt * speed;
          for (const pt of particles) {
            pt.y += pt.v * dt * speed;
            if (pt.y > 3.6) pt.y = -1.9;
          }
        }

        ctx.clearRect(0, 0, W, H);

        // Stars
        for (const s of stars) {
          const p = project(s.p);
          if (!p) continue;
          const alpha = Math.max(0.15, Math.min(1, 0.55 + 0.4 * Math.sin(simTime * s.rate + s.phase)));
          ctx.fillStyle = `rgba(210, 230, 255, ${alpha})`;
          ctx.fillRect(p.x, p.y, s.size, s.size);
        }

        // Cyber grid floor at y = -2.0
        for (let i = -12; i <= 12; i++) {
          const bright = i % 4 === 0;
          ctx.strokeStyle = bright ? 'rgba(40, 225, 255, 0.34)' : 'rgba(40, 140, 220, 0.14)';
          ctx.lineWidth = bright ? 1.2 : 0.8;
          const a = project([i, -2.0, -12]), b = project([i, -2.0, 12]);
          if (a && b) {
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
          const c = project([-12, -2.0, i]), d = project([12, -2.0, i]);
          if (c && d) {
            ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.stroke();
          }
        }

        // Collect polygons + portal into depth-sorted draw list
        const drawList = [];
        for (const f of faces) {
          const proj = f.pts.map(project);
          if (proj.some((p) => !p)) continue;
          const meanDepth = proj.reduce((s, p) => s + p.depth, 0) / proj.length;
          const n = faceNormal(f.pts);
          const ndotl = Math.max(0, n[0] * light[0] + n[1] * light[1] + n[2] * light[2]);
          const br = 0.42 + 0.95 * ndotl + f.glow;
          drawList.push({ type: 'poly', depth: meanDepth, proj, color: f.color, br, crystal: false });
        }
        for (const cr of crystals) {
          for (const tri of crystalTris(cr, simTime)) {
            const proj = tri.pts.map(project);
            if (proj.some((p) => !p)) continue;
            const meanDepth = proj.reduce((s, p) => s + p.depth, 0) / proj.length;
            const n = faceNormal(tri.pts);
            const ndotl = Math.max(0, n[0] * light[0] + n[1] * light[1] + n[2] * light[2]);
            const br = 0.42 + 0.95 * ndotl + tri.glow;
            drawList.push({ type: 'poly', depth: meanDepth, proj, color: tri.color, br, crystal: true });
          }
        }
        const portalProj = project([0, 0.55, 0]);
        if (portalProj) {
          drawList.push({ type: 'portal', depth: portalProj.depth, p: portalProj });
        }

        drawList.sort((a, b) => b.depth - a.depth);
        let polyCount = 0;

        for (const item of drawList) {
          if (item.type === 'portal') {
            const pulse = 1 + 0.08 * Math.sin(simTime * 2.4);
            const rad = 1.05 * item.p.s * pulse;
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            const g = ctx.createRadialGradient(item.p.x, item.p.y, 0, item.p.x, item.p.y, rad);
            g.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
            g.addColorStop(0.28, 'rgba(40, 225, 255, 0.72)');
            g.addColorStop(0.65, 'rgba(255, 70, 215, 0.35)');
            g.addColorStop(1, 'rgba(255, 70, 215, 0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(item.p.x, item.p.y, rad, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            drawRing(1.0, 0.35, 0.2, simTime * 1.1, 'rgba(40, 225, 255, 0.85)');
            drawRing(0.78, -0.45, 0.3, -simTime * 1.5, 'rgba(255, 70, 215, 0.85)');
          } else {
            polyCount++;
            const [r, g, b] = item.color;
            ctx.fillStyle = `rgb(${Math.min(255, Math.round(r * item.br))}, ${Math.min(255, Math.round(g * item.br))}, ${Math.min(255, Math.round(b * item.br))})`;
            ctx.strokeStyle = item.crystal ? 'rgba(255, 255, 255, 0.7)' : 'rgba(0, 220, 255, 0.45)';
            ctx.lineWidth = item.crystal ? 1 : 0.9;
            ctx.beginPath();
            ctx.moveTo(item.proj[0].x, item.proj[0].y);
            for (let i = 1; i < item.proj.length; i++) ctx.lineTo(item.proj[i].x, item.proj[i].y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
        }
        lastPolys = polyCount;

        // Rising additive particles
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (const pt of particles) {
          const sx = pt.x + Math.sin(simTime * 1.6 + pt.sway) * 0.14;
          const p = project([sx, pt.y, pt.z]);
          if (!p) continue;
          const r = Math.max(1.2, pt.size * p.s);
          ctx.fillStyle = `hsla(${pt.hue}, 100%, 70%, 0.78)`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
