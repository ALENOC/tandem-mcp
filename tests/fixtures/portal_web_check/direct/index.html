<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEON PORTAL 3D</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #03040a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e2e8f0;
      user-select: none;
    }

    #c {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }

    #c:active {
      cursor: grabbing;
    }

    .hud {
      position: fixed;
      top: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      pointer-events: none;
      z-index: 10;
    }

    .glass {
      pointer-events: auto;
      background: rgba(10, 14, 34, 0.56);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: 14px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .hud-header {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pulse-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #00f5d4;
      box-shadow: 0 0 10px #00f5d4, 0 0 20px #00f5d4;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.82); }
    }

    h1 {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      background: linear-gradient(90deg, #00f5d4, #38bdf8, #e879f9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .stats {
      display: flex;
      gap: 14px;
      font-size: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #94a3b8;
    }

    .stat {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }

    .stat-label {
      letter-spacing: 0.08em;
      color: #64748b;
    }

    .stat-value {
      color: #38bdf8;
      font-weight: 600;
    }

    .hud-controls {
      padding: 12px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(56, 189, 248, 0.32);
      background: rgba(15, 23, 52, 0.7);
      color: #e2e8f0;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 7px 13px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .btn:hover {
      border-color: #00f5d4;
      background: rgba(0, 245, 212, 0.14);
      box-shadow: 0 0 12px rgba(0, 245, 212, 0.25);
    }

    .btn.active {
      border-color: #00f5d4;
      background: rgba(0, 245, 212, 0.2);
      color: #a5f3fc;
      box-shadow: 0 0 14px rgba(0, 245, 212, 0.28);
    }

    .speed-group {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 4px;
      font-size: 0.76rem;
      color: #94a3b8;
    }

    .speed-group input[type="range"] {
      width: 96px;
      accent-color: #00f5d4;
      cursor: pointer;
    }

    #speed-val {
      min-width: 34px;
      text-align: right;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #e879f9;
      font-weight: 600;
    }

    @media (max-width: 640px) {
      .hud {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <header class="hud">
    <div class="glass hud-header">
      <div class="title-row">
        <span class="pulse-dot"></span>
        <h1>NEON PORTAL 3D</h1>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">FPS</span>
          <span class="stat-value" id="stat-fps">60</span>
        </div>
        <div class="stat">
          <span class="stat-label">POLYS</span>
          <span class="stat-value" id="stat-polys">84</span>
        </div>
        <div class="stat">
          <span class="stat-label">PARTS</span>
          <span class="stat-value" id="stat-parts">110</span>
        </div>
      </div>
    </div>

    <div class="glass hud-controls">
      <button type="button" class="btn" id="btn-pause">Pause</button>
      <button type="button" class="btn active" id="btn-orbit">Orbit ON</button>
      <button type="button" class="btn" id="btn-reset">Reset</button>
      <label class="speed-group" for="speed-slider">
        <span>Speed</span>
        <input id="speed-slider" type="range" min="0.1" max="3.0" step="0.1" value="1.0" />
        <span id="speed-val">1.0x</span>
      </label>
    </div>
  </header>

  <script src="engine3d.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
