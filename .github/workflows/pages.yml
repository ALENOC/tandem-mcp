name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'benchmarks/opus/REEVAL_4_2.json', 'benchmarks/opus/REEVAL_4_2_PORTAL_DIRECT.json', 'benchmarks/opus/gifs/**', 'benchmarks/opus/runs/20261124-174810_v4_2/workspaces/gen_*/**', 'scripts/build_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/build_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
