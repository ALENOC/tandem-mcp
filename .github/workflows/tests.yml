name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: pip install .
      - name: Verify Bubblewrap namespaces and jail
        run: |
          bwrap --version
          python -c "import tandem_mcp.sandbox as s; assert s.jail_available(), 'bubblewrap jail_available() returned False'"
          TANDEM_SANDBOX=secure python -c "import pathlib, tandem_mcp.sandbox as s; code, out = s.run('echo bwrap-ok', pathlib.Path('.'), jail=True); assert code == 0 and 'bwrap-ok' in out, (code, out)"
      - name: Trap regressions
        run: python scripts/verify_traps.py
      - name: Limits, evidence, journal, and mandatory jail (no model)
        env:
          TANDEM_REQUIRE_JAIL: '1'
          TANDEM_SANDBOX: secure
        run: python tests/test_offline.py
      - name: Whole loop against a scripted server (no model)
        run: python tests/test_protocol.py
      - name: Lean profile against scripted server (no model)
        run: python tests/test_lean.py
      - name: Benchmark adapter and quota tests (no model)
        run: python -m unittest discover -s tests -p test_orchestrators.py -v
      - name: Comparative benchmark methodology & fixture integrity (no model)
        run: python tests/test_benchmarks.py
      - name: Evaluator regression tests (B01 and B03, no model)
        run: python tests/test_evaluators.py
      - name: Benchmark suite provenance & plan tests (B02 and B04, no model)
        run: python tests/test_suite_b02_b04.py
      - name: Digest deadline, deterministic git-stat, and selective routing tests (B05 and B06, no model)
        run: python tests/test_b05_b06.py
      - name: Store concurrency, workspace lease, and cancellation tests (P02, P03, P04, no model)
        run: python tests/test_p02_p03_p04.py
      - name: UI acceptance tests, web controls and contract rule for pages (no model)
        run: |
          python tests/test_ui_test.py
          python tests/test_web_controls.py
      - name: Direct fallback and local success routing (no model)
        run: |
          python tests/test_fallback.py
          python tests/test_router_success.py
